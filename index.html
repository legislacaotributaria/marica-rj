<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1a3a6c;--blue:#2563a8;--gold:#b45309;
  --green:#166534;--red:#b91c1c;
  --bg:#f0f4f8;--surface:#fff;
  --bord:#e2e8f0;--muted:#64748b;--text:#1e293b;
  --r:8px;--shadow:0 1px 3px rgba(0,0,0,.07);
}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
#hdr{background:var(--navy);color:#fff;padding:0 24px;height:58px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#hdr h1{font-size:15px;font-weight:700}
#hdr .sub{font-size:11px;opacity:.7}
.badge-pub{font-size:11px;background:rgba(255,255,255,.15);padding:3px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.2)}
#barra{background:#fff;border-bottom:1px solid var(--bord);padding:10px 24px;
  display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:58px;z-index:99;box-shadow:0 1px 4px rgba(0,0,0,.05)}
#q{flex:1;min-width:200px;border:1px solid var(--bord);border-radius:6px;padding:8px 12px;font-size:13px;outline:none;transition:border .2s}
#q:focus{border-color:var(--blue)}
.fb{padding:6px 13px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;
  border:1px solid var(--bord);background:#fff;color:var(--muted);transition:all .15s}
.fb:hover,.fb.on{background:var(--navy);color:#fff;border-color:var(--navy)}
#main{max-width:1200px;margin:0 auto;padding:24px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;margin-bottom:28px}
.stat{background:#fff;border:1px solid var(--bord);border-radius:var(--r);padding:16px;
  text-align:center;cursor:pointer;transition:all .15s;box-shadow:var(--shadow)}
.stat:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.stat-n{font-size:28px;font-weight:700;color:var(--navy)}
.stat-l{font-size:11px;color:var(--muted);margin-top:4px}
.stat.gold{border-top:3px solid var(--gold)}
.stat.blue{border-top:3px solid var(--blue)}
.sec{margin-bottom:32px}
.sec-hdr{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid var(--bord)}
.sec-titulo{font-size:15px;font-weight:700;color:var(--navy)}
.sec-n{font-size:11px;background:var(--navy);color:#fff;padding:2px 8px;border-radius:10px;margin-left:auto}
.subsec{margin-bottom:20px}
.subsec-titulo{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.5px;padding:4px 10px;background:var(--bg);border-radius:4px;
  border-left:3px solid var(--gold);margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.grid-sm{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.cn{background:#fff;border:1px solid var(--bord);border-radius:var(--r);padding:16px;
  cursor:pointer;transition:all .15s;box-shadow:var(--shadow);position:relative;overflow:hidden}
.cn:hover{border-color:var(--navy);box-shadow:0 4px 14px rgba(0,0,0,.1);transform:translateY(-2px)}
.cn.rev{opacity:.5;filter:grayscale(.4)}
.cn.st{border-style:dashed}
.cn-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px}
.cn-num{font-size:13px;font-weight:700;color:var(--navy)}
.cn-em{font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:10px}
.cn-ft{font-size:10px;color:var(--muted)}
.cn-arrow{position:absolute;right:14px;bottom:12px;font-size:18px;opacity:.2;transition:all .15s}
.cn:hover .cn-arrow{opacity:1;transform:translateX(4px)}
.cm{background:var(--bg);border:1px solid var(--bord);border-radius:6px;padding:10px 12px;cursor:pointer;transition:all .15s}
.cm:hover{border-color:var(--blue);background:#eff6ff}
.cm-num{font-size:11px;font-weight:700;color:var(--navy)}
.cm-em{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.4}
.subsec-dd-hdr{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:8px 12px;border-radius:8px;border:1px solid var(--bord);background:#fff;transition:background .15s,border-color .15s;user-select:none}
.subsec-dd-hdr:hover{background:var(--bg);border-color:var(--navy)}
.subsec-dd-hdr .subsec-titulo{margin:0;border:none;padding:0}
.subsec-dd-arrow{font-size:14px;color:var(--muted);transition:transform .25s;flex-shrink:0}
.subsec-dd-arrow.open{transform:rotate(180deg)}
.subsec-dd-body{overflow:hidden;max-height:0;transition:max-height .35s ease,opacity .25s ease;opacity:0}
.subsec-dd-body.open{max-height:2000px;opacity:1}
.cc{background:linear-gradient(135deg,#1a3a6c,#2563a8);color:#fff;border-radius:var(--r);
  padding:18px;cursor:pointer;transition:all .15s;box-shadow:var(--shadow)}
.cc:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(26,58,108,.35)}
.cc-tipo{font-size:10px;opacity:.7;letter-spacing:.5px;margin-bottom:6px}
.cc-titulo{font-size:14px;font-weight:700;margin-bottom:4px}
.cc-sub{font-size:11px;opacity:.8;margin-bottom:12px}
.cc-badge{display:inline-block;background:rgba(255,255,255,.2);font-size:10px;padding:3px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.3)}
.b-alt{font-size:9px;background:#fff8e1;color:#b45309;border:1px solid #f59e0b;padding:2px 6px;border-radius:8px;font-weight:700}
.b-rev{font-size:9px;background:#fef2f2;color:#b91c1c;border:1px solid #fca5a5;padding:2px 6px;border-radius:8px;font-weight:700}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:20px}
.ov.open{display:flex}
.mb{background:#fff;border-radius:10px;width:100%;max-width:900px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mh{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--bord);flex-shrink:0}
.mh-t{font-size:14px;font-weight:700;color:var(--navy);flex:1;margin-right:12px}
.mx{background:none;border:none;font-size:24px;cursor:pointer;color:var(--muted);padding:0 4px;line-height:1}
.mx:hover{color:var(--navy)}
.ms{flex:1;overflow-y:auto;padding:28px 32px}
.mf{flex-shrink:0;padding:10px 24px;border-top:1px solid var(--bord);display:flex;align-items:center;justify-content:flex-end;gap:8px;background:#fff;border-radius:0 0 10px 10px;}
.mf-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border:1px solid var(--bord);border-radius:6px;background:#fff;font-size:12px;color:var(--muted);cursor:pointer;font-family:inherit;transition:background .15s,color .15s;white-space:nowrap;}
.mf-btn:hover{background:var(--bg);color:var(--navy);}
:root {
  --navy: #0f2340;
  --navy2: #1a3658;
  --gold: #c9972c;
  --gold-l: #fdf3dc;
  --blue: #1e5fa8;
  --blue-l: #e8f0fb;
  --green: #155f3b;
  --green-l: #e4f5ec;
  --red: #8b1a1a;
  --red-l: #fde8e8;
  --bg: #f5f3ef;
  --surface: #ffffff;
  --border: #ddd9d0;
  --text: #1a1714;
  --muted: #6b6560;
  --light: #ede9e2;
  --r: 10px;
  --shadow: 0 2px 8px rgba(15,35,64,.07), 0 1px 2px rgba(15,35,64,.05);
  --shadow-lg: 0 8px 32px rgba(15,35,64,.12), 0 2px 8px rgba(15,35,64,.06);
}
.p-lc{background:#e0e7ff;color:#3730a3;}
.p-lei{background:var(--green-l);color:var(--green);}
.p-dec{background:var(--gold-l);color:#8a6010;}
.p-in{background:#fce7f3;color:#9d174d;}
.p-port{background:#f3e8ff;color:#7e22ce;}
.p-res{background:#e0f2fe;color:#0369a1;}
.p-ot{background:#f1f5f9;color:#475569;}

/* ── LISTA DE LEIS ── */
.lei-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.25rem;margin-bottom:.75rem;display:flex;align-items:center;gap:1rem;box-shadow:var(--shadow);transition:.15s;}
.lei-row:hover{border-color:#bbb5ac;}
.lei-row-info{flex:1;min-width:0;}
.lei-row-num{font-size:14px;font-weight:500;color:var(--navy);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.lei-row-ementa{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lei-row-meta{font-size:11px;color:var(--muted);margin-top:4px;display:flex;gap:12px;}
.lei-row-actions{display:flex;gap:6px;flex-shrink:0;}

/* ── FILTROS ── */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.25rem;align-items:center;}
.filters .form-control{width:auto;font-size:12px;}

/* ── STEPPER ── */
.stepper{display:flex;align-items:center;margin-bottom:2rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.5rem;box-shadow:var(--shadow);}
.step{display:flex;align-items:center;gap:8px;flex:1;}
.step-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;border:2px solid var(--border);color:var(--muted);background:var(--surface);}
.step.done .step-num{background:var(--navy);color:#fff;border-color:var(--navy);}
.step.active .step-num{background:var(--gold);color:#fff;border-color:var(--gold);}
.step-label{font-size:12px;color:var(--muted);font-weight:400;}
.step.active .step-label{color:var(--navy);font-weight:500;}
.step.done .step-label{color:var(--navy);}
.step-line{height:1px;background:var(--border);flex:1;margin:0 .5rem;}
.step.done .step-line{background:var(--navy);}

/* ── ARTIGOS ── */
.art-list{display:flex;flex-direction:column;gap:6px;}
.art-item{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:start;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);transition:.15s;}
.art-item:hover{border-color:#bbb5ac;background:#f0ece4;}
.art-num{font-size:12px;font-weight:600;color:var(--navy);padding-top:3px;display:flex;flex-direction:column;gap:4px;}
.art-texto{font-size:13px;color:var(--text);line-height:1.65;}
.art-texto.rev{text-decoration:line-through;opacity:.4;}
.art-actions{display:flex;gap:4px;}
.tag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:3px;font-weight:600;}
.tag-alt{background:var(--blue-l);color:var(--blue);}
.tag-rev{background:var(--red-l);color:var(--red);}
.tag-inc{background:var(--green-l);color:var(--green);}

/* ── ALTERAÇÕES REGISTRADAS ── */
.alt-card{border-radius:8px;padding:.875rem 1rem;margin-bottom:.5rem;display:flex;justify-content:space-between;align-items:flex-start;gap:.75rem;}
.alt-card.alterado{background:var(--blue-l);border-left:3px solid var(--blue);}
.alt-card.revogado{background:var(--red-l);border-left:3px solid #dc2626;}
.alt-card.incluido{background:var(--green-l);border-left:3px solid #16a34a;}
.alt-tipo{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;opacity:.7;}
.alt-disp{font-size:13px;font-weight:500;margin:2px 0;}
.alt-preview{font-size:12px;opacity:.75;font-style:italic;margin-top:4px;line-height:1.5;}

/* ── DOCUMENTO CONSOLIDADO ── */
.doc-wrapper{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);}
.doc-toolbar{padding:.875rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg);}
.doc-toolbar-left{font-size:13px;color:var(--muted);}
.doc-legenda{display:flex;gap:1.25rem;font-size:12px;}
.leg-item{display:flex;align-items:center;gap:5px;}
.leg-dot{width:8px;height:8px;border-radius:2px;}
.doc-body{padding:2.5rem 3rem;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:2;background:var(--surface);}
.doc-cabecalho{text-align:center;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border);}
.doc-lei-id{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--navy);}
.doc-lei-tipo{font-size:12px;color:var(--muted);margin-top:4px;font-family:'IBM Plex Sans',sans-serif;}
.doc-lei-cons{font-size:11px;color:var(--muted);margin-top:8px;font-style:italic;font-family:'IBM Plex Sans',sans-serif;padding:6px 16px;background:var(--gold-l);border-radius:4px;display:inline-block;}
.doc-art{margin-bottom:1.25rem;padding-bottom:1.25rem;border-bottom:1px solid #f0ece4;}
.doc-art:last-child{border-bottom:none;}
.doc-art-header{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;}
.doc-art-id{font-weight:700;font-size:13px;}
.doc-art-nota{font-family:'IBM Plex Sans',sans-serif;font-size:11px;font-style:italic;color:var(--muted);background:var(--light);padding:2px 8px;border-radius:3px;}
.doc-art-texto{font-size:13px;line-height:1.9;color:var(--text);text-align:justify;}
.c-alt .doc-art-id{color:var(--blue);}

.c-rev .doc-art-id{color:var(--red);}
.c-rev .doc-art-texto{color:var(--red);}
.c-inc .doc-art-id{color:var(--green);}
.c-inc .doc-art-texto{color:var(--green);}
/* Texto tachado e novo */
.doc-art-tachado{text-decoration:line-through;opacity:.6;}
.c-rev .doc-art-tachado{color:var(--red);}
.c-alt .doc-art-tachado{color:var(--red);opacity:.55;}
.doc-art-redacao-ant{background:#fff5f5;border-left:3px solid var(--red);padding:6px 10px;border-radius:0 6px 6px 0;margin-bottom:6px;}
.doc-ant-label{font-family:'IBM Plex Sans',sans-serif;font-size:10px;color:var(--red);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
.doc-art-redacao-nov{background:#f0fdf4;border-left:3px solid var(--green);padding:6px 10px;border-radius:0 6px 6px 0;}
.doc-nov-label{font-family:'IBM Plex Sans',sans-serif;font-size:10px;color:var(--green);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
.doc-art-novo{color:var(--blue);}

/* ── HISTÓRICO ── */
.hist-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.25rem;margin-bottom:.75rem;display:flex;align-items:center;gap:1rem;box-shadow:var(--shadow);}
.hist-info{flex:1;}
.hist-title{font-size:14px;font-weight:500;color:var(--navy);}
.hist-sub{font-size:12px;color:var(--muted);margin-top:2px;}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(15,35,64,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;}
.overlay.hidden{display:none;}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:580px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;}
.modal-body{flex:1;overflow-y:auto;}
.modal-foot{flex-shrink:0;}
.modal-wide{max-width:800px;}
.modal-head{padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:1;}
.modal-title{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:var(--navy);}
.modal-body{padding:1.5rem;}
.modal-foot{padding:1rem 1.5rem;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.modal-x{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1;padding:0 4px;}
.modal-x:hover{color:var(--text);}

/* ── EMPTY ── */
.empty-state{text-align:center;padding:3rem 2rem;color:var(--muted);}
.empty-state .ico{font-size:36px;display:block;margin-bottom:.75rem;opacity:.35;}
.empty-state p{font-size:13px;}

/* ── SEP ── */
.sep{height:1px;background:var(--border);margin:1rem 0;}

/* ── TOAST ── */
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--navy);color:#fff;padding:.75rem 1.25rem;border-radius:8px;font-size:13px;z-index:999;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;max-width:280px;}
.toast.show{opacity:1;transform:translateY(0);}

/* ── SELECT LEI ── */
.sel-lei-opt{padding:.875rem 1rem;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:.15s;margin-bottom:.5rem;display:flex;justify-content:space-between;align-items:center;}
.sel-lei-opt:hover{border-color:var(--blue);background:var(--blue-l);}
.sel-lei-opt.selected{border-color:var(--navy);background:var(--navy);color:#fff;}
.sel-lei-opt.selected .slo-ementa{color:rgba(255,255,255,.7);}
.slo-num{font-size:13px;font-weight:500;}
.slo-ementa{font-size:12px;color:var(--muted);margin-top:2px;}

/* ── RESPONSIVO ── */
@media(max-width:768px){
  .sidebar{width:100%;height:auto;position:relative;}
  .main{margin-left:0;}
  .content{padding:1rem;}
  .stats{grid-template-columns:1fr 1fr;}
  .form-2,.form-3{grid-template-columns:1fr;}
  .art-item{grid-template-columns:80px 1fr auto;}
  .doc-body{padding:1.25rem;}
  .stepper{flex-direction:column;align-items:flex-start;gap:.5rem;}
  .step-line{display:none;}
}
.doc-art.c-alt{background:rgba(30,95,168,.06);border-left:3px solid var(--blue);padding:8px 12px;border-radius:0 6px 6px 0;margin-bottom:.75rem;}
.doc-art.c-rev{background:rgba(139,26,26,.06);border-left:3px solid var(--red);padding:8px 12px;border-radius:0 6px 6px 0;margin-bottom:.75rem;}
.doc-art.c-inc{background:rgba(21,95,59,.06);border-left:3px solid var(--green);padding:8px 12px;border-radius:0 6px 6px 0;margin-bottom:.75rem;}
.doc-art-redacao-ant{background:#fdf4f4;border-left:2px solid #8b1a1a;padding:5px 10px;border-radius:0 4px 4px 0;margin-bottom:5px;}
.doc-ant-label{font-family:'IBM Plex Sans',sans-serif;font-size:10px;color:#8b1a1a;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px;}
.doc-art-tachado{text-decoration:line-through;color:#1a1714;opacity:.65;}
.doc-art-redacao-nov{background:#f0fdf4;border-left:2px solid #155f3b;padding:5px 10px;border-radius:0 4px 4px 0;}
.doc-nov-label{font-family:'IBM Plex Sans',sans-serif;font-size:10px;color:#155f3b;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px;}
.doc-art-novo{color:var(--blue);}

.doc-est-titulo{text-align:center;margin:1.25rem 0 .25rem;}
.doc-est-titulo .doc-est-label{font-size:13px;font-weight:700;color:var(--navy);font-family:'IBM Plex Mono',monospace;}
.doc-est-titulo .doc-est-nome{font-size:13px;font-weight:700;color:var(--navy);font-family:'IBM Plex Mono',monospace;margin-bottom:.5rem;}
.doc-est-capitulo{text-align:center;margin:.875rem 0 .25rem;}
.doc-est-capitulo .doc-est-label{font-size:12px;font-weight:700;color:var(--navy);font-family:'IBM Plex Mono',monospace;}
.doc-est-capitulo .doc-est-nome{font-size:12px;font-weight:700;color:var(--navy);font-family:'IBM Plex Mono',monospace;margin-bottom:.375rem;}
.doc-est-secao{text-align:center;margin:.625rem 0 .25rem;}
.doc-est-secao .doc-est-label{font-size:12px;font-weight:600;font-style:italic;color:var(--navy);font-family:'IBM Plex Mono',monospace;}
.doc-est-secao .doc-est-nome{font-size:12px;font-weight:600;font-style:italic;color:var(--navy);font-family:'IBM Plex Mono',monospace;margin-bottom:.25rem;}

/* TABELAS ANEXOS */
.anexo-table-wrap{overflow-x:auto;margin:.5rem 0;}
.anexo-table{width:100%;border-collapse:collapse;font-size:12px;}
.anexo-table th{background:var(--navy);color:#fff;padding:6px 10px;text-align:left;font-weight:600;font-size:11px;white-space:nowrap;}
.anexo-table td{padding:5px 10px;border:1px solid var(--bord);color:var(--text);vertical-align:top;line-height:1.5;}
.anexo-table tr:nth-child(even) td{background:var(--bg);}

<body>

<textarea id="db-data" style="display:none">{"leis":[{"id":1,"tipo":"lc","num":"005","ano":"1991","ementa":"Institui o Código Tributário Municipal.","tributo":"geral","situacao":"vigente-alt","link":"","artigos":[],"anexos":[]},{"id":2,"tipo":"lc","num":"358","ano":"2022","ementa":"Dispõe sobre o parcelamento dos créditos tributários e não tributários de titularidade do Município de Maricá.","tributo":"geral","situacao":"vigente","link":"JOM 1.285, de 14/03/2022","artigos":[{"tipo":"art","label":"Art. 1º","texto":"Os créditos de natureza tributária e não tributária, de titularidade do Município de Maricá, inscritos ou não em dívida ativa, ajuizados ou por ajuizar, desde que vencidos, poderão ser parcelados em até 60 (sessenta) meses, observadas as condições fixadas nesta Lei Complementar e em regulamento específico editado pelo Chefe do Poder Executivo Municipal.","paiId":null,"id":2046,"_path":"Art. 1º"},{"tipo":"art","label":"Art. 2º","texto":"O valor da dívida parcelada será consolidado na data da efetivação do parcelamento, de acordo com os acréscimos legais previstos e será expresso em valores de moeda corrente nacional.","paiId":null,"id":2047,"_path":"Art. 2º"},{"tipo":"par","label":"§1º","texto":"Por crédito consolidado compreende-se o total da dívida atinente ao pedido de parcelamento, computados os encargos e os acréscimos legais vencidos até a data da consolidação, monetariamente atualizado.","paiId":2047,"id":2048,"_path":"Art. 2º – §1º"},{"tipo":"par","label":"§2º","texto":"A consolidação do crédito não exclui a possibilidade de posterior verifi cação de sua exatidão e a cobrança ou devolução de eventuais diferenças.","paiId":2047,"id":2049,"_path":"Art. 2º – §2º"},{"tipo":"par","label":"§3º","texto":"O valor do crédito objeto do parcelamento corresponderá ao valor do crédito consolidado, deduzido o valor do pagamento a que se refere à entrada.","paiId":2047,"id":2050,"_path":"Art. 2º – §3º"},{"tipo":"par","label":"§4º","texto":"O sujeito passivo procederá ao pagamento dos débitos tributários e não tributários, em parcelas mensais, sucessivas, acrescidas de juros de 1% (um por cento) ao mês sobre o valor de cada parcela, calculados a partir do primeiro dia do mês subsequente ao vencimento do prazo até o último dia do mês anterior ao do pagamento.","paiId":2047,"id":2051,"_path":"Art. 2º – §4º"},{"tipo":"par","label":"§5º","texto":"As parcelas obedecerão aos seguintes limites mínimos.","paiId":2047,"id":2052,"_path":"Art. 2º – §5º"},{"tipo":"inc","label":"I","texto":"o valor de cada parcela para pessoa jurídica não poderá ser inferior a 1 (uma) Unidade Fiscal de Maricá - UFIMA;","paiId":2052,"id":2053,"_path":"Art. 2º – §5º – I"},{"tipo":"inc","label":"II","texto":"o valor de cada parcela para pessoa física não poderá ser inferior a 0,5 (cinco décimos) Unidade Fiscal de Maricá - UFIMA.","paiId":2052,"id":2054,"_path":"Art. 2º – §5º – II"},{"tipo":"par","label":"§6º","texto":"Lei específica versará sobre eventuais descontos de juros e multas, observadas as respectivas renúncias fiscais.","paiId":2047,"id":2055,"_path":"Art. 2º – §6º"},{"tipo":"art","label":"Art. 3º","texto":"Não poderão ser reunidos no mesmo parcelamento os seguintes créditos:","paiId":null,"id":2056,"_path":"Art. 3º"},{"tipo":"inc","label":"I","texto":"tributários com não tributários;","paiId":2056,"id":2057,"_path":"Art. 3º – I"},{"tipo":"inc","label":"II","texto":"relativos a tributos diferentes, com exceção daqueles cujos lançamentos são feitos conjuntamente;","paiId":2056,"id":2058,"_path":"Art. 3º – II"},{"tipo":"inc","label":"III","texto":"lançados de ofício mediante diferentes autos de infração ou notificações de lançamento;","paiId":2056,"id":2059,"_path":"Art. 3º – III"},{"tipo":"inc","label":"IV","texto":"lançados de ofício com outros lançados por homologação ou declaração; e","paiId":2056,"id":2060,"_path":"Art. 3º – IV"},{"tipo":"inc","label":"V","texto":"inscritos em dívida ativa com não inscritos em dívida ativa.","paiId":2056,"id":2061,"_path":"Art. 3º – V"},{"tipo":"art","label":"Art. 4º","texto":"O número de parcelas fica condicionado ao respectivo valor total do crédito consolidado, de acordo com os parâmetros definidos a seguir:","paiId":null,"id":2062,"_path":"Art. 4º"},{"tipo":"inc","label":"I","texto":"em até 48 (quarento e oito) parcelas mensais e sucessivas, quando os créditos não ultrapassarem o montante de 60 (sessenta) UFIMAS.","paiId":2062,"id":2063,"_path":"Art. 4º – I"},{"tipo":"inc","label":"II","texto":"em até 54 (cinquenta e quatro) parcelas mensais e sucessivas, quando os créditos forem superiores a 60 (sessenta) UFIMAS e não ultrapassarem o montante de 600 (seiscentas) UFIMAS;","paiId":2062,"id":2064,"_path":"Art. 4º – II"},{"tipo":"inc","label":"III","texto":"em até 60 (sessenta) parcelas mensais e sucessivas, quando os créditos forem superiores a 600 (seiscentas) UFIMAS.","paiId":2062,"id":2065,"_path":"Art. 4º – III"},{"tipo":"par","label":"§1º","texto":"Pessoas físicas declaradas hipossuficientes ou que ganhem até 02 (dois) salários mínimo vigentes a época do requerimento do parcelamento, terão o prazo de até 60 (sessenta) meses, independentemente do valor do crédito tributário ou não tributário, desde que observado o artigo 2º, § 5º, desta lei.","paiId":2062,"id":2066,"_path":"Art. 4º – §1º"},{"tipo":"par","label":"§2º","texto":"O reconhecimento do direito previsto no parágrafo antecedente se dará no âmbito das atribuições dos órgãos descritas no art. 10 desta Lei Complementar.","paiId":2062,"id":2067,"_path":"Art. 4º – §2º"},{"tipo":"art","label":"Art. 5º","texto":"O pedido de parcelamento de crédito constitui confi ssão extrajudicial irretratável e irrevogável do débito e aceitação plena e irrestrita das condições estabelecidas nesta Lei Complementar.","paiId":null,"id":2068,"_path":"Art. 5º"},{"tipo":"art","label":"Art. 6º","texto":"A falta de pagamento de 03 (três) parcelas consecutivas ou não, ou de qualquer parcela por mais de noventa dias, acarretará o cancelamento, independente de prévia notifi cação do contribuinte.","paiId":null,"id":2069,"_path":"Art. 6º"},{"tipo":"par","label":"Parágrafo único","texto":"O saldo devedor remanescente será objeto de prosseguimento de cobrança judicial, de inscrição em dívida ativa ou de ajuizamento, conforme o caso.","paiId":2069,"id":2070,"_path":"Art. 6º – Parágrafo único"},{"tipo":"art","label":"Art. 7º","texto":"Será permitido o reparcelamento decorrente de inadimplência, uma única vez, desde que observado o pagamento inicial mínimo de 25% (vinte e cinco por cento) do saldo remanescente do parcelamento originário, acrescidos de juros, multas e encargos legais.","paiId":null,"id":2071,"_path":"Art. 7º"},{"tipo":"art","label":"Art. 8º","texto":"É vedada a concessão de parcelamento relativos a esta Lei Complementar:","paiId":null,"id":2072,"_path":"Art. 8º"},{"tipo":"inc","label":"I","texto":"ao contribuinte que tenha parcelamento em atraso, que não enseje o cancelamento, enquanto não regularizado o pagamento das parcelas vencidas e não pagas.","paiId":2072,"id":2073,"_path":"Art. 8º – I"},{"tipo":"inc","label":"II","texto":"aos devedores que estejam sob ação fiscal, ressalvados os créditos anteriormente apurados, quando denunciados espontaneamente.","paiId":2072,"id":2074,"_path":"Art. 8º – II"},{"tipo":"par","label":"Parágrafo único","texto":"A vedação que se trata o caput desse artigo é exclusiva para os créditos tributários e não tributários vencidos, observadas as vedações legais para os parcelamentos do Código Tributário Municipal.","paiId":2072,"id":2075,"_path":"Art. 8º – Parágrafo único"},{"tipo":"art","label":"Art. 9º","texto":"O parcelamento somente será concedido mediante requerimento, protocolizado pessoalmente ou por procurador regulamente constituído, pelo contribuinte, responsável tributário ou devedor, ou ainda, por terceiro que demonstre ter legítimo interesse na liquidação do débito, importando na expressa confissão irretratável e indivisível, quanto a sua certeza, liquidez e exigibilidade.","paiId":null,"id":2076,"_path":"Art. 9º"},{"tipo":"par","label":"§1º","texto":"Considera-se terceiro interessado o locatário, o cessionário, o usufrutuário, o donatário, o comodatário, o arrendatário, promitente comprador, posseiro, o cônjuge ou companheiro do proprietário ou terceiro, seus parentes, em linha reta ou colateral em até quarto grau, herdeiro ou inventariante, mediante prova documental idônea de uma dessas qualidades.","paiId":2076,"id":2077,"_path":"Art. 9º – §1º"},{"tipo":"par","label":"§2º","texto":"No caso de terceiros interessados não conste dos cadastros municiais como contribuinte, responsável tributário ou devedor do crédito a ser parcelado, o parcelamento requerido nos termos do caput não suspende a exigibilidade do crédito e nem suspende ou não interrompe o decurso do prazo prescricional, salvo se apresentada declaração escrita com expresso reconhecimento do débito firmada pelo contribuinte, responsável tributário ou devedor do crédito.","paiId":2076,"id":2078,"_path":"Art. 9º – §2º"},{"tipo":"par","label":"§3º","texto":"Na hipótese prevista no §2º deste artigo, a data de vencimento da última parcela não poderá ser posterior ao sexto mês imediatamente anterior ao mês em que ocorrer o término do prazo prescricional da dívida original mais antiga incluída no parcelamento.","paiId":2076,"id":2079,"_path":"Art. 9º – §3º"},{"tipo":"par","label":"§4º","texto":"O terceiro interessado, defi nido no §1º deste artigo, não fará jus ao reparcelamento definido no art. 7º.","paiId":2076,"id":2080,"_path":"Art. 9º – §4º"},{"tipo":"par","label":"§5º","texto":"Para afastar as limitações previstas no § 2º deste artigo e no art. 7º deverá o solicitante do parcelamento promover as alterações cadastrais pertinentes junto ao Município.","paiId":2076,"id":2081,"_path":"Art. 9º – §5º"},{"tipo":"art","label":"Art. 10.","texto":"A concessão e o controle do parcelamento e do reparcelamento dos créditos mencionados nesta Lei Complementar, bem como o seu cancelamento, incluem-se na competência:","paiId":null,"id":2082,"_path":"Art. 10."},{"tipo":"inc","label":"I","texto":"do Órgão Fazendário, relativamente aos créditos de natureza tributária e não tributária vencidos até a competência anterior e não inscritos em dívida ativa;","paiId":2082,"id":2083,"_path":"Art. 10. – I"},{"tipo":"inc","label":"II","texto":"da Procuradoria Geral do Município, relativamente aos créditos inscritos em dívida ativa ou ajuizados de natureza tributária e não tributária.","paiId":2082,"id":2084,"_path":"Art. 10. – II"},{"tipo":"par","label":"Parágrafo único","texto":"O empresário ou a sociedade empresária que pleitear ou tiver deferido o processamento de recuperação judicial, poderá parcelar os seus débitos para com a Fazenda Municipal, ainda que não vencidos, nos termos do arts. 10-A, 10-B e 10-C da Lei Federal 10.522, de 19 de julho de 2002.","paiId":2082,"id":2085,"_path":"Art. 10. – Parágrafo único"},{"tipo":"art","label":"Art. 11.","texto":"O disposto nesta Lei Complementar não se aplica aos créditos tributários relativos aos impostos cujo fato gerador tenha ocorrido quando o contribuinte era optante pelo Regime Especial Unificado de Arrecadação de Tributos e Contribuições devidos pelas Microempresas e Empresas de Pequeno Porte – SIMPLES NACIONAL, instituído pela Lei Complementar nº 123, de 14 de dezembro de 2006.","paiId":null,"id":2086,"_path":"Art. 11."},{"tipo":"art","label":"Art. 12.","texto":"O Poder Executivo editará os atos necessários ao cumprimento desta Lei Complementar.","paiId":null,"id":2087,"_path":"Art. 12."},{"tipo":"art","label":"Art. 13.","texto":"Ato conjunto do Órgão Fazendário e da Procuradoria Geral do Município regulamentará o procedimento de parcelamento on-line.","paiId":null,"id":2088,"_path":"Art. 13."},{"tipo":"art","label":"Art. 14.","texto":"Fica revogado o art. 284, da Lei Complementar nº 05, de 30 de janeiro de 1991 - Código Tributário do Município de Maricá.","paiId":null,"id":2089,"_path":"Art. 14."},{"tipo":"art","label":"Art. 15.","texto":"Esta Lei Complementar entra em vigor na data de sua publicação.","paiId":null,"id":2090,"_path":"Art. 15."}],"anexos":[],"preambulo":"DISPÕE SOBRE O PARCELAMENTO DOS CRÉDITOS DE NATUREZA TRIBUTÁRIA E NÃO TRIBUTÁRIA DE TITULARIDADE DO MUNICÍPIO DE MARICÁ; REVOGA ART. 284, DA LEI COMPLEMENTAR Nº 05, DE 30 DE JANEIRO DE 1991; E DÁ OUTRAS PROVIDÊNCIAS.","formulaPromulgacao":"O POVO DO MUNICÍPIO DE MARICÁ, por seus representantes na Câmara Municipal, aprovou e o Prefeito Municipal, em seu nome sanciona a seguinte Lei Complementar:","dataExtenso":"10 DE MARÇO DE 2022","municipio":"Estado do Rio de Janeiro, RJ","assinatura":"Fabiano Taques Horta \nPREFEITO DO MUNICÍPIO DE MARICÁ"},{"id":3,"tipo":"lc","num":"383","ano":"2023","ementa":"Altera o art. 13, inclui parágrafo único ao art. 16, e revoga o art. 205, da LC nº 005/1991 – CTM.","tributo":"geral","situacao":"vigente","link":"JOM 1.493, de 28/08/2023","artigos":[{"id":2129,"tipo":"art","label":"Art. 1º","paiId":null,"texto":"Altera o caput e o § 3º, renumera os §§ 1º, 2º, e 4º para §§ 4º, 5º, 6º, respectivamente, e inclui os §§ 1º e 2º, ao Art. 13, da Lei Complementar nº 005, de 30 de janeiro de 1991, que passa a viger com a seguinte forma e redação:␞__CITACAO__␞\"Art. 13. O imposto será lançado de ofício, anualmente, para cada imóvel ou unidade imobiliária independente, ainda que contíguo, levando-se em conta a sua situação e a legislação vigente à data do fato gerador.\n§1º O sujeito passivo será notificado do lançamento, independentemente de ordem de preferência:\nI – pela remessa da notificação, do carnê ou da guia ao domicílio tributário eleito pelo contribuinte; ou\nII – pela publicação de edital, em caráter geral, no Jornal Oficial do Município.\n§2º A remessa da notificação, do carnê ou da guia de que trata o inciso I do caput ao contribuinte não o desobriga de procurar a repartição competente, caso não receba o documento até a data de vencimento do tributo.\n§3º O edital de que trata o inciso II do caput conterá:\nI – a legislação aplicável;\nII – o local ou o sítio eletrônico, quando for o caso, para retirada da notificação de lançamento com o detalhamento individualizado do cálculo do tributo;\nIII – a data de vencimento do tributo;\nIV – o prazo para impugnação, contado da data da publicação;\n§4º O lançamento será procedido, na hipótese de condomínio:\nI – quando pro indiviso, em nome de qualquer um dos coproprietários, titulares de domínio útil ou possuidores;\nII – quando pro diviso, em nome do proprietário, do titular do domínio útil ou do possuidor da unidade autônoma.\n§5º Os imóveis com testadas para diferentes logradouros serão tributados com base nos valores referentes ao logradouro mais valorizado.\n§6º Os contribuintes terão o prazo até 30 de junho do exercício vigente, do lançamento do imposto, para apresentação de pedido de revisão do valor venal do imóvel respectivo.\""},{"id":2130,"tipo":"art","label":"Art. 2º","paiId":null,"texto":"Inclui o parágrafo único, ao Art. 116, da Lei Complementar nº 005, 30 de janeiro de 1991, que passa a viger com a seguinte forma e redação:␞__CITACAO__␞\"Art. 116. (...)\nParágrafo único Os sujeitos passivos serão notificados do lançamento da taxa de coleta de lixo na mesma forma prevista no § 1º, do Art. 13, para o IPTU.\""},{"id":2131,"tipo":"art","label":"Art. 3º","paiId":null,"texto":"Revoga o Art. 205, da Lei Complementar nº 005, de 30 de janeiro de 1991, que passa a viger com a seguinte forma e redação:␞__CITACAO__␞\"Art. 205. Revogado.\""},{"id":2132,"tipo":"art","label":"Art. 4º","paiId":null,"texto":"Esta Lei Complementar entra em vigor na data de sua publicação."}],"anexos":[],"preambulo":"ALTERA O CAPUT E O § 3º, RENUMERA OS §§ 1º, 2º, E 4º PARA §§ 4º, 5º E 6º, RESPECTIVAMENTE, E INCLUI OS §§ 1º E 2º, AO ART. 13, INCLUI O PARÁGRAFO ÚNICO, AO ART. 16, E REVOGA O ART. 205, DA LEI COMPLEMENTAR Nº 005, DE 30 DE JANEIRO DE 1991 – CÓDIGO TRIBUTÁRIO MUNICIPAL.","formulaPromulgacao":"O POVO DO MUNICÍPIO DE MARICÁ, por seus representantes na Câmara Municipal, aprovou e o Prefeito Municipal, em seu nome, sanciona a seguinte Lei Complementar:","dataExtenso":"23 DE AGOSTO DE 2023","municipio":"Estado do Rio de Janeiro, RJ","assinatura":"FABIANO TAQUES HORTA\nPREFEITO DO MUNICÍPIO DE MARICÁ"},{"id":4,"tipo":"lc","num":"389","ano":"2023","ementa":"Define a forma de tributação do ISSQN no Município de Maricá.","tributo":"issqn","situacao":"vigente","link":"JOM 1.538, de 22/12/2023","preambulo":"DEFINE A FORMA DE TRIBUTAÇÃO, NO MUNICÍPIO DE MARICÁ, DO IMPOSTO SOBRE SERVIÇOS DE QUALQUER NATUREZA – ISSQN, PREVISTO NO INCISO III DO ARTIGO 156 DA CONSTITUIÇÃO DA REPÚBLICA FEDERATIVA DO BRASIL DE 1988.","formulaPromulgacao":"O POVO DO MUNICÍPIO DE MARICÁ, por seus representantes na Câmara Municipal, aprovou e o Prefeito Municipal, em seu nome, sanciona a seguinte Lei Complementar:","artigos":[{"tipo":"titulo","label":"TÍTULO I","texto":"DO IMPOSTO SOBRE SERVIÇOS DE QUALQUER NATUREZA","paiId":null,"id":3459},{"tipo":"capitulo","label":"Capítulo I","texto":"FATO GERADOR","paiId":3459,"id":3460},{"tipo":"art","label":"Art. 1º","texto":"O Imposto Sobre Serviços de Qualquer Natureza, tem como fato gerador a prestação dos serviços constantes dos Anexos desta Lei, ainda que esses não se constituam como atividade preponderante do prestador.","paiId":3460,"id":3461},{"tipo":"par","label":"§1º","texto":"A hipótese de incidência do imposto se configura independentemente:","paiId":3461,"id":3462},{"tipo":"inc","label":"I","texto":"da existência de estabelecimento fixo;","paiId":3462,"id":3463},{"tipo":"inc","label":"II","texto":"do resultado financeiro do exercício da atividade;","paiId":3462,"id":3464},{"tipo":"inc","label":"III","texto":"do cumprimento de qualquer exigência legal ou regulamentar, sem prejuízo das penalidades cabíveis;","paiId":3462,"id":3465},{"tipo":"inc","label":"IV","texto":"do pagamento ou não do preço do serviço no mesmo mês ou exercício;","paiId":3462,"id":3466},{"tipo":"par","label":"§2º","texto":"O imposto incide também sobre:","paiId":3461,"id":3467},{"tipo":"inc","label":"I","texto":"o serviço proveniente do exterior do País ou cuja prestação se tenha iniciado no exterior do País;","paiId":3467,"id":3468},{"tipo":"inc","label":"II","texto":"os serviços prestados mediante a utilização de bens e serviços públicos explorados economicamente mediante autorização, permissão ou concessão, com o pagamento de tarifa, preço ou pedágio pelo usuário final do serviço.","paiId":3467,"id":3469},{"tipo":"par","label":"§3º","texto":"Ressalvadas as exceções expressas no Anexo I desta Lei, os serviços nela mencionados não ficam sujeitos ao Imposto Sobre Operações Relativas à Circulação de Mercadorias e Prestações de Serviços de Transporte Interestadual e Intermunicipal e de Comunicação – ICMS, ainda que sua prestação envolva fornecimento de mercadorias.","paiId":3461,"id":3470},{"tipo":"art","label":"Art. 2º","texto":"Considera-se ocorrido o fato gerador do imposto e existentes os seus efeitos:","paiId":3460,"id":3471},{"tipo":"inc","label":"I","texto":"desde o momento em que se verificarem as circunstâncias materiais necessárias para que a prestação dos serviços previstos na lista de serviços do Anexo I produza os efeitos que normalmente lhe são próprios;","paiId":3471,"id":3472},{"tipo":"inc","label":"II","texto":"mensalmente, no caso da prestação de serviços em caráter continuado, considerando-se as frações de mês;","paiId":3471,"id":3473},{"tipo":"inc","label":"III","texto":"na data de início de atividade e em cada dia 1º de janeiro dos exercícios subsequentes, até o término das atividades, no caso de contribuintes sujeitos à tributação por valores fixos anuais.","paiId":3471,"id":3474},{"tipo":"par","label":"Parágrafo único","texto":"Considera-se prestação de serviços em caráter continuado aquela em que o decurso de tempo superior a um mês é condição necessária para o seu cumprimento.","paiId":3471,"id":3475},{"tipo":"capitulo","label":"Capítulo II","texto":"NÃO - INCIDÊNCIA","paiId":3459,"id":3476},{"tipo":"art","label":"Art. 3º","texto":"O Imposto sobre Serviços de Qualquer Natureza não incide sobre:","paiId":3476,"id":3477},{"tipo":"inc","label":"I","texto":"a prestação de serviços de transportes interestadual e intermunicipal e de comunicação;","paiId":3477,"id":3478},{"tipo":"inc","label":"II","texto":"as exportações de serviços para o exterior do País;","paiId":3477,"id":3479},{"tipo":"inc","label":"III","texto":"a prestação de serviços em relação de emprego, dos trabalhadores avulsos, dos diretores e membros de conselho consultivo ou de conselho fiscal de sociedades e fundações, bem como dos sócios-gerentes e dos gerentes-delegados; e","paiId":3477,"id":3480},{"tipo":"inc","label":"IV","texto":"o valor intermediado no mercado de títulos e valores mobiliários, o valor dos depósitos bancários, o principal, juros e acréscimos moratórios relativos a operações de crédito realizadas por instituições financeiras.","paiId":3477,"id":3481},{"tipo":"par","label":"Parágrafo único","texto":"Não se enquadram no disposto no inciso II os serviços desenvolvidos no Município, cujo resultado aqui se verifique, ainda que o pagamento seja feito por residente no exterior.","paiId":3477,"id":3482},{"tipo":"capitulo","label":"Capítulo III","texto":"ISENÇÕES","paiId":3459,"id":3483},{"tipo":"art","label":"Art. 4º","texto":"Ficam isentos do imposto:","paiId":3483,"id":3484},{"tipo":"inc","label":"I","texto":"os serviços prestados por associações culturais, associações comunitárias e clubes de serviço, cuja finalidade essencial, nos termos do respectivo estatuto e tendo em vista os atos efetivamente praticados, esteja voltada para o desenvolvimento da comunidade;","paiId":3484,"id":3485},{"tipo":"inc","label":"II","texto":"os serviços de diversão pública e de competições desportivas com fins beneficentes ou considerados de interesse da comunidade pelo órgão de educação e cultura do Município ou órgão similar.","paiId":3484,"id":3486},{"tipo":"par","label":"Parágrafo único","texto":"As isenções a que se referem os incisos I e II do caput não se aplicam às receitas decorrentes de:","paiId":3484,"id":3487},{"tipo":"inc","label":"I","texto":"serviços prestados a não-sócios;","paiId":3487,"id":3488},{"tipo":"inc","label":"II","texto":"serviços descritos no item 19 do Anexo I desta Lei;","paiId":3487,"id":3489},{"tipo":"inc","label":"III","texto":"serviços não compreendidos nas finalidades especificadas em seu Estatuto ou Contrato Social e de acordo com o art. 4º deste Lei.","paiId":3487,"id":3490},{"tipo":"art","label":"Art. 5º","texto":"As isenções serão solicitadas em requerimento, acompanhado das provas de que o contribuinte preenche os requisitos necessários à obtenção do benefício.","paiId":3483,"id":3491},{"tipo":"par","label":"§1º","texto":"Nos casos de início de atividade, o pedido de isenção deve ser feito por ocasião da concessão da licença para localização e/ou funcionamento de estabelecimentos.","paiId":3491,"id":3492},{"tipo":"par","label":"§2º","texto":"A documentação apresentada com o primeiro pedido de isenção poderá servir para os demais exercícios, devendo o requerimento de renovação de isenção a ele referir-se, apresentando as provas relativas ao novo exercício.","paiId":3491,"id":3493},{"tipo":"par","label":"§3º","texto":"As renovações de isenções devem ser requeridas até o último dia de expediente na repartição fazendária do exercício anterior ao que se pleiteia o benefício, sob pena de perda do mesmo.","paiId":3491,"id":3494},{"tipo":"par","label":"§4º","texto":"As isenções serão revistas:","paiId":3491,"id":3495},{"tipo":"inc","label":"I","texto":"por requerimento do contribuinte comunicando a extinção ou modificação das condições de prestação do serviço beneficiadas pelas hipóteses de isenção do artigo 4º;","paiId":3495,"id":3496},{"tipo":"inc","label":"II","texto":"de ofício a qualquer tempo em que se constate a modificação das condições de prestação do serviço, por parte do contribuinte, de forma que não mais se enquadre nas hipóteses de isenção do artigo 4º, podendo ser promovido o seu cancelamento, se for o caso e nos termos da lei, independentemente das demais sanções cabíveis.","paiId":3495,"id":3497},{"tipo":"capitulo","label":"Capítulo IV","texto":"LOCAL DE INCIDÊNCIA DO IMPOSTO","paiId":3459,"id":3498},{"tipo":"art","label":"Art. 6º","texto":"O serviço considera-se prestado, e o imposto devido, no local do estabelecimento prestador ou, na falta do estabelecimento, no local do domicílio do prestador, exceto nas hipóteses previstas nos incisos abaixo, quando o imposto será devido no local:","paiId":3498,"id":3499},{"tipo":"inc","label":"I","texto":"do estabelecimento do tomador ou intermediário do serviço ou, na falta de estabelecimento, onde ele estiver domiciliado, na hipótese do inciso I do parágrafo 2º do artigo 1º;","paiId":3499,"id":3500},{"tipo":"inc","label":"II","texto":"da instalação dos andaimes, palcos, coberturas e outras estruturas, no caso dos serviços descritos no subitem 3.05 da tabela do Anexo I desta Lei;","paiId":3499,"id":3501},{"tipo":"inc","label":"III","texto":"da execução da obra, no caso dos serviços descritos subitens 7.02 e 7.19 do Anexo I desta Lei;","paiId":3499,"id":3502},{"tipo":"inc","label":"IV","texto":"da demolição, no caso dos serviços descritos no subitem 7.04 do Anexo I desta Lei;","paiId":3499,"id":3503},{"tipo":"inc","label":"V","texto":"das edificações em geral, estradas, pontes, portos e congêneres, no caso dos serviços descritos no subitem 7.05 do Anexo I desta Lei;","paiId":3499,"id":3504},{"tipo":"inc","label":"VI","texto":"da execução da varrição, coleta, remoção, incineração, tratamento, reciclagem, separação e destinação final de lixo, rejeitos e outros resíduos quaisquer, no caso dos serviços descritos no subitem 7.09 do Anexo I desta Lei;","paiId":3499,"id":3505},{"tipo":"inc","label":"VII","texto":"da execução da limpeza, manutenção e conservação de vias e logradouros públicos, imóveis, chaminés, piscinas, parques, jardins e congêneres, no caso dos serviços descritos no subitem 7.10 do Anexo I desta Lei;","paiId":3499,"id":3506},{"tipo":"inc","label":"VIII","texto":"da execução da decoração e jardinagem, do corte e poda de árvores, no caso dos serviços descritos no subitem 7.11 do Anexo I desta Lei;","paiId":3499,"id":3507},{"tipo":"inc","label":"IX","texto":"do controle e tratamento do efluente de qualquer natureza e de agentes físicos, químicos e biológicos, no caso dos serviços descritos no subitem 7.12 do Anexo I desta Lei;","paiId":3499,"id":3508},{"tipo":"inc","label":"X","texto":"do florestamento, reflorestamento, semeadura, adubação, reparação de solo, plantio, silagem, colheita, corte, descascamento de árvores, silvicultura, exploração florestal e serviços congêneres indissociáveis da formação, manutenção e colheita de florestas para quaisquer fins e por quaisquer meios, no caso dos serviços descritos no subitem 7.16 do Anexo I desta Lei;","paiId":3499,"id":3509},{"tipo":"inc","label":"XI","texto":"da execução dos serviços de escoramento, contenção de encostas e congêneres, no caso dos serviços descritos no subitem 7.17 do Anexo I desta Lei;","paiId":3499,"id":3510},{"tipo":"inc","label":"XII","texto":"da limpeza e dragagem, no caso dos serviços descritos no subitem 7.18 do Anexo I desta Lei;","paiId":3499,"id":3511},{"tipo":"inc","label":"XIII","texto":"onde o bem estiver guardado ou estacionado, no caso dos serviços descritos no subitem 11.01 do Anexo I desta Lei;","paiId":3499,"id":3512},{"tipo":"inc","label":"XIV","texto":"dos bens, dos semoventes ou do domicílio das pessoas vigiados, segurados ou monitorados, no caso dos serviços descritos no subitem 11.02 do Anexo I desta Lei;","paiId":3499,"id":3513},{"tipo":"inc","label":"XV","texto":"do armazenamento, depósito, carga, descarga, arrumação e guarda do bem, no caso dos serviços descritos no subitem 11.04 do Anexo I desta Lei;","paiId":3499,"id":3514},{"tipo":"inc","label":"XVI","texto":"da execução dos serviços de diversão, lazer, entretenimento e congêneres, no caso dos serviços descritos nos subitens do item 12, exceto o 12.13, do Anexo I desta Lei;","paiId":3499,"id":3515},{"tipo":"inc","label":"XVII","texto":"do Município onde está sendo executado o transporte, no caso dos serviços descritos pelo item 16 do Anexo I desta Lei;","paiId":3499,"id":3516},{"tipo":"inc","label":"XVIII","texto":"do estabelecimento do tomador da mão de obra ou, na falta de estabelecimento, onde ele estiver domiciliado, no caso dos serviços descritos pelo subitem 17.05 do Anexo I desta Lei;","paiId":3499,"id":3517},{"tipo":"inc","label":"XIX","texto":"da feira, exposição, congresso ou congênere a que se referir o planejamento, organização e administração, no caso dos serviços descritos pelo subitem 17.10 do Anexo I desta Lei;","paiId":3499,"id":3518},{"tipo":"inc","label":"XX","texto":"do porto, aeroporto, ferroporto, terminal rodoviário, ferroviário ou metroviário, no caso dos serviços descritos pelo item 20 do Anexo I desta Lei.","paiId":3499,"id":3519},{"tipo":"inc","label":"XXI","texto":"do domicílio do tomador dos serviços dos subitens 4.22, 4.23 e 5.09 do Anexo I;","paiId":3499,"id":3520},{"tipo":"inc","label":"XXII","texto":"do domicílio do tomador do serviço no caso dos serviços prestados pelas administradoras de cartão de crédito ou débito e demais descritos no subitem 15.01 do Anexo I;","paiId":3499,"id":3521},{"tipo":"inc","label":"XXIII","texto":"do domicílio do tomador do serviço do subitem 15.09 do Anexo I.","paiId":3499,"id":3522},{"tipo":"par","label":"§1º","texto":"No caso dos serviços a que se refere o subitem 3.04 do Anexo I desta Lei, considera-se ocorrido o fato gerador e devido o imposto caso haja no território do Município extensão de ferrovia, rodovia, postes, cabos, dutos e condutos de qualquer natureza, objetos de locação, sublocação, arrendamento, direito de passagem ou permissão de uso, compartilhado ou não.","paiId":3499,"id":3523},{"tipo":"par","label":"§2º","texto":"No caso dos serviços a que se refere o subitem 22.01 do Anexo I desta Lei, considera-se ocorrido o fato gerador e devido o imposto caso haja no território do Município extensão de rodovia explorada.","paiId":3499,"id":3524},{"tipo":"par","label":"§3º","texto":"Considera-se ocorrido o fato gerador do imposto no local do estabelecimento prestador nos serviços executados em águas marítimas, excetuados os serviços descritos no subitem 20.01.","paiId":3499,"id":3525},{"tipo":"par","label":"§4º","texto":"Na hipótese de descumprimento do disposto no caput ou no parágrafo único ou ambos do artigo 23 desta Lei, referente à alíquota mínima, o imposto será devido no local do estabelecimento tomador ou intermediário do serviço ou, na falta de estabelecimento, onde ele estiver domiciliado.","paiId":3499,"id":3526},{"tipo":"par","label":"§5º","texto":"Ressalvadas as exceções e especificações estabelecidas nos §§ 6º a 12 deste artigo, considera-se tomador dos serviços referidos nos incisos XXI, XXII e XXIII do caput deste artigo o contratante do serviço e, no caso de negócio jurídico que envolva estipulação em favor de unidade da pessoa jurídica contratante, a unidade em favor da qual o serviço foi estipulado, sendo irrelevantes para caracterizá-la as denominações de sede, filial, agência, posto de atendimento, sucursal, escritório de representação ou contato ou quaisquer outras que venham a ser utilizadas.","paiId":3499,"id":3527},{"tipo":"par","label":"§6º","texto":"No caso dos serviços de planos de saúde ou de medicina e congêneres, referidos nos subitens 4.22 e 4.23 da lista de serviços anexa a esta Lei Complementar, o tomador do serviço é a pessoa física beneficiária vinculada à operadora por meio de convênio ou contrato de plano de saúde individual, familiar, coletivo empresarial ou coletivo por adesão.","paiId":3499,"id":3528},{"tipo":"par","label":"§7º","texto":"Nos casos em que houver dependentes vinculados ao titular do plano, será considerado apenas o domicílio do titular para fins do disposto no § 6º deste artigo.","paiId":3499,"id":3529},{"tipo":"par","label":"§8º","texto":"No caso dos serviços de administração de cartão de crédito ou débito e congêneres, referidos no subitem 15.01 do Anexo I, prestados diretamente aos portadores de cartões de crédito ou débito e congêneres, o tomador é o primeiro titular do cartão.","paiId":3499,"id":3530},{"tipo":"par","label":"§9º","texto":"O local do estabelecimento credenciado é considerado o domicílio do tomador dos demais serviços referidos no subitem 15.01 da lista de serviços Anexo I desta Lei Complementar, relativos às transferências realizadas por meio de cartão de crédito ou débito, ou a eles conexos, que sejam prestados ao tomador, direta ou indiretamente, por:","paiId":3499,"id":3531},{"tipo":"inc","label":"I","texto":"bandeiras;","paiId":3531,"id":3532},{"tipo":"inc","label":"II","texto":"credenciadoras; ou","paiId":3531,"id":3533},{"tipo":"inc","label":"III","texto":"emissoras de cartões de crédito ou débito.","paiId":3531,"id":3534},{"tipo":"par","label":"§10.","texto":"No caso dos serviços de administração de carteira de valores mobiliários e dos serviços de administração e gestão de fundos e clubes de investimento, referidos no subitem 15.01 do Anexo I o tomador é o cotista.","paiId":3499,"id":3535},{"tipo":"par","label":"§11.","texto":"No caso dos serviços de administração de consórcios, o tomador de serviço é o consorciado.","paiId":3499,"id":3536},{"tipo":"par","label":"§12.","texto":"No caso dos serviços de arrendamento mercantil, o tomador do serviço é o arrendatário, pessoa física ou a unidade beneficiária da pessoa jurídica, domiciliado no país, e, no caso de arrendatário não domiciliado no país, o tomador é o beneficiário do serviço no país.","paiId":3499,"id":3537},{"tipo":"capitulo","label":"Capítulo V","texto":"SUJEITO PASSIVO","paiId":3459,"id":3538},{"tipo":"art","label":"Art. 7º","texto":"Contribuinte do imposto é o prestador do serviço.","paiId":3538,"id":3539},{"tipo":"par","label":"Parágrafo único","texto":"O contribuinte dos Serviços de Registros Públicos, Cartorários e Notariais previstos no subitem 21.01 do Anexo I desta lei é o titular da serventia.","paiId":3539,"id":3540},{"tipo":"art","label":"Art. 8º","texto":"Para os efeitos desse imposto considera-se:","paiId":3538,"id":3541},{"tipo":"inc","label":"I","texto":"empresa – toda e qualquer pessoa jurídica que exercer atividade econômica de prestação de serviço, conforme definida na Lei Federal nº 10.406 de 10 de janeiro de 2002 – Código Civil Brasileiro;","paiId":3541,"id":3542},{"tipo":"inc","label":"II","texto":"profissional autônomo – toda e qualquer pessoa física que sem subordinação jurídica ou dependência hierárquica exercer atividade econômica de prestação de serviços;","paiId":3541,"id":3543},{"tipo":"inc","label":"III","texto":"Profissional liberal – pessoa física que, habilitada por Ordem ou Conselho Profissional, na forma da lei regente de sua profissão, exerce atividade econômica de prestação de serviços de caráter técnico ou científico, sem subordinação jurídica ou hierárquica.","paiId":3541,"id":3544},{"tipo":"inc","label":"IV","texto":"sociedade de prestação de serviços profissionais – sociedade de trabalho uniprofissional de caráter especializado, organizada exclusivamente por pessoas físicas habilitadas para a prestação dos serviços sob a forma de trabalho pessoal do próprio contribuinte e que tenha seu contrato ou ato constitutivo registrado no respectivo órgão de classe, que não possuam a mesma habilitação do empregador, para a execução de atividades acessórias ou auxiliares não componentes da essência do serviço;","paiId":3541,"id":3545},{"tipo":"inc","label":"V","texto":"integrante da sociedade de profissionais – profissional devidamente habilitado, sócio ou empregado de sociedade de prestação de serviços profissionais, que preste serviço em nome da sociedade, embora assumindo responsabilidade pessoal;","paiId":3541,"id":3546},{"tipo":"inc","label":"VI","texto":"trabalhador avulso – aquele que exercer atividade de caráter eventual, isto é, fortuito, casual, incerto, sem continuidade, sob dependência hierárquica, mas sem vinculação empregatícia;","paiId":3541,"id":3547},{"tipo":"inc","label":"VII","texto":"trabalho pessoal – aquele, material ou intelectual executado pelo próprio prestador, pessoa física, que não possuam a mesma habilitação do empregador, para a execução de atividades acessórias ou auxiliares não componentes da essência do serviço;","paiId":3541,"id":3548},{"tipo":"inc","label":"VIII","texto":"estabelecimento prestador – é o complexo de bens organizados onde o contribuinte desenvolva a atividade de prestar serviços, de modo permanente ou temporário, e que configure unidade econômica ou profissional, sendo irrelevantes para caracterizá-lo as denominações de sede, filial, agência, posto de atendimento, sucursal, escritório de representação ou contato ou quaisquer outras que venham a ser utilizadas.","paiId":3541,"id":3549},{"tipo":"secao","label":"SEÇÃO I","texto":"Responsabilidade","paiId":3538,"id":3550},{"tipo":"art","label":"Art. 9º","texto":"São responsáveis pela retenção e recolhimento do imposto, quando o recolhimento deva ser feito ao Município de Maricá:","paiId":3550,"id":3551},{"tipo":"inc","label":"I","texto":"o tomador ou intermediário de serviço proveniente do exterior do País ou cuja prestação se tenha iniciado no exterior do País;","paiId":3551,"id":3552},{"tipo":"inc","label":"II","texto":"a pessoa jurídica, exceto MEI, ainda que imune ou isenta, tomadora ou intermediária dos serviços descritos nos subitens 3.05, 7.02, 7.04, 7.05, 7.09, 7.10, 7.11, 7.12, 7.16, 7.17, 7.18, 7.19, 11.02, 16.02, 17.05 e 17.10 do Anexo I desta Lei.","paiId":3551,"id":3553},{"tipo":"inc","label":"III","texto":"a pessoa jurídica tomadora ou intermediária de serviços, ainda que imune ou isenta, na hipótese prevista no § 4o do artigo 6o desta Lei;","paiId":3551,"id":3554},{"tipo":"inc","label":"IV","texto":"as pessoas referidas nos incisos II ou III do § 9º do artigo 6º desta Lei Complementar, pelo imposto devido pelas pessoas a que se refere o inciso I do mesmo parágrafo, em decorrência dos serviços prestados na forma do subitem 15.01 da lista de serviços anexa a esta Lei;","paiId":3551,"id":3555},{"tipo":"inc","label":"V","texto":"toda pessoa jurídica que, mesmo incluída nos regimes de imunidade ou isenção, fizer uso de serviços de terceiros, quando:","paiId":3551,"id":3556},{"tipo":"ali","label":"a)","texto":"o prestador de serviços for empresa que, legalmente obrigada, não emitir nota fiscal ou outro documento permitido contendo no mínimo, seu endereço e número de inscrição no Cadastro Mobiliário do Município;","paiId":3556,"id":3557},{"tipo":"ali","label":"b)","texto":"o serviço for prestado em caráter pessoal ou por sociedade, e o prestador não apresentar comprovante de inscrição no Cadastro Mobiliário Município recolhimento atualizado do imposto;","paiId":3556,"id":3558},{"tipo":"ali","label":"c)","texto":"o prestador de serviço alegar, mas não comprovar imunidade ou isenção.","paiId":3556,"id":3559},{"tipo":"inc","label":"VI","texto":"os órgãos e entidades da administração direta e indireta da União, dos Estados, do Distrito Federal e dos Municípios, em relação aos serviços por eles tomados ou intermediados, exceto quando relativos aos subitens 10.01, 10.02, 10.03, 10.04, 10.05, 21.01, 22.01 e 26.01 e ao item 15 e seus subitens do Anexo I;","paiId":3551,"id":3560},{"tipo":"par","label":"§1º","texto":"No caso dos serviços prestados pelas administradoras de cartão de crédito e débito, descritos no subitem 15.01 do Anexo I, os terminais eletrônicos ou as máquinas das operações efetivadas deverão ser registradas no local do domicílio do tomador do serviço.","paiId":3551,"id":3561},{"tipo":"par","label":"§2º","texto":"Compete às administradoras de cartão de crédito e débito providenciar o registro a que se refere o § 1º deste artigo.","paiId":3551,"id":3562},{"tipo":"par","label":"§3º","texto":"Os responsáveis a que se referem os incisos do caput deste artigo estão obrigados ao recolhimento integral do imposto devido, multa e acréscimos legais, independentemente de ter sido efetuada sua retenção na fonte; exceção feita aos órgãos da administração direta, autarquias e fundações públicas de direito público do Município de Maricá, quanto à multa e aos acréscimos.","paiId":3551,"id":3563},{"tipo":"par","label":"§4º","texto":"Caso o tomador ou intermediário do serviço não seja estabelecido ou domiciliado no território do município, o prestador, desde que estabelecido no município de Maricá, fará o recolhimento do tributo.","paiId":3551,"id":3564},{"tipo":"art","label":"Art. 10.","texto":"A retenção na fonte será cumprida pelo recolhimento do imposto na rede bancária autorizada através do Documento de Arrecadação da Receita Municipal – DARM.","paiId":3550,"id":3565},{"tipo":"par","label":"Parágrafo único","texto":"O responsável pelo recolhimento dará ao prestador de serviço uma via do DARM quitado a qual lhe servirá como comprovante do pagamento do imposto.","paiId":3565,"id":3566},{"tipo":"art","label":"Art. 11.","texto":"Para a retenção na fonte o imposto será calculado aplicando-se, independentemente da natureza jurídica do prestador, alíquota sobre o preço do serviço.","paiId":3550,"id":3567},{"tipo":"secao","label":"SEÇÃO II","texto":"Solidariedade","paiId":3538,"id":3568},{"tipo":"art","label":"Art. 12.","texto":"São solidariamente responsáveis pelo recolhimento do imposto:","paiId":3568,"id":3569},{"tipo":"inc","label":"I","texto":"os construtores, empreiteiros principais e administradores de obras hidráulicas, de construção civil ou de reparação de edifícios, estradas, logradouros, pontes e congêneres, pelo imposto relativo aos serviços prestados por subempreiteiros, exclusivamente de mão de obra;","paiId":3569,"id":3570},{"tipo":"inc","label":"II","texto":"os administradores de obras, pelo imposto relativo à mão de obra, inclusive de subcontratos, ainda que o pagamento dos serviços seja feito diretamente pelo dono da obra ou contratante;","paiId":3569,"id":3571},{"tipo":"inc","label":"III","texto":"os construtores, os empreiteiros principais ou quaisquer outros contratantes de obras de construção civil, pelo imposto devido por empreiteiros ou subempreiteiros não estabelecidos no Município;","paiId":3569,"id":3572},{"tipo":"inc","label":"IV","texto":"os titulares de direitos sobre prédios ou os contratantes de obras e serviços, se não identificarem os construtores ou os empreiteiros de construção, reconstrução, reforma, reparação ou acréscimo desses bens, pelo imposto devido pelos construtores ou empreiteiros;","paiId":3569,"id":3573},{"tipo":"inc","label":"V","texto":"os locadores de máquinas, aparelhos e equipamentos instalados, pelo imposto devido pelos locatários estabelecidos no Município e relativo à exploração desses bens;","paiId":3569,"id":3574},{"tipo":"inc","label":"VI","texto":"os titulares dos estabelecimentos onde se instalarem máquinas, aparelhos e equipamentos, pelo imposto devido pelos respectivos proprietários não estabelecidos no Município, e relativo à exploração destes bens;","paiId":3569,"id":3575},{"tipo":"inc","label":"VII","texto":"os que permitirem em seus estabelecimentos ou domicílios exploração de atividade tributável sem estar o prestador do serviço inscrito no órgão fiscal competente, pelo imposto devido sobre essa atividade;","paiId":3569,"id":3576},{"tipo":"inc","label":"VIII","texto":"os que efetuarem pagamento de serviços a terceiros não identificados, pelo imposto cabível nas operações;","paiId":3569,"id":3577},{"tipo":"inc","label":"IX","texto":"os que utilizarem serviços de empresas, pelo imposto incidente sobre as operações, se não exigirem dos prestadores documento fiscal idôneo;","paiId":3569,"id":3578},{"tipo":"inc","label":"X","texto":"os que utilizarem serviços de profissionais autônomos, pelo imposto incidente sobre as operações, se não exigirem dos prestadores prova de inscrição no Cadastro Mobiliário do Município;","paiId":3569,"id":3579},{"tipo":"inc","label":"XI","texto":"as empresas que explorem serviços de planos de saúde ou de assistência médica e hospitalar através de planos de medicina de grupo e convênios, pelo imposto devido sobre serviços a ela prestados por:","paiId":3569,"id":3580},{"tipo":"ali","label":"a)","texto":"empresas que agenciem, intermedeiem ou façam corretagem dos referidos planos junto ao público;","paiId":3580,"id":3581},{"tipo":"ali","label":"b)","texto":"hospitais, clínicas, sanatórios, laboratórios de análises, de patologia, de eletricidade médica e assemelhados, ambulatórios, prontos-socorros, manicômios, casa de saúde, de repouso e de recuperação e congêneres;","paiId":3580,"id":3582},{"tipo":"ali","label":"c)","texto":"bancos de sangue, de pele, de olhos, de sêmen e congêneres;","paiId":3580,"id":3583},{"tipo":"ali","label":"d)","texto":"empresas que executem remoção de doentes.","paiId":3580,"id":3584},{"tipo":"inc","label":"XII","texto":"os hospitais e clínicas privados, pelo imposto devido sobre os serviços a eles prestados:","paiId":3569,"id":3585},{"tipo":"ali","label":"a)","texto":"por empresas de guarda e vigilância e de conservação e limpeza de imóveis;","paiId":3585,"id":3586},{"tipo":"ali","label":"b)","texto":"por laboratórios de análises, de patologia e de eletricidade médica e assemelhados, quando a assistência a seus pacientes se fizer sem intervenção das empresas das atividades referidas no inciso anterior;","paiId":3585,"id":3587},{"tipo":"ali","label":"c)","texto":"por bancos de sangue, de pele, de olhos, de sêmen e congêneres, bem como por empresas que executem remoção de pacientes, quando seu atendimento se fizer na forma referida na alínea anterior;","paiId":3585,"id":3588},{"tipo":"inc","label":"XIII","texto":"os estabelecimentos particulares de ensino, pelo imposto devido sobre os serviços a eles prestados pelas empresas de guarda e vigilância e de conservação e limpeza de imóveis;","paiId":3569,"id":3589},{"tipo":"inc","label":"XIV","texto":"os bancos e demais entidades financeiras, pelo imposto devido sobre os serviços a eles prestados pelas empresas de guarda e vigilância, de transporte de valores e de conservação e limpeza de imóveis.","paiId":3569,"id":3590},{"tipo":"inc","label":"XV","texto":"pessoas jurídicas administradoras de bingos e quaisquer outras modalidades de jogos, apostas ou sorteios, pelo imposto devido por suas contratantes, pessoas físicas ou jurídicas, autorizadas a explorar tais atividades;","paiId":3569,"id":3591},{"tipo":"inc","label":"XVI","texto":"as concessionárias de serviços públicos de telecomunicações, pelo imposto incidente sobre a cota repassada às empresas administradoras ou promotoras de apostas ou sorteios;","paiId":3569,"id":3592},{"tipo":"inc","label":"XVII","texto":"as empresas imobiliárias, incorporadoras e construtoras, pelo imposto devido sobre as comissões pagas às empresas corretoras de imóveis;","paiId":3569,"id":3593},{"tipo":"inc","label":"XVIII","texto":"as empresas e entidades que explorem loterias e outros jogos permitidos, inclusive apostas, pelo imposto devido sobre as comissões pagas a seus agentes, revendedores ou concessionários;","paiId":3569,"id":3594},{"tipo":"par","label":"§1º","texto":"A responsabilidade de que trata este artigo será satisfeita mediante o pagamento:","paiId":3569,"id":3595},{"tipo":"inc","label":"I","texto":"do imposto retido das pessoas físicas ou jurídicas, com base no preço do serviço prestado, aplicada a alíquota correspondente à atividade exercida;","paiId":3595,"id":3596},{"tipo":"inc","label":"II","texto":"do imposto incidente sobre as operações, nos demais casos.","paiId":3595,"id":3597},{"tipo":"par","label":"§2º","texto":"A responsabilidade prevista neste artigo é inerente a todas as pessoas físicas ou jurídicas, ainda que alcançadas por imunidade ou isenção tributária.","paiId":3569,"id":3598},{"tipo":"par","label":"§3º","texto":"A retenção do imposto prevista neste artigo somente se aplica aos pagamentos de serviços tributáveis pelo Município.","paiId":3569,"id":3599},{"tipo":"capitulo","label":"Capítulo VI","texto":"BASE DO CÁLCULO","paiId":3459,"id":3600},{"tipo":"art","label":"Art. 13.","texto":"A base de cálculo do imposto é o preço do serviço.","paiId":3600,"id":3601},{"tipo":"par","label":"Parágrafo único","texto":"Quando os serviços descritos pelo subitem 3.04 da lista anexa forem prestados no território de mais de um Município, a base de cálculo será proporcional, conforme o caso, à extensão da ferrovia, rodovia, dutos e condutos de qualquer natureza, cabos de qualquer natureza, ou ao número de postes, existentes no Município.","paiId":3601,"id":3602},{"tipo":"art","label":"Art. 14.","texto":"Em se tratando de prestação de serviços executados por empresas de publicidade, quando o serviço, ou parte dele, for executado por terceiros que emitam notas fiscais em nome da agência de publicidade, o preço do serviço desta será a diferença entre o valor da nota fiscal de serviços ao cliente e o valor da nota fiscal de serviços do executor à agência.","paiId":3600,"id":3603},{"tipo":"par","label":"Parágrafo único","texto":"No caso de o serviço ser prestado na forma do caput, na nota fiscal de serviços emitida pela agência de publicidade ao cliente, deverão constar os dados e informações das notas fiscais de serviços com os respectivos valores das deduções dos terceiros executores emitidos para a agência, sob pena de integrar-se à base de cálculo.","paiId":3603,"id":3604},{"tipo":"art","label":"Art. 15.","texto":"A base de cálculo do imposto a que se refere o subitem 21.01 do Anexo I desta lei complementar é o preço do serviço, calculado pelo valor total dos emolumentos e demais encargos, inclusive aqueles recebidos a título de reembolso, ressarcimento e reajustamento, independente de classificação contábil, e o imposto será cobrado de forma variável.","paiId":3600,"id":3605},{"tipo":"par","label":"Parágrafo único","texto":"Os valores a serem repassados aos Fundos Estaduais, por força expressa de previsão legal, não integram o preço do serviço.","paiId":3605,"id":3606},{"tipo":"art","label":"Art. 16.","texto":"Não se inclui na base de cálculo do Imposto Sobre Serviços de Qualquer Natureza o valor dos materiais fornecidos pelo prestador dos serviços previstos nos itens 7.02 e 7.05 do Anexo I desta Lei.","paiId":3600,"id":3607},{"tipo":"par","label":"§1º","texto":"Em relação às não inclusões previstas neste artigo quanto às mercadorias, só serão admitidas deduções relativas aos materiais que se incorporem ou se consumam na execução das obras, excluídos:","paiId":3607,"id":3608},{"tipo":"inc","label":"I","texto":"escoras, andaimes, torres e formas;","paiId":3608,"id":3609},{"tipo":"inc","label":"II","texto":"ferramentas, equipamentos de proteção individual, máquinas e respectiva manutenção;","paiId":3608,"id":3610},{"tipo":"inc","label":"III","texto":"materiais adquiridos para a formação de estoque ou armazenagem fora dos canteiros de obra antes de sua utilização;","paiId":3608,"id":3611},{"tipo":"inc","label":"IV","texto":"materiais recebidos na obra após a sua conclusão.","paiId":3608,"id":3612},{"tipo":"par","label":"§2º","texto":"São irredutíveis os valores de quaisquer materiais cujos documentos não estejam revestidos das características ou formalidades legais, previstas na legislação federal, estadual ou municipal, especialmente no que se concerne à perfeita identificação do emitente e do destinatário, bem como das mercadorias e serviços.","paiId":3607,"id":3613},{"tipo":"par","label":"§3º","texto":"Quando os serviços referidos neste artigo forem prestados sob o regime de administração, a base de cálculo incluirá, além dos honorários do prestador, as despesas gerais de administração, bem como as de mão de obra, encargos sociais e reajustamentos, ainda que tais despesas sejam de responsabilidade de terceiros.","paiId":3607,"id":3614},{"tipo":"par","label":"§4º","texto":"Quando as deduções referidas no caput deste artigo superarem o limite de 50% (cinquenta por cento) do valor do contratado, a comprovação de todas as deduções aplicadas deverá ser feita à Fiscalização Tributária do Município ao encerramento da obra.","paiId":3607,"id":3615},{"tipo":"par","label":"§5º","texto":"Independentemente do disposto no parágrafo anterior, as deduções aplicadas ficam sujeitas à comprovação enquanto não decorrido o prazo prescricional.","paiId":3607,"id":3616},{"tipo":"art","label":"Art. 17.","texto":"Preço do serviço é a receita bruta a ele correspondente, sem quaisquer deduções com exceção do fornecimento de materiais previsto no artigo 16.","paiId":3600,"id":3617},{"tipo":"par","label":"§1º","texto":"Considera-se preço do serviço, para efeito de cálculo do imposto, tudo o que for cobrado em virtude da prestação do serviço, em bens, serviços ou direitos, seja na conta ou não, inclusive a título de reembolso, reajustamento ou dispêndio de qualquer natureza, sem prejuízo do disposto neste Capítulo.","paiId":3617,"id":3618},{"tipo":"par","label":"§2º","texto":"Constituem parte integrante do preço:","paiId":3617,"id":3619},{"tipo":"inc","label":"I","texto":"os valores acrescidos e os encargos de qualquer natureza, ainda que de responsabilidade de terceiros;","paiId":3619,"id":3620},{"tipo":"inc","label":"II","texto":"os ônus relativos à concessão de crédito, ainda que cobrados em separado, na hipótese de prestação de serviços a crédito, sob qualquer modalidade;","paiId":3619,"id":3621},{"tipo":"inc","label":"III","texto":"as vantagens financeiras decorrentes da prestação de serviços, inclusive as relacionadas com a retenção periódica dos valores recebidos;","paiId":3619,"id":3622},{"tipo":"inc","label":"IV","texto":"o valor recebido em material, estimado a preços correntes de mercado, nos serviços de demolição.","paiId":3619,"id":3623},{"tipo":"par","label":"§3º","texto":"Serão diminuídos do preço do serviço os valores relativos a descontos ou abatimentos não sujeitos a condição, desde que prévia e expressamente contratados.","paiId":3617,"id":3624},{"tipo":"par","label":"§4º","texto":"Quando a contraprestação se verificar através da troca de serviços ou o seu pagamento for realizado mediante o fornecimento de mercadorias, o preço do serviço para base cálculo do imposto será o preço corrente na praça ou o valor das mercadorias.","paiId":3617,"id":3625},{"tipo":"par","label":"§5º","texto":"Na falta de preço, será tomado como base de cálculo o valor cobrado dos usuários ou contratantes de serviços similares.","paiId":3617,"id":3626},{"tipo":"par","label":"§6º","texto":"Nos serviços contratados em moeda estrangeira, o preço será o valor resultante da sua conversão em moeda nacional, ao câmbio do dia da ocorrência do fato gerador.","paiId":3617,"id":3627},{"tipo":"art","label":"Art. 18.","texto":"Na hipótese de serviços prestados por empresas enquadráveis em mais de um dos itens da lista de serviços, o imposto será calculado aplicando-se a alíquota própria sobre o preço do serviço de cada atividade.","paiId":3600,"id":3628},{"tipo":"art","label":"Art. 19.","texto":"A apuração do preço do serviço será efetuada com base nos elementos em poder do sujeito passivo, ou de outros quaisquer, mesmo que em poder de terceiros, de forma que possa ser utilizado como paradigma para a obtenção da base de cálculo.","paiId":3600,"id":3629},{"tipo":"art","label":"Art. 20.","texto":"Quando se tratar de prestação de serviço sob a forma de trabalho pessoal do próprio contribuinte, o imposto será cobrado em valores fixos anuais, conforme estabelecido no Anexo II.","paiId":3600,"id":3630},{"tipo":"par","label":"§1º","texto":"Na hipótese de serviços prestados sob a forma de trabalho pessoal do próprio contribuinte enquadráveis em mais de uma das atividades do Anexo II, o imposto será cobrado em relação a cada uma das atividades exercidas.","paiId":3630,"id":3631},{"tipo":"par","label":"§2º","texto":"O disposto no caput deste artigo não se aplica:","paiId":3630,"id":3632},{"tipo":"inc","label":"I","texto":"aos integrantes das sociedades profissionais relativamente à prestação de serviços alheios ao exercício da profissão para a qual se achem habilitados, bem como aos serviços que prestarem em nome próprio; e","paiId":3632,"id":3633},{"tipo":"inc","label":"II","texto":"às sociedades de prestação de serviços que não sejam constituídas exclusivamente de profissionais habilitados para o exercício da profissão correspondente aos serviços por elas prestados.","paiId":3632,"id":3634},{"tipo":"art","label":"Art. 21.","texto":"Equipara-se à pessoa jurídica a pessoa física que opte pela emissão de nota fiscal de serviço, que nesse caso passa a ter o ISSQN tributado na forma do inciso II do artigo 24.","paiId":3600,"id":3635},{"tipo":"par","label":"Parágrafo único","texto":"A opção de que trata o caput deverá ser exercida anualmente, conforme dispuser o regulamento.","paiId":3635,"id":3636},{"tipo":"capitulo","label":"Capítulo VII","texto":"ALÍQUOTAS","paiId":3459,"id":3637},{"tipo":"art","label":"Art. 22.","texto":"As alíquotas do imposto são as fixadas na tabela de Anexo I desta Lei.","paiId":3637,"id":3638},{"tipo":"par","label":"§1º","texto":"No caso de atividades tributadas com alíquotas diferentes, se não for possível a comprovação por meio de documento hábil da separação das operações por atividade, ficarão as operações, em sua totalidade, sujeitas à alíquota mais elevada.","paiId":3638,"id":3639},{"tipo":"par","label":"§2º","texto":"Quando as atividades descritas no Anexo I desta lei forem prestadas por instituições financeiras e demais instituições autorizadas a funcionar pelo Banco Central do Brasil, o imposto deverá ser calculado na alíquota máxima prevista nesta Lei.","paiId":3638,"id":3640},{"tipo":"art","label":"Art. 23.","texto":"As alíquotas mínima e máxima do Imposto Sobre Serviços de Qualquer Natureza são 2% (dois por cento) e 5% (cinco por cento), respectivamente.","paiId":3637,"id":3641},{"tipo":"par","label":"Parágrafo único","texto":"O imposto não será objeto de concessão de isenções, incentivos ou benefícios tributários ou financeiros, inclusive redução da base de cálculo ou de crédito presumido ou outorgado, ou sob qualquer outra forma que resulte, direta ou indiretamente, em carga tributária menor que a decorrente da aplicação da alíquota mínima estabelecida no caput, exceto para os serviços a que se referem os subitens 7.02, 7.05 e 16.01 do Anexo I desta Lei.","paiId":3641,"id":3642},{"tipo":"capitulo","label":"Capítulo VIII","texto":"LANÇAMENTO","paiId":3459,"id":3643},{"tipo":"art","label":"Art. 24.","texto":"O lançamento do Imposto Sobre Serviços de Qualquer Natureza ocorrerá:","paiId":3643,"id":3644},{"tipo":"inc","label":"I","texto":"uma única vez, na forma estabelecida em regulamento, no exercício a que corresponder o tributo, quando o serviço for prestado sob a forma de trabalho pessoal do próprio contribuinte ou pelas sociedades de prestação de serviços profissionais, observado o disposto no artigo 39;","paiId":3644,"id":3645},{"tipo":"inc","label":"II","texto":"mensalmente, na forma estabelecida em regulamento, em relação ao serviço efetivamente prestado no período, independentemente do pagamento, quando o prestador for:","paiId":3644,"id":3646},{"tipo":"ali","label":"a)","texto":"empresa; e","paiId":3646,"id":3647},{"tipo":"ali","label":"b)","texto":"profissional autônomo ou liberal localizado que emita nota fiscal.","paiId":3646,"id":3648},{"tipo":"inc","label":"III","texto":"tratando-se de lançamentos de ofício, será respeitado o intervalo mínimo de 30 (trinta) dias entre o lançamento e o prazo fixado para pagamento.","paiId":3644,"id":3649},{"tipo":"par","label":"Parágrafo único","texto":"A apuração de que trata o inciso II deverá ser efetuada até a data de vencimento do tributo estabelecida no Calendário
