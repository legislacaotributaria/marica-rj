1.256, de 29/12/2021","artigos":[],"anexos":[]},{"id":54,"tipo":"dec","num":"605","ano":"2020","ementa":"Regulamenta a Declaração Eletrônica de Serviços de Instituições Financeiras (DES-IF).","tributo":"issqn","situacao":"vigente","link":"JOM Especial 297, de 06/11/2020","artigos":[],"anexos":[]},{"id":55,"tipo":"dec","num":"587","ano":"2020","ementa":"Institui a comissão especial para elaborar estudos sobre a legislação tributária do município.","tributo":"geral","situacao":"vigente","link":"JOM 1.087, de 16/09/2020","artigos":[],"anexos":[]},{"id":56,"tipo":"dec","num":"155","ano":"2018","ementa":"Regulamenta a licença e autorização de localização e funcionamento de empresas no município.","tributo":"geral","situacao":"vigente","link":"JOM 853, de 07/05/2018","artigos":[],"anexos":[]},{"id":57,"tipo":"dec","num":"101","ano":"2017","ementa":"Institui o planejamento das atividades fiscais e padroniza documentos fiscais.","tributo":"geral","situacao":"vigente","link":"JOM 837, de 07/03/2017","artigos":[],"anexos":[]},{"id":58,"tipo":"dec","num":"072","ano":"2017","ementa":"Estabelece obrigações relativas ao ISSQN para prestadores nos subitens 8.01 e 8.02 da lista de serviços.","tributo":"issqn","situacao":"vigente","link":"JOM 786, de 21/08/2017","artigos":[],"anexos":[]},{"id":59,"tipo":"res","num":"SEPOF 003","ano":"2023","ementa":"Dispõe sobre o adiamento do prazo para pagamento do ISS variável — competência outubro/2023.","tributo":"issqn","situacao":"vigente","link":"JOM 1.521, de 08/11/2023","artigos":[],"anexos":[]},{"id":60,"tipo":"edital","num":"SEGET 001","ano":"2025","ementa":"Edital de Notificação de Lançamento do IPTU e TCL 2025.","tributo":"iptu","situacao":"vigente","link":"JOM Especial 337, de 07/01/2025","artigos":[],"anexos":[]},{"id":61,"tipo":"edital","num":"SEPOF 001","ano":"2024","ementa":"Edital de Notificação de Lançamento do IPTU e TCL 2024.","tributo":"iptu","situacao":"vigente","link":"JOM 1.541, de 03/01/2024","artigos":[],"anexos":[]},{"id":46,"tipo":"dec","num":"1.285","ano":"2023","ementa":"Dispõe sobre a regulamentação das normas a serem adotadas nas construções multifamiliares.","tributo":"geral","situacao":"vigente","link":"JOM 1.528, de 29/11/2023","artigos":[],"anexos":[]}],"consolidacoes":[{"id":2073,"leiBaseId":2,"leiBaseNome":"Lei Complementar nº 358/2022","leiModId":8,"leiModNome":"Lei Complementar nº 426/2026","nalts":1,"alteracoes":[{"tipo":"alterado","disp":"Art. 7º","texto":"Será permitido o reparcelamento decorrente de inadimplência, uma única vez, desde que observado o pagamento inicial mínimo de 25% (vinte e cinco por cento) do saldo remanescente do parcelamento originário, acrescidos de juros, multas e encargos legais.","apos":"","textoAnt":"Tratando-se de crédito não ajuizado, será permitido o reparcelamento decorrente de inadimplência, desde que o observado o pagamento de mínimo 25% (vinte e cinco por cento) do saldo remanescente do parcelamento originário, acrescidos de juros, multas e encargos legais."}],"html":"<div class=\"doc-cabecalho\"><div class=\"doc-lei-id\">LEI COMPLEMENTAR Nº 358, DE 10 de março de 2022</div><div class=\"doc-ementa-bloco\"><div class=\"doc-ementa-txt\">DISPÕE SOBRE O PARCELAMENTO DOS CRÉDITOS DE NATUREZA TRIBUTÁRIA E NÃO TRIBUTÁRIA DE TITULARIDADE DO MUNICÍPIO DE MARICÁ; REVOGA ART. 284, DA LEI COMPLEMENTAR Nº 05, DE 30 DE JANEIRO DE 1991; E DÁ OUTRAS PROVIDÊNCIAS.</div></div><div class=\"doc-formula\">O POVO DO MUNICÍPIO DE MARICÁ, por seus representantes na Câmara Municipal, aprovou e o Prefeito Municipal, em seu nome sanciona a seguinte Lei Complementar:</div><div style=\"margin-top:.75rem\"><span class=\"doc-lei-cons\">Texto consolidado com as alterações da Lei Complementar nº 426/2026</span></div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 1º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Os créditos de natureza tributária e não tributária, de titularidade do Município de Maricá, inscritos ou não em dívida ativa, ajuizados ou por ajuizar, desde que vencidos, poderão ser parcelados em até 60 (sessenta) meses, observadas as condições fixadas nesta Lei Complementar e em regulamento específico editado pelo Chefe do Poder Executivo Municipal.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 2º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O valor da dívida parcelada será consolidado na data da efetivação do parcelamento, de acordo com os acréscimos legais previstos e será expresso em valores de moeda corrente nacional.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§1º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Por crédito consolidado compreende-se o total da dívida atinente ao pedido de parcelamento, computados os encargos e os acréscimos legais vencidos até a data da consolidação, monetariamente atualizado.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§2º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A consolidação do crédito não exclui a possibilidade de posterior verificação de sua exatidão e a cobrança ou devolução de eventuais diferenças.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§3º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O valor do crédito objeto do parcelamento corresponderá ao valor do crédito consolidado, deduzido o valor do pagamento a que se refere à entrada.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§4º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O sujeito passivo procederá ao pagamento dos débitos tributários e não tributários, em parcelas mensais, sucessivas, acrescidas de juros de 1% (um por cento) ao mês sobre o valor de cada parcela, calculados a partir do primeiro dia do mês subsequente ao vencimento do prazo até o último dia do mês anterior ao do pagamento.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§5º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">As parcelas obedecerão aos seguintes limites mínimos.</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">o valor de cada parcela para pessoa jurídica não poderá ser inferior a 1 (uma) Unidade Fiscal de Maricá - UFIMA;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">o valor de cada parcela para pessoa física não poderá ser inferior a 0,5 (cinco décimos) Unidade Fiscal de Maricá - UFIMA.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§6º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Lei específica versará sobre eventuais descontos de juros e multas, observadas as respectivas renúncias fiscais.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 3º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Não poderão ser reunidos no mesmo parcelamento os seguintes créditos:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">tributários com não tributários;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">relativos a tributos diferentes, com exceção daqueles cujos lançamentos são feitos conjuntamente;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">III – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">lançados de ofício mediante diferentes autos de infração ou notifi cações de lançamento;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">IV – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">lançados de ofício com outros lançados por homologação ou declaração; e</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">V – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">inscritos em dívida ativa com não inscritos em dívida ativa.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 4º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O número de parcelas fica condicionado ao respectivo valor total do crédito consolidado, de acordo com os parâmetros definidos a seguir:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">em até 48 (quarento e oito) parcelas mensais e sucessivas, quando os créditos não ultrapassarem o montante de 60 (sessenta) UFIMAS.</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">em até 54 (cinquenta e quatro) parcelas mensais e sucessivas, quando os créditos forem superiores a 60 (sessenta) UFIMAS e não ultrapassarem o montante de 600 (seiscentas) UFIMAS;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">III – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">em até 60 (sessenta) parcelas mensais e sucessivas, quando os créditos forem superiores a 600 (seiscentas) UFIMAS.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§1º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Pessoas físicas declaradas hipossuficientes ou que ganhem até 02 (dois) salários mínimo vigentes a época do requerimento do parcelamento, terão o prazo de até 60 (sessenta) meses, independentemente do valor do crédito tributário ou não tributário, desde que observado o artigo 2º, § 5º, desta lei.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§2º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O reconhecimento do direito previsto no parágrafo antecedente se dará no âmbito das atribuições dos órgãos descritas no art. 10 desta Lei Complementar.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 5º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O pedido de parcelamento de crédito constitui confissão extrajudicial irretratável e irrevogável do débito e aceitação plena e irrestrita das condições estabelecidas nesta Lei Complementar.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 6º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A falta de pagamento de 03 (três) parcelas consecutivas ou não, ou de qualquer parcela por mais de noventa dias, acarretará o cancelamento, independente de prévia notificação do contribuinte.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Parágrafo único  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O saldo devedor remanescente será objeto de prosseguimento de cobrança judicial, de inscrição em dívida ativa ou de ajuizamento, conforme o caso.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(30, 95, 168, 0.06); border-left: 3px solid var(--blue); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><div style=\"font-size:13px;font-family:monospace;\"><span style=\"font-weight:700;color:var(--blue)\">Art. 7º  </span><span style=\"color:var(--muted);text-decoration:line-through\">Tratando-se de crédito não ajuizado, será permitido o reparcelamento decorrente de inadimplência, desde que o observado o pagamento de mínimo 25% (vinte e cinco por cento) do saldo remanescente do parcelamento originário, acrescidos de juros, multas e encargos legais.</span></div><div style=\"font-size:13px;font-family:monospace;margin-top:3px\"><span style=\"font-weight:700;color:var(--blue)\">Art. 7º  </span><span style=\"color:var(--text)\">Será permitido o reparcelamento decorrente de inadimplência, uma única vez, desde que observado o pagamento inicial mínimo de 25% (vinte e cinco por cento) do saldo remanescente do parcelamento originário, acrescidos de juros, multas e encargos legais.</span><br><span class=\"doc-art-nota\">(Redação dada pela Lei Complementar nº 426/2026)</span></div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 8º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">É vedada a concessão de parcelamento relativos a esta Lei Complementar:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">ao contribuinte que tenha parcelamento em atraso, que não enseje o cancelamento, enquanto não regularizado o pagamento das parcelas vencidas e não pagas.</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">aos devedores que estejam sob ação fiscal, ressalvados os créditos anteriormente apurados, quando denunciados espontaneamente.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Parágrafo único  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A vedação que se trata o caput desse artigo é exclusiva para os créditos tributários e não tributários vencidos, observadas as vedações legais para os parcelamentos do Código Tributário Municipal. Art. 9º O parcelamento somente será concedido mediante requerimento, protocolizado pessoalmente ou por procurador regulamente constituído, pelo contribuinte, responsável tributário ou devedor, ou ainda, por terceiro que demonstre ter legítimo interesse na liquidação do débito, importando na expressa confissão irretratável e indivisível, quanto a sua certeza, liquidez e exigibilidade.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§1º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Considera-se terceiro interessado o locatário, o cessionário, o usufrutuário, o donatário, o comodatário, o arrendatário, promitente comprador, posseiro, o cônjuge ou companheiro do proprietário ou terceiro, seus parentes, em linha reta ou colateral em até quarto grau, herdeiro ou inventariante, mediante prova documental idônea de uma dessas qualidades.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§2º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">No caso de terceiros interessados não conste dos cadastros municiais como contribuinte, responsável tributário ou devedor do crédito a ser parcelado, o parcelamento requerido nos termos do caput não suspende a exigibilidade do crédito e nem suspende ou não interrompe o decurso do prazo prescricional, salvo se apresentada declaração escrita com expresso reconhecimento do débito firmada pelo contribuinte, responsável tributário ou devedor do crédito.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§3º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Na hipótese prevista no §2º deste artigo, a data de vencimento da última parcela não poderá ser posterior ao sexto mês imediatamente anterior ao mês em que ocorrer o término do prazo prescricional da dívida original mais antiga incluída no parcelamento.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§4º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O terceiro interessado, definido no §1º deste artigo, não fará jus ao reparcelamento definido no art. 7º. § 5º Para afastar as limitações previstas no § 2º deste artigo e no art. 7º deverá o solicitante do parcelamento promover as alterações cadastrais pertinentes junto ao Município.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 10.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A concessão e o controle do parcelamento e do reparcelamento dos créditos mencionados nesta Lei Complementar, bem como o seu cancelamento, incluem-se na competência:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">do Órgão Fazendário, relativamente aos créditos de natureza tributária e não tributária vencidos até a competência anterior e não inscritos em dívida ativa;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">da Procuradoria Geral do Município, relativamente aos créditos inscritos em dívida ativa ou ajuizados de natureza tributária e não tributária.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Parágrafo único  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O empresário ou a sociedade empresária que pleitear ou tiver deferido o processamento de recuperação judicial, poderá parcelar os seus débitos para com a Fazenda Municipal, ainda que não vencidos, nos termos do arts. 10-A, 10-B e 10-C da Lei Federal 10.522, de 19 de julho de 2002.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 11.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O disposto nesta Lei Complementar não se aplica aos créditos tributários relativos aos impostos cujo fato gerador tenha ocorrido quando o contribuinte era optante pelo Regime Especial Unificado de Arrecadação de Tributos e Contribuições devidos pelas Microempresas e Empresas de Pequeno Porte – SIMPLES NACIONAL, instituído pela Lei Complementar nº 123, de 14 de dezembro de 2006.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 12.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O Poder Executivo editará os atos necessários ao cumprimento desta Lei Complementar.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 13.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Ato conjunto do Órgão Fazendário e da Procuradoria Geral do Município regulamentará o procedimento de parcelamento on-line.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 14.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Fica revogado o art. 284, da Lei Complementar nº 05, de 30 de janeiro de 1991 - Código Tributário do Município de Maricá.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 15.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Esta Lei Complementar entra em vigor na data de sua publicação.</span></div><div class=\"doc-fecho\"><div class=\"doc-fecho-local\">GABINETE DO PREFEITO DO MUNICÍPIO DE MARICÁ, Estado do Rio de Janeiro, RJ, 10 de março de 2022.</div><div class=\"doc-fecho-assinatura\">FABIANO TAQUES HORTA\nPREFEITO</div></div>","data":"04/05/2026"},{"id":2425,"leiBaseId":4,"leiBaseNome":"Lei Complementar nº 389/2023","leiModId":7,"leiModNome":"Lei Complementar nº 419/2025","nalts":31,"alteracoes":[{"tipo":"alterado","disp":"TÍTULO I – Capítulo XIII – Art. 47.","texto":"Será pessoalmente responsável pelas obrigações tributárias resultantes de atos praticados com infração da presente lei o gerente, diretor e/ou representante de cada agência das instituições financeiras.","apos":"","textoAnt":"Será pessoalmente responsável pelas obrigações tributárias resultantes de atos praticados com infração ao regulamento da DESIF o gerente, diretor e/ou representante de cada agência das instituições financeiras."},{"tipo":"incluido","disp":"TÍTULO I – Capítulo XIII – Art. 47-A.","texto":"No momento da conclusão da prestação de serviço de execução de obra de construção civil, demolição, reparação, conservação ou reforma de determinado edifício, deverão ser declarados todos os serviços executados, com os respectivos documentos fiscais, bem como os dados do imóvel necessários à tributação, na forma e condições estabelecidas no regulamento.","apos":"TÍTULO I – Capítulo XIII – Art. 47.","textoAnt":""},{"tipo":"incluido","disp":"TÍTULO I – Capítulo XIII – Art. 47-A. – §1º","texto":"A declaração de que trata o caput será realizada pelo responsável pela obra ou pelo sujeito passivo do IPTU referente ao imóvel objeto do serviço.","apos":"TÍTULO I – Capítulo XIII – Art. 47-A.","textoAnt":""},{"tipo":"incluido","disp":"TÍTULO I – Capítulo XIII – Art. 47-A. – §2º","texto":"As edificações presumem-se concluídas ou modificadas na data informada, pelo responsável pela declaração, como sendo a data de finalização da obra.","apos":"TÍTULO I – Capítulo XIII – Art. 47-A. – §1º","textoAnt":""},{"tipo":"incluido","disp":"TÍTULO I – Capítulo XIII – Art. 47-A. – §3º","texto":"O preenchimento e a confirmação de envio da declaração configuram confissão irretratável de dívida em relação aos valores nela declarados, podendo os créditos tributários correspondentes ser inscritos diretamente em dívida ativa.","apos":"TÍTULO I – Capítulo XIII – Art. 47-A. – §2º","textoAnt":""},{"tipo":"incluido","disp":"TÍTULO I – Capítulo XIII – Art. 47-A. – §4º","texto":"A não apresentação da declaração no prazo regulamentar ou a apresentação incompleta ou com informações falsas sujeitarão o responsável ao lançamento de ofício do ISSQN, com aplicação da multa prevista na legislação tributária municipal, sem prejuízo de outras sanções cabíveis.","apos":"TÍTULO I – Capítulo XIII – Art. 47-A. – §3º","textoAnt":""},{"tipo":"alterado","disp":"TÍTULO I – Capítulo V – SEÇÃO I – Art. 9º – II","texto":"a pessoa jurídica, exceto MEI, ainda que imune ou isenta, tomadora ou intermediária dos serviços descritos nos subitens 3.05, 7.02, 7.04, 7.05, 7.09, 7.10, 7.11, 7.12, 7.16, 7.17, 7.18, 7.19, 11.01, 11.02, 11.04, item 12 (exceto o subitem 12.13), 16.01, 16.02, 17.05, 17.10 e item 20 do Anexo I desta Lei;","apos":"","textoAnt":"a pessoa jurídica, exceto MEI, ainda que imune ou isenta, tomadora ou intermediária dos serviços descritos nos subitens 3.05, 7.02, 7.04, 7.05, 7.09, 7.10, 7.11, 7.12, 7.16, 7.17, 7.18, 7.19, 11.02, 16.02, 17.05 e 17.10 do Anexo I desta Lei."},{"tipo":"alterado","disp":"TÍTULO I – Capítulo V – SEÇÃO I – Art. 9º – §3º","texto":"Os responsáveis mencionados nos incisos do caput deste artigo ficam obrigados ao recolhimento integral do imposto devido, inclusive multa e acréscimos legais, independentemente de sua efetiva retenção na fonte, excetuando-se, quanto à multa e aos acréscimos, os órgãos da administração direta, as autarquias, fundações, empresas públicas e sociedades de economia mista dependentes do Município de Maricá.","apos":"","textoAnt":"Os responsáveis a que se referem os incisos do caput deste artigo estão obrigados ao recolhimento integral do imposto devido, multa e acréscimos legais, independentemente de ter sido efetuada sua retenção na fonte; exceção feita aos órgãos da administração direta, autarquias e fundações públicas de direito público do Município de Maricá, quanto à multa e aos acréscimos."},{"tipo":"alterado","disp":"TÍTULO I – Capítulo V – SEÇÃO II – Art. 12. – IV","texto":"o titular de direitos sobre imóvel, inclusive o proprietário, o possuidor ou o contratante da obra, sobre os serviços de construção civil, reforma, demolição, manutenção ou congêneres executados no respectivo imóvel, independentemente da pessoa do prestador de serviços ou da existência de vínculo contratual direto;","apos":"","textoAnt":"os titulares de direitos sobre prédios ou os contratantes de obras e serviços, se não identificarem os construtores ou os empreiteiros de construção, reconstrução, reforma, reparação ou acréscimo desses bens, pelo imposto devido pelos construtores ou empreiteiros;"},{"tipo":"incluido","disp":"TÍTULO I – Capítulo V – SEÇÃO II – Art. 12. – XIX","texto":"o prestador de serviços, quando, por erro, omissão ou prestação de informações falsas ou incompletas, der causa à falta de recolhimento do ISS, ainda que tenha sido emitido documento fiscal.","apos":"TÍTULO I – Capítulo V – SEÇÃO II – Art. 12. – XVIII","textoAnt":""},{"tipo":"alterado","disp":"TÍTULO I – Capítulo VI – Art. 14.","texto":"Na prestação de serviços por agências de publicidade, quando o serviço de publicidade e propaganda, no todo ou em parte, for executado por terceiros, a agência deverá discriminar, nas informações prestadas ao cliente, os valores correspondentes aos seus próprios honorários e comissões, bem como os valores relativos aos serviços executados por terceiros, devidamente respaldados por documentos fiscais emitidos pelos respectivos prestadores.","apos":"","textoAnt":"Em se tratando de prestação de serviços executados por empresas de publicidade, quando o serviço, ou parte dele, for executado por terceiros que emitam notas fiscais em nome da agência de publicidade, o preço do serviço desta será a diferença entre o valor da nota fiscal de serviços ao cliente e o valor da nota fiscal de serviços do executor à agência."},{"tipo":"alterado","disp":"TÍTULO I – Capítulo VI – Art. 14. – Parágrafo único","texto":"Na prestação de serviços descritos no caput, os valores referentes aos serviços executados por terceiros não integrarão a base de cálculo do ISS devido pela agência, desde que devidamente identificados e segregados, sob pena de inclusão do valor total do serviço contratado na base de cálculo do imposto.","apos":"","textoAnt":"No caso de o serviço ser prestado na forma do caput, na nota fiscal de serviços emitida pela agência de publicidade ao cliente, deverão constar os dados e informações das notas fiscais de serviços com os respectivos valores das deduções dos terceiros executores emitidos para a agência, sob pena de integrar-se à base de cálculo."},{"tipo":"alterado","disp":"TÍTULO I – Capítulo VI – Art. 16.","texto":"A base de cálculo do Imposto Sobre Serviços de Qualquer Natureza – ISSQN, nos serviços descritos nos itens 7.02 e 7.05 do Anexo I desta Lei, compreende o valor total do serviço, incluindo os materiais fornecidos pelo prestador, ainda que produzidos ou adquiridos por ele, salvo quando os materiais forem produzidos fora do local da obra e comercializados separadamente, com a incidência de ICMS, acompanhados de documentação fiscal apropriada e compatível com a operação.","apos":"","textoAnt":"Não se inclui na base de cálculo do Imposto Sobre Serviços de Qualquer Natureza o valor dos materiais fornecidos pelo prestador dos serviços previstos nos itens 7.02 e 7.05 do Anexo I desta Lei."},{"tipo":"revogado","disp":"TÍTULO I – Capítulo VI – Art. 16. – §1º","texto":"","apos":"","textoAnt":"Em relação às não inclusões previstas neste artigo quanto às mercadorias, só serão admitidas deduções relativas aos materiais que se incorporem ou se consumam na execução das obras, excluídos:"},{"tipo":"revogado","disp":"TÍTULO I – Capítulo VI – Art. 16. – §1º – I","texto":"","apos":"","textoAnt":"escoras, andaimes, torres e formas;"},{"tipo":"revogado","disp":"TÍTULO I – Capítulo VI – Art. 16. – §1º – II","texto":"","apos":"","textoAnt":"ferramentas, equipamentos de proteção individual, máquinas e respectiva manutenção;"},{"tipo":"revogado","disp":"TÍTULO I – Capítulo VI – Art. 16. – §1º – III","texto":"","apos":"","textoAnt":"materiais adquiridos para a formação de estoque ou armazenagem fora dos canteiros de obra antes de sua utilização;"},{"tipo":"revogado","disp":"TÍTULO I – Capítulo VI – Art. 16. – §1º – IV","texto":"","apos":"","textoAnt":"materiais recebidos na obra após a sua conclusão."},{"tipo":"alterado","disp":"TÍTULO I – Capítulo VI – Art. 17.","texto":"O preço do serviço é a receita bruta a ele correspondente, sem quaisquer deduções, exceto aquelas expressamente previstas nesta Lei.","apos":"","textoAnt":"Preço do serviço é a receita bruta a ele correspondente, sem quaisquer deduções com exceção do fornecimento de materiais previsto no artigo 16."},{"tipo":"incluido","disp":"TÍTULO I – Capítulo VI – Art. 17. – §7º","texto":"Nos serviços de intermediação, definidos como aqueles em que o intermediário aproxima partes interessadas na realização de negócio ou contratação de serviço, sem executar diretamente o objeto pactuado nem assumir responsabilidade técnica por sua execução, a base de cálculo do imposto será exclusivamente o valor da comissão ou remuneração recebida pela intermediação.","apos":"TÍTULO I – Capítulo VI – Art. 17. – §6º","textoAnt":""},{"tipo":"revogado","disp":"TÍTULO I – Capítulo VI – Art. 21.","texto":"","apos":"","textoAnt":"Equipara-se à pessoa jurídica a pessoa física que opte pela emissão de nota fiscal de serviço, que nesse caso passa a ter o ISSQN tributado na forma do inciso II do artigo 24."},{"tipo":"revogado","disp":"TÍTULO I – Capítulo VI – Art. 21. – Parágrafo único","texto":"","apos":"","textoAnt":"A opção de que trata o caput deverá ser exercida anualmente, conforme dispuser o regulamento."},{"tipo":"alterado","disp":"TÍTULO I – Capítulo VIII – Art. 24. – II","texto":"mensalmente, na forma estabelecida em regulamento, em relação aos serviços efetivamente prestados e tomados no período, independentemente do pagamento, quando o prestador for empresa, e o imposto seja devido no Município, na forma do art. 6º;","apos":"","textoAnt":"mensalmente, na forma estabelecida em regulamento, em relação ao serviço efetivamente prestado no período, independentemente do pagamento, quando o prestador for:"},{"tipo":"revogado","disp":"TÍTULO I – Capítulo VIII – Art. 24. – II – a)","texto":"","apos":"","textoAnt":"empresa; e"},{"tipo":"revogado","disp":"TÍTULO I – Capítulo VIII – Art. 24. – II – b)","texto":"","apos":"","textoAnt":"profissional autônomo ou liberal localizado que emita nota fiscal."},{"tipo":"alterado","disp":"TÍTULO I – Capítulo XIV – Art. 49.","texto":"As informações prestadas na Nota Fiscal de Serviços Eletrônica – NFS-e, bem como na escrituração dos serviços prestados e tomados, configuram confissão de dívida do Imposto Sobre Serviços de Qualquer Natureza incidente na operação, ficando a falta de seu recolhimento sujeita aos procedimentos de cobrança administrativa ou judicial, observados os procedimentos regulamentares.","apos":"","textoAnt":"A emissão da NFS-e constitui confissão de dívida do Imposto Sobre Serviços de Qualquer Natureza incidente na operação, ficando a falta de seu recolhimento sujeita a cobrança administrativa ou judicial, observados os procedimentos regulamentares."},{"tipo":"alterado","disp":"TÍTULO I – Capítulo XVI – Art. 56. – IV","texto":"I – nos casos de condutas não tipificadas na legislação como crimes contra a ordem tributária, multa de 75% (setenta e cinco por cento) do montante do tributo devido em UFIMA;","apos":"","textoAnt":"nos casos de condutas não tipificadas na legislação como crimes contra a ordem tributária, multa de 75% (setenta e cinco por cento) do montante do tributo devido em UFIMA."},{"tipo":"alterado","disp":"TÍTULO I – Capítulo XVI – Art. 56. – V","texto":"II – nos casos de condutas tipificadas como crimes contra a ordem tributária, multa de 100% (cem por cento) do montante do tributo devido em UFIMA, sem prejuízo da representação fiscal para fins penais.","apos":"","textoAnt":"nos casos de condutas tipificadas na legislação como crimes contra a ordem tributária, multa de 150% (cento e cinquenta por cento) do montante do tributo devido em UFIMA, independentemente da representação fiscal para fins penais."},{"tipo":"alterado","disp":"TÍTULO I – Capítulo XVI – Art. 57. – III","texto":"20 (vinte) UFIMA ou 20% (vinte por cento) do imposto devido, o que for maior, quando se tratar de instituição financeira ou equiparada;","apos":"","textoAnt":"20 (dez) UFIMA ou 20% (vinte por cento) do imposto devido, o que for maior, quando se tratar de instituição financeira ou equiparada."},{"tipo":"incluido","disp":"TÍTULO I – Capítulo XVI – Art. 57. – IV","texto":"1 (uma) UFIMA ou 20% (vinte por cento) do imposto devido, o que for maior, quando se tratar da declaração obrigatória prevista no art. 47-A desta Lei Complementar, apresentada fora do prazo, com omissão ou inexatidão de informações.","apos":"TÍTULO I – Capítulo XVI – Art. 57. – III","textoAnt":""},{"tipo":"anexo_substituido","disp":"Anexo: ANEXO I","anexoId":2407,"novasColunas":["ITEM","LISTA DE SERVIÇOS","ALÍQUOTA (%)"],"novasLinhas":[["1","1 - Serviços de informática e congêneres.","-"],["01.01","Análise e desenvolvimento de sistemas.","2%"],["01.02","Programação.","2%"],["01.03","Processamento, armazenamento ou hospedagem de dados, textos, imagens, vídeos, páginas eletrônicas, aplicativos e sistemas de informação, entre outros formatos e congêneres.","2%"],["01.04","Elaboração de programas de computadores, inclusive de jogos eletrônicos, independentemente da arquitetura construtiva da máquina em que o programa será executado, incluindo tablets, smartphones e congêneres.","2%"],["01.05","Licenciamento ou cessão de direito de uso de programas de computação","2%"],["01.06","Assessoria e consultoria em informática.","2%"],["01.07","Suporte técnico em informática, inclusive instalação, configuração e manutenção de programas de computação e bancos de dados.","2%"],["01.08","Planejamento, confecção, manutenção e atualização de páginas eletrônicas.","2%"],["01.09","Disponibilização, sem cessão definitiva, de conteúdos de áudio, vídeo, imagem e texto por meio da internet, respeitada a imunidade de livros, jornais e periódicos (exceto a distribuição de conteúdos pelas prestadoras de Serviço de Acesso Condicionado, de que trata a Lei nº ca.","-"],["30.01","Serviços de biologia, biotecnologia e química.","2%"],["31","Serviços técnicos em edificações, eletrônica, eletrotécnica, mecânica, telecomunicações e congêneres.","-"],["31.01","Serviços técnicos em edificações, eletrônica, eletrotécnica, mecânica, telecomunicações e congêneres.","2%"],["32","Serviços de desenhos técnicos.","-"],["32.01","Serviços de desenhos técnicos.","2%"],["33","Serviços de desembaraço aduaneiro, comissários, despachantes e congêneres.","-"],["33.01","Serviços de desembaraço aduaneiro, comissários, despachantes e congêneres.","2%"],["34","Serviços de investigações particulares, detetives e congêneres.","-"],["34.01","Serviços de investigações particulares, detetives e congêneres.","2%"],["35","Serviços de reportagem, assessoria de imprensa, jornalismo e relações públicas.","-"],["35.01","Serviços de reportagem, assessoria de imprensa, jornalismo e relações públicas.","2%"],["36","Serviços de meteorologia.","-"],["36.01","Serviços de meteorologia.","2%"],["37","Serviços de artistas, atletas, modelos e manequins.","-"],["37.01","Serviços de artistas, atletas, modelos e manequins.","2%"],["38","Serviços de museologia.","-"],["38.01","Serviços de museologia.","2%"],["39","Serviços de ourivesaria e lapidação.","-"],["39.01","Serviços de ourivesaria e lapidação (quando o material for fornecido pelo tomador do serviço).","2%"],["40","Serviços relativos a obras de arte sob encomenda.","-"],["40.01","Obras de arte sob encomenda.","2%"]],"texto":""}],"html":"<div class=\"doc-cabecalho\"><div class=\"doc-lei-id\">LEI COMPLEMENTAR Nº 389, DE 20 DE DEZEMBRO DE 2023</div><div class=\"doc-ementa-bloco\"><div class=\"doc-ementa-txt\">DEFINE A FORMA DE TRIBUTAÇÃO, NO MUNICÍPIO DE MARICÁ, DO IMPOSTO SOBRE SERVIÇOS DE QUALQUER NATUREZA – ISSQN, PREVISTO NO INCISO III DO ARTIGO 156 DA CONSTITUIÇÃO DA REPÚBLICA FEDERATIVA DO BRASIL DE 1988.</div></div><div class=\"doc-formula\">O POVO DO MUNICÍPIO DE MARICÁ, por seus representantes na Câmara Municipal, aprovou e o Prefeito Municipal, em seu nome, sanciona a seguinte Lei Complementar:</div><div style=\"margin-top:.75rem\"><span class=\"doc-lei-cons\">Texto consolidado com as alterações da Lei Complementar nº 419/2025</span></div></div><div class=\"doc-est-titulo\"><div class=\"doc-est-label\">TÍTULO I</div><div class=\"doc-est-nome\">DO IMPOSTO SOBRE SERVIÇOS DE QUALQUER NATUREZA</div></div><div class=\"doc-est-capitulo\"><div class=\"doc-est-label\">CAPÍTULO I</div><div class=\"doc-est-nome\">FATO GERADOR</div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 1º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O Imposto Sobre Serviços de Qualquer Natureza, tem como fato gerador a prestação dos serviços constantes dos Anexos desta Lei, ainda que esses não se constituam como atividade preponderante do prestador.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§1º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A hipótese de incidência do imposto se configura independentemente:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">da existência de estabelecimento fixo;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">do resultado financeiro do exercício da atividade;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">III – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">do cumprimento de qualquer exigência legal ou regulamentar, sem prejuízo das penalidades cabíveis;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">IV – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">do pagamento ou não do preço do serviço no mesmo mês ou exercício;</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§2º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O imposto incide também sobre:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">o serviço proveniente do exterior do País ou cuja prestação se tenha iniciado no exterior do País;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">os serviços prestados mediante a utilização de bens e serviços públicos explorados economicamente mediante autorização, permissão ou concessão, com o pagamento de tarifa, preço ou pedágio pelo usuário final do serviço.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§3º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Ressalvadas as exceções expressas no Anexo I desta Lei, os serviços nela mencionados não ficam sujeitos ao Imposto Sobre Operações Relativas à Circulação de Mercadorias e Prestações de Serviços de Transporte Interestadual e Intermunicipal e de Comunicação – ICMS, ainda que sua prestação envolva fornecimento de mercadorias.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 2º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Considera-se ocorrido o fato gerador do imposto e existentes os seus efeitos:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">desde o momento em que se verificarem as circunstâncias materiais necessárias para que a prestação dos serviços previstos na lista de serviços do Anexo I produza os efeitos que normalmente lhe são próprios;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">mensalmente, no caso da prestação de serviços em caráter continuado, considerando-se as frações de mês;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">III – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">na data de início de atividade e em cada dia 1º de janeiro dos exercícios subsequentes, até o término das atividades, no caso de contribuintes sujeitos à tributação por valores fixos anuais.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Parágrafo único  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Considera-se prestação de serviços em caráter continuado aquela em que o decurso de tempo superior a um mês é condição necessária para o seu cumprimento.</span></div><div class=\"doc-est-capitulo\"><div class=\"doc-est-label\">CAPÍTULO II</div><div class=\"doc-est-nome\">NÃO - INCIDÊNCIA</div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 3º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O Imposto sobre Serviços de Qualquer Natureza não incide sobre:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">a prestação de serviços de transportes interestadual e intermunicipal e de comunicação;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">as exportações de serviços para o exterior do País;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">III – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">a prestação de serviços em relação de emprego, dos trabalhadores avulsos, dos diretores e membros de conselho consultivo ou de conselho fiscal de sociedades e fundações, bem como dos sócios-gerentes e dos gerentes-delegados; e</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">IV – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">o valor intermediado no mercado de títulos e valores mobiliários, o valor dos depósitos bancários, o principal, juros e acréscimos moratórios relativos a operações de crédito realizadas por instituições financeiras.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Parágrafo único  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Não se enquadram no disposto no inciso II os serviços desenvolvidos no Município, cujo resultado aqui se verifique, ainda que o pagamento seja feito por residente no exterior.</span></div><div class=\"doc-est-capitulo\"><div class=\"doc-est-label\">CAPÍTULO III</div><div class=\"doc-est-nome\">ISENÇÕES</div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 4º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Ficam isentos do imposto:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">os serviços prestados por associações culturais, associações comunitárias e clubes de serviço, cuja finalidade essencial, nos termos do respectivo estatuto e tendo em vista os atos efetivamente praticados, esteja voltada para o desenvolvimento da comunidade;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">os serviços de diversão pública e de competições desportivas com fins beneficentes ou considerados de interesse da comunidade pelo órgão de educação e cultura do Município ou órgão similar.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Parágrafo único  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">As isenções a que se referem os incisos I e II do caput não se aplicam às receitas decorrentes de:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">serviços prestados a não-sócios;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">serviços descritos no item 19 do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">III – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">serviços não compreendidos nas finalidades especificadas em seu Estatuto ou Contrato Social e de acordo com o art. 4º deste Lei.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 5º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">As isenções serão solicitadas em requerimento, acompanhado das provas de que o contribuinte preenche os requisitos necessários à obtenção do benefício.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§1º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Nos casos de início de atividade, o pedido de isenção deve ser feito por ocasião da concessão da licença para localização e/ou funcionamento de estabelecimentos.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§2º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A documentação apresentada com o primeiro pedido de isenção poderá servir para os demais exercícios, devendo o requerimento de renovação de isenção a ele referir-se, apresentando as provas relativas ao novo exercício.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§3º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">As renovações de isenções devem ser requeridas até o último dia de expediente na repartição fazendária do exercício anterior ao que se pleiteia o benefício, sob pena de perda do mesmo.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§4º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">As isenções serão revistas:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">por requerimento do contribuinte comunicando a extinção ou modificação das condições de prestação do serviço beneficiadas pelas hipóteses de isenção do artigo 4º;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">de ofício a qualquer tempo em que se constate a modificação das condições de prestação do serviço, por parte do contribuinte, de forma que não mais se enquadre nas hipóteses de isenção do artigo 4º, podendo ser promovido o seu cancelamento, se for o caso e nos termos da lei, independentemente das demais sanções cabíveis.</span></div><div class=\"doc-est-capitulo\"><div class=\"doc-est-label\">CAPÍTULO IV</div><div class=\"doc-est-nome\">LOCAL DE INCIDÊNCIA DO IMPOSTO</div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 6º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O serviço considera-se prestado, e o imposto devido, no local do estabelecimento prestador ou, na falta do estabelecimento, no local do domicílio do prestador, exceto nas hipóteses previstas nos incisos abaixo, quando o imposto será devido no local:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">do estabelecimento do tomador ou intermediário do serviço ou, na falta de estabelecimento, onde ele estiver domiciliado, na hipótese do inciso I do parágrafo 2º do artigo 1º;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">da instalação dos andaimes, palcos, coberturas e outras estruturas, no caso dos serviços descritos no subitem 3.05 da tabela do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">III – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">da execução da obra, no caso dos serviços descritos subitens 7.02 e 7.19 do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">IV – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">da demolição, no caso dos serviços descritos no subitem 7.04 do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">V – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">das edificações em geral, estradas, pontes, portos e congêneres, no caso dos serviços descritos no subitem 7.05 do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">VI – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">da execução da varrição, coleta, remoção, incineração, tratamento, reciclagem, separação e destinação final de lixo, rejeitos e outros resíduos quaisquer, no caso dos serviços descritos no subitem 7.09 do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">VII – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">da execução da limpeza, manutenção e conservação de vias e logradouros públicos, imóveis, chaminés, piscinas, parques, jardins e congêneres, no caso dos serviços descritos no subitem 7.10 do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">VIII – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">da execução da decoração e jardinagem, do corte e poda de árvores, no caso dos serviços descritos no subitem 7.11 do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">IX – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">do controle e tratamento do efluente de qualquer natureza e de agentes físicos, químicos e biológicos, no caso dos serviços descritos no subitem 7.12 do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">X – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">do florestamento, reflorestamento, semeadura, adubação, reparação de solo, plantio, silagem, colheita, corte, descascamento de árvores, silvicultura, exploração florestal e serviços congêneres indissociáveis da formação, manutenção e colheita de florestas para quaisquer fins e por quaisquer meios, no caso dos serviços descritos no subitem 7.16 do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">XI – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">da execução dos serviços de escoramento, contenção de encostas e congêneres, no caso dos serviços descritos no subitem 7.17 do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">XII – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">da limpeza e dragagem, no caso dos serviços descritos no subitem 7.18 do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">XIII – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">onde o bem estiver guardado ou estacionado, no caso dos serviços descritos no subitem 11.01 do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">XIV – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">dos bens, dos semoventes ou do domicílio das pessoas vigiados, segurados ou monitorados, no caso dos serviços descritos no subitem 11.02 do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">XV – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">do armazenamento, depósito, carga, descarga, arrumação e guarda do bem, no caso dos serviços descritos no subitem 11.04 do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">XVI – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">da execução dos serviços de diversão, lazer, entretenimento e congêneres, no caso dos serviços descritos nos subitens do item 12, exceto o 12.13, do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">XVII – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">do Município onde está sendo executado o transporte, no caso dos serviços descritos pelo item 16 do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">XVIII – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">do estabelecimento do tomador da mão de obra ou, na falta de estabelecimento, onde ele estiver domiciliado, no caso dos serviços descritos pelo subitem 17.05 do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">XIX – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">da feira, exposição, congresso ou congênere a que se referir o planejamento, organização e administração, no caso dos serviços descritos pelo subitem 17.10 do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">XX – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">do porto, aeroporto, ferroporto, terminal rodoviário, ferroviário ou metroviário, no caso dos serviços descritos pelo item 20 do Anexo I desta Lei.</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">XXI – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">do domicílio do tomador dos serviços dos subitens 4.22, 4.23 e 5.09 do Anexo I;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">XXII – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">do domicílio do tomador do serviço no caso dos serviços prestados pelas administradoras de cartão de crédito ou débito e demais descritos no subitem 15.01 do Anexo I;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">XXIII – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">do domicílio do tomador do serviço do subitem 15.09 do Anexo I.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§1º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">No caso dos serviços a que se refere o subitem 3.04 do Anexo I desta Lei, considera-se ocorrido o fato gerador e devido o imposto caso haja no território do Município extensão de ferrovia, rodovia, postes, cabos, dutos e condutos de qualquer natureza, objetos de locação, sublocação, arrendamento, direito de passagem ou permissão de uso, compartilhado ou não.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§2º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">No caso dos serviços a que se refere o subitem 22.01 do Anexo I desta Lei, considera-se ocorrido o fato gerador e devido o imposto caso haja no território do Município extensão de rodovia explorada.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§3º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Considera-se ocorrido o fato gerador do imposto no local do estabelecimento prestador nos serviços executados em águas marítimas, excetuados os serviços descritos no subitem 20.01.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§4º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Na hipótese de descumprimento do disposto no caput ou no parágrafo único ou ambos do artigo 23 desta Lei, referente à alíquota mínima, o imposto será devido no local do estabelecimento tomador ou intermediário do serviço ou, na falta de estabelecimento, onde ele estiver domiciliado.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§5º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Ressalvadas as exceções e especificações estabelecidas nos §§ 6º a 12 deste artigo, considera-se tomador dos serviços referidos nos incisos XXI, XXII e XXIII do caput deste artigo o contratante do serviço e, no caso de negócio jurídico que envolva estipulação em favor de unidade da pessoa jurídica contratante, a unidade em favor da qual o serviço foi estipulado, sendo irrelevantes para caracterizá-la as denominações de sede, filial, agência, posto de atendimento, sucursal, escritório de representação ou contato ou quaisquer outras que venham a ser utilizadas.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§6º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">No caso dos serviços de planos de saúde ou de medicina e congêneres, referidos nos subitens 4.22 e 4.23 da lista de serviços anexa a esta Lei Complementar, o tomador do serviço é a pessoa física beneficiária vinculada à operadora por meio de convênio ou contrato de plano de saúde individual, familiar, coletivo empresarial ou coletivo por adesão.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§7º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Nos casos em que houver dependentes vinculados ao titular do plano, será considerado apenas o domicílio do titular para fins do disposto no § 6º deste artigo.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§8º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">No caso dos serviços de administração de cartão de crédito ou débito e congêneres, referidos no subitem 15.01 do Anexo I, prestados diretamente aos portadores de cartões de crédito ou débito e congêneres, o tomador é o primeiro titular do cartão.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§9º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O local do estabelecimento credenciado é considerado o domicílio do tomador dos demais serviços referidos no subitem 15.01 da lista de serviços Anexo I desta Lei Complementar, relativos às transferências realizadas por meio de cartão de crédito ou débito, ou a eles conexos, que sejam prestados ao tomador, direta ou indiretamente, por:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">bandeiras;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">credenciadoras; ou</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">III – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">emissoras de cartões de crédito ou débito.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§10.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">No caso dos serviços de administração de carteira de valores mobiliários e dos serviços de administração e gestão de fundos e clubes de investimento, referidos no subitem 15.01 do Anexo I o tomador é o cotista.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§11.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">No caso dos serviços de administração de consórcios, o tomador de serviço é o consorciado.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§12.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">No caso dos serviços de arrendamento mercantil, o tomador do serviço é o arrendatário, pessoa física ou a unidade beneficiária da pessoa jurídica, domiciliado no país, e, no caso de arrendatário não domiciliado no país, o tomador é o beneficiário do serviço no país.</span></div><div class=\"doc-est-capitulo\"><div class=\"doc-est-label\">CAPÍTULO V</div><div class=\"doc-est-nome\">SUJEITO PASSIVO</div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 7º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Contribuinte do imposto é o prestador do serviço.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Parágrafo único  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O contribuinte dos Serviços de Registros Públicos, Cartorários e Notariais previstos no subitem 21.01 do Anexo I desta lei é o titular da serventia.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 8º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Para os efeitos desse imposto considera-se:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">empresa – toda e qualquer pessoa jurídica que exercer atividade econômica de prestação de serviço, conforme definida na Lei Federal nº 10.406 de 10 de janeiro de 2002 – Código Civil Brasileiro;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">profissional autônomo – toda e qualquer pessoa física que sem subordinação jurídica ou dependência hierárquica exercer atividade econômica de prestação de serviços;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">III – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Profissional liberal – pessoa física que, habilitada por Ordem ou Conselho Profissional, na forma da lei regente de sua profissão, exerce atividade econômica de prestação de serviços de caráter técnico ou científico, sem subordinação jurídica ou hierárquica.</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">IV – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">sociedade de prestação de serviços profissionais – sociedade de trabalho uniprofissional de caráter especializado, organizada exclusivamente por pessoas físicas habilitadas para a prestação dos serviços sob a forma de trabalho pessoal do próprio contribuinte e que tenha seu contrato ou ato constitutivo registrado no respectivo órgão de classe, que não possuam a mesma habilitação do empregador, para a execução de atividades acessórias ou auxiliares não componentes da essência do serviço;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">V – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">integrante da sociedade de profissionais – profissional devidamente habilitado, sócio ou empregado de sociedade de prestação de serviços profissionais, que preste serviço em nome da sociedade, embora assumindo responsabilidade pessoal;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">VI – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">trabalhador avulso – aquele que exercer atividade de caráter eventual, isto é, fortuito, casual, incerto, sem continuidade, sob dependência hierárquica, mas sem vinculação empregatícia;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">VII – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">trabalho pessoal – aquele, material ou intelectual executado pelo próprio prestador, pessoa física, que não possuam a mesma habilitação do empregador, para a execução de atividades acessórias ou auxiliares não componentes da essência do serviço;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">VIII – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">estabelecimento prestador – é o complexo de bens organizados onde o contribuinte desenvolva a atividade de prestar serviços, de modo permanente ou temporário, e que configure unidade econômica ou profissional, sendo irrelevantes para caracterizá-lo as denominações de sede, filial, agência, posto de atendimento, sucursal, escritório de representação ou contato ou quaisquer outras que venham a ser utilizadas.</span></div><div class=\"doc-est-secao\"><div class=\"doc-est-label\">SEÇÃO I</div><div class=\"doc-est-nome\">Responsabilidade</div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 9º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">São responsáveis pela retenção e recolhimento do imposto, quando o recolhimento deva ser feito ao Município de Maricá:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">o tomador ou intermediário de serviço proveniente do exterior do País ou cuja prestação se tenha iniciado no exterior do País;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(30, 95, 168, 0.06); border-left: 3px solid var(--blue); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><div style=\"font-size:13px;font-family:monospace;\"><span style=\"color:var(--blue)\">II – </span><span style=\"color:var(--muted);text-decoration:line-through\">a pessoa jurídica, exceto MEI, ainda que imune ou isenta, tomadora ou intermediária dos serviços descritos nos subitens 3.05, 7.02, 7.04, 7.05, 7.09, 7.10, 7.11, 7.12, 7.16, 7.17, 7.18, 7.19, 11.02, 16.02, 17.05 e 17.10 do Anexo I desta Lei.</span></div><div style=\"font-size:13px;font-family:monospace;margin-top:3px\"><span style=\"color:var(--blue)\">II – </span><span style=\"color:var(--text)\">a pessoa jurídica, exceto MEI, ainda que imune ou isenta, tomadora ou intermediária dos serviços descritos nos subitens 3.05, 7.02, 7.04, 7.05, 7.09, 7.10, 7.11, 7.12, 7.16, 7.17, 7.18, 7.19, 11.01, 11.02, 11.04, item 12 (exceto o subitem 12.13), 16.01, 16.02, 17.05, 17.10 e item 20 do Anexo I desta Lei;</span><br><span class=\"doc-art-nota\">(Redação dada pela Lei Complementar nº 419/2025)</span></div></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">III – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">a pessoa jurídica tomadora ou intermediária de serviços, ainda que imune ou isenta, na hipótese prevista no § 4o do artigo 6o desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">IV – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">as pessoas referidas nos incisos II ou III do § 9º do artigo 6º desta Lei Complementar, pelo imposto devido pelas pessoas a que se refere o inciso I do mesmo parágrafo, em decorrência dos serviços prestados na forma do subitem 15.01 da lista de serviços anexa a esta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">V – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">toda pessoa jurídica que, mesmo incluída nos regimes de imunidade ou isenção, fizer uso de serviços de terceiros, quando:</span></div><div style=\"margin-left: 40px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:mono
