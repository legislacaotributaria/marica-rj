","label":"Capítulo VII","texto":"DISPOSIÇÕES FINAIS","paiId":null,"id":4652},{"tipo":"art","label":"Art. 12.","texto":"Em caso extraordinário, mesmo que não ocorra a prorrogação prevista no parágrafo único do art. 1º, permanece a obrigatoriedade da Comissão em atender convocação prévia e por escrito do Secretário de Planejamento, Orçamento e Fazenda para dirimir dúvidas ou conflitos em relação à Planta Genérica de Valores-PGV e sua atualização.","paiId":4652,"id":4653},{"tipo":"art","label":"Art. 13.","texto":"Este Decreto entra em vigor na data de sua publicação.","paiId":4652,"id":4654}],"anexos":[],"preambulo":"INSTITUI A COMISSÃO ESPECIAL PARA VALIDAÇÃO E ATUALIZAÇÃO ANUAL DA PLANTA GENÉRICA DE VALORES VENAIS DOS IMÓVEIS DO MUNICÍPIO DE MARICÁ.","formulaPromulgacao":"CONSIDERANDO o disposto no artigo 11 do Código Tributário Municipal, que determina a atualização do valor venal dos imóveis do município de Maricá, através do Poder Executivo, por comissão instituída para esse fim específico;\nCONSIDERANDO a inexistência de Órgão de Deliberação Coletiva para a necessária atualização e atribuição dos valores venais dos imóveis do Município; \nCONSIDERANDO que a base de cálculo do Imposto Predial Territorial Urbano - IPTU é o valor venal do imóvel, apurado com base na Planta Genérica de Valores -PGV; CONSIDERANDO que a estruturação da Planta de Valores Imobiliários deve ocorrer periodicamente ajustando-a à realidade do mercado; \nCONSIDERANDO que a ação é imprescindível à boa gestão das finanças municipais, conforme orientação da Lei de Responsabilidade Fiscal e do Tribunal de Contas do Estado do Rio de Janeiro. \nO PREFEITO MUNICIPAL DE MARICÁ, no uso de suas atribuições legais, DECRETA:","dataExtenso":"24 DE JUNHO 2022","assinatura":"Fabiano Taques Horta \nPREFEITO"},{"id":18,"tipo":"dec","num":"887","ano":"2022","ementa":"Regulamenta as normas gerais de parcelamento dos créditos tributários conforme a LC nº 358/2022.","tributo":"geral","situacao":"vigente","link":"JOM 1.347, de 19/08/2022","artigos":[{"tipo":"capitulo","label":"Capítulo I","texto":"DISPOSIÇÕES PRELIMINARES","paiId":null,"id":4012},{"tipo":"art","label":"Art. 1º","texto":"Este decreto regulamenta o parcelamento ordinário dos créditos tributários e não tributários, de que trata a Lei Complementar nº 358/2022.","paiId":4012,"id":4013},{"tipo":"art","label":"Art. 2º","texto":"O disposto neste Decreto se aplica aos créditos vencidos, inscritos ou não em dívida ativa, mesmo em fase de execução fiscal.","paiId":4012,"id":4014},{"tipo":"par","label":"§1º","texto":"O disposto neste Decreto também se aplica aos créditos vincendos nos casos em que o requerente seja empresário ou sociedade empresária que pleiteie ou tenha deferido o processamento de recuperação judicial.","paiId":4014,"id":4015},{"tipo":"par","label":"§2º","texto":"No ato da concessão o valo da dívida será consolidado e atualizado monetariamente pelo mesmo índice utilizado para atualização dos créditos tributários do Município, acrescido de multa de mora, juros de mora e demais acréscimos pecuniários previstos na legislação em vigor à época do parcelamento, e será expresso em moeda nacional corrente.","paiId":4014,"id":4016},{"tipo":"art","label":"Art. 3º","texto":"A efetivação do parcelamento previsto pela Lei Complementar nº 358/2022 e regulamentado por este Decreto, não configura a novação prevista no art. 360, inciso I, do Código Civil.","paiId":4012,"id":4017},{"tipo":"capitulo","label":"Capítulo II","texto":"DOCUMENTOS NECESSÁRIOS PARA INSTRUÇÃO DO PROCESSOS ADMINISTRATIVOS DE PARCELAMENTO","paiId":null,"id":4018},{"tipo":"art","label":"Art. 4º","texto":"Devem integrar os autos dos processos administrativos de solicitação de parcelamentos os seguintes documentos:","paiId":4018,"id":4019},{"tipo":"inc","label":"I","texto":"quando Pessoas Físicas:","paiId":4019,"id":4020},{"tipo":"ali","label":"a)","texto":"em caso de comparecimento do próprio sujeito passivo: documento de identidade e comprovante de residência; endereço eletrônico (e-mail) válido, e houver, bem como número de celular e/ou telefone fixo.","paiId":4020,"id":4021},{"tipo":"ali","label":"b)","texto":"em caso de comparecimento de representante do sujeito passivo: procuração com poderes específicos; cópia do documento de identidade, CPF, comprovante de residência ou domicilio tributário elegível pelo sujeito passivo.","paiId":4020,"id":4022},{"tipo":"ali","label":"c)","texto":"em caso de contribuinte já falecido: certidão de óbito, documento de identidade de todos os herdeiros e do cônjuge meeiro ou documento do inventariante com abertura do inventário, cópia do termo de inventariança assinado e CPF;","paiId":4020,"id":4023},{"tipo":"ali","label":"d)","texto":"Formal de Partilha ou seu respectivo registro junto ao Registro Geral de Imóveis.","paiId":4020,"id":4024},{"tipo":"ali","label":"e)","texto":"em caso de comparecimento de terceiro interessado: documento de identidade, CPF e comprovante de residência, endereço eletrônico (e-mail) válido, se houver, bem como número de celular;","paiId":4020,"id":4025},{"tipo":"ali","label":"f)","texto":"declaração de que consta no CadÚnico na condição de hipossuficiente ou de que ganha até 2 (dois) salários mínimos, quando for o caso.","paiId":4020,"id":4026},{"tipo":"inc","label":"II","texto":"quando Pessoa Jurídica;","paiId":4019,"id":4027},{"tipo":"ali","label":"a)","texto":"em caso de comparecimento de um dos sócios: documento de identidade, CPF, comprovante de endereço da empresa, CNPJ; Contrato Social ou Estatuto Social;","paiId":4027,"id":4028},{"tipo":"ali","label":"b)","texto":"em caso de comparecimento de administrador ou representante legal, ata de assembleia que o elegeu, identidade e CPF; comprovante de endereço da empresa, CNPJ e contrato social.","paiId":4027,"id":4029},{"tipo":"ali","label":"c)","texto":"em caso de comparecimento por procuração, documento de identidade, CPF, comprovante de endereço da empresa e procuração com poderes específicos;","paiId":4027,"id":4030},{"tipo":"ali","label":"d)","texto":"em caso de comparecimento do representante contábil, deverão ser apresentados os documentos da alínea “a” deste inciso e o contrato de prestação de serviços ou procuração com poderes específicos.","paiId":4027,"id":4031},{"tipo":"par","label":"§1º","texto":"Também comporão o processo administrativo de solicitação de parcelamento, em quaisquer casos:","paiId":4019,"id":4032},{"tipo":"inc","label":"I","texto":"requerimento indicando os débitos a serem parcelados e o número de parcelas solicitadas;","paiId":4032,"id":4033},{"tipo":"inc","label":"II","texto":"demonstrativo atualizado do cálculo do parcelamento, fornecido pela Administração, que evidencie sua adequação aos parâmetros previsto na lei regente do Parcelamento.","paiId":4032,"id":4034},{"tipo":"inc","label":"III","texto":"despacho da autoridade competente para conceder o parcelamento;","paiId":4032,"id":4035},{"tipo":"inc","label":"IV","texto":"Termo de reconhecimento de dívida, quando o solicitante for sujeito passivo ou seu representante legal, ou Termo de Ciência de Quitação de Dívida alheia em nome do sujeito passivo, quando o solicitante for terceiro interessado;","paiId":4032,"id":4036},{"tipo":"par","label":"§2º","texto":"Caso o peticionante se declare hipossuficiente e não esteja inscrito no Cadúnico do Município, deverá comprovar ter remuneração máxima de até 2 (dois) salários mínimos mensais, anexando os 3(três) últimos contracheques acompanhados de extrato bancário referente aos últimos 3 (três meses) de movimentação de todas as suas contas bancárias, caso possua.","paiId":4019,"id":4037},{"tipo":"art","label":"Art. 5º","texto":"O requerimento do parcelamento pelo contribuinte ou por seu representante legal devidamente documentado implica o reconhecimento dos créditos tributários nele incluídos e a desistência automática de eventuais impugnações e recursos apresentados no âmbito administrativo e seu deferimento será condicionado à apresentação de prova de desistência de quaisquer impugnações na esfera judicial.","paiId":4018,"id":4038},{"tipo":"art","label":"Art. 6º","texto":"Indicação dos débitos no pedido de parcelamento será de exclusiva responsabilidade do contribuinte, podendo utilizar o extrato financeiro disponível no Portal do Sim, ou ainda confessar espontaneamente os débitos que ainda não estejam registrados no sistema.","paiId":4018,"id":4039},{"tipo":"par","label":"Parágrafo único","texto":"A concessão do parcelamento ou o recolhimento de qualquer valor, integral ou parcial, não implicará o reconhecimento, pela Fazenda Municipal, dos termos do débito declarado, tampouco renúncia ao direito de apurar sua exatidão e exigir eventuais diferenças, inclusive com aplicação das sanções cabíveis.","paiId":4039,"id":4040},{"tipo":"capitulo","label":"Capítulo III","texto":"DA COMPETÊNCIA PARA CONCEDER PARCELAMENTOS","paiId":null,"id":4041},{"tipo":"art","label":"Art. 7º","texto":"São competentes para conceder parcelamentos:","paiId":4041,"id":4042},{"tipo":"inc","label":"I","texto":"em relação aos créditos não inscritos em Dívida Ativa:","paiId":4042,"id":4043},{"tipo":"ali","label":"a)","texto":"Os Gerentes dos Serviços Integrados Municipais do Centro, Inoã e Itaipuaçu;","paiId":4043,"id":4044},{"tipo":"ali","label":"b)","texto":"O Gerente da Cobrança e Dívida Ativa da Subsecretaria de Receita.","paiId":4043,"id":4045},{"tipo":"inc","label":"II","texto":"em relação aos créditos inscritos em Dívida Ativa:","paiId":4042,"id":4046},{"tipo":"ali","label":"a)","texto":"Os servidores designados por ato do Procurador Geral do Município.","paiId":4046,"id":4047},{"tipo":"capitulo","label":"Capítulo IV","texto":"DAS CONDIÇÕES PARA A CONCESSÃO DO PARCELAMENTO","paiId":null,"id":4048},{"tipo":"art","label":"Art. 8º","texto":"s parcelamentos requeridos na forma e condições de que trata este Decreto:","paiId":4048,"id":4049},{"tipo":"inc","label":"I","texto":"não dependem de apresentação de garantia ou de arrolamento de bens, exceto quando já houver penhora em execução fiscal ajuizada; e","paiId":4049,"id":4050},{"tipo":"inc","label":"II","texto":"no caso de débito inscrito em Dívida Ativa do Município, abrangerão inclusive os encargos legais que forem devidos.","paiId":4049,"id":4051},{"tipo":"par","label":"Parágrafo único","texto":"Caso o crédito tributário já esteja garantido por penhora, esta será mantida até o adimplemento integral do valor devido.","paiId":4049,"id":4052},{"tipo":"art","label":"Art. 9º","texto":"O parcelamento considerar-se-á efetivado após a quitação da primeira parcela.","paiId":4048,"id":4053},{"tipo":"art","label":"Art. 10.","texto":"Os depósitos de qualquer natureza, vinculados aos débitos a serem parcelados nos termos deste Decreto, serão imediatamente convertidos em renda do Município, e apenas o saldo remanescente será objeto de parcelamento.","paiId":4048,"id":4054},{"tipo":"par","label":"Parágrafo único","texto":"Na hipótese em que o valor depositado exceda o valor do débito após a consolidação de que trata este Decreto, o saldo remanescente poderá ser levantado pelo sujeito passivo.","paiId":4054,"id":4055},{"tipo":"art","label":"Art. 11.","texto":"O valor das parcelas será corrigido no mesmo prazo e pelo mesmo índice utilizado para atualização dos créditos tributários do Município, incidindo, ainda, juros de mora mensais.","paiId":4048,"id":4056},{"tipo":"par","label":"Parágrafo único","texto":"No termo de Reconhecimento de Dívida ou de Ciência de Quitação da Dívida alheia, assinado pelo requerente, constarão obrigatoriamente:","paiId":4056,"id":4057},{"tipo":"inc","label":"I","texto":"a norma aplicável à utilização dos créditos e a periodicidade de atualização;","paiId":4057,"id":4058},{"tipo":"inc","label":"II","texto":"a norma aplicável, o índice utilizado para cálculo e a regra de fluência dos juros moratórios;","paiId":4057,"id":4059},{"tipo":"inc","label":"III","texto":"a norma aplicável, o índice utilizado e a regra de fluência de qualquer outro acréscimo previsto na legislação e que índice sobre o crédito parcelado.","paiId":4057,"id":4060},{"tipo":"art","label":"Art. 12.","texto":"Deferido o parcelamento de crédito ajuizado, as custas deverão ser pagas na forma do Convênio celebrado com o Tribunal de Justiça do Estado do Rio de Janeiro, podendo os honorários sucumbenciais serem parcelados na forma a ser definida em Resolução da PGM. Em ambos os casos, será suspensa a execução fiscal enquanto o parcelamento estiver em curso.","paiId":4048,"id":4061},{"tipo":"capitulo","label":"Capítulo V","texto":"DAS DISPOSIÇÕES FINAIS","paiId":null,"id":4062},{"tipo":"art","label":"Art. 13.","texto":"Os parcelamentos deferidos anteriormente à data da publicação da Lei Complementar nº 358/2022 e deste Decreto serão regidos pela legislação vigente por ocasião de seu deferimento.","paiId":4062,"id":4063},{"tipo":"art","label":"Art. 14.","texto":"A Secretaria Municipal de Fazenda e a Procuradoria Geral do Município, no âmbito de suas respectivas competências, editarão os atos necessários à execução dos parcelamentos de que trata este Decreto.","paiId":4062,"id":4064},{"tipo":"par","label":"Parágrafo único","texto":"Os atos referidos no caput deste artigo poderão dispor sobre restrições à concessão dos parcelamentos em decorrência de deferimento da penhora, protesto ou indicação do imóvel a leilão em execução fiscal.","paiId":4064,"id":4065},{"tipo":"art","label":"Art. 15.","texto":"Este decreto entra em vigor na data de sua publicação.","paiId":4062,"id":4066}],"anexos":[],"preambulo":"REGULAMENTA AS NORMAS GERAIS DE PARCELAMENTO DOS CRÉDITOS TRIBUTÁRIOS CONFORME DISPOSTO NA LEI COMPLEMENTAR Nº 358/2022 E DÁ OUTRAS PROVIDÊNCIAS.","formulaPromulgacao":"CONSIDERANDO a Lei nº 5.172/1966, Código Tributário Nacional – CTN, que dispõe sobre o Sistema Tributário Nacional e institui normas gerais de direito tributário aplicáveis à União, Estados e Municípios; \nCONSIDERANDO a Lei Complementar nº 005/1991, que dispõe sobre o Sistema Tributário Municipal; \nCONSIDERANDO a Lei Complementar nº 358/2022, que dispõe sobre as normas gerais de parcelamento dos créditos tributários e não tributários do Município de Maricá e dá outras providências; \nCONSIDERANDO a necessidade de aprimorar os procedimentos de cobrança e arrecadação dos créditos inscritos ou não em dívida ativa municipal; e \nCONSIDERANDO o compromisso desta administração com os princípios constitucionais da legalidade, isonomia, transparência, publicidade e eficiência.\nO PREFEITO DO MUNICÍPIO DE MARICÁ, no uso de suas atribuições, DECRETA:","dataExtenso":"","municipio":"Maricá, Estado do Rio de Janeiro, RJ","fechoTexto":"REGISTRE-SE, PUBLIQUE-SE, CUMPRA-SE. Prefeitura Municipal de Maricá, em 18 de agosto de 2022.","assinatura":"Fabiano Taques Horta \nPREFEITO"},{"id":19,"tipo":"in","num":"SEGET 001","ano":"2026","ementa":"Autoriza a emissão de NFS-e de forma consolidada pelos serviços notariais e de registro.","tributo":"issqn","situacao":"vigente","link":"JOM 1.835, de 28/01/2026","artigos":[{"tipo":"art","label":"Art. 1º","texto":"A emissão de Nota Fiscal de Serviços Eletrônica – NFS-e, no padrão nacional, pelos serviços notariais e de registro, poderá ocorrer de forma consolidada por período de apuração mensal.","paiId":null,"id":4613},{"tipo":"par","label":"§1º","texto":"O disposto no caput aplica-se enquanto não houver norma nacional dispondo de maneira diversa.","paiId":4613,"id":4614},{"tipo":"par","label":"§2º","texto":"Observado o disposto no §1º, a autorização prevista no caput deste artigo alcança também os serviços relativos à competência de janeiro de 2026, prestados anteriormente à vigência desta Instrução Normativa.","paiId":4613,"id":4615},{"tipo":"art","label":"Art. 2º","texto":"A NFS-e emitida na forma desta Instrução Normativa deverá ser escriturada no Sistema Gerenciador do ISSQN do Município (Nota Maricá), competindo ao prestador encerrar a respectiva competência para fins de apuração e recolhimento do imposto, nos prazos definidos pelo Calendário de Recolhimento de Tributos Municipais de Maricá (CATRIMA).","paiId":null,"id":4616},{"tipo":"art","label":"Art. 3º","texto":"Esta Instrução Normativa aplica-se exclusivamente aos serviços notariais e de registro, previstos no subitem 21.01 do Anexo I da Lei Complementar nº 389/2023.","paiId":null,"id":4617},{"tipo":"art","label":"Art. 4º","texto":"Esta Instrução Normativa entra em vigor na data de sua publicação.","paiId":null,"id":4618}],"anexos":[],"preambulo":"Autoriza a emissão de nota fiscal de serviços eletrônica – NFS-e, no padrão nacional, de forma consolidada pelos serviços notariais e de registro.","formulaPromulgacao":"CONSIDERANDO o disposto nos arts. 48 e 49 e nos arts. 25 e 26 da Lei Complementar Municipal nº 389, de 20 de dezembro de 2023; \nCONSIDERANDO o disposto no art. 62 da Lei Complementar Federal nº 214, de 16 de janeiro de 2025; \nCONSIDERANDO o disposto no Decreto Municipal nº 286/2025, especialmente em seus arts. 2º, parágrafo único, e 3º; \nCONSIDERANDO as peculiaridades operacionais dos serviços notariais e de registro, caracterizados por elevado volume diário de atos sujeitos ao ISSQN; \nA SECRETÁRIA MUNICIPAL DE GESTÃO TRIBUTÁRIA E FISCAL, no uso das atribuições que lhe são conferidas pela legislação municipal, RESOLVE:","dataExtenso":"23 DE JANEIRO DE 2026","assinatura":"Lawrice dos Santos Souza \nSecretária de Gestão Tributária e Fiscal \nMat. 113.490"},{"id":20,"tipo":"in","num":"SEGET 001","ano":"2025","ementa":"Dispõe sobre a não exigência de taxa para emissão de certidões da Fazenda para defesa de direitos.","tributo":"taxas","situacao":"vigente","link":"JOM Especial 337, de 07/01/2025","artigos":[{"tipo":"art","label":"Art. 1º","texto":"Esta Instrução Normativa visa garantir o Direito de Petição no que se refere à não exigência do recolhimento de taxa para emissão de certidões expedidas pela Secretaria, para defesa de direitos e esclarecimento de situações pessoais, ou para interposição de recurso administrativo.","paiId":null,"id":3794},{"tipo":"art","label":"Art. 2º","texto":"São a todos assegurados, independentemente do pagamento de taxas, a obtenção de certidões nas repartições públicas subordinadas à Secretaria de Gestão Tributária e Fiscal, para defesa de direitos e esclarecimento de situações de interesse pessoal.","paiId":null,"id":3795},{"tipo":"art","label":"Art. 3º","texto":"Não poderá ser exigido do solicitante pelo atendimento, pelos setores de cadastro, pela fiscalização de tributos, ou por qualquer outro órgão subordinado à Secretaria de Gestão Tributária e Fiscal, o recolhimento de:","paiId":null,"id":3796},{"tipo":"inc","label":"I","texto":"taxa ou cobrança de tarifa para emissão de certidões expedidas pela Secretaria, para defesa de direitos e esclarecimento de situações pessoais;","paiId":3796,"id":3797},{"tipo":"inc","label":"II","texto":"taxa ou cobrança de tarifa para abertura de processos originários de obtenção de certidões expedidas pela Fazenda, para defesa de direitos e esclarecimento de situações pessoais;","paiId":3796,"id":3798},{"tipo":"inc","label":"III","texto":"taxa ou cobrança de tarifa para desarquivamento de processos originários de obtenção de certidões expedidas pela Fazenda, para defesa de direitos e esclarecimento de situações pessoais.","paiId":3796,"id":3799},{"tipo":"par","label":"§1º","texto":"A não exigência de que trata o caput refere-se tão somente a certidões solicitadas objetivando a defesa de direitos ou o esclarecimento de situação de interesse pessoal, não estando incluídas as certidões voltadas à prestação de informações de interesse coletivo ou geral.","paiId":3796,"id":3800},{"tipo":"par","label":"§2º","texto":"Poderá ser exigida taxa ou cobrança de tarifa para emissão de Certidão de Inteiro Teor.","paiId":3796,"id":3801},{"tipo":"art","label":"Art. 4º","texto":"Para fins desta Instrução Normativa, compreende-se como:","paiId":null,"id":3802},{"tipo":"inc","label":"I","texto":"Certidão: documento emitido por um órgão público ou autoridade competente que atesta, de forma ofi cial, a veracidade de determinados fatos, registros ou informações, possuindo valor legal;","paiId":3802,"id":3803},{"tipo":"inc","label":"II","texto":"Taxa para Emissão de Certidão: preço público exigido do solicitante como requisito para a emissão da Certidão;","paiId":3802,"id":3804},{"tipo":"inc","label":"III","texto":"Certidão para Defesa de Direitos: aquela com a explícita finalidade de viabilizar a defesa, perante as instituições estatais, de direitos ou valores revestidos tanto de natureza pessoal quanto de signifi cação coletiva;","paiId":3802,"id":3805},{"tipo":"inc","label":"IV","texto":"Certidão para Esclarecimento de Situações Pessoais: aquela que ateste determinados fatos, registros ou informações relativas à pessoa do solicitante;","paiId":3802,"id":3806},{"tipo":"inc","label":"V","texto":"Recurso Administrativo: é o meio pelo qual a Administração é provocada a fiscalizar seus próprios atos, visando ao atendimento do interesse público e à preservação da legalidade.","paiId":3802,"id":3807},{"tipo":"art","label":"Art. 5º","texto":"Cabe ao solicitante que postular a certidão declarar a finalidade do seu requerimento.","paiId":null,"id":3808},{"tipo":"par","label":"§1º","texto":"A demonstração, pelo solicitante, de que a certidão é solicitada para a defesa de direitos ou o esclarecimento de situações de interesse pessoal, não é necessária quando a certidão pleiteada for concernente ao próprio requerente.","paiId":3808,"id":3809},{"tipo":"par","label":"§2º","texto":"Quando o pedido tiver como objeto interesse indireto ou de terceiros, é necessária a expressa e fundamentada demonstração dos fins e das razões do pedido.","paiId":3808,"id":3810},{"tipo":"art","label":"Art. 6º","texto":"O direito de petição consubstancia os instrumentos processuais de defesa não jurisdicional de direitos, da constituição, das leis e dos interesses gerais e coletivos contra ilegalidades e abusos de poder.","paiId":null,"id":3811},{"tipo":"par","label":"§1º","texto":"Não poderá ser exigido do solicitante pelo atendimento, pelos setores de cadastro, pela fiscalização de tributos, ou por qualquer outro órgão subordinado à Secretaria de Gestão Tributária e Fiscal, o recolhimento de taxa ou cobrança de tarifa, bem como o depósito ou arrolamento prévio de dinheiro ou bens, para interposição e admissibilidade de recurso administrativo ou abertura de processo administrativo para contestar decisão administrativa.","paiId":3811,"id":3812},{"tipo":"par","label":"§2º","texto":"A não exigência de recolhimento de taxa ou cobrança de tarifa para interposição de recurso administrativo não abarca a realização de perícias e o empreendimento de diligências.","paiId":3811,"id":3813},{"tipo":"art","label":"Art. 7º","texto":"Não poderá ser exigido do solicitante pelo atendimento, pelos setores de cadastro, pela fiscalização de tributos, ou por qualquer outro órgão subordinado à Secretaria de Gestão Tributária e Fiscal, o recolhimento de taxa ou cobrança de tarifa em razão de emissão ou remessa de carnês/guias de recolhimento de tributos.","paiId":null,"id":3814},{"tipo":"art","label":"Art. 8º","texto":"A presente Instrução Normativa entra em vigor na data de sua publicação.","paiId":null,"id":3815}],"anexos":[],"preambulo":"Dispõe sobre a não exigência de recolhimento de taxa ou cobrança de tarifa para emissão de certidões expedidas pela Fazenda, para defesa de direitos e esclarecimento de situações de interesse pessoal ou para interposição de recurso administrativo.","formulaPromulgacao":"A SECRETÁRIA DE GESTÃO TRIBUTÁRIA E FISCAL, no uso de suas atribuições conferidas pela Lei Complementar nº 398 de 12 de dezembro de 2024, que dispõe sobre a Estrutura Administrativa do Poder Executivo Municipal, resolve:","dataExtenso":"03 DE JANEIRO DE 2025","assinatura":"Lawrice dos Santos Souza\nSecretária de Gestão Tributária e Fiscal \nMat.113.490"},{"id":21,"tipo":"in","num":"SEGET 002","ano":"2025","ementa":"Dispõe sobre a aplicação da base de cálculo da Taxa de Inspeção Sanitária (TIS).","tributo":"taxas","situacao":"vigente","link":"JOM 1.715, de 26/03/2025","artigos":[{"tipo":"art","label":"Art. 1º","texto":"Esta Instrução Normativa estabelece critérios para a aplicação da Taxa de Inspeção Sanitária (TIS) no âmbito do Município de Maricá, até que seja editada norma específica que discipline a metodologia para definição do porte da atividade econômica.","paiId":null,"id":4605},{"tipo":"art","label":"Art. 2º","texto":"Para fins desta Instrução Normativa, compreende-se como:","paiId":null,"id":4606},{"tipo":"inc","label":"I","texto":"Taxa de Inspeção Sanitária (TIS): tributo devido em razão do exercício do poder de polícia da Administração Pública Municipal, com fins de disciplinar o direito de exercício de atividades econômicas específicas, sobretudo às relativas à manipulação de alimentos, medicamentos e material hospitalar, visando ao interesse público de garantia da saúde da população pela fiscalização dessas atividades, conforme previsto nos Arts. 120 e 121, do Código Tributário Municipal — CTM (Lei Complementar 005 de 30 de Janeiro de 1991);","paiId":4606,"id":4607},{"tipo":"inc","label":"II","texto":"Porte da atividade: critério utilizado para definir a base de cálculo da TIS.","paiId":4606,"id":4608},{"tipo":"art","label":"Art. 3º","texto":"Fica determinado que, enquanto não houver lei específica para a definição do porte da atividade econômica, a Taxa de Inspeção Sanitária (TIS) será calculada, em todos os casos em que for devida, com base no valor correspondente ao Porte “E” da tabela do Anexo IX do Código Tributário Municipal.","paiId":null,"id":4609},{"tipo":"art","label":"Art. 4º","texto":"Os setores responsáveis pela fiscalização e arrecadação tributária deverão observar o disposto nesta Instrução Normativa ao realizarem os lançamentos da Taxa de Inspeção Sanitária (TIS), sendo vedada a utilização de critérios não previstos em lei para definição do porte da atividade econômica.","paiId":null,"id":4610},{"tipo":"art","label":"Art. 5º","texto":"Esta Instrução Normativa aplica-se aos lançamentos da Taxa de Inspeção Sanitária (TIS) realizados a partir da data de sua publicação, sem efeito retroativo, conforme disposto no Decreto nº 9.830/2019.","paiId":null,"id":4611},{"tipo":"art","label":"Art. 6º","texto":"Esta Instrução Normativa entra em vigor na data de sua publicação.","paiId":null,"id":4612}],"anexos":[],"preambulo":"Dispõe sobre a aplicação da base de cálculo da Taxa de Inspeção Sanitária (TIS) diante da ausência de metodologia expressa para definição do porte da atividade econômica.","formulaPromulgacao":"A SECRETÁRIA DE GESTÃO TRIBUTÁRIA E FISCAL, no uso de suas atribuições conferidas pela Lei Complementar nº 398, de 12 de dezembro de 2024, que dispõe sobre a Estrutura Administrativa do Poder Executivo Municipal, e considerando: \nI – A ausência de previsão expressa na legislação municipal sobre os critérios para definição do porte das atividades econômicas para fins de enquadramento na tabela do Anexo IX do Código Tributário Municipal (CTM); \nII – A necessidade de garantir segurança jurídica e previsibilidade na aplicação da TIS; \nIII – A utilização da equidade para colmatação de lacuna referente ao critério adotado para definição do valor da TIS; \nIV – O entendimento emanado na Consulta nº 06/2024, ao Setor de Legislação e Consulta Fiscal, da Subsecretaria Tributária, conforme competência constante do Decreto n° 1398/2024, Art. 52, XI, RESOLVE:","dataExtenso":"27 DE FEVEREIRO DE 2025","municipio":"Maricá, Estado do Rio de Janeiro, RJ","assinatura":"Lawrice dos Santos Souza \nSecretária de Gestão Tributária e Fiscal \nMat.113.490"},{"id":22,"tipo":"in","num":"SEGET 003","ano":"2025","ementa":"Regulamenta o cadastramento e atualização de dados cadastrais de possuidores de imóveis.","tributo":"iptu","situacao":"vigente","link":"JOM 1.775, de 29/08/2025","artigos":[{"tipo":"capitulo","label":"CAPÍTULO I","texto":"DAS DISPOSIÇÕES PRELIMINARES","paiId":null,"id":3823},{"tipo":"art","label":"Art. 1º","texto":"Esta Instrução Normativa dispõe sobre o cadastramento e a atualização dos dados cadastrais de possuidores e titulares de domínio útil de imóveis situados no município de Maricá, para fins de definição do sujeito passivo do Imposto sobre a Propriedade Predial e Territorial Urbana (IPTU) e da Taxa de Coleta de Lixo (TCL).","paiId":3823,"id":3824},{"tipo":"art","label":"Art. 2º","texto":"Os procedimentos previstos nesta Instrução Normativa serão realizados por meio de processo administrativo regularmente instaurado, instruído com a documentação exigida, observando-se os princípios da legalidade, da publicidade, da motivação e da verdade material, assegurados o contraditório e a ampla defesa, com os meios e recursos a eles inerentes.","paiId":3823,"id":3825},{"tipo":"capitulo","label":"CAPÍTULO II","texto":"DAS DISPOSIÇÕES GERAIS","paiId":null,"id":3826},{"tipo":"secao","label":"SEÇÃO I","texto":"DOS POSSUIDORES","paiId":3826,"id":3827},{"tipo":"art","label":"Art. 3º","texto":"Nos termos do art. 1.196 do Código Civil Brasileiro, considera-se possuidor todo aquele que tem, de fato, o exercício, pleno ou não, de algum dos poderes inerentes à propriedade.","paiId":3827,"id":3828},{"tipo":"par","label":"§1º","texto":"É justa a posse que não for violenta, clandestina ou precária.","paiId":3828,"id":3829},{"tipo":"par","label":"§2º","texto":"O possuidor com justo título tem, por si, a presunção relativa de boa-fé, salvo prova em contrário, ou quando a lei expressamente não admite esta presunção.","paiId":3828,"id":3830},{"tipo":"art","label":"Art. 4º","texto":"Considera-se detentor aquele que, achando-se em relação de dependência para com outro, conserva a posse em nome deste e em cumprimento de ordens ou instruções suas.","paiId":3827,"id":3831},{"tipo":"par","label":"Parágrafo único","texto":"O exercício da detenção não gera o direito à posse.","paiId":3831,"id":3832},{"tipo":"secao","label":"SEÇÃO II","texto":"DOS COMPOSSUIDORES","paiId":3826,"id":3833},{"tipo":"art","label":"Art. 5º","texto":"Se duas ou mais pessoas possuírem coisa indivisa, poderá cada uma exercer sobre ela atos possessórios, contanto que não excluam os dos outros compossuidores.","paiId":3833,"id":3834},{"tipo":"art","label":"Art. 6º","texto":"Denomina-se composse pro indiviso a situação em que os compossuidores exercem indistintamente e simultaneamente atos possessórios sobre toda a extensão do bem.","paiId":3833,"id":3835},{"tipo":"par","label":"§1º","texto":"Presume-se a existência de composse pro indiviso quando houver dois ou mais compossuidores, salvo prova em contrário.","paiId":3835,"id":3836},{"tipo":"par","label":"§2º","texto":"Na composse pro indiviso, os compossuidores são contribuintes dos tributos devidos em relação à totalidade do imóvel.","paiId":3835,"id":3837},{"tipo":"art","label":"Art. 7º","texto":"Denomina-se composse pro diviso quando cada um dos possuidores sabe a parte na qual pode exercer atos possessórios, sendo a posse exercida em área definida do bem.","paiId":3833,"id":3838},{"tipo":"par","label":"Parágrafo único","texto":"Na composse pro diviso, cada compossuidor será contribuinte dos tributos relativos à área que possui.","paiId":3838,"id":3839},{"tipo":"secao","label":"SEÇÃO III","texto":"DO POSSUIDOR A JUSTO TÍTULO","paiId":3826,"id":3840},{"tipo":"art","label":"Art. 8º","texto":"Possuidor a justo título é a pessoa que, não se revestindo da condição de proprietário, exerce o direito de posse justa fundada em motivo legítimo, que lhe autorize a aquisição derivada da posse, configurada por um ato translativo de domínio, cujo título tenha ou não sido levado a registro imobiliário.","paiId":3840,"id":3841},{"tipo":"par","label":"§1º","texto":"São documentos hábeis a deflagrar a abertura de processo administrativo de cadastramento de possuidor a justo título:","paiId":3841,"id":3842},{"tipo":"inc","label":"I","texto":"escritura pública cujo objeto seja imóvel urbano:","paiId":3842,"id":3843},{"tipo":"ali","label":"a)","texto":"escritura pública de compra e venda, ou de promessa de compra e venda;","paiId":3843,"id":3844},{"tipo":"ali","label":"b)","texto":"escritura pública de doação;","paiId":3843,"id":3845},{"tipo":"ali","label":"c)","texto":"escritura pública de dação em pagamento;","paiId":3843,"id":3846},{"tipo":"ali","label":"d)","texto":"escritura pública de permuta;","paiId":3843,"id":3847},{"tipo":"ali","label":"e)","texto":"escritura pública de divórcio e partilha;","paiId":3843,"id":3848},{"tipo":"ali","label":"f)","texto":"escritura pública de inventário e partilha;","paiId":3843,"id":3849},{"tipo":"ali","label":"g)","texto":"escritura pública de divisão amigável;","paiId":3843,"id":3850},{"tipo":"ali","label":"h)","texto":"escritura pública de cessão de direitos.","paiId":3843,"id":3851},{"tipo":"inc","label":"II","texto":"título judicial:","paiId":3842,"id":3852},{"tipo":"ali","label":"a)","texto":"carta de sentença;","paiId":3852,"id":3853},{"tipo":"ali","label":"b)","texto":"formal de partilha;","paiId":3852,"id":3854},{"tipo":"ali","label":"c)","texto":"carta de adjudicação;","paiId":3852,"id":3855},{"tipo":"ali","label":"d)","texto":"carta de arrematação;","paiId":3852,"id":3856},{"tipo":"ali","label":"e)","texto":"mandados e outros títulos extraídos de autos judiciais.","paiId":3852,"id":3857},{"tipo":"inc","label":"III","texto":"título expedido pelo Poder Público:","paiId":3842,"id":3858},{"tipo":"ali","label":"a)","texto":"título de venda de terras devolutas;","paiId":3858,"id":3859},{"tipo":"ali","label":"b)","texto":"título de legitimação de terras devolutas;","paiId":3858,"id":3860},{"tipo":"ali","label":"c)","texto":"título de concessão de direito real de uso;","paiId":3858,"id":3861},{"tipo":"ali","label":"d)","texto":"título de concessão de direito de uso especial para fins de moradia.","paiId":3858,"id":3862},{"tipo":"inc","label":"IV","texto":"certidão expedida pela Junta Comercial ou pelo Cartório do Registro Civil das Pessoas Jurídicas, relativa ao registro de atos:","paiId":3842,"id":3863},{"tipo":"ali","label":"a)","texto":"constituição de pessoa jurídica, com incorporação do imóvel ao seu patrimônio;","paiId":3863,"id":3864},{"tipo":"ali","label":"b)","texto":"ata de incorporação, fusão, cisão ou transformação;","paiId":3863,"id":3865},{"tipo":"ali","label":"c)","texto":"extinção de pessoa jurídica, redução do capital ou retirada de sócio, com pagamento de haveres em imóvel urbano.","paiId":3863,"id":3866},{"tipo":"inc","label":"V","texto":"certidão de matrícula imobiliária ou certidão de ônus reais em que conste o requerente como titular de posse, domínio útil ou usufruto do imóvel;","paiId":3842,"id":3867},{"tipo":"inc","label":"VI","texto":"instrumento particular de compra e venda ao qual a lei atribua o efeito de escritura pública;","paiId":3842,"id":3868},{"tipo":"inc","label":"VII","texto":"instrumento particular de compra e venda ou de cessão de direitos possessórios sobre o imóvel, desde que subscrito com firma reconhecida pelas partes contratantes e acompanhado da comprovação da cadeia sucessória de alienações, iniciada pelo proprietário do imóvel, constante no RGI;","paiId":3842,"id":3869},{"tipo":"inc","label":"VIII","texto":"outro documento público não elencado nos incisos anteriores, desde que revele, de maneira inequívoca, a posse exercida pelo requerente, mediante manifestação expressa do responsável pelo Cadastro Fiscal.","paiId":3842,"id":3870},{"tipo":"par","label":"§2º","texto":"Para os fins do disposto no inciso VII do §1º deste artigo, admite-se que o instrumento particular não esteja com firma reconhecida das partes contratantes, desde que o requerente apresente, como documentação complementar, pelo menos um dos seguintes documentos, subscrito pelo alienante com firma reconhecida:","paiId":3841,"id":3871},{"tipo":"inc","label":"I","texto":"declaração de quitação do negócio jurídico;","paiId":3871,"id":3872},{"tipo":"inc","label":"II","texto":"autorização expressa para lavratura de escritura pública;","paiId":3871,"id":3873},{"tipo":"inc","label":"III","texto":"autorização expressa para inclusão do requerente como possuidor no cadastro fiscal.","paiId":3871,"id":3874},{"tipo":"par","label":"§3º","texto":"São, ainda, considerados possuidores a justo título os herdeiros do proprietário ou do possuidor a justo título do imóvel, situação comprovada mediante apresentação da certidão de óbito do de cujus e documentos que comprovem a condição de herdeiros legítimos, tais como, mas não exclusivamente:","paiId":3841,"id":3875},{"tipo":"inc","label":"I","texto":"termo de inventariante;","paiId":3875,"id":3876},{"tipo":"inc","label":"II","texto":"testamento.","paiId":3875,"id":3877},{"tipo":"par","label":"§4º","texto":"Podem ser considerados possuidores a justo título os herdeiros do possuidor que, embora não tenha sido formalmente incluído no cadastro como tal, exercia posse mansa e pacífica até a data do óbito, desde que o requerente comprove a condição de herdeiro nos termos do §3º e apresente um dos documentos previstos no §1º.","paiId":3841,"id":3878},{"tipo":"par","label":"§5º","texto":"Fica vedado o cadastramento de posse por simples ocupação, fundado exclusivamente em quaisquer das seguintes hipóteses:","paiId":3841,"id":3879},{"tipo":"inc","label":"I","texto":"contrato particular ou cessão de direitos possessórios, subscrito pelo alienante com firma reconhecida, mas desacompanhado da cadeia sucessória de alienações iniciada pelo proprietário constante no RGI;","paiId":3879,"id":3880},{"tipo":"inc","label":"II","texto":"documento que apenas informe a abertura de processo judicial de usucapião;","paiId":3879,"id":3881},{"tipo":"inc","label":"III","texto":"ata notarial ou escritura declaratória de posse;","paiId":3879,"id":3882},{"tipo":"inc","label":"IV","texto":"apresentação de contas de consumo ou documentos similares que apenas demonstrem o uso ou a habitação do imóvel, ainda que por tempo igual ou superior a 12 (doze) meses consecutivos;","paiId":3879,"id":3883},{"tipo":"inc","label":"V","texto":"declaração unilateral do possuidor, ainda que acompanhada de testemunhas.","paiId":3879,"id":3884},{"tipo":"capitulo","label":"CAPÍTULO III","texto":"DO PROCEDIMENTO ADMINISTRATIVO DE CADASTRAMENTO DO POSSUIDOR","paiId":null,"id":3885},{"tipo":"secao","label":"SEÇÃO I","texto":"DA DOCUMENTAÇÃO DO REQUERENTE","paiId":3885,"id":3886},{"tipo":"art","label":"Art. 9º","texto":"Para fins de identificação do requerente e regular tramitação do processo administrativo, deverão ser apresentados os seguintes documentos:","paiId":3886,"id":3887},{"tipo":"inc","label":"I","texto":"documento oficial de identificação com foto;","paiId":3887,"id":3888},{"tipo":"inc","label":"II","texto":"número de inscrição no Cadastro de Pessoas Físicas (CPF);","paiId":3887,"id":3889},{"tipo":"inc","label":"III","texto":"comprovante de residência atualizado;","paiId":3887,"id":3890},{"tipo":"inc","label":"IV","texto":"indicação do domicílio tributário.","paiId":3887,"id":3891},{"tipo":"par","label":"§1º","texto":"Quando o requerente for pessoa jurídica, deverão ser apresentados os seguintes documentos:","paiId":3887,"id":3892},{"tipo":"inc","label":"I","texto":"cartão do Cadastro Nacional da Pessoa Jurídica (CNPJ);","paiId":3892,"id":3893},{"tipo":"inc","label":"II","texto":"contrato social, estatuto ou ato constitutivo da pessoa jurídica, devidamente registrado;","paiId":3892,"id":3894},{"tipo":"inc","label":"III","texto":"documento comprobatório da representação legal vigente (ata de eleição, termo de posse, contrato social com cláusula de representação ou outro instrumento equivalente);","paiId":3892,"id":3895},{"tipo":"inc","label":"IV","texto":"número de inscrição no CPF e documento oficial de identificação com foto do representante legal;","paiId":3892,"id":3896},{"tipo":"inc","label":"V","texto":"comprovante de endereço da sede da pessoa jurídica atualizado.","paiId":3892,"id":3897},{"tipo":"par","label":"§2º","texto":"A autoridade competente poderá determinar a juntada de documentos adicionais, a oitiva de testemunhas, a realização de diligências ou vistorias in loco, bem como quaisquer outras medidas que entender necessárias à apuração dos fatos.","paiId":3887,"id":3898},{"tipo":"secao","label":"SEÇÃO II","texto":"DA INCLUSÃO NO CADASTRO FISCAL IMOBILIÁRIO","paiId":3885,"id":3899},{"tipo":"art","label":"Art. 10.","texto":"O cadastramento do requerente como possuidor somente terá início após sua habilitação, mediante a apresentação da documentação exigida nos arts. 8º e 9º e demais requisitos previstos nesta Instrução Normativa.","paiId":3899,"id":3900},{"tipo":"art","label":"Art. 11.","texto":"Habilitado o requerente, o setor competente pela análise do processo administrativo deverá dar ciência formal do pedido ao proprietário ou possuidor anteriormente cadastrado no Cadastro Fiscal Imobiliário, por meio de comunicação realizada através dos meios de contato registrados no cadastro municipal (CGM), concedendo o prazo de 20 (vinte) dias, contados do recebimento da notificação, para manifestação fundamentada sobre o pleito.","paiId":3899,"id":3901},{"tipo":"par","label":"§1º","texto":"A ausência de manifestação no prazo previsto no caput será interpretada como concordância tácita, salvo nos casos em que houver elementos que indiquem dúvida quanto à posse mansa e pacífica.","paiId":3901,"id":3902},{"tipo":"par","label":"§2º","texto":"A inclusão do possuidor não excluirá do Cadastro Fiscal Imobiliário o proprietário.","paiId":3901,"id":3903},{"tipo":"par","label":"§3º","texto":"A constatação de falsidade ou inexatidão das informações prestadas sujeitará o infrator à penalidade prevista no inciso II do art. 24 da Lei Complementar nº 005, de 30 de janeiro de 1991 (Código Tributário Municipal), sem prejuízo das demais sanções administrativas, civis e penais cabíveis.","paiId":3901,"id":3904},{"tipo":"capitulo","label":"CAPÍTULO IV","texto":"DAS ALTERAÇÕES E CONTROVÉRSIAS CADASTRAIS","paiId":null,"id":3905},{"tipo":"secao","label":"SEÇÃO I","texto":"DA REVISÃO DO CADASTRO","paiId":3905,"id":3906},{"tipo":"art","label":"Art. 12.","texto":"A Administração poderá rever, de ofício, o cadastro de possuidor, sempre que situações supervenientes ensejarem sua reavaliação, inclusive para eventual remoção do registro, nos seguintes casos:","paiId":3906,"id":3907},{"tipo":"inc","label":"I","texto":"quando houver registro mais atual na certidão do Registro Geral de Imóveis (RGI), que aponte titular diverso;","paiId":3907,"id":3908},{"tipo":"inc","label":"II","texto":"quando apresentados documentos pelos proprietários ou herdeiros legítimos que, após análise do setor competente, comprovem oposição ao cadastramento e não deixem dúvida quanto à titularidade;","paiId":3907,"id":3909},{"tipo":"inc","label":"III","texto":"quando caracterizada disputa entre possuidores, momento em que caberá ao setor responsável considerar, preferencialmente, a titularidade reconhecida por título judicial ou título expedido pelo Poder Público.","paiId":3907,"id":3910},{"tipo":"par","label":"§1º","texto":"Nos casos em que a disputa envolver documentos distintos não previstos no inciso III do caput deste artigo, os possuidores poderão ser cadastrados de forma solidária, desde que apresentem documentação mínima, na forma do art. 8º desta Instrução Normativa, que demonstre o vínculo legítimo com o imóvel.","paiId":3907,"id":3911},{"tipo":"par","label":"§2º","texto":"Deverá ser promovida a comunicação com o proprietário ou possuidor anteriormente cadastrado, na forma do art. 11, com o devido registro processual.","paiId":3907,"id":3912},{"tipo":"par","label":"§3º","texto":"A revisão de ofício prevista neste artigo poderá alcançar processos administrativos de cadastramento já encerrados ou em curso na data da publicação desta Instrução Normativa, inclusive com a possibilidade de solicitação de complementação documental, quando constatada a ausência dos requisitos estabelecidos nesta norma.","paiId":3907,"id":3913},{"tipo":"art","label":"Art. 13.","texto":"Esta Instrução Normativa entra em vigor na data de sua publicação.","paiId":3906,"id":3914}],"anexos":[],"preambulo":"Regulamenta o procedimento de cadastramento e atualização de dados cadastrais de possuidores e de titulares de domínio útil de imóveis situados no Município de Maricá.","formulaPromulgacao":"A SECRETÁRIA DE GESTÃO TRIBUTÁRIA E FISCAL, no uso da competência que lhe foi conferida pelo inciso II do art. 19 da Lei Complementar nº 398, de 12 de dezembro de 2024, que dispõe sobre a Estrutura Administrativa do Poder Executivo Municipal, RESOLVE:","dataExtenso":"27 DE AGOSTO DE 2025","assinatura":"Lawrice dos Santos Souza \nSecretária de Gestão Tributária e Fiscal \nMat. 113.490"},{"id":23,"tipo":"in","num":"SEPOF 001","ano":"2022","ementa":"Uniformiza o entendimento da fiscalização quanto ao fato gerador da taxa de execução de obras.","tributo":"taxas","situacao":"vigente","link":"JOM 1.321, de 15/06/2022","artigos":[{"tipo":"art","label":"Art. 1º","texto":"As obras de construção civil, mesmo as enquadradas no item 21 do Anexo V do Código Tributário de Maricá, quando compostas de várias etapas, unidades ou estruturas, ainda que essas possuam projetos próprios individualizados, sofrerão incidência da taxa de execução de obras em função do projeto global, vedados os lançamentos em função de cada subprojeto.","paiId":null,"id":3916}],"anexos":[],"preambulo":"Dispõe sobre a uniformização do entendimento da Fiscalização de Tributos quanto ao fato gerador da taxa de execução de obras.","formulaPromulgacao":"O SECRETÁRIO MUNICIPAL DE ORÇAMENTO, PLANEJAMENTO E FAZENDA, no uso de suas atribuições, e em acordo com o disposto nos autos do processo administrativo 6076/2022, com vistas a uniformizar e pacificar entendimento da Fiscalização de Tributos quanto ao fato gerador da taxa de execução de obras prevista no art. 135 da Lei Complementar nº 005/1991 (Código Tributário Municipal), declara:","municipio":"Maricá, Estado do Rio de Janeiro, RJ","assinatura":"LEONARDO DE OLIVEIRA ALVES\nSecretário Municipal de Orçamento, Planejamento e Fazenda\nMat. 106.014"},{"id":24,"tipo":"in","num":"SUBFAZ-SEPOF 001","ano":"2022","ementa":"Regulamenta critérios para cobrança, controle e baixa da dívida administrativa e inscrição na Dívida Ativa.","tributo":"geral","situacao":"vigente","link":"JOM 1.392, de 14/12/2022","artigos":[{"tipo":"capitulo","label":"CAPÍTULO I","texto":"DA FINALIDADE E ABRANGÊNCIA","paiId":null,"id":4020},{"tipo":"art","label":"Art. 1º","texto":"Esta Instrução Normativa tem por finalidade instituir a normatização dos critérios adotados nos atos e procedimentos administrativos para a cobrança, controle e baixa da  dívida administrativa tributária e não tributária do município, assim como sua inscrição em Dívida Ativa.","paiId":4020,"id":4021},{"tipo":"par","label":"Parágrafo único","texto":"Os atos e procedimentos descritos no caput abrangem os órgãos da administração direta e indireta do Município de Maricá, exclusive as empresas públicas e sociedades de economia mista.","paiId":4021,"id":4022},{"tipo":"capitulo","label":"CAPÍTULO II","texto":"DA BASE LEGAL","paiId":null,"id":4023},{"tipo":"art","label":"Art. 2º","texto":"Os fundamentos jurídicos são respaldados nos seguintes dispositivos:","paiId":4023,"id":4024},{"tipo":"inc","label":"I","texto":"Constituição Federal;","paiId":4024,"id":4025},{"tipo":"inc","label":"II","texto":"Lei Complementar Federal nº 101/2000;","paiId":4024,"id":4026},{"tipo":"inc","label":"III","texto":"Lei Federal nº 5.172/1966 - Código Tributário Nacional;","paiId":4024,"id":4027},{"tipo":"inc","label":"IV","texto":"Lei Federal nº 4.320/1964;","paiId":4024,"id":4028},{"tipo":"inc","label":"V","texto":"Lei Federal nº 6.830/1990;","paiId":4024,"id":4029},{"tipo":"inc","label":"VI","texto":"Lei Municipal 910/1990 - Código Tributário Municipal e suas alterações;","paiId":4024,"id":4030},{"tipo":"capitulo","label":"CAPÍTULO III","texto":"DOS CONCEITOS","paiId":null,"id":4031},{"tipo":"art","label":"Art. 3º","texto":"Para os fins desta Instrução Normativa considera-se:","paiId":4031,"id":4032},{"tipo":"inc","label":"I","texto":"Dívida Administrativa: Crédito de natureza tributária ou não tributária inadimplido, depois de esgotado o prazo fixado para pagamento.","paiId":4032,"id":4033},{"tipo":"inc","label":"II","texto":"Dívida Tributária: Crédito proveniente obrigação legal relativa a impostos, taxas, contribuições, multas decorrentes de infrações à legislação tributária e respectivos adicionais inadimplido depois de esgotado o prazo para pagamento fixado pela legislação tributária ou por decisão final proferida em processo regular, bem como os valores correspondentes à respectiva atualização monetária, à multa e juros de mora.","paiId":4032,"id":4034},{"tipo":"inc","label":"III","texto":"Dívida não Tributária: Demais créditos da Fazenda Pública, tais como os provenientes multas de qualquer origem ou natureza, exceto as tributárias, aluguéis ou taxas de ocupação, preços públicos, indenizações, reposições, restituições, alcances dos responsáveis definitivamente julgados, bem como os créditos decorrentes de obrigações em moeda estrangeira, de sub-rogação de hipoteca, fiança, aval ou outra garantia, de contratos em geral, de imputações do TCE-RJ ou de outras obrigações legais, inadimplido depois de esgotado o prazo fixado para pagamento.","paiId":4032,"id":4035},{"tipo":"inc","label":"IV","texto":"Dívida Ativa: Abrange os créditos mencionados nos incisos II e III, bem como os valores correspondentes à respectiva atualização monetária, à multa e juros de mora, inscritos, na forma da legislação, em registro próprio, após apurada sua liquidez e certeza.","paiId":4032,"id":4036},{"tipo":"par","label":"§1º","texto":"O valor do crédito em moeda estrangeira será convertido ao correspondente valor na moeda nacional à taxa cambial oficial, para compra, na data da notificação do devedor pela autoridade administrativa, ou, à sua falta, na data da inscrição da Dívida Ativa. § 2º Para Dívida não Tributária incidirá atualização monetária e os juros de mora, a partir do vencimento ou da conversão de que trata o § 1º, de acordo com preceitos legais pertinentes aos débitos tributários, se de outra forma não dispuser o contrato ou a legislação específica.","paiId":4032,"id":4037},{"tipo":"capitulo","label":"CAPÍTULO VI","texto":"DAS RESPONSABILIDADES","paiId":null,"id":4038},{"tipo":"art","label":"Art. 4º","texto":"A responsabilidade sobre a Dívida Ativa do Município, é comum e concorrente entre a Procuradoria Geral do Município e a Secretaria Municipal de Planejamento, Orçamento e Fazenda.","paiId":4038,"id":4039},{"tipo":"par","label":"Parágrafo único","texto":"A cobrança da Dívida Administrativa é de responsabilidade da Secretaria de Planejamento, Orçamento e Gestão.","paiId":4039,"id":4040},{"tipo":"art","label":"Art. 5º","texto":"Os órgãos da administração direta, autárquica e fundacional de direito público do Município deverão encaminhar os créditos com eles inadimplidos ao Setor de Cobrança e Dívida Ativa para o devido tratamento.","paiId":4038,"id":4041},{"tipo":"art","label":"Art. 6º","texto":"São responsabilidades do Setor de Cobrança e Dívida Ativa, dentre outras:","paiId":4038,"id":4042},{"tipo":"inc","label":"I","texto":"análisar as petições, autorizar e controlar os acordos de parcelamentos das dívidas vencidas não inscritas como dívida ativa;","paiId":4042,"id":4043},{"tipo":"inc","label":"II","texto":"criar estratégias, coordenar a cobrança, definindo sua periodicidade, e elaborar propostas administrativas amigáveis relacionadas à dívida;","paiId":4042,"id":4044},{"tipo":"inc","label":"III","texto":"cobrar, por meio eletrônico ou físico, a dívida administrativa e os termos de parcelamento de dívida;","paiId":4042,"id":4045},{"tipo":"inc","label":"IV","texto":"cancelar os termos de parcelamento inadimplidos e cobrar os créditos remanescentes;","paiId":4042,"id":4046},{"tipo":"inc","label":"V","texto":"resolver sobre as solicitações de reconhecimento de prescrição de créditos inadimplidos;","paiId":4042,"id":4047},{"tipo":"inc","label":"VI","texto":"arrolar os créditos tributários inadimplidos, que por decurso de prazo prescricional, deverão ser cancelados de ofício;","paiId":4042,"id":4048},{"tipo":"inc","label":"VII","texto":"levantar junto ao sistema de tributos os valores vencidos e providenciar sua inscrição nos Livros de Dívida;","paiId":4042,"id":4049},{"tipo":"inc","label":"VIII","texto":"emitir, reemitir e assinar as Certidões da Dívida Ativa (CDA´s), assim como seu cancelamento;","paiId":4042,"id":4050},{"tipo":"inc","label":"IX","texto":"comunicar à Procuradoria Geral do Município, nos autos do processo administrativo, o cancelamento, o abatimento ou a majoração de Dívida Ativa ajuizada ou não ajuizada;","paiId":4042,"id":4051},{"tipo":"inc","label":"X","texto":"confeccionar e conferir os relatórios financeiros quanto ao estoque da Dívida Ativa, de acordo com o tipo de cadastro (mercantil, imobiliário ou geral), por atividade, maiores devedores e/ou outros parâmetros, com indicadores de contagem de valores a prescrever;","paiId":4042,"id":4052},{"tipo":"inc","label":"XI","texto":"monitorar e conferir os relatórios de cancelamento e baixa da Dívida Ativa;","paiId":4042,"id":4053},{"tipo":"inc","label":"XII","texto":"emitir relatórios que permitam acompanhar a evolução dos valores inscritos, evidenciando de forma clara a posição da Dívida Ativa a qualquer momento;","paiId":4042,"id":4054},{"tipo":"inc","label":"XIII","texto":"auxiliar a Procuradoria do Município reclassificar, com razoável certeza, o montante de créditos inscritos em dívida ativa com expectativa de recebimento no período do curto prazo (até 12 meses da data do demostrativo) – Ativo Circulante;","paiId":4042,"id":4055},{"tipo":"inc","label":"XIV","texto":"acompanhar a consistência dos registros relativos à baixas, anistias, remissões, abatimentos, cancelamentos, etc. e a integração dessas informações nos registros contábeis;","paiId":4042,"id":4056},{"tipo":"inc","label":"XV","texto":"mensurar a apropriação de atualização monetária, juros, multas e outros encargos dos créditos inscritos;","paiId":4042,"id":4057},{"tipo":"inc","label":"XVI","texto":"auxiliar a Procuradoria do Município a mensurar o ajuste para perdas, que deve basear-se em estudos especializados que delineiem e qualifiquem os créditos inscritos, de modo a não superestimar e nem subavaliar o patrimônio real do Município.","paiId":4042,"id":4058},{"tipo":"par","label":"Parágrafo único","texto":"As responsabilidades apontadas nos incisos deste artigo não excluem a possibilidade de que o Setor informe aos contribuintes a iminência do vencimento de tributos ainda não vencidos.","paiId":4042,"id":4059},{"tipo":"capitulo","label":"CAPÍTULO V","texto":"DOS PROCEDIMENTOS","paiId":null,"id":4060},{"tipo":"secao","label":"Seção I","texto":"Da Cobrança da Dívida Administrativa","paiId":4060,"id":4061},{"tipo":"art","label":"Art. 7º","texto":"O crédito que, encerrado o prazo para pagamento não tenha seu recolhimento efetuado, será considerado Dívida Administrativa.","paiId":4061,"id":4062},{"tipo":"art","label":"Art. 8º","texto":"A Dívida Administrativa será objeto de cobrança amigável procedida por:","paiId":4061,"id":4063},{"tipo":"inc","label":"I","texto":"e-mail ou outra forma de comunicação eletrônica;","paiId":4063,"id":4064},{"tipo":"inc","label":"II","texto":"carta simples, quando inviável a comunicação na forma do inciso I;","paiId":4063,"id":4065},{"tipo":"inc","label":"III","texto":"comunicação pelo Simples Nacional;","paiId":4063,"id":4066},{"tipo":"inc","label":"IV","texto":"carta com aviso de recebimento.","paiId":4063,"id":4067},{"tipo":"par","label":"Parágrafo único","texto":"Cabe ao contribuinte manter atualizado seu cadastro junto à Prefeitura Municipal de Maricá.","paiId":4063,"id":4068},{"tipo":"art","label":"Art. 9º","texto":"No caso de créditos em Dívida Administrativa, o contribuinte poderá ser notificado ou manifestar-se espontâneamente ao Portal ou ao Atendimento das unidades do SIM ou ainda ao Setor de Arrecadação e Cobrança para consulta, pagamento à vista ou parcelamento do débito.","paiId":4061,"id":4069},{"tipo":"par","label":"§1º","texto":"O contribuinte poderá emitir seu Documento de Arrecadação da Receita Municipal (DARM) pelo site da Prefeitura de Maricá (www. marica.rj.gov.br) somente quando não estiver vencido.","paiId":4069,"id":4070},{"tipo":"par","label":"§2º","texto":"Caso o contribuinte opte pelo pagamento parcelado, será simulada a proposta de acordo mediante as condições estipuladas na legislação municipal.","paiId":4069,"id":4071},{"tipo":"par","label":"§3º","texto":"O parcelamento será consolidado mediante assinatura do Termo de Parcelamento e Confissão de Dívida juntando-se documentação hábil, se for o caso, e pagamento da 1º parcela à vista.","paiId":4069,"id":4072},{"tipo":"par","label":"§4º","texto":"O parcelamento será rescindido de ofício na hipótese de insolvência de três parcelas consecutivas ou não, ou de qualquer parcela por mais de noventa dias, independente de prévia notificação ao contribuinte. § 5º O Setor de Arrecadação e Cobrança deverá monitorar os relatórios de parcelamentos para verificação de eventuais estornos ou para dar sequência à cobrança da dívida.","paiId":4069,"id":4073},{"tipo":"art","label":"Art. 10.","texto":"Todos os parcelamentos deverão ser peticionados em processo  administrativo tributário.","paiId":4061,"id":4074},{"tipo":"par","label":"§1º","texto":"A mera petição do devedor ou responsável legal não gera direito antes de seu deferimento, e não garante a concessão de eventuais benefícios  legais, e ainda, não se configura transação ou novação de dívida.","paiId":4074,"id":4075},{"tipo":"par","label":"§2º","texto":"O parcelamento reconhece a exatidão da certeza do crédito a ser parcelado e concordância quanto à novação do débito, assumindo a obrigação principal e acessória e todos os demais consectários legais aplicados.","paiId":4074,"id":4076},{"tipo":"secao","label":"Seção II","texto":"Da Inscrição da Dívida Ativa","paiId":4060,"id":4077},{"tipo":"art","label":"Art. 11.","texto":"Encerrado o prazo para pagamento e depois da cobrança administrativa de que trata o artigo 8º, permanecendo a inadimplência, será apurada a certeza e liquidez do crédito e realizada a sua inscrição em Dívida Ativa.","paiId":4077,"id":4078},{"tipo":"par","label":"Parágrafo único","texto":"Os créditos referentes à imputação pelo TCE-RJ, poderão sofrer rito diferenciado, conforme determinação daquele Tribunal de Contas.","paiId":4078,"id":4079},{"tipo":"art","label":"Art. 12.","texto":"Como regra geral, os contribuintes serão notificados da inscrição em Dívida Ativa da seguinte forma:","paiId":4077,"id":4080},{"tipo":"inc","label":"I","texto":"por e-mail ou outra forma de comunicação eletrônica, inclusive Simples Nacional;","paiId":4080,"id":4081},{"tipo":"inc","label":"II","texto":"por correspondência com aviso de recebimento - AR;","paiId":4080,"id":4082},{"tipo":"inc","label":"III","texto":"por edital publicado no Jornal Oficial do Município; IV -  livros publicados no Portal da Transparência do Município.","paiId":4080,"id":4083},{"tipo":"par","label":"Parágrafo único","texto":"O retorno da correspondência citada no inciso II sem que o contribuinte tenha dela tomado ciência não sustará a inscrição, haja vista as demais formas de comunicação previstas.","paiId":4080,"id":4084},{"tipo":"art","label":"Art. 13.","texto":"Os Livros Registro de Inscrição em Dívida Ativa tributária serão segregados em:","paiId":4077,"id":4085},{"tipo":"inc","label":"I","texto":"Livro Registro de Inscrição do IPTU;","paiId":4085,"id":4086},{"tipo":"inc","label":"II","texto":"Livro Registro de Inscrição do ISSQN;","paiId":4085,"id":4087},{"tipo":"inc","label":"III","texto":"Livro Registro de Inscrição do ISS-Obras;","paiId":4085,"id":4088},{"tipo":"inc","label":"IV","texto":"Livro Registro de Inscrição do ITBI;","paiId":4085,"id":4089},{"tipo":"inc","label":"V","texto":"Livro Registro de Inscrição de Taxas pelo Poder de Polícia;","paiId":4085,"id":4090},{"tipo":"inc","label":"VI","texto":"Livro Registro de Inscrição de Taxas pela Prestação de Serviços;","paiId":4085,"id":4091},{"tipo":"inc","label":"VII","texto":"Livro Registro de Inscrição de Outros Tributos.","paiId":4085,"id":4092},{"tipo":"art","label":"Art. 14.","texto":"Os Livros Registro de Inscrição em Dívida Ativa não tributária serão segregados em:","paiId":4077,"id":4093},{"tipo":"inc","label":"I","texto":"Livro Registro de Inscrição de Multas Não Tributárias;","paiId":4093,"id":4094},{"tipo":"inc","label":"II","texto":"Livro Registro de Inscrição de Preços, Tarifas e Taxas;","paiId":4093,"id":4095},{"tipo":"inc","label":"III","texto":"Livro Registro de Inscrição de Autos de Infração Não Tributários;","paiId":4093,"id":4096},{"tipo":"inc","label":"IV","texto":"Livro Registro de Inscrição Licenças;","paiId":4093,"id":4097},{"tipo":"inc","label":"V","texto":"Livro Registro de Inscrição de Outras Dívidas Não Tributárias.","paiId":4093,"id":4098},{"tipo":"art","label":"Art. 15.","texto":"Os Livros se manterão atualizados e disponíveis no Portal da Transparência do Município.","paiId":4077,"id":4099},{"tipo":"art","label":"Art. 16.","texto":"Após a inscrição do crédito em Dívida Ativa será emitida a Certidão de Dívida Ativa (CDA) referente e encaminada à Procuradoria Geral do Município.","paiId":4077,"id":4100},{"tipo":"art","label":"Art. 17.","texto":"No caso de créditos vencidos inscritos em Dívida Ativa, poderá o contribuinte ser notificado ou apresentar-se espontâneamente ao Atendimento das unidades do SIM ou da Procuradoria Geral do Município para consultar os valores pendentes, para pagamento à vista, para optar por parcelamento ou aderir a Plano de Recuperação Fiscal (REFIS) se houver lei específica em vigor.","paiId":4077,"id":4101},{"tipo":"par","label":"§1º","texto":"A Procuradoria Geral do Município deverá monitorar os relatórios de parcelamentos para verificação de eventuais estornos ou para dar sequência à cobrança da Dívida Ativa.","paiId":4101,"id":4102},{"tipo":"par","label":"§2º","texto":"Aplicam-se ao parcelamento de Dívida Ativa no que couberem as regras do parcelamento da Dívida Administrativa.","paiId":4101,"id":4103},{"tipo":"secao","label":"Seção III","texto":"Da Cobrança Extrajudicial da Dívida Ativa","paiId":4060,"id":4104},{"tipo":"art","label":"Art. 18.","texto":"As CDA, título executivo extrajudicial, emitidas poderão, após encaminhadas à Procuradoria Geral do Município para ajuizamento, ser também encaminhadas para protesto junto ao Cartório do 1° Ofício de Maricá/RJ.","paiId":4104,"id":4105},{"tipo":"art","label":"Art. 19.","texto":"Compete à Procuradoria Geral do Município a coordenação geral do protesto das CDA.","paiId":4104,"id":4106},{"tipo":"par","label":"Parágrafo único","texto":"A SEPOF realizará o acompanhamento dos créditos da Dívida Ativa protestada.","paiId":4106,"id":4107},{"tipo":"capitulo","label":"CAPÍTULO VI","texto":"DA PRESCRIÇÃO DOS CRÉDITOS","paiId":null,"id":4108},{"tipo":"art","label":"Art. 286.","texto":"Serão cancelados de ofício, mediante despacho do Prefeito, os débitos fiscais:","paiId":4108,"id":4109},{"tipo":"inc","label":"I","texto":"legalmente prescritos;","paiId":4109,"id":4110},{"tipo":"inc","label":"II","texto":"cujo valor atualizado, incluídas as penalidades, sejam inferiores a 10% (dez por cento) da Unidade Fiscal de Maricá (UFIMA). Lei 2052/2003","paiId":4109,"id":4111},{"tipo":"art","label":"Art. 5º","texto":"Fica estabelecido como limite mínimo para o ajuizamento de executivos fiscais, o valor histórico da ação em 1/2 (meio) salário mínimo.","paiId":4108,"id":4112},{"tipo":"art","label":"Art. 20.","texto":"O reconhecimento da prescrição de crédito tributário no âmbito administrativo dar-se-á de acordo com os procedimentos previstos neste artigo.","paiId":4108,"id":4113},{"tipo":"inc","label":"I","texto":"o processo será recebido pelo Setor de Cobrança e Dívida Ativa que verificará se, decorrido o prazo prescricional de crédito tributário ou não tributário não inscrito em Dívida Ativa, poderá ser realizado o reconhecimento da extinção do crédito;","paiId":4113,"id":4114},{"tipo":"inc","label":"II","texto":"é prerrogativa do Setor de Cobrança e Dívida Ativa realizar as buscas necessárias para verificar se houve algum elemento que suspendeu ou interrompeu a prescrição, e qualquer revisão na CDA se for o caso;","paiId":4113,"id":4115},{"tipo":"inc","label":"III","texto":"em todos os casos, os processos serão instruídos com parecer do Fiscal de Tributos sobre a matéria de direito e a possibilidade da extinção definitiva do crédito tributário ou não tributário;","paiId":4113,"id":4116},{"tipo":"inc","label":"IV","texto":"ao final serão tramitados ao Setor de Receita Municipal para procedimentos no sistema referentes ao cancelamento junto à conta corrente do contribuinte.","paiId":4113,"id":4117},{"tipo":"art","label":"Art. 21.","texto":"O reconhecimento da prescrição de crédito tributário ou não tributário inscrito em Dívida Ativa caberá à Procuradoria Geral do Município.","paiId":4108,"id":4118},{"tipo":"par","label":"§1º","texto":"A Procuradoria, caso entenda pela prescrição parcial, tramitará os autos ao Setor de Cobrança e Dívida Ativa para procedimentos referentes à revisão na CDA, com parecer fundamentado.","paiId":4118,"id":4119},{"tipo":"par","label":"§2º","texto":"A Procuradoria, caso entenda pela prescrição, tramitará os autos ao Setor de Receita Municipal, com parecer fundamentado, para procedimentos referentes ao cancelamento junto à conta corrente do contribuinte.","paiId":4118,"id":4120},{"tipo":"capitulo","label":"CAPÍTULO VII","texto":"DAS CONSIDERAÇÕES FINAIS","paiId":null,"id":4121},{"tipo":"art","label":"Art. 22.","texto":"Outras recomendações e responsabilidade não mencionadas nesta instrução deverão ser observadas subsidiariamente na legislação que rege o Processo Administrativo Tributário do Município de Maricá.","paiId":4121,"id":4122},{"tipo":"art","label":"Art. 23.","texto":"Esta instrução deverá ser atualizada sempre que fatores legais, técnicos ou organizacionais assim o exigirem, visando verificar a sua adequação aos novos requisitos bem como manter o processo de aprimoramento e modernização.","paiId":4121,"id":4123},{"tipo":"art","label":"Art. 24.","texto":"Esta instrução normativa entra em vigor a partir da data de sua publicação","paiId":4121,"id":4124}],"anexos":[],"preambulo":"Regulamenta os critérios adotados nos atos e procedimentos administrativos para a cobrança, controle e baixa da dívida administrativa e inscrição na Dívida Ativa do Município de Maricá.","formulaPromulgacao":"O SUBSECRETÁRIO DE FAZENDA, no uso de suas atribuições conferidas pelo Capítulo VII do Anexo I, do Decreto nº 884, de 17 de agosto de 2022, que aprova o Regimento Interno e consolida a estrutura organizacional da Secretaria de Planejamento, Orçamento e Fazenda – Sepof, e dá outras providências, resolve:","dataExtenso":"05 DE DEZEMBRO DE 2022","municipio":"Maricá, Estado do Rio de Janeiro, RJ","assinatura":"Cesar Augusto Barbiero \nSubsecretário de Fazenda \nSecretaria de Planejamento Orçamento e Fazenda de Maricá"},{"id":25,"tipo":"ot","num":"SUBFAZ-SEPOF 01","ano":"2024","ementa":"Estabelece orientação sobre arbitramento da base de cálculo do ISS na construção civil — art. 31 da LC 389/2023.","tributo":"issqn","situacao":"vigente","link":"JOM 1.609, de 01/07/2024","artigos":[],"anexos":[]},{"id":26,"tipo":"ot","num":"SUBFAZ-SEPOF 001","ano":"2022","ementa":"Dispõe sobre laudo técnico para fins de impugnação da base de cálculo do ITBI.","tributo":"itbi","situacao":"vigente","link":"JOM 1.392, de 14/12/2022","artigos":[],"anexos":[]},{"id":27,"tipo":"res","num":"SEPOF 004","ano":"2023","ementa":"Dispõe sobre novo modelo de DES-IF — Declaração Eletrônica de Serviços de Instituições Financeiras.","tributo":"issqn","situacao":"vigente","link":"JOM 1.534, de 13/12/2023","artigos":[],"anexos":[]},{"id":28,"tipo":"res","num":"SEPOF 003","ano":"2022","ementa":"Dispõe sobre simplificação de procedimentos e dispensa de alvará para MEI.","tributo":"geral","situacao":"vigente","link":"JOM 1.360, de 21/09/2022","artigos":[],"anexos":[]},{"id":29,"tipo":"port","num":"SEGET 016","ano":"2026","ementa":"Estabelece procedimentos para declaração administrativa de prescrição de créditos tributários.","tributo":"geral","situacao":"vigente","link":"DOM 020, de 07/04/2026","artigos":[],"anexos":[]},{"id":30,"tipo":"port","num":"SEGET 002","ano":"2026","ementa":"Prorroga vencimento do ISSQN variável — competência dezembro/2025 — CATRIMA 2025.","tributo":"issqn","situacao":"vigente","link":"JOM 1.833, de 23/01/2026","artigos":[],"anexos":[]},{"id":31,"tipo":"port","num":"Conjunta 001","ano":"2026","ementa":"Prorroga vencimento de parcelas de parcelamentos tributários e não tributários de janeiro/2026.","tributo":"geral","situacao":"vigente","link":"JOM 1.833, de 23/01/2026","artigos":[],"anexos":[]},{"id":32,"tipo":"port","num":"GAB. PREF. 344","ano":"2025","ementa":"Autoriza o cancelamento de débitos fiscais prescritos e de pequeno valor no Município de Maricá.","tributo":"geral","situacao":"vigente","link":"JOM 1.696, de 05/02/2025","artigos":[],"anexos":[]},{"id":33,"tipo":"lc","num":"362","ano":"2022","ementa":"Institui o Programa de Incentivo à Regularização Fiscal com a Fazenda Pública (REFIS).","tributo":"geral","situacao":"vigente","link":"JOM 1.321, de 15/06/2022","artigos":[],"anexos":[]},{"id":34,"tipo":"lc","num":"332","ano":"2020","ementa":"Altera a Lei Complementar nº 112/2003 no que tange ao ISSQN — LC Federal nº 175/2020.","tributo":"issqn","situacao":"revogada","link":"JOM 1.113, de 23/12/2020","artigos":[],"anexos":[]},{"id":35,"tipo":"lei","num":"3.404","ano":"2023","ementa":"Institui normas para convênios e composição de litígio por mediação, conciliação, arbitragem e cobrança extrajudicial.","tributo":"geral","situacao":"vigente","link":"JOM 1.521, de 08/11/2023","artigos":[{"tipo":"capitulo","label":"CAPÍTULO I","texto":"DAS DISPOSIÇÕES GERAIS","paiId":null,"id":3827},{"tipo":"art","label":"Art. 1º","texto":"Esta lei institui a Política de Desjudicialização no âmbito da Administração Pública Municipal Direta e Indireta através da utilização de parcerias e convênios com câmaras de mediação e arbitragem, com os seguintes objetivos:","paiId":3827,"id":3828},{"tipo":"inc","label":"I","texto":"reduzir a litigiosidade;","paiId":3828,"id":3829},{"tipo":"inc","label":"II","texto":"estimular a solução adequada de controvérsias para áreas cíveis, tributárias, ambientais, trabalhistas, fundiárias e de matérias contratuais, assim como cobrança extrajudicial de créditos tributários ou não tributários, desapropriação, devendo a Administração Pública instituir clausula compromissória em todos seus contratos e sua previsão nos editais.","paiId":3828,"id":3830},{"tipo":"inc","label":"III","texto":"promover, sempre que possível, a solução consensual dos conflitos;","paiId":3828,"id":3831},{"tipo":"inc","label":"IV","texto":"aprimorar o gerenciamento do volume de demandas administrativas e judiciais.","paiId":3828,"id":3832},{"tipo":"par","label":"Parágrafo único","texto":"A política de que trata esta lei visa atender às disposições das leis federais nº 13.105/15 e 13.140/15, bem como das leis que vierem a substituí-las.","paiId":3828,"id":3833},{"tipo":"art","label":"Art. 2º","texto":"A Política de Desjudicialização será coordenada pela Procuradoria Geral do Município de Maricá quanto à dívida ativa, pelo Gabinete do Prefeito quanto créditos ou litígios administrativos e não inscritos na dívida ativa de Maricá, na administração indireta pelos seus gestores, cabendo-lhe, dentre outras ações:","paiId":3827,"id":3834},{"tipo":"inc","label":"I","texto":"dirimir, por meios autocompositivos, os conflitos entre órgãos e entidades da Administração Pública Municipal Direta e Indireta;","paiId":3834,"id":3835},{"tipo":"inc","label":"II","texto":"avaliar a admissibilidade de pedidos de resolução de conflitos, por meio de composição, no caso de controvérsia entre o particular e a Administração Pública Municipal Direta e Indireta;","paiId":3834,"id":3836},{"tipo":"inc","label":"III","texto":"requisitar, aos órgãos e entidades da Administração Pública Municipal, informações para subsidiar sua atuação;","paiId":3834,"id":3837},{"tipo":"inc","label":"IV","texto":"promover o arbitramento das controvérsias não solucionadas por meios autocompositivos, na hipótese do inciso I;","paiId":3834,"id":3838},{"tipo":"inc","label":"V","texto":"fomentar a solução adequada de conflitos, no âmbito de seus órgãos de execução;","paiId":3834,"id":3839},{"tipo":"inc","label":"VI","texto":"propor, em regulamento, a organização e a uniformização dos procedimentos e parâmetros para a celebração de acordos envolvendo a Administração Direta, bem como as autarquias e fundações representadas judicialmente pela Procuradoria Geral do Município de Maricá, nos termos desta lei;","paiId":3834,"id":3840},{"tipo":"inc","label":"VII","texto":"disseminar a prática da negociação, podendo se conveniar à 38ª Subseção da OAB/Maricá para auxiliar na prática e disseminação da mediação e arbitragem entre os advogados.","paiId":3834,"id":3841},{"tipo":"inc","label":"VIII","texto":"coordenar as negociações realizadas por seus órgãos de execução;","paiId":3834,"id":3842},{"tipo":"inc","label":"IX","texto":"identificar e fomentar práticas que auxiliem na prevenção da litigiosidade;","paiId":3834,"id":3843},{"tipo":"inc","label":"X","texto":"identificar matérias elegíveis à solução consensual de controvérsias.","paiId":3834,"id":3844},{"tipo":"par","label":"§1º","texto":"Fica o Poder Executivo, através dos respectivos órgãos de atuação, autorizado a efetuar convênios com câmaras de mediação e arbitragem.","paiId":3834,"id":3845},{"tipo":"par","label":"§2º","texto":"As câmara de mediação e arbitragem conveniadas também atenderão, para fins de prevenção e resolução administrativa de conflitos no município de Maricá, a Procuradoria Geral do Município.","paiId":3834,"id":3846},{"tipo":"par","label":"§3º","texto":"O modo de composição e funcionamento das câmaras de mediação e arbitragem conveniadas de que trata o caput será estabelecido no convenio.","paiId":3834,"id":3847},{"tipo":"par","label":"§4º","texto":"Havendo consenso entre as partes, o acordo firmado entre o devedor e a municipalidade, será reduzido a termo e constituirá título executivo extrajudicial.","paiId":3834,"id":3848},{"tipo":"art","label":"Art. 3º","texto":"O município de Maricá, através dos órgãos que compõem a Administração Pública Direta e Indireta poderão estabelecer procedimentos administrativos e convênios de conciliação, mediação, arbitragem, para áreas cíveis, tributárias, ambiental, contratual, responsabilidade civil e matéria fundiária, assim como cobrança extrajudicial de créditos tributários ou não tributários do município, inclusive em situações de desapropriação, independentemente do valor do crédito, bem como se inscrito ou não em dívida ativa, devendo instituir clausula compromissória nos contratos firmados e sua previsão nos editais licitatórios.","paiId":3827,"id":3849},{"tipo":"capitulo","label":"CAPÍTULO II","texto":"DOS INSTRUMENTOS PARA A SOLUÇÃO ADEQUADA DE CONTROVÉRSIAS","paiId":null,"id":3850},{"tipo":"secao","label":"Seção I","texto":"Dos acordos","paiId":3850,"id":3851},{"tipo":"art","label":"Art. 4º","texto":"A celebração deverá ser efetuada por meio de câmaras de mediação e arbitragem, sendo que os acordos para a solução consensual de controvérsias dependerá da prévia análise de sua vantajosidade e viabilidade jurídica em processos administrativos instaurados pelas câmaras, observados os seguintes critérios:","paiId":3851,"id":3852},{"tipo":"inc","label":"I","texto":"o conflito deve versar sobre direitos cíveis, tributários, ambiental, contratual, trabalhista, responsabilidade civil e matéria fundiária, assim como cobrança extrajudicial de créditos tributários ou não tributários do município, inclusive em situações de desapropriação, independentemente do valor do crédito e se inscrito ou não em dívida ativa, que admitam transação;","paiId":3852,"id":3853},{"tipo":"inc","label":"II","texto":"antiguidade do débito;","paiId":3852,"id":3854},{"tipo":"inc","label":"III","texto":"estejam os débitos fiscais em cobrança ou inscritos em dívida ativa, quando encaminhados à Procuradoria Geral do Município para a cobrança judicial;","paiId":3852,"id":3855},{"tipo":"inc","label":"IV","texto":"não importem em desequilíbrio contratual entre o particular e a municipalidade;","paiId":3852,"id":3856},{"tipo":"inc","label":"V","texto":"garantia da isonomia para qualquer interessado em situação similar que pretenda solucionar o conflito consensualmente;","paiId":3852,"id":3857},{"tipo":"inc","label":"VI","texto":"edição de ato regulamentar das condições e parâmetros objetivos para celebração de acordos a respeito de determinada controvérsia, quando for o caso;","paiId":3852,"id":3858},{"tipo":"inc","label":"VII","texto":"capacidade contributiva;","paiId":3852,"id":3859},{"tipo":"inc","label":"VIII","texto":"qualidade da garantia.","paiId":3852,"id":3860},{"tipo":"par","label":"§1º","texto":"O consenso das partes envolvendo direitos indisponíveis que admitam transação deve ser homologado em juízo, exigida a oitiva do Ministério Público, nos termos das leis federais nº 13.105/15 e 13.140/15.","paiId":3852,"id":3861},{"tipo":"par","label":"§2º","texto":"O disposto no § 1º deste artigo não se aplica às hipóteses em que a lei dispense a oitiva do Ministério Público e a homologação judicial.","paiId":3852,"id":3862},{"tipo":"par","label":"§3º","texto":"A autocomposição poderá versar sobre todo o conflito ou parte dele.","paiId":3852,"id":3863},{"tipo":"par","label":"§4º","texto":"Nos conflitos judiciais, a autocomposição poderá abranger o reconhecimento da procedência do pedido formulado na ação ou na reconvenção, a transação ou a renúncia à pretensão formulada na ação ou na reconvenção.","paiId":3852,"id":3864},{"tipo":"par","label":"§5º","texto":"É vedada a renúncia de receita, salvo a autorizada por lei específica, podendo, no entanto, haver o parcelamento nos termos da lei.","paiId":3852,"id":3865},{"tipo":"art","label":"Art. 5º","texto":"Os acordos de que trata esta lei poderão consistir no pagamento de débitos inscritos ou não na dívida ativa municipal, em parcelas mensais e sucessivas, não se aplicando aos acordos firmados em REFIS e/ou Programas de Parcelamento Incentivado - PPI anteriores à publicação desta lei e regidos por legislação própria.","paiId":3851,"id":3866},{"tipo":"par","label":"§1º","texto":"A efetivação do parcelamento, por qualquer forma, implica confissão irretratável do débito e renúncia ao direito sobre o qual se funda a defesa ou recurso interposto no âmbito administrativo ou judicial, observando-se o regramento próprio dos créditos municipais, inclusive em relação aos acréscimos legais.","paiId":3866,"id":3867},{"tipo":"par","label":"§2º","texto":"Independentemente da origem ou natureza do débito, se inadimplida qualquer parcela, após 90 (noventa) dias, instaurar-se-á o processo de execução ou nele prosseguir-se-á pelo saldo consolidado originalmente, devidamente corrigido, subtraindo-se os valores já pagos.","paiId":3866,"id":3868},{"tipo":"art","label":"Art. 6º","texto":"A autorização para a realização dos acordos previstos nesta lei, inclusive os judiciais, será conferida:","paiId":3851,"id":3869},{"tipo":"inc","label":"I","texto":"pelo Procurador Geral do Município, diretamente ou mediante delegação, através das câmaras de mediação e arbitragem, quando a controvérsia envolver a Administração Pública Direta, bem
