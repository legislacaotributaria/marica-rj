TO SOBRE SERVIÇOS DE QUALQUER NATUREZA – ISSQN NO MUNICÍPIO DE MARICÁ.","formulaPromulgacao":"O POVO DO MUNICÍPIO DE MARICÁ, por seus representantes na Câmara Municipal, aprovou e o Prefeito Municipal, em seu nome sanciona a seguinte Lei:","dataExtenso":"07 DE NOVEMBRO DE 2025","assinatura":"Washington Luiz Cardoso Siqueira \nPREFEITO DO MUNICÍPIO DE MARICÁ","municipio":"Estado do Rio de Janeiro, RJ"},{"id":8,"tipo":"lc","num":"426","ano":"2026","ementa":"Dispõe sobre as condições para celebração da transação fiscal e limite máximo para pagamentos de RPV.","tributo":"geral","situacao":"vigente","link":"DOM 006, de 16/03/2026","artigos":[{"tipo":"titulo","label":"TÍTULO I","texto":"DISPOSIÇÕES PRELIMINARES","paiId":null,"id":3223},{"tipo":"art","label":"Art. 1º","texto":"Esta Lei regula as condições e os requisitos da transação fiscal do crédito tributário e não tributário dos créditos inscritos em dívida ativa municipal ou em fase de cobrança por ação de execução fiscal a que se refere o artigo 171 do Código Tributário Nacional.","paiId":3223,"id":3224},{"tipo":"par","label":"§1º","texto":"Aplica-se o disposto nesta Lei à dívida ativa tributária e não tributária do Município, referente a créditos cuja inscrição, cobrança ou representação incumbam à Procuradoria-Geral do Município, nos termos do artigo 1º, inciso II, da Lei Complementar Municipal nº218, de 20 de março de 2012.","paiId":3224,"id":3225},{"tipo":"par","label":"§2º","texto":"Os créditos não inscritos em dívida ativa seguirão os ritos de negociação próprios, sob a competência do órgão fazendário.","paiId":3224,"id":3226},{"tipo":"art","label":"Art. 2º","texto":"O Município, em juízo de oportunidade e conveniência, poderá celebrar transação fiscal em quaisquer das modalidades de que trata esta Lei, sempre que, motivadamente, entender que a medida atende ao interesse público.","paiId":3223,"id":3227},{"tipo":"art","label":"Art. 3º","texto":"Para fins de aplicação e regulamentação desta Lei, serão observados, entre outros, os princípios da isonomia, da capacidade contributiva, da transparência, da moralidade, da razoável duração dos processos, da eficiência e, resguardadas as informações protegidas por sigilo, o princípio da publicidade.","paiId":3223,"id":3228},{"tipo":"par","label":"Parágrafo único","texto":"A observância dos princípios da transparência e da publicidade será efetivada:","paiId":3228,"id":3229},{"tipo":"inc","label":"I","texto":"quanto à transação individual, preferencialmente pela divulgação em meio eletrônico de todos os termos de transação celebrados, com informações que viabilizem o atendimento do princípio da isonomia, resguardadas as legalmente protegidas por sigilo;","paiId":3229,"id":3230},{"tipo":"inc","label":"II","texto":"quanto à transação por adesão e, enquanto não desenvolvido o sistema mencionado no inciso anterior, quanto à transação individual, pela disponibilização dos termos de transação mediante simples requerimento, feito ao órgão administrativo competente;","paiId":3229,"id":3231},{"tipo":"inc","label":"III","texto":"todas as transações celebradas serão amplamente divulgadas no Portal da Transparência, ressalvado o devido sigilo legal.","paiId":3229,"id":3232},{"tipo":"art","label":"Art. 4º","texto":"Para fins do disposto nesta Lei, considera-se microempresa (MEI) ou empresa de pequeno porte (EPP) a pessoa jurídica que esteja registrada como tal no Cadastro Nacional da Pessoa Jurídica (CNPJ), perante a Receita Federal do Brasil.","paiId":3223,"id":3233},{"tipo":"art","label":"Art. 5º","texto":"A efetividade das disposições normativas previstas nesta Lei poderá, quando for o caso, ser condicionada à observância das normas orçamentárias e financeiras.","paiId":3223,"id":3234},{"tipo":"art","label":"Art. 6º","texto":"A Procuradoria Geral do Município, após inscrição do débito em dívida ativa, poderá averbar, inclusive por meio eletrônico, a certidão de dívida ativa (CDA) nos órgãos de registro de bens e direitos sujeitos a arresto ou penhora.","paiId":3223,"id":3235},{"tipo":"par","label":"Parágrafo único","texto":"A Procuradoria Geral do Município poderá utilizar o protesto extrajudicial como meio de cobrança de créditos tributários e não tributários, inscritos em dívida ativa, ajuizados ou não, observados os critérios de eficiência administrativa e de custos de administração e cobrança.","paiId":3235,"id":3236},{"tipo":"titulo","label":"TÍTULO II","texto":"TRANSAÇÃO FISCAL","paiId":null,"id":3237},{"tipo":"capitulo","label":"Capítulo I","texto":"BENEFÍCIOS E LIMITAÇÕES","paiId":3237,"id":3238},{"tipo":"art","label":"Art. 7º","texto":"A transação poderá contemplar os seguintes benefícios, alternativa ou cumulativamente:","paiId":3238,"id":3239},{"tipo":"inc","label":"I","texto":"a concessão de descontos, apenas para os créditos classificados como irrecuperáveis ou de difícil recuperação, nos termos desta Lei e/ou de seus atos regulamentares;","paiId":3239,"id":3240},{"tipo":"inc","label":"II","texto":"o oferecimento de prazos e formas de pagamento especiais, incluídos o diferimento, a moratória e o parcelamento; e","paiId":3239,"id":3241},{"tipo":"inc","label":"III","texto":"o oferecimento, a substituição ou a alienação de garantias e de constrições.","paiId":3239,"id":3242},{"tipo":"art","label":"Art. 8º","texto":"É vedada a transação que abranja créditos que já tenham sido objeto de transação rescindida no último ano, considerando-se como marco inicial a data da rescisão formal da transação pretérita e como marco final a data da formalização da nova proposta, ou a data da adesão, a depender da forma em que efetuada.","paiId":3238,"id":3243},{"tipo":"capitulo","label":"Capítulo II","texto":"MODALIDADES E FORMAS DE TRANSAÇÃO","paiId":3237,"id":3244},{"tipo":"art","label":"Art. 9º","texto":"Para fins desta Lei, são modalidades de transação as realizadas:","paiId":3244,"id":3245},{"tipo":"inc","label":"I","texto":"na cobrança administrativa de créditos inscritos na dívida ativa do Município;","paiId":3245,"id":3246},{"tipo":"inc","label":"II","texto":"no contencioso judicial.","paiId":3245,"id":3247},{"tipo":"art","label":"Art. 10.","texto":"A transação, em qualquer das modalidades acima, poderá ser feita sob a forma de proposta individual ou por adesão.","paiId":3244,"id":3248},{"tipo":"par","label":"§1º","texto":"A transação por adesão será precedida de edital que especificará todas as suas condições, as quais serão automaticamente aceitas pelo devedor que optar pela modalidade ofertada feita preferencialmente por sistema eletrônico, disponibilizado pela Procuradoria-Geral do Município (PGM), ou, na sua impossibilidade, mediante simples requerimento administrativo, a ser apresentado presencialmente ou por outro recurso tecnológico disponível, no órgão competente, conforme orientações divulgadas em edital.","paiId":3248,"id":3249},{"tipo":"par","label":"§2º","texto":"A proposta de transação individual poderá ser feita por iniciativa do órgão responsável pela cobrança dos créditos ou do devedor, devendo, em ambos os casos, expor os meios para a extinção dos créditos nela contemplados.","paiId":3248,"id":3250},{"tipo":"par","label":"§3º","texto":"Em todos os casos, as propostas serão protocoladas, autuadas, numeradas e datadas em processos administrativos físicos ou eletrônicos para controle, instrução, decisão ou homologação.","paiId":3248,"id":3251},{"tipo":"par","label":"§4º","texto":"Independente da forma de transação instituída, a Procuradoria Municipal deverá formar comissão composta por procuradores efetivos para o processamento, a operacionalização, a instrução e a decisão ou a homologação das propostas apresentadas.","paiId":3248,"id":3252},{"tipo":"par","label":"§5º","texto":"A comissão a que se refere o Parágrafo 4º deste artigo será auxiliada por servidores do quadro da Procuradoria Geral.","paiId":3248,"id":3253},{"tipo":"capitulo","label":"Capítulo III","texto":"PARCELAMENTO E DESCONTOS","paiId":3237,"id":3254},{"tipo":"art","label":"Art. 11.","texto":"A transação poderá prever o parcelamento dos créditos negociados, observadas as seguintes diretrizes:","paiId":3254,"id":3255},{"tipo":"inc","label":"I","texto":"exigência de pagamento de um percentual mínimo do débito a título de entrada, que não poderá ser inferior a 5% (cinco por cento);","paiId":3255,"id":3256},{"tipo":"inc","label":"II","texto":"estabelecimento de prazos máximos de parcelamento distintos, não superiores a 120 (cento e vinte) meses, que podem variar conforme o valor consolidado da dívida;","paiId":3255,"id":3257},{"tipo":"inc","label":"III","texto":"concessão de condições mais benéficas para pessoas naturais, microempreendedores individuais (MEI), microempresas (ME) e empresas de pequeno porte (EPP).","paiId":3255,"id":3258},{"tipo":"par","label":"Parágrafo único","texto":"Ato do Procurador-Geral do Município definirá os valores, os percentuais de entrada e o número máximo de parcelas para cada faixa de débito e perfil de contribuinte, observadas as diretrizes deste artigo.","paiId":3255,"id":3259},{"tipo":"art","label":"Art. 12.","texto":"A concessão de descontos será restrita aos créditos irrecuperáveis ou de difícil recuperação.","paiId":3254,"id":3260},{"tipo":"par","label":"§1º","texto":"A classificação do grau de recuperabilidade dos créditos será realizada pela ProcuradoriaGeral do Município, conforme critérios objetivos estabelecidos em ato do Procurador-Geral, que levará em conta, de forma isolada ou conjunta:","paiId":3260,"id":3261},{"tipo":"inc","label":"I","texto":"o tempo em cobrança administrativa ou judicial;","paiId":3261,"id":3262},{"tipo":"inc","label":"II","texto":"a situação econômica e a capacidade de pagamento do devedor;","paiId":3261,"id":3263},{"tipo":"inc","label":"III","texto":"a inexistência de garantias ou a sua insuficiência;","paiId":3261,"id":3264},{"tipo":"inc","label":"IV","texto":"a situação cadastral do devedor perante os órgãos de registro;","paiId":3261,"id":3265},{"tipo":"inc","label":"V","texto":"os custos do processo de cobrança em relação ao valor do crédito.","paiId":3261,"id":3266},{"tipo":"par","label":"§2º","texto":"Os critérios e parâmetros para a aferição do grau de recuperabilidade das dívidas serão preferencialmente objetivos e levarão em conta o provável insucesso dos meios ordinários e convencionais de cobrança, a idade da dívida inscrita, a capacidade contributiva do devedor e os custos da cobrança judicial.","paiId":3260,"id":3267},{"tipo":"par","label":"§3º","texto":"Para a aferição da capacidade de pagamento do devedor, na transação individual, será possível utilizar como um dos parâmetros a classificação por ele obtida no rating federal, desde que voluntariamente fornecida pelo próprio devedor.","paiId":3260,"id":3268},{"tipo":"par","label":"§4º","texto":"Para fins orçamentários, os débitos considerados irrecuperáveis ou de difícil recuperação, na forma do parágrafo 1º deste artigo, serão reconhecidos como receita de liquidação duvidosa e deverão permanecer em conta de controle até sua extinção ou reclassificação.","paiId":3260,"id":3269},{"tipo":"art","label":"Art. 13.","texto":"Será vedada a concessão de qualquer desconto ou abatimento sobre o valor principal do crédito parcelado, assim entendido o valor originário, monetariamente atualizado, sendo o desconto aplicável somente sobre juros e multa, de modo a atingir os seguintes limites:","paiId":3254,"id":3270},{"tipo":"inc","label":"I","texto":"até 80% (oitenta por cento) para débitos de pessoas jurídicas em geral;","paiId":3270,"id":3271},{"tipo":"inc","label":"II","texto":"até 90% (noventa por cento) para débitos de pessoas naturais, microempresas (MEI) e empresas de pequeno porte (EPP).","paiId":3270,"id":3272},{"tipo":"par","label":"Parágrafo único","texto":": Os descontos previstos nesse artigo são aplicáveis tanto na transação individual quanto na transação por adesão.","paiId":3270,"id":3273},{"tipo":"capitulo","label":"Capítulo V","texto":"EFEITOS DA TRANSAÇÃO","paiId":3237,"id":3274},{"tipo":"art","label":"Art. 14.","texto":"Em qualquer modalidade e forma celebrada, a transação implicará a assunção dos seguintes compromissos:","paiId":3274,"id":3275},{"tipo":"inc","label":"I","texto":"não utilizar a transação de forma abusiva, com a finalidade de limitar, de falsear ou de prejudicar, de qualquer forma, a livre concorrência ou a livre iniciativa econômica;","paiId":3275,"id":3276},{"tipo":"inc","label":"II","texto":"não utilizar pessoa natural ou jurídica interposta para ocultar ou dissimular a origem ou a destinação de bens, de direitos e de valores, os seus reais interesses ou a identidade dos beneficiários de seus atos, em prejuízo da Fazenda Pública Municipal;","paiId":3275,"id":3277},{"tipo":"inc","label":"III","texto":"não alienar nem onerar bens ou direitos sem a devida comunicação ao órgão da Fazenda Pública competente, quando exigido em lei;","paiId":3275,"id":3278},{"tipo":"inc","label":"IV","texto":"desistir das impugnações ou dos recursos administrativos que tenham por objeto os créditos incluídos na transação e renunciar a quaisquer alegações de direito sobre as quais se fundem as referidas impugnações ou recursos;","paiId":3275,"id":3279},{"tipo":"inc","label":"V","texto":"renunciar a quaisquer alegações de direito, atuais ou futuras, sobre as quais se fundem ações judiciais, inclusive as coletivas, ou recursos que tenham por objeto os créditos incluídos na transação, por meio de requerimento de extinção do respectivo processo com resolução de mérito, nos termos da alínea c do inciso III do caput do artigo 487 da Lei Federal nº 13.105, de 16 de março de 2015 (Código de Processo Civil);","paiId":3275,"id":3280},{"tipo":"par","label":"§1º","texto":"A formalização da transação importa aceitação plena e irretratável de todas as condições estabelecidas nesta Lei e em sua regulamentação, constituindo confissão irrevogável e irretratável dos créditos nela abrangidos, nos termos dos artigos 389 a 395 da Lei Federal nº 13.105, de 16 de março de 2015 (Código de Processo Civil) e do artigo 174, inciso IV, do Código Tributário Nacional.","paiId":3275,"id":3281},{"tipo":"par","label":"§2º","texto":"Na hipótese de cindibilidade do objeto da demanda, para fins do disposto nos incisos IV e V do caput, bastará a desistência e a renúncia parcial da impugnação, da ação ou do recurso.","paiId":3275,"id":3282},{"tipo":"art","label":"Art. 15.","texto":"A simples apresentação da proposta de transação não suspende a exigibilidade dos créditos ali abrangidos, nem obsta o andamento das ações de execuções fiscais que tenham por objeto a sua cobrança.","paiId":3274,"id":3283},{"tipo":"par","label":"§1º","texto":"Sempre que a transação envolver moratória ou parcelamento, haverá suspensão da exigibilidade dos créditos transacionados, conforme artigo 151, incisos I e IV, da Lei Federal nº 5.172, de 25 de outubro de 1966 (Código Tributário Nacional).","paiId":3283,"id":3284},{"tipo":"par","label":"§2º","texto":"O disposto no caput deste artigo não afasta a possibilidade de suspensão do processo por convenção das partes, conforme o disposto no inciso II do caput do artigo 313 da Lei nº 13.105, de 16 de março de 2015 (Código de Processo Civil), alternativa que, quando cabível, constará preferencialmente do termo de transação.","paiId":3283,"id":3285},{"tipo":"art","label":"Art. 16.","texto":"O termo de transação será celebrado mediante condição suspensiva, equivalente ao cumprimento integral das condições ali previstas, ocasião em que só então a transação será perfectibilizada e os créditos serão extintos.","paiId":3274,"id":3286},{"tipo":"par","label":"Parágrafo único","texto":"A celebração de termo de transação, ou a adesão às condições do edital, não caracteriza novação dos créditos transacionados.","paiId":3286,"id":3287},{"tipo":"capitulo","label":"Capítulo VI","texto":"HIPÓTESES DE RESCISÃO","paiId":3237,"id":3288},{"tipo":"art","label":"Art. 17.","texto":"Implica a rescisão da transação:","paiId":3288,"id":3289},{"tipo":"inc","label":"I","texto":"o descumprimento das condições, das cláusulas ou dos compromissos assumidos;","paiId":3289,"id":3290},{"tipo":"inc","label":"II","texto":"a constatação, pelo credor, de ato tendente ao esvaziamento patrimonial do devedor como forma de fraudar o cumprimento da transação, ainda que realizado anteriormente à sua celebração;","paiId":3289,"id":3291},{"tipo":"inc","label":"III","texto":"a comprovação de prevaricação, de concussão ou de corrupção passiva na sua formação;","paiId":3289,"id":3292},{"tipo":"inc","label":"IV","texto":"a ocorrência de dolo, de fraude, de simulação ou de erro essencial quanto à pessoa ou quanto ao objeto do conflito;","paiId":3289,"id":3293},{"tipo":"inc","label":"V","texto":"a contrariedade a decisão judicial definitiva prolatada antes da sua celebração;","paiId":3289,"id":3294},{"tipo":"inc","label":"VI","texto":"a ocorrência de alguma das hipóteses rescisórias adicionalmente previstas no respectivo termo de transação; ou","paiId":3289,"id":3295},{"tipo":"inc","label":"VII","texto":"a inobservância de quaisquer disposições desta Lei, dos atos da Procuradoria-Geral do Município que vierem a regulamentá-la ou do edital.","paiId":3289,"id":3296},{"tipo":"par","label":"§1º","texto":"O devedor será notificado sobre a incidência de alguma das hipóteses de rescisão da transação e poderá impugnar o ato, na forma da Lei Municipal de Processo Administrativo ou, na sua ausência, da Lei nº 9.784, de 29 de janeiro de 1999.","paiId":3289,"id":3297},{"tipo":"par","label":"§2º","texto":"Quando sanável, é admitida a regularização do vício que ensejaria a rescisão durante o prazo concedido para a impugnação, preservada a transação em todos os seus termos.","paiId":3289,"id":3298},{"tipo":"par","label":"§3º","texto":"A rescisão da transação implicará o afastamento dos benefícios concedidos e a restauração da integralidade do crédito devidamente atualizado com juros, multas e honorários, deduzidos os valores já pagos, sem prejuízo de outras consequências previstas em ato normativo ou no edital.","paiId":3289,"id":3299},{"tipo":"titulo","label":"TÍTULO III","texto":"TRANSAÇÃO NA COBRANÇA DA DÍVIDA MUNICIPAL","paiId":null,"id":3300},{"tipo":"art","label":"Art. 18.","texto":"A transação na cobrança da dívida municipal abrangerá créditos já inscritos em dívida ativa.","paiId":3300,"id":3301},{"tipo":"par","label":"Parágrafo único","texto":"Ficam compreendidos no objeto possível da transação os créditos inscritos em dívida ativa ajuizados ou não.","paiId":3301,"id":3302},{"tipo":"art","label":"Art. 19.","texto":"A transação na cobrança da dívida municipal envolverá, preferencialmente, a integralidade dos créditos transacionáveis do sujeito passivo.","paiId":3300,"id":3303},{"tipo":"par","label":"Parágrafo único","texto":"Ato do Procurador-Geral do Município poderá autorizar a transação de apenas parte dos débitos elegíveis, estabelecendo os critérios, as condições e os percentuais mínimos de inclusão, que poderão variar conforme o valor total do passivo fiscal do devedor.","paiId":3303,"id":3304},{"tipo":"art","label":"Art. 20.","texto":"A transação na cobrança da dívida municipal poderá ser feita mediante proposta individual ou por adesão, consoante disposições desta Lei.","paiId":3300,"id":3305},{"tipo":"titulo","label":"TÍTULO IV","texto":"TRANSAÇÃO NO CONTENCIOSO JUDICIAL","paiId":null,"id":3306},{"tipo":"art","label":"Art. 21.","texto":"A transação no contencioso judicial dependerá de discussão em curso acerca do crédito, por qualquer ação, incidente processual ou recurso pertinente, na forma da legislação, não bastando, para tanto, a existência de ação de execução fiscal.","paiId":3306,"id":3307},{"tipo":"art","label":"Art. 22.","texto":"A transação no contencioso poderá ser feita somente com relação ao crédito objeto de discussão, ressalvado a existência de precedente vinculante, nos moldes dos incisos I, II, III e IV do caput do artigo 927 da Lei Federal nº 13.105, de 16 de março de 2015 (Código de Processo Civil), quando integralmente favorável à Fazenda Municipal.","paiId":3306,"id":3308},{"tipo":"par","label":"Parágrafo único","texto":"Na transação no contencioso judicial não haverá limitação à negociação parcial com base em percentual do passivo total.","paiId":3308,"id":3309},{"tipo":"art","label":"Art. 23.","texto":"A formalização do acordo, ou a adesão à proposta, será feita perante a Procuradoria-Geral do Município.","paiId":3306,"id":3310},{"tipo":"art","label":"Art. 24.","texto":"A transação no contencioso implicará extinção do litígio, na forma desta Lei, ressalvadas as hipóteses em que ficar demonstrada a inequívoca cindibilidade do objeto, hipótese em que haverá renúncia parcial.","paiId":3306,"id":3311},{"tipo":"art","label":"Art. 25.","texto":"A transação individual poderá ser feita mediante proposta de iniciativa do devedor ou do órgão competente.","paiId":3306,"id":3312},{"tipo":"par","label":"§1º","texto":"No oferecimento de proposta de iniciativa própria ou na aceitação de proposta do devedor, os procuradores efetivos atuantes na comissão a que se refere o Parágrafo 4º do artigo 10 desta Lei deverão fundamentar a sua decisão, levando em conta a chance real de êxito da demanda, as circunstâncias do processo, o interesse na cobrança do crédito e a repercussão jurídica para demandas semelhantes.","paiId":3312,"id":3313},{"tipo":"par","label":"§2º","texto":"As parcelas e os descontos observarão as regras gerais previstas nos artigos 11, 12 e 13 desta Lei. § 3º A transação individual no contencioso não poderá ser realizada quando existir precedente vinculante, nos moldes dos incisos I, II, III e IV do caput do artigo 927 da Lei Federal nº 13.105, de 16 de março de 2015 (Código de Processo Civil), integralmente favorável à Fazenda Municipal, seja para o oferecimento ou para a aceitação de proposta.","paiId":3312,"id":3314},{"tipo":"art","label":"Art. 26.","texto":"Quando houver controvérsia jurídica de interesse transcendente, a comissão a que se refere o Parágrafo 4º do artigo 10 desta Lei poderá, mediante autorização do Procurador-Geral, propor aos sujeitos passivos transação resolutiva de litígios, mediante edital que será divulgado nos órgãos de comunicação oficial e nos sítios dos respectivos órgãos na internet.","paiId":3306,"id":3315},{"tipo":"par","label":"§1º","texto":"Considera-se controvérsia jurídica de interesse transcendente aquela que envolva questões jurídicas que ultrapassem os interesses subjetivos da demanda ou que afetem a exequibilidade do crédito.","paiId":3315,"id":3316},{"tipo":"par","label":"§2º","texto":"O edital a que se refere o caput deste artigo especificará, de maneira objetiva, as hipóteses fáticas e jurídicas nas quais a Fazenda Municipal poderá propor a transação no contencioso tributário e não tributário, aberta à adesão de todos os sujeitos passivos que se enquadrem nessas hipóteses e que satisfaçam às condições previstas nesta Lei e no edital.","paiId":3315,"id":3317},{"tipo":"par","label":"§3º","texto":"É vedada a formulação de proposta na hipótese de existência de precedente vinculante, nos moldes dos incisos I, II, III e IV do caput do artigo 927 da Lei Federal nº 13.105, de 16 de março de 2015 (Código de Processo Civil), quando integralmente favorável à Fazenda Municipal.","paiId":3315,"id":3318},{"tipo":"par","label":"§4º","texto":"A proposta de transação referida neste artigo se pautará na tese discutida, mas poderá limitar os créditos nela contemplados, conforme:","paiId":3315,"id":3319},{"tipo":"inc","label":"I","texto":"a etapa em que se encontre o respectivo processo judicial; ou","paiId":3319,"id":3320},{"tipo":"inc","label":"II","texto":"os períodos de competência a que se refiram.","paiId":3319,"id":3321},{"tipo":"par","label":"§5º","texto":"O edital definirá o prazo para adesão à proposta, durante o qual não será possível transacionar de forma individual com o sujeito passivo, relativamente aos créditos elegíveis para a transação por adesão. § 6º A solicitação de adesão deverá abranger todos os litígios relacionados à tese objeto da transação existentes na data do pedido, observadas as limitações eventualmente existentes, na forma do Parágrafo 3º deste artigo.","paiId":3315,"id":3322},{"tipo":"art","label":"Art. 27.","texto":"O sujeito passivo que aderir à proposta de que trata o artigo 26 desta Lei sujeitar-se-á, em relação aos fatos geradores futuros ou não consumados, ao entendimento dado pela administração tributária à questão em litígio, ressalvadas:","paiId":3306,"id":3323},{"tipo":"inc","label":"I","texto":"a cessação de eficácia prospectiva da transação decorrente do advento de precedente vinculante nos termos dos incisos I, II, III e IV do caput do artigo 927 da Lei Federal nº 13.105, de 16 de março de 2015 (Código de Processo Civil);","paiId":3323,"id":3324},{"tipo":"inc","label":"II","texto":"a alteração da legislação em discussão.","paiId":3323,"id":3325},{"tipo":"par","label":"Parágrafo único","texto":"O disposto neste artigo não se aplica à transação individual no contencioso, realizada na forma do artigo 25 desta Lei.","paiId":3323,"id":3326},{"tipo":"titulo","label":"TÍTULO V","texto":"DISPOSIÇÕES FINAIS","paiId":null,"id":3327},{"tipo":"art","label":"Art. 28.","texto":"Os órgãos técnicos competentes deverão, progressivamente, conforme regulamentação a ser editada pela Procuradoria Geral do Município, estabelecer mecanismos de facilitação para pagamento por meio de cartão de débito e/ou crédito, PIX e outros meios de pagamento autorizados pelo Banco Central do Brasil.","paiId":3327,"id":3328},{"tipo":"art","label":"Art. 29.","texto":"A Procuradoria-Geral do Município poderá celebrar negócio jurídico processual em seu âmbito de atuação, inclusive na cobrança administrativa ou judicial da dívida ativa do Município, na forma do artigo 190 da Lei Federal nº 13.105, de 16 de março de 2015 (Código de Processo Civil), cabendo ao Procurador-Geral a sua regulamentação.","paiId":3327,"id":3329},{"tipo":"art","label":"Art. 30.","texto":"Na transação com a Fazenda Pública Municipal, o particular poderá ser assistido por advogado. Art. 31. Caberá ao Procurador-Geral do Município, por meio de ato próprio, editar as normas complementares e os atos necessários à fiel execução e operacionalização do disposto nesta Lei Complementar, disciplinando:","paiId":3327,"id":3330},{"tipo":"inc","label":"I","texto":"os procedimentos e os detalhamentos necessários à aplicação do disposto nesta Lei, inclusive quanto à formalização e à rescisão da transação;","paiId":3330,"id":3331},{"tipo":"inc","label":"II","texto":"a legitimidade para formalizar acordo de transação, seja por proposta individual ou por adesão, consideradas as regras de responsabilidade tributária previstas na Lei Federal nº 5.172, de 25 de outubro de 1966 (Código Tributário Nacional) e na Lei nº 910, de 14 de dezembro de 1990, renomeada pela Lei Complementar nº 005, de 30 de janeiro de 1991 (Código Tributário Municipal);","paiId":3330,"id":3332},{"tipo":"inc","label":"III","texto":"as normas necessárias ao funcionamento da comissão prevista no Parágrafo 4º do artigo 10 desta Lei para processamento, instrução e decisão ou homologação do termo de transação;","paiId":3330,"id":3333},{"tipo":"inc","label":"IV","texto":"a possibilidade de se condicionar a transação ao pagamento de entrada, à apresentação de garantia e à manutenção das garantias já existentes;","paiId":3330,"id":3334},{"tipo":"inc","label":"V","texto":"as situações em que a transação somente poderá ser celebrada por adesão, autorizado o não conhecimento de eventuais propostas de transação individual;","paiId":3330,"id":3335},{"tipo":"inc","label":"VI","texto":"o formato e os requisitos da proposta de transação, bem como os documentos que deverão ser apresentados por ocasião de sua formulação;","paiId":3330,"id":3336},{"tipo":"inc","label":"VII","texto":"os critérios e parâmetros para aferição do grau de recuperabilidade das dívidas e para a concessão de descontos;","paiId":3330,"id":3337},{"tipo":"inc","label":"VIII","texto":"os critérios, procedimento e demais condições para a efetivação do protesto extrajudicial; e","paiId":3330,"id":3338},{"tipo":"inc","label":"IX","texto":"as demais questões eventualmente omissas nessa Lei.","paiId":3330,"id":3339},{"tipo":"art","label":"Art. 32.","texto":"O Município, através da Procuradoria Geral, fica autorizado a firmar convênio com o Tribunal de Justiça do Estado do Rio de Janeiro ou com o Tribunal Regional Federal para operacionalização dos acordos de transação previstos nesta Lei.","paiId":3327,"id":3340},{"tipo":"art","label":"Art. 33.","texto":"O órgão municipal responsável pelos sistemas informatizados de gestão do crédito fiscal deverá adequar as suas funcionalidades ao disposto nesta Lei.","paiId":3327,"id":3341},{"tipo":"art","label":"Art. 34.","texto":"Fica o Poder Executivo autorizado a instituir, por meio de Decreto, programas de incentivo à quitação à vista de débitos inscritos em dívida ativa, ajuizados ou não, com a concessão de desconto de até 100% (cem por cento) sobre os juros e multa.","paiId":3327,"id":3342},{"tipo":"par","label":"§1º","texto":"O programa de incentivo previsto pelo caput independe da classificação do crédito previsto no art. 12 desta Lei.","paiId":3342,"id":3343},{"tipo":"par","label":"§2º","texto":"O Poder Executivo poderá, excepcionalmente, dividir os débitos em até 10 (dez) parcelas mensais e sucessivas, observando os descontos previstos no caput.","paiId":3342,"id":3344},{"tipo":"par","label":"§3º","texto":"O Decreto a que se refere o caput definirá o período de vigência e as condições para adesão ao programa, observadas as normas orçamentárias e financeiras.","paiId":3342,"id":3345},{"tipo":"art","label":"Art. 35.","texto":"Em qualquer modalidade de transação, o percentual dos honorários devidos ao Fundo Especial da Procuradoria Geral do Município será aquele fixado pelo artigo 18 da Lei Complementar Municipal nº 246, de 23 de setembro de 2014, se o débito não estiver ajuizado. Se o débito estiver ajuizado, o percentual será fixado pelo juízo competente, nos termos do Código de Processo Civil e da Lei nº 6.830/1980, e, se não fixado, será considerado o percentual fixado pelo artigo 22 da Lei Complementar Municipal nº 218, de 20 de março de 2012, alterado pela Lei Complementar Municipal nº 273, de 10 de dezembro de 2015.","paiId":3327,"id":3346},{"tipo":"art","label":"Art. 36.","texto":"O protesto da certidão de dívida ativa será realizado exclusivamente pela Procuradoria Geral do Município.","paiId":3327,"id":3347},{"tipo":"art","label":"Art. 37.","texto":"A Procuradoria Geral do Município poderá criar câmaras de prevenção e resolução administrativa de conflitos, nos termos da Lei nº 13.140, de 26 de junho de 2015, e/ou realizar convênios com câmaras de mediação e arbitragem para auxiliá-la na composição de litígios.","paiId":3327,"id":3348},{"tipo":"art","label":"Art. 38.","texto":"O ajuizamento de execuções fiscais para a cobrança de créditos do Município fica condicionado a um valor mínimo de alçada, a ser fixado por ato do Procurador-Geral do Município, com base em critérios de eficiência administrativa e no custo estimado do processo judicial.","paiId":3327,"id":3349},{"tipo":"art","label":"Art. 39.","texto":"O art. 7º da Lei Complementar Municipal 385/2022 passa a vigorar com a seguinte redação:␞__CITACAO__␞\"Art. 7º. Será permitido o reparcelamento decorrente de inadimplência, uma única vez, desde que observado o pagamento inicial mínimo de 25% (vinte e cinco por cento) do saldo remanescente do parcelamento originário, acrescidos de juros, multas e encargos legais. (NR)\"","paiId":3327,"id":3350},{"tipo":"art","label":"Art. 40.","texto":"Ficam definidos no âmbito do Município de Maricá, suas autarquias e fundações, como obrigações de pequeno valor a que aludem os §§ 3º e 4º do art. 100 da Constituição Federal, os créditos oriundos de decisão judicial transitada em julgado, cujo valor total atualizado não exceda a 10 (dez) salários mínimos.","paiId":3327,"id":3351},{"tipo":"art","label":"Art. 41.","texto":"Revogam-se as disposições em contrário.","paiId":3327,"id":3352},{"tipo":"art","label":"Art. 42.","texto":"Esta Lei Complementar entra em vigor na data de sua publicação.","paiId":3327,"id":3353}],"anexos":[],"preambulo":"DISPÕE SOBRE AS CONDIÇÕES E REQUISITOS PARA A CELEBRAÇÃO DE TRANSAÇÃO FISCAL COMO MEIO DE EXTINÇÃO DE CRÉDITOS TRIBUTÁRIOS E NÃO TRIBUTÁRIOS, E O VALOR A SER CONSIDERADO COMO LIMITE MÁXIMO PARA PAGAMENTOS DE REQUISIÇÕES DE PEQUENO VALOR (RPV) NO ÂMBITO DO MUNICÍPIO DE MARICÁ E DÁ OUTRAS PROVIDÊNCIAS.","formulaPromulgacao":"O POVO DO MUNICÍPIO DE MARICÁ, por seus representantes na Câmara Municipal, aprovou e o Prefeito Municipal, em seu nome sanciona a seguinte Lei Complementar:","dataExtenso":"11 DE MARÇO DE 2026","assinatura":"Washington Luiz Cardoso Siqueira \nPREFEITO DO MUNICÍPIO DE MARICÁ","municipio":"Estado do Rio de Janeiro, RJ"},{"id":9,"tipo":"lei","num":"3.624","ano":"2025","ementa":"Dispõe sobre isenção de IPTU, ISS e taxas para imóveis e serviços de templos de qualquer culto.","tributo":"geral","situacao":"vigente","link":"JOM 1.797, de 20/10/2025","artigos":[{"tipo":"art","label":"Art. 1º","texto":"Ficam isentos do pagamento do Imposto Predial e Territorial Urbano (IPTU) e de quaisquer taxas municipais relativas à propriedade, ocupação, edificação, conservação ou funcionamento os imóveis","paiId":null,"id":2902},{"tipo":"art","label":"Art. 2º","texto":"A isenção prevista no artigo anterior aplica-se:","paiId":null,"id":2903},{"tipo":"inc","label":"I","texto":"aos imóveis pertencentes ou utilizados por entidades religiosas, desde que comprovadamente destinados ao exercício das atividades essenciais de culto, celebrações e funções administrativas;","paiId":2903,"id":2904},{"tipo":"inc","label":"II","texto":"aos imóveis cedidos em comodato ou locação gratuita para uso religioso, desde que cumpridos os","paiId":2903,"id":2905},{"tipo":"inc","label":"III","texto":"às taxas de localização, funcionamento, vistoria e fiscalização urbana ou sanitária, quando incidentes sobre templos de qualquer culto.","paiId":2903,"id":2906},{"tipo":"art","label":"Art. 3º","texto":"Fica reconhecida a imunidade tributária dos templos de qualquer culto em relação ao Imposto Sobre","paiId":null,"id":2907},{"tipo":"par","label":"§1º","texto":"Não serão exigidos, lançados ou cobrados valores a título de ISS sobre serviços religiosos, litúrgicos, administrativos ou sociais prestados por entidades religiosas no exercício de suas funções institucionais.","paiId":2907,"id":2908},{"tipo":"par","label":"§2º","texto":"Ficam declarados inexigíveis os créditos tributários relativos ao ISS, constituídos ou não, cujo fato gerador tenha ocorrido anteriormente à vigência desta Lei, desde que vinculados a atividades essenciais da entidade religiosa.","paiId":2907,"id":2909},{"tipo":"art","label":"Art. 4º","texto":"Ficam declarados inexigíveis os créditos tributários municipais, constituídos ou não, relativos a IPTU e taxas incidentes sobre imóveis utilizados por templos de qualquer culto, cujo fato gerador seja anterior à data de vigência desta Lei.","paiId":null,"id":2910},{"tipo":"par","label":"Parágrafo único","texto":"A inexigibilidade prevista neste artigo alcança débitos ainda não quitados, protestados ou inscritos em dívida ativa, desde que estejam relacionados a imóveis de efetiva e comprovada destinação religiosa.","paiId":2910,"id":2911},{"tipo":"art","label":"Art. 5º","texto":"Para a obtenção do reconhecimento da isenção, a entidade religiosa deverá apresentar requerimento à Secretaria Municipal de Fazenda, instruído com:","paiId":null,"id":2912},{"tipo":"inc","label":"I","texto":"prova da titularidade ou da posse legítima do imóvel;","paiId":2912,"id":2913},{"tipo":"inc","label":"II","texto":"comprovação da atividade religiosa desenvolvida no local;","paiId":2912,"id":2914},{"tipo":"inc","label":"III","texto":"declaração de que o imóvel é utilizado exclusiva ou predominantemente como templo.","paiId":2912,"id":2915},{"tipo":"art","label":"Art. 6º","texto":"Ficam os órgãos da administração pública municipal autorizados a promover os registros, cancelamentos e demais procedimentos necessários para o cumprimento desta Lei.","paiId":null,"id":2916},{"tipo":"art","label":"Art. 7º","texto":"A inexigibilidade prevista nesta Lei não enseja direito à restituição de quaisquer valores eventualmente pagos antes da sua entrada em vigor.","paiId":null,"id":2917},{"tipo":"art","label":"Art. 8º","texto":"Nos casos de parcelamentos tributários em curso, a inexigibilidade aplicar-se-á exclusivamente às","paiId":null,"id":2918},{"tipo":"art","label":"Art. 9º","texto":"Na hipótese de desistência de ação judicial com fundamento nesta Lei, caberá ao contribuinte o","paiId":null,"id":2919},{"tipo":"art","label":"Art. 10.","texto":"A inexigibilidade prevista nesta Lei não constitui direito adquirido, podendo ser revogada de ofício caso se constate que o beneficiário:","paiId":null,"id":2920},{"tipo":"inc","label":"I","texto":"não preenchia ou deixou de preencher os requisitos legais;","paiId":2920,"id":2921},{"tipo":"inc","label":"II","texto":"prestou informações falsas ou omitiu dados relevantes;","paiId":2920,"id":2922},{"tipo":"inc","label":"III","texto":"descumpriu, por qualquer meio, as condições previstas nesta Lei.","paiId":2920,"id":2923},{"tipo":"par","label":"Parágrafo único","texto":"Nessas hipóteses, o crédito tributário será restabelecido com acréscimos legais, incluindo juros de mora, conforme previsto na legislação vigente.","paiId":2920,"id":2924},{"tipo":"art","label":"Art. 11.","texto":"Esta Lei constitui norma de regulamentação local da imunidade tributária prevista no art. 150, inciso VI, alínea “b”, da Constituição Federal, não configurando renúncia de receita tributária nos termos do art. 14 da Lei Complementar nº 101/2000.","paiId":null,"id":2925},{"tipo":"art","label":"Art. 12.","texto":"Esta Lei entra em vigor na data de sua publicação.","paiId":null,"id":2926}],"anexos":[],"preambulo":"DISPÕE SOBRE A ISENÇÃO DE IPTU, ISS E TAXAS MUNICIPAIS INCIDENTES SOBRE OS IMÓVEIS E SERVIÇOS DE TEMPLOS DE QUALQUER CULTO NO MUNICÍPIO DE MARICÁ E DECLARA INEXIGÍVEIS OS DÉBITOS ANTERIORES À VIGÊNCIA DESTA LEI.","formulaPromulgacao":"O POVO DO MUNICÍPIO DE MARICÁ, por seus representantes na Câmara Municipal de Maricá, aprovou e o Prefeito Municipal, em seu nome, sanciona a seguinte Lei.","dataExtenso":"17 DE OUTUBRO DE 2025","assinatura":"WASHINGTON LUIZ CARDOSO SIQUEIRA\nPREFEITO DO MUNICÍPIO DE MARICÁ","municipio":"Estado do Rio de Janeiro, RJ"},{"id":10,"tipo":"dec","num":"082","ano":"2025","ementa":"Aprova o Regimento Interno e consolida a estrutura organizacional da SEGET.","tributo":"geral","situacao":"vigente","link":"JOM 1.730, de 09/05/2025","artigos":[{"tipo":"art","label":"Art. 1º","texto":"Fica instituído o Regimento Interno no âmbito da SECRETARIA DE GESTÃO TRIBUTÁRIA E FISCAL – SEGET, do Município de Maricá, consolidado na forma dos Anexo I e II do presente Decreto.","paiId":null,"id":3789},{"tipo":"art","label":"Art. 2º","texto":"Este Decreto entra em vigor na data de sua publicação.","paiId":null,"id":3790}],"anexos":[],"preambulo":"APROVA O REGIMENTO INTERNO E CONSOLIDA A ESTRUTURA ORGANIZACIONAL DA SECRETARIA DE GESTÃO TRIBUTÁRIA E FISCAL.","formulaPromulgacao":"CONSIDERANDO que a Lei Orgânica do Município de Maricá, nos termos dos artigos nº 107, III e 127, XXIV, estabelece que compete ao Prefeito a iniciativa das leis relativas à criação, estruturação e atribuições das Secretarias, Departamentos ou Diretorias equivalentes e Órgãos da Administração Pública, bem como organizar os serviços internos das repartições criadas por lei, com observância do limite das dotações a elas destinadas;\nCONSIDERANDO que o art. 2º, § 1º, I, p e art. 19 da Lei Complementar Municipal nº 398, de 12 de dezembro de 2024, instituiu a Secretaria de Gestão Tributária e Fiscal do Município de Maricá e estabeleceu as suas competências; \nCONSIDERANDO, ainda, que o artigo 58 da Lei Complementar Municipal nº 398, de 12 de dezembro de 2024, estabelece a obrigatoriedade de elaborar o Organograma e Regimento Interno para análise e posterior regulamentação, mediante Decreto Municipal, a ser assinado pelo Prefeito e devidamente publicado no Diário Oficial do Município. \nO Prefeito Municipal de Maricá, no uso de suas atribuições legais; DECRETA:","dataExtenso":"08 DE MAIO DE 2025","assinatura":"Washington Luiz Cardoso Siqueira \nPREFEITO DO MUNICÍPIO DE MARICÁ","municipio":"Estado do Rio de Janeiro, RJ"},{"id":11,"tipo":"dec","num":"145","ano":"2025","ementa":"Dispõe sobre a política de Governança Pública no âmbito da SEGET.","tributo":"geral","situacao":"vigente","link":"JOM 1.759, de 21/07/2025","artigos":[{"tipo":"capitulo","label":"CAPÍTULO I","texto":"DAS DISPOSIÇÕES GERAIS","paiId":null,"id":3354},{"tipo":"art","label":"Art. 1º","texto":"Fica instituída a Política de Governança Pública no âmbito da Secretaria de Gestão Tributária e","paiId":3354,"id":3355},{"tipo":"art","label":"Art. 2º","texto":"Para assegurar a efetividade das ações de governança, este Decreto adota os seguintes conceitos:","paiId":3354,"id":3356},{"tipo":"inc","label":"I","texto":"Governança pública: conjunto de mecanismos de liderança, estratégia e controle voltado para avaliar,","paiId":3356,"id":3357},{"tipo":"inc","label":"II","texto":"Valor público: resultados entregues pela SEGET que atendem às demandas da sociedade e contribuem","paiId":3356,"id":3358},{"tipo":"inc","label":"III","texto":"Alta administração: composta pelos ocupantes de cargos de natureza política, incluindo o(a)","paiId":3356,"id":3359},{"tipo":"inc","label":"IV","texto":"Gestão de riscos: conjunto de práticas voltadas à identificação, avaliação, tratamento e monitoramento de eventos incertos que possam impactar negativa ou positivamente os objetivos da SEGET, contribuindo para decisões mais seguras e para o aprimoramento da gestão institucional.","paiId":3356,"id":3360},{"tipo":"capitulo","label":"CAPÍTULO II","texto":"DOS PRINCÍPIOS E DIRETRIZES DA GOVERNANÇA","paiId":null,"id":3361},{"tipo":"art","label":"Art. 3º","texto":"São princípios da governança pública:","paiId":3361,"id":3362},{"tipo":"inc","label":"I","texto":"capacidade de resposta;","paiId":3362,"id":3363},{"tipo":"inc","label":"II","texto":"integridade;","paiId":3362,"id":3364},{"tipo":"inc","label":"III","texto":"confiabilidade;","paiId":3362,"id":3365},{"tipo":"inc","label":"IV","texto":"melhoria regulatória;","paiId":3362,"id":3366},{"tipo":"inc","label":"V","texto":"prestação de contas e responsabilidade; e","paiId":3362,"id":3367},{"tipo":"inc","label":"VI","texto":"transparência.","paiId":3362,"id":3368},{"tipo":"art","label":"Art. 4º","texto":"São diretrizes da governança pública na SEGET:","paiId":3361,"id":3369},{"tipo":"inc","label":"I","texto":"direcionar ações para a busca de resultados que promovam justiça fiscal, eficiência arrecadatória e melhoria na relação fisco-contribuinte, propondo soluções tempestivas e inovadoras para lidar com a limitação de recursos, a complexidade tributária e as mudanças na gestão fiscal;","paiId":3369,"id":3370},{"tipo":"inc","label":"II","texto":"promover a desburocratização e a racionalização dos procedimentos tributários e fiscais, a modernização da administração tributária e a integração dos serviços oferecidos ao contribuinte, especialmente por meios eletrônicos;","paiId":3369,"id":3371},{"tipo":"inc","label":"III","texto":"monitorar o desempenho institucional e avaliar a concepção, a implementação e os resultados das","paiId":3369,"id":3372},{"tipo":"inc","label":"IV","texto":"promover a integração e o intercâmbio de informações com os demais órgãos da administração municipal, estadual e federal, especialmente os de fiscalização, controle e arrecadação, com vistas a fortalecer a eficiência da gestão tributária e a  gestão de riscos e instrumentos de tomada de","paiId":3399,"id":3404},{"tipo":"inc","label":"VI","texto":"fomentar o mapeamento de processos e a adoção de soluções que contribuam para o aumento da","paiId":3399,"id":3405},{"tipo":"inc","label":"VII","texto":"apoiar a integração das políticas transversais no âmbito da SEGET, em articulação com outras Secretarias e órgãos municipais;","paiId":3399,"id":3406},{"tipo":"inc","label":"VIII","texto":"aprovar manuais e guias com medidas, mecanismos e práticas organizacionais que contribuam para","paiId":3399,"id":3407},{"tipo":"inc","label":"IX","texto":"emitir recomendações à Assessoria de Governança, sempre que pertinente, com vistas à qualificação","paiId":3399,"id":3408},{"tipo":"par","label":"Parágrafo único","texto":"As competências aqui previstas não substituem nem se sobrepõem às atribuições da","paiId":3399,"id":3409},{"tipo":"art","label":"Art. 10.","texto":"O Comitê será composto por:","paiId":3396,"id":3410},{"tipo":"inc","label":"I","texto":"o(a) Secretário(a) da SEGET, que o presidirá;","paiId":3410,"id":3411},{"tipo":"inc","label":"II","texto":"os(as) Subsecretários(as);","paiId":3410,"id":3412},{"tipo":"inc","label":"III","texto":"o(a) Chefe da Assessoria de Governança;","paiId":3410,"id":3413},{"tipo":"inc","label":"IV","texto":"o(a) Chefe da Assessoria de Controle Interno e Compliance;","paiId":3410,"id":3414},{"tipo":"inc","label":"V","texto":"um(a) representante indicado(a) por cada unidade técnico-administrativa da SEGET.","paiId":3410,"id":3415},{"tipo":"par","label":"§1º","texto":"Poderão ser convidados, a critério do Comitê, servidores de outras unidades, especialistas ou representantes de órgãos parceiros, conforme a natureza dos temas em pauta.","paiId":3410,"id":3416},{"tipo":"par","label":"§2º","texto":"Os membros exercerão suas funções sem prejuízo de suas atribuições ordinárias.","paiId":3410,"id":3417},{"tipo":"par","label":"§3º","texto":"A designação dos membros integrantes do Comitê dar-se-á por meio de portaria da autoridade competente.","paiId":3410,"id":3418},{"tipo":"art","label":"Art. 11.","texto":"O Comitê reunir-se-á ordinariamente a cada dois meses e, extraordinariamente, sempre que convocado pelo(a) Presidente ou por solicitação da Assessoria de Governança.","paiId":3396,"id":3419},{"tipo":"capitulo","label":"CAPÍTULO V","texto":"DO PLANEJAMENTO ESTRATÉGICO E DA GESTÃO DE RISCOS","paiId":null,"id":3420},{"tipo":"art","label":"Art. 12.","texto":"O planejamento estratégico da SEGET constitui o principal instrumento de orientação das ações","paiId":3420,"id":3421},{"tipo":"par","label":"§1º","texto":"O planejamento estratégico estabelecerá metas claras, indicadores mensuráveis, prazos definidos e","paiId":3421,"id":3422},{"tipo":"par","label":"§2º","texto":"A revisão do planejamento estratégico será realizada periodicamente, com base na análise dos resultados obtidos, no monitoramento dos indicadores e na identificação de novos riscos, oportunidades ou","paiId":3421,"id":3423},{"tipo":"art","label":"Art. 13.","texto":"A gestão de riscos na SEGET é uma prática contínua que visa identificar, analisar, tratar e acompanhar situações que possam afetar o cumprimento dos objetivos institucionais.","paiId":3420,"id":3424},{"tipo":"par","label":"§1º","texto":"O processo deverá envolver as unidades da Secretaria de forma integrada, utilizando metodologias","paiId":3424,"id":3425},{"tipo":"par","label":"§2º","texto":"A gestão de riscos abrangerá, no mínimo, as etapas de identificação, avaliação, tratamento e monitoramento dos riscos institucionais.","paiId":3424,"id":3426},{"tipo":"par","label":"§3º","texto":"Os riscos levantados deverão subsidiar a tomada de decisão e orientar a adoção de medidas preventivas e corretivas para fortalecer a gestão e preservar os resultados esperados.","paiId":3424,"id":3427},{"tipo":"capitulo","label":"CAPÍTULO VI","texto":"DA TRANSPARÊNCIA","paiId":null,"id":3428},{"tipo":"art","label":"Art. 14.","texto":"A transparência s t","label":"Art. 20.","texto":"A Assessoria de Governança pode editar atos complementares e estabelecer procedimentos para","paiId":3455,"id":3456},{"tipo":"art","label":"Art. 21.","texto":"A participação no Comitê de Governança e grupos de trabalho constituídos é considerada prestação","paiId":3455,"id":3457},{"tipo":"art","label":"Art. 22.","texto":"Este Decreto entra em vigor na data de sua publicação.","paiId":3455,"id":3458}],"anexos":[],"preambulo":"DISPÕE SOBRE A POLÍTICA DE GOVERNANÇA PÚBLICA NO ÂMBITO DA SECRETARIA DE GESTÃO TRIBUTÁRIA E FISCAL – SEGET","formulaPromulgacao":"O Prefeito Municipal de Maricá, no uso de suas atribuições legais;\nDECRETA:","dataExtenso":"21 DE JULHO DE 2025","assinatura":"Washington Luiz Cardoso Siqueira\nPREFEITO DO MUNICÍPIO DE MARICÁ","municipio":"Estado do Rio de Janeiro, RJ"},{"id":12,"tipo":"dec","num":"173","ano":"2025","ementa":"Institui o CATRIMA e fixa o valor da UFIMA para 2026.","tributo":"geral","situacao":"vigente","link":"JOM 1.774, de 27/08/2025","artigos":[{"tipo":"capitulo","label":"Capítulo I","texto":"Disposição Preliminar","paiId":null,"id":2960},{"tipo":"art","label":"Art. 1º","texto":"Este Decreto institui o Calendário de Recolhimento de Tributos Municipais de Maricá (CATRIMA) e fixa o valor da Unidade Fiscal de Maricá (UFIMA) para o exercício de 2026, nos termos do § 1º do art. 355 da Lei Complementar nº 005, de 30 de janeiro de 1991, aplicando-se aos tributos de competência do Município de Maricá.","paiId":2960,"id":2961},{"tipo":"capitulo","label":"Capítulo II","texto":"Do Calendário de Recolhimento de Tributos","paiId":null,"id":2962},{"tipo":"secao","label":"Seção I","texto":"Das Regras Gerais de Vencimento","paiId":2962,"id":2963},{"tipo":"art","label":"Art. 2º","texto":"As datas e os prazos para pagamento de tributos municipais no exercício de 2026 são os fixados no Anexo I deste Decreto.","paiId":2963,"id":2964},{"tipo":"par","label":"§1º","texto":"Na hipótese de não funcionamento da rede bancária autorizada na data prevista para o vencimento do tributo, este será prorrogado para o primeiro dia útil imediatamente subsequente.","paiId":2964,"id":2965},{"tipo":"par","label":"§2º","texto":"Fica vedada a emissão de guias de pagamento com vencimento no último dia útil do exercício ou em data posterior.","paiId":2964,"id":2966},{"tipo":"art","label":"Art. 3º","texto":"As datas e os prazos fixados no Anexo I poderão ser alterados por ato do titular da Fazenda Municipal, na ocorrência de fatos que justifiquem a medida, devendo ser dada ciência aos contribuintes por meio de publicação no Jornal Oficial de Maricá (JOM).","paiId":2963,"id":2967},{"tipo":"art","label":"Art. 4º","texto":"O não pagamento de tributo até a data de vencimento implicará a incidência de multa e juros moratórios, bem como a inscrição do débito em dívida ativa, nos termos do art. 281 da Lei Complementar nº 005, de 30 de janeiro de 1991.","paiId":2963,"id":2968},{"tipo":"secao","label":"Seção II","texto":"Do Recolhimento do IPTU e da TCL","paiId":2962,"id":2969},{"tipo":"art","label":"Art. 5º","texto":"O contribuinte poderá recolher o IPTU (Imposto sobre a Propriedade Predial e Territorial Urbana) e a Taxa de Coleta de Lixo (TCL) em cota única, com desconto de 15% (quinze por cento), ou em até 10 (dez) cotas mensais, com desconto de 10% (dez por cento) em cada parcela, nos termos do § 1º do art. 16 da Lei Complementar nº 005, de 30 de janeiro de 1991, desde que o pagamento seja efetuado até a data de","paiId":2969,"id":2970},{"tipo":"par","label":"§1º","texto":"O não pagamento no prazo fixado no Anexo I acarretará a perda dos descontos previstos, bem como a incidência de acréscimos moratórios.","paiId":2970,"id":2971},{"tipo":"par","label":"§2º","texto":"A Taxa de Coleta de Lixo (TCL) será lançada conjuntamente com o IPTU, na forma do art. 6º deste Decreto, resguardada sua identificação individualizada no demonstrativo de cálculo.","paiId":2970,"id":2972},{"tipo":"par","label":"§3º","texto":"O desconto concedido sobre o IPTU não é aplicável ao valor da TCL.","paiId":2970,"id":2973},{"tipo":"art","label":"Art. 6º","texto":"A notificação do lançamento do IPTU e da TCL, relativos ao exercício de 2026, dar-se-á mediante publicação de edital no Jornal Oficial do Município, na forma do inciso II do § 1º do art. 13 da Lei Complementar nº 005, de 30 de janeiro de 1991.","paiId":2969,"id":2974},{"tipo":"par","label":"§1º","texto":"Não serão encaminhados carnês físicos ao domicílio fiscal dos contribuintes.","paiId":2974,"id":2975},{"tipo":"par","label":"§2º","texto":"As guias para pagamento da cota única ou das cotas mensais deverão ser retiradas, a partir de 09 de janeiro de 2026, por meio dos seguintes canais:","paiId":2974,"id":2976},{"tipo":"inc","label":"I","texto":"pela internet, no endereço: https://sim.marica.rj.gov.br/;","paiId":2976,"id":2977},{"tipo":"inc","label":"II","texto":"presencialmente, em qualquer unidade dos SIM – Serviços Integrados Municipais.","paiId":2976,"id":2978},{"tipo":"par","label":"§3º","texto":"A segunda via das guias poderá ser obtida pelos mesmos canais indicados no § 2º deste artigo.","paiId":2974,"id":2979},{"tipo":"secao","label":"Seção III","texto":"Dos Pedidos de Isenção de IPTU e de Revisão do Valor Venal de Imóveis","paiId":2962,"id":2980},{"tipo":"art","label":"Art. 7º","texto":"Os pedidos de reconhecimento ou renovação de isenção de IPTU para o exercício de 2027 deverão ser protocolados até o dia 31 de julho de 2026, na forma do art. 18, caput, da Lei Complementar nº 005, de","paiId":2980,"id":2981},{"tipo":"par","label":"Parágrafo único","texto":"Os processos protocolados fora do prazo serão indeferidos de plano.","paiId":2981,"id":2982},{"tipo":"art","label":"Art. 8º","texto":"Os pedidos de revisão do valor venal de imóveis, nos termos do § 6º do art. 13 da Lei Complementar nº 005, de 30 de janeiro de 1991, deverão ser protocolados até 30 de junho de 2026.","paiId":2980,"id":2983},{"tipo":"par","label":"§1º","texto":"Os pedidos a que se refere o caput serão analisados com efeitos no mesmo exercício, desde que o requerente comprove que a situação alegada já se verificava anteriormente.","paiId":2983,"id":2984},{"tipo":"par","label":"§2º","texto":"As alterações cadastrais decorrentes de processos de regularização de obras produzirão efeitos a partir do exercício seguinte, nos termos do § 2º do art. 22 da Lei Complementar nº 005, de 30 de janeiro de 1991.","paiId":2983,"id":2985},{"tipo":"capitulo","label":"Capítulo III","texto":"Do Índice de Atualização e da Unidade Fiscal de Maricá (UFIMA)","paiId":null,"id":2986},{"tipo":"art","label":"Art. 9º","texto":"Fica fixado o índice de atualização da UFIMA em 5,18% (cinco inteiros e dezoito centésimos por cento), com base na variação acumulada do INPC/IBGE entre julho de 2024 e junho de 2025, nos termos do §1º do art. 355 da Lei Complementar n° 005, de 30 de janeiro de 1991.","paiId":2986,"id":2987},{"tipo":"par","label":"§1º","texto":"As tabelas de atualização encontram-se no Anexo II deste Decreto.","paiId":2987,"id":2988},{"tipo":"par","label":"§2º","texto":"O valor da UFIMA será arredondado para o centavo par mais próximo, por conveniência do sistema informatizado.","paiId":2987,"id":2989},{"tipo":"art","label":"Art. 10.","texto":"A UFIMA, para o exercício de 2026, fica fixada em R$ 220,74 (duzentos e vinte reais e setenta e quatro centavos).","paiId":2986,"id":2990},{"tipo":"par","label":"§1º","texto":"O valor mínimo do IPTU para o exercício de 2026 será de 1 (uma) UFIMA - R$ 220,74 (duzentos e vinte reais e setenta e quatro centavos), nos moldes da alínea “f” do inciso I do Anexo XIII da Lei Complementar nº 005, de 30 de janeiro de 1991.","paiId":2990,"id":2991},{"tipo":"par","label":"§2º","texto":"O valor mínimo das cotas do IPTU para o exercício de 2026 será de 0,5 (meia) UFIMA - R$ 110,37 (cento e dez reais e trinta e sete centavos), nos moldes do § 2º do art. 16 da Lei Complementar nº 005, de 30 de janeiro de 1991.","paiId":2990,"id":2992},{"tipo":"art","label":"Art. 11.","texto":"Este Decreto entra em vigor na data de sua publicação, produzindo seus efeitos a partir de 1º de janeiro de 2026.","paiId":2986,"id":2993}],"anexos":[{"id":3792,"nome":"ANEXO I","descricao":"CALENDÁRIO DE RECOLHIMENTO DE TRIBUTOS MUNICIPAIS DE MARICÁ","tipo":"secoes","secoes":[{"titulo":"I. IPTU — Imposto sobre a Propriedade Predial e Territorial Urbana","colunas":["COTA","VENCIMENTO","DESCONTO","BASE LEGAL"],"linhas":[["ÚNICA","27/02/2026","15%","Art. 16, I, da LC nº 005, de 30 de janeiro de 1991"],["01","27/02/2026","10%","Art. 16, II, da LC nº 005, de 30 de janeiro de 1991"],["02","31/03/2026","^","^"],["03","30/04/2026","^","^"],["04","29/05/2026","^","^"],["05","30/06/2026","^","^"],["06","31/07/2026","^","^"],["07","31/08/2026","^","^"],["08","30/09/2026","^","^"],["09","30/10/2026","^","^"],["10","30/11/2026","^","^"]]},{"titulo":"II. ISSQN Variável — Imposto Sobre Serviços de Qualquer Natureza (Variável)","colunas":["COMPETÊNCIA","VENCIMENTO","BASE LEGAL"],"linhas":[["JAN - 2025","20/02/2026","Art. 38, da LC nº 389, de 20 de dezembro de 2023"],["FEV - 2025","20/03/2026","^"],["MAR - 2025","20/04/2026","^"],["ABR - 2025","20/05/2026","^"],["MAI - 2025","19/06/2026","^"],["JUN - 2025","20/07/2026","^"],["JUL - 2025","20/08/2026","^"],["AGO - 2025","18/09/2026","^"],["SET - 2025","20/10/2026","^"],["OUT - 2025","19/11/2026","^"],["NOV - 2025","18/12/2026","^"],["DEZ - 2025","20/01/2027","^"]]},{"titulo":"III. ISSQN Fixo — Imposto Sobre Serviços de Qualquer Natureza (Fixo — Autônomos e Profissionais Liberais)","colunas":["COTA","VENCIMENTO","BASE LEGAL"],"linhas":[["ÚNICA","30/06/2026","Art. 39, da LC nº 389, de 20 de dezembro de 2023"]]},{"titulo":"IV. TCL — Taxa de Coleta de Lixo","colunas":["COTA","VENCIMENTO","BASE LEGAL"],"linhas":[["ÚNICA","27/02/2026","Arts. 116 e 117, da LC nº 005, de 30 de janeiro de 1991"],["01","27/02/2026","^"],["02","31/03/2026","^"],["03","30/04/2026","^"],["04","29/05/2026","^"],[
