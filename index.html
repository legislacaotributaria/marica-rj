pais - CATRIMA.","paiId":3644,"id":3650},{"tipo":"art","label":"Art. 25.","texto":"Os contribuintes sujeitos ao pagamento mensal do imposto ficam obrigados a:","paiId":3643,"id":3651},{"tipo":"inc","label":"I","texto":"manter escrita fiscal destinada ao registro dos serviços prestados e tomados, ainda que não tributáveis;","paiId":3651,"id":3652},{"tipo":"inc","label":"II","texto":"emitir notas fiscais de serviços ou outros documentos admitidos pela Administração, por ocasião da prestação dos serviços.","paiId":3651,"id":3653},{"tipo":"par","label":"§1º","texto":"O Poder Executivo definirá os modelos de livros, notas fiscais e demais documentos a serem obrigatoriamente utilizados pelo contribuinte, bem como os contribuintes dispensados desta formalidade.","paiId":3651,"id":3654},{"tipo":"par","label":"§2º","texto":"Constituem instrumentos auxiliares da escrita fiscal os livros de contabilidade geral do contribuinte, tanto os de uso obrigatório quanto os auxiliares, os documentos fiscais, as guias de pagamento do imposto e demais documentos ainda que pertencentes ao arquivo de terceiros, que se relacionem direta ou indiretamente com os lançamentos efetuados na escrita fiscal ou comercial do contribuinte ou responsável.","paiId":3651,"id":3655},{"tipo":"par","label":"§3º","texto":"Cada estabelecimento terá escrituração tributária própria, salvo situações expressamente previstas em regulamento.","paiId":3651,"id":3656},{"tipo":"par","label":"§4º","texto":"Sendo insatisfatórios os meios normais para fiscalização e tendo em vista a natureza do serviço prestado, o Poder Executivo poderá decretar, ou a autoridade administrativa por despacho fundamentado, permitir ou exigir, complementarmente ou em substituição, a adoção de instrumentos e documentos especiais necessários à perfeita apuração dos serviços prestados, da receita auferida e do imposto devido.","paiId":3651,"id":3657},{"tipo":"par","label":"§5º","texto":"Durante o prazo de 5 (cinco) anos dado à Fazenda Pública para constituir o crédito tributário, o lançamento ficará sujeito a revisão, devendo o contribuinte manter à disposição do fisco os livros e os documentos tanto os obrigatórios como os instrumentos auxiliares.","paiId":3651,"id":3658},{"tipo":"art","label":"Art. 26.","texto":"Fica autorizado o Poder Executivo a criar ou aceitar documentação simplificada no caso de contribuintes optantes pelo Simples Nacional ou qualquer outro regime simplificado que venha a substituí-lo.","paiId":3643,"id":3659},{"tipo":"art","label":"Art. 27.","texto":"O lançamento do imposto não implica reconhecimento ou regularidade do exercício de atividade ou da legalidade das condições referentes a local, instalações, equipamentos ou obras.","paiId":3643,"id":3660},{"tipo":"art","label":"Art. 28.","texto":"Decorrido o prazo de 5 (cinco) anos contados a partir da ocorrência do fato gerador sem que a Fazenda Pública tenha se pronunciado, considera-se homologado o lançamento e definitivamente extinto o crédito, salvo se comprovada a ocorrência de dolo, fraude ou simulação.","paiId":3643,"id":3661},{"tipo":"capitulo","label":"Capítulo IX","texto":"ARBITRAMENTO","paiId":3459,"id":3662},{"tipo":"art","label":"Art. 29.","texto":"A autoridade fiscal procederá ao arbitramento para a apuração do preço sempre que, fundamentalmente, incorrer em ao menos uma das seguintes situações:","paiId":3662,"id":3663},{"tipo":"inc","label":"I","texto":"o contribuinte não possuir livros fiscais de utilização obrigatória ou estes não se encontrarem com sua escrituração atualizada, ou ainda nos casos de perda, extravio ou inutilização de livros ou documentos fiscais;","paiId":3663,"id":3664},{"tipo":"inc","label":"II","texto":"o contribuinte reiteradamente violar o disposto na legislação tributária;","paiId":3663,"id":3665},{"tipo":"inc","label":"III","texto":"o contribuinte, depois de intimado, deixar de exibir os livros fiscais de utilização obrigatória, ou não prestar os esclarecimentos exigidos pela fiscalização;","paiId":3663,"id":3666},{"tipo":"inc","label":"IV","texto":"ocorrer fraude ou sonegação de dados julgados indispensáveis ao lançamento;","paiId":3663,"id":3667},{"tipo":"inc","label":"V","texto":"sejam omissos, insuficientes ou não mereçam fé as declarações, os esclarecimentos prestados ou os livros e/ou os documentos expedidos pelo sujeito passivo;","paiId":3663,"id":3668},{"tipo":"inc","label":"VI","texto":"o preço seja notoriamente inferior ao corrente no mercado ou desconhecido pela autoridade administrativa;","paiId":3663,"id":3669},{"tipo":"inc","label":"VII","texto":"o contribuinte prestar serviço sem estar regularmente inscrito no Município de Maricá.","paiId":3663,"id":3670},{"tipo":"inc","label":"VIII","texto":"existência de atos qualificados em lei como crimes ou contravenções ou que, mesmo sem essa qualificação, sejam praticados com dolo, fraude ou simulação.","paiId":3663,"id":3671},{"tipo":"par","label":"Parágrafo único","texto":"O arbitramento referir-se-á, exclusivamente, aos fatos ocorridos no período em que se verificarem os pressupostos mencionados nos incisos deste artigo.","paiId":3663,"id":3672},{"tipo":"art","label":"Art. 30.","texto":"Nas hipóteses do artigo 29, o arbitramento poderá ser procedido pela autoridade administrativa levando-se em conta, entre outros os seguintes elementos:","paiId":3662,"id":3673},{"tipo":"inc","label":"I","texto":"os recolhimentos feitos em períodos idênticos pelo contribuinte ou por outros contribuintes que exerçam a mesma atividade em condições semelhantes;","paiId":3673,"id":3674},{"tipo":"inc","label":"II","texto":"os preços correntes dos serviços no mercado em vigor na época da apuração;","paiId":3673,"id":3675},{"tipo":"inc","label":"III","texto":"as condições próprias do contribuinte, bem como os elementos que possam evidenciar sua situação econômico-financeira, abaixo descritas, acrescidos da margem de lucro praticada no mercado levando-se em consideração atividades semelhantes:","paiId":3673,"id":3676},{"tipo":"ali","label":"a)","texto":"valor de matérias-primas, combustíveis e outros materiais consumidos ou aplicados no período;","paiId":3676,"id":3677},{"tipo":"ali","label":"b)","texto":"folha de salários pagos, honorários de diretores, retiradas de sócios ou gerentes e respectivas obrigações trabalhistas e sociais;","paiId":3676,"id":3678},{"tipo":"ali","label":"c)","texto":"despesas com fornecimentos de água, luz, força, telefone e demais encargos obrigatórios do contribuinte, inclusive tributos.","paiId":3676,"id":3679},{"tipo":"inc","label":"IV","texto":"as informações prestadas pelo titular da serventia à Corregedoria do Tribunal de Justiça ou dados obtidos junto ao Conselho Nacional de Justiça – CNJ, no caso dos serviços a que se refere o subitem 21.01 do Anexo I desta lei.","paiId":3673,"id":3680},{"tipo":"art","label":"Art. 31.","texto":"Para arbitramento da base de cálculo do ISSQN na construção civil de imóveis será utilizado o produto entre a área construída, reparada, conservada, reformada, modificada ou demolida e o Custo Unitário Base por metro quadrado (CUB/m²) Estadual, sem desonerações, calculado pelo Sindicato da Indústria da Construção Civil no Estado do Rio de Janeiro (Sinduscon-Rio), do mês imediatamente anterior ao do lançamento, de acordo com o projeto padrão utilizado para o cálculo do CUB/m² do tipo da construção em tela, deduzido do valor referente aos materiais, conforme definido em regulamento.","paiId":3662,"id":3681},{"tipo":"par","label":"Parágrafo único","texto":"A base de cálculo arbitrada na forma do caput deste artigo será ajustada para fração de seu valor nos seguintes casos:","paiId":3681,"id":3682},{"tipo":"inc","label":"I","texto":"10% na demolição;","paiId":3682,"id":3683},{"tipo":"inc","label":"II","texto":"25% na reparação, conservação, reforma e modificação sem acréscimo de área;","paiId":3682,"id":3684},{"tipo":"inc","label":"III","texto":"20% na construção de piscinas e cisternas;","paiId":3682,"id":3685},{"tipo":"inc","label":"IV","texto":"15% na construção de pátios descobertos;","paiId":3682,"id":3686},{"tipo":"inc","label":"V","texto":"15% na construção de muros.","paiId":3682,"id":3687},{"tipo":"art","label":"Art. 32.","texto":"O arbitramento do preço dos serviços não exonera o contribuinte da imposição das penalidades cabíveis, quando for o caso.","paiId":3662,"id":3688},{"tipo":"art","label":"Art. 33.","texto":"O arbitramento só será revisto mediante apresentação de provas documentais que possam estabelecer a real base de cálculo.","paiId":3662,"id":3689},{"tipo":"capitulo","label":"Capítulo X","texto":"ESTIMATIVA","paiId":3459,"id":3690},{"tipo":"art","label":"Art. 34.","texto":"A autoridade administrativa poderá, quando se tratar de atividades cujo exercício seja de natureza temporária ou transitória ou estejam vinculadas a fatores ou acontecimentos ocasionais ou excepcionais, fixar o valor do imposto a partir de uma base de cálculo estimada.","paiId":3690,"id":3691},{"tipo":"par","label":"§1º","texto":"Na hipótese do que trata o caput deste artigo, o valor estimado do imposto deverá ser caucionado, conforme disposto em regulamento, antes da ocorrência do fato gerador e não poderá o contribuinte iniciar suas atividades sem efetuar a caução, sob pena de interdição do local, independentemente de qualquer formalidade.","paiId":3691,"id":3692},{"tipo":"par","label":"§2º","texto":"Após a ocorrência do fato gerador a autoridade tributária apurará o valor do tributo a ser recolhido e fará encontro de contas entre o valor devido e o valor caucionado, no prazo 5 (cinco) dias úteis.","paiId":3691,"id":3693},{"tipo":"par","label":"§3º","texto":"Caso o sujeito passivo não se apresente para a homologação do imposto no encontro de contas, será o valor caucionado convertido em renda, resguardado o direito da Fazenda Municipal de lançar eventuais diferenças constatadas entre o valor estimado e o valor arbitrado.","paiId":3691,"id":3694},{"tipo":"art","label":"Art. 35.","texto":"O valor do imposto lançado por estimativa levará em consideração:","paiId":3690,"id":3695},{"tipo":"inc","label":"I","texto":"o tempo de duração e a natureza específica da atividade;","paiId":3695,"id":3696},{"tipo":"inc","label":"II","texto":"o preço corrente dos serviços;","paiId":3695,"id":3697},{"tipo":"inc","label":"III","texto":"o local do estabelecimento do contribuinte;","paiId":3695,"id":3698},{"tipo":"inc","label":"IV","texto":"o volume da receita em períodos anteriores e sua projeção para os períodos seguintes, podendo ainda se basear na receita de outros contribuintes de idêntica atividade.","paiId":3695,"id":3699},{"tipo":"art","label":"Art. 36.","texto":"Os contribuintes que incorrerem na hipótese do § 3º do artigo 34 poderão, no prazo de 30 (trinta) dias a contar da ciência da respectiva notificação, apresentar impugnação contra o valor arbitrado, observado o disposto na legislação municipal.","paiId":3690,"id":3700},{"tipo":"par","label":"Parágrafo único","texto":"A impugnação prevista no caput deste conterá, obrigatoriamente, o valor que o interessado reputar justo e os elementos para sua aferição.","paiId":3700,"id":3701},{"tipo":"capitulo","label":"Capítulo XI","texto":"PAGAMENTO E ARRECADAÇÃO","paiId":3459,"id":3702},{"tipo":"art","label":"Art. 37.","texto":"O imposto será recolhido, através da rede bancária autorizada, através do Documento de Arrecadação da Receita Municipal – DARM específico, emitida pela administração tributária.","paiId":3702,"id":3703},{"tipo":"art","label":"Art. 38.","texto":"No caso do imposto calculado sobre a receita bruta mensal apurada ou estimada, o recolhimento deverá ser feito mensalmente aos cofres da Prefeitura Municipal, através dos bancos autorizados, independentemente de qualquer aviso ou notificação e do recebimento do preço do serviço ou da época do seu recebimento, até o dia 20 (vinte) do mês subsequente ao da ocorrência do fato gerador, conforme dispuser o regulamento.","paiId":3702,"id":3704},{"tipo":"par","label":"Parágrafo único","texto":"Os responsáveis pela retenção e pelo recolhimento do imposto o farão no prazo determinado no caput.","paiId":3704,"id":3705},{"tipo":"art","label":"Art. 39.","texto":"Quando os serviços forem prestados sob a forma de trabalho pessoal do próprio contribuinte o recolhimento do imposto se dará até 30 de junho de cada ano, de acordo com o Calendário de Recolhimento de Tributos Municipais - CATRIMA.","paiId":3702,"id":3706},{"tipo":"par","label":"Parágrafo único","texto":"No caso de início de atividade o imposto será devido, antes do início da atividade, proporcionalmente ao número de meses restantes no ano.","paiId":3706,"id":3707},{"tipo":"capitulo","label":"Capítulo XII","texto":"INSCRIÇÃO NO CADASTRO MOBILIÁRIO","paiId":3459,"id":3708},{"tipo":"art","label":"Art. 40.","texto":"O contribuinte domiciliado no Município de Maricá, com ou sem estabelecimento, ainda que isento ou imune, deve requerer sua inscrição no Cadastro Mobiliário do Município antes de iniciar suas atividades, fornecendo os elementos e as informações necessárias para a correta fiscalização do tributo.","paiId":3708,"id":3709},{"tipo":"par","label":"§1º","texto":"O contribuinte ou responsável não domiciliado neste Município, que por conta da legislação aplicável deva recolher o tributo ao Município de Maricá deverá promover sua inscrição eventual, da forma como dispuser o regulamento.","paiId":3709,"id":3710},{"tipo":"par","label":"§2º","texto":"O órgão responsável pelo Cadastro Mobiliário do Município, deverá promover de ofício a inscrição, a alteração ou a baixa, quando constatada situação de fato, quedando inerte a pessoa física ou jurídica responsável, ou por qualquer outro motivo, sem prejuízo das sanções previstas na legislação.","paiId":3709,"id":3711},{"tipo":"par","label":"§3º","texto":"Fica adotada a Classificação Nacional de Atividades Econômicas – CNAE da Comissão Nacional de Classificação - CONCLA, como elemento base para o cadastramento e recadastramento das empresas localizadas no Município de Maricá.","paiId":3709,"id":3712},{"tipo":"par","label":"§4º","texto":"Fica adotada a Classificação Brasileira de Ocupações – CBO da Comissão Nacional de Classificação - CONCLA, como elemento base para o cadastramento e recadastramento das ocupações econômicas no Município de Maricá.","paiId":3709,"id":3713},{"tipo":"art","label":"Art. 41.","texto":"Para cada estabelecimento o contribuinte deve fazer uma inscrição, exceto quando tratar-se de não-estabelecido, que fica sujeito à inscrição única por atividade.","paiId":3708,"id":3714},{"tipo":"art","label":"Art. 42.","texto":"Em se tratando de prestação dos Serviços de Registros Públicos, Cartorários e Notariais, previstos no subitem 21.01 do Anexo I desta lei, a inscrição municipal será feita em nome do titular da serventia.","paiId":3708,"id":3715},{"tipo":"art","label":"Art. 43.","texto":"A inscrição não presume a aceitação pela Prefeitura dos dados e das informações apresentadas pelo contribuinte.","paiId":3708,"id":3716},{"tipo":"art","label":"Art. 44.","texto":"O contribuinte deverá comunicar à Prefeitura no prazo de 30 (trinta) dias das seguintes ocorrências:","paiId":3708,"id":3717},{"tipo":"inc","label":"I","texto":"alteração ou inclusão de novas atividades, alteração de contrato social ou de quaisquer outros dados cadastrais;","paiId":3717,"id":3718},{"tipo":"inc","label":"II","texto":"cessação de atividades, a fim de obter a baixa de inscrição cadastral.","paiId":3717,"id":3719},{"tipo":"art","label":"Art. 45.","texto":"O contribuinte deverá comunicar à Prefeitura a paralisação de suas atividades com antecedência mínima de 72 (setenta e duas) horas da ocorrência, estabelecendo no comunicado o período da paralisação.","paiId":3708,"id":3720},{"tipo":"par","label":"Parágrafo único","texto":"Caso o contribuinte resolva retomar suas atividades antes do término do prazo constante do comunicado, deverá o mesmo proceder comunicado à Prefeitura de retorno de atividade obedecendo a mesma antecedência prevista no caput.","paiId":3720,"id":3721},{"tipo":"capitulo","label":"Capítulo XIII","texto":"OBRIGAÇÕES ACESSÓRIAS ESPECÍFICAS","paiId":3459,"id":3722},{"tipo":"art","label":"Art. 46.","texto":"Fica adotada a Declaração Mensal de Serviços de Instituições Financeiras – DESIF, que consiste em sistema eletrônico para registro e apuração das contas tributáveis, cálculo e emissão do respectivo documento de arrecadação do ISSQN devido pelas instituições financeiras e equiparadas, autorizadas a funcionar pelo Banco Central do Brasil – BACEN, e demais pessoas jurídicas obrigadas a utilizar o Plano Contábil das Instituições do Sistema Financeiro Nacional – COSIF, conforme dispuser o regulamento.","paiId":3722,"id":3723},{"tipo":"art","label":"Art. 47.","texto":"Será pessoalmente responsável pelas obrigações tributárias resultantes de atos praticados com infração ao regulamento da DESIF o gerente, diretor e/ou representante de cada agência das instituições financeiras.","paiId":3722,"id":3724},{"tipo":"capitulo","label":"Capítulo XIV","texto":"DA NOTA FISCAL DE SERVIÇOS ELETRÔNICA E NOTA FISCAL AVULSA","paiId":3459,"id":3725},{"tipo":"art","label":"Art. 48.","texto":"A Nota Fiscal de Serviços eletrônica – NFS-e, documento gerado e armazenado eletronicamente no sistema gerenciador do ISSQN disponibilizado pela Prefeitura Municipal de Maricá, é o documento fiscal básico que objetiva registrar as operações relativas à prestação de serviços pelos prestadores de serviço estabelecidos no Município de Maricá.","paiId":3725,"id":3726},{"tipo":"par","label":"Parágrafo único","texto":"As normas para autorização e emissão da NFS-e e as regras para operacionalização do Recibo Provisório de Serviço - RPS serão definidas em regulamento.","paiId":3726,"id":3727},{"tipo":"art","label":"Art. 49.","texto":"A emissão da NFS-e constitui confissão de dívida do Imposto Sobre Serviços de Qualquer Natureza incidente na operação, ficando a falta de seu recolhimento sujeita a cobrança administrativa ou judicial, observados os procedimentos regulamentares.","paiId":3725,"id":3728},{"tipo":"art","label":"Art. 50.","texto":"A Nota Fiscal Avulsa de Serviços eletrônica – NFAS-e, documento gerado e armazenado eletronicamente no sistema gerenciador do ISSQN disponibilizado pela Prefeitura Municipal de Maricá, destina-se às pessoas físicas ou jurídicas do Município de Maricá, ou de fora deste, que aqui prestem serviços eventuais, conforme definido em regulamento.","paiId":3725,"id":3729},{"tipo":"par","label":"§1º","texto":"O ISSQN será exigido do prestador antecipadamente, por ocasião da emissão da NFAS-e, mediante alíquota especificada no Anexo I e II desta Lei.","paiId":3729,"id":3730},{"tipo":"par","label":"§2º","texto":"A Nota Fiscal Avulsa de Serviços eletrônica:","paiId":3729,"id":3731},{"tipo":"inc","label":"I","texto":"será fornecida pela autoridade fiscal, mediante solicitação do interessado, nos limites e termos a serem definidos em Resolução do órgão responsável pela arrecadação municipal;","paiId":3731,"id":3732},{"tipo":"inc","label":"II","texto":"obedecerá a uma numeração anual geral e sequencial crescente, estabelecida pela administração;","paiId":3731,"id":3733},{"tipo":"inc","label":"III","texto":"será automaticamente gravada na escrituração do tomador do serviço;","paiId":3731,"id":3734},{"tipo":"inc","label":"IV","texto":"dispensa o tomador do serviço do recolhimento do ISSQN a ela relativo;","paiId":3731,"id":3735},{"tipo":"inc","label":"V","texto":"não terá custo de emissão.","paiId":3731,"id":3736},{"tipo":"par","label":"§3º","texto":"Não poderá ser fornecida NFAS-e, devendo o contribuinte regularizar sua atividade e solicitar autorização para emissão de Nota Fiscal de Serviços eletrônica – NFS-e, quando os serviços não se caracterizarem como eventuais.","paiId":3729,"id":3737},{"tipo":"capitulo","label":"Capítulo XV","texto":"DOS INCENTIVOS FISCAIS","paiId":3459,"id":3738},{"tipo":"art","label":"Art. 51.","texto":"O Poder Executivo, no interesse da política fiscal de tributação, arrecadação e fiscalização, poderá conceder incentivos em favor da pessoa física que solicitar Nota Fiscal de Serviços eletrônica (NFS-e) das pessoas jurídicas ou equiparadas estabelecidas no Município de Maricá.","paiId":3738,"id":3739},{"tipo":"par","label":"Parágrafo único","texto":"A concessão e/ou utilização do incentivo poderá ser suspensa a qualquer tempo por ato do Poder Executivo, com fulcro no interesse público do Município.","paiId":3739,"id":3740},{"tipo":"art","label":"Art. 52.","texto":"O incentivo a que se refere o artigo 52 poderá consistir em uma das modalidades constantes nos incisos deste artigo ou em todas, conforme dispuser o regulamento:","paiId":3738,"id":3741},{"tipo":"inc","label":"I","texto":"concessão de crédito, correspondente a percentual do montante do ISSQN relativo a cada NFS-e recebida pelo tomador, para fins de abatimento no Imposto sobre a Propriedade Predial e Territorial Urbana – IPTU lançado pelo Município de Maricá;","paiId":3741,"id":3742},{"tipo":"inc","label":"II","texto":"participação em sorteio de prêmios;","paiId":3741,"id":3743},{"tipo":"inc","label":"III","texto":"pagamento de importância, correspondente a percentual do montante do ISSQN relativo a cada NFS-e recebida pelo tomador, em moeda ou cujo valor nela se possa exprimir.","paiId":3741,"id":3744},{"tipo":"art","label":"Art. 53.","texto":"O crédito gerado e/ou o pagamento de importância observarão o percentual de até 30% (trinta por cento) aplicados sobre o montante do ISSQN.","paiId":3738,"id":3745},{"tipo":"par","label":"§1º","texto":"O valor do crédito e/ou da importância somente será gerado após o pagamento do ISSQN relativo à NFS-e.","paiId":3745,"id":3746},{"tipo":"par","label":"§2º","texto":"Quando o prestador de serviço for optante pelo Regime Especial Unificado de Arrecadação de Tributos e Contribuições devidos pelas Microempresas e Empresas de Pequeno Porte (Simples Nacional), será considerado como montante do ISSQN o resultado da aplicação da alíquota de 2% (dois por cento) sobre a base de cálculo.","paiId":3745,"id":3747},{"tipo":"par","label":"§3º","texto":"O crédito terá validade até o dia trinta de setembro do segundo exercício seguinte àquele em que tiver sido gerado.","paiId":3745,"id":3748},{"tipo":"par","label":"§4º","texto":"Não gerará crédito e/ou importância a ser paga:a prestação de serviço isenta, imune ou em que não houver incidência do ISSQN;","paiId":3745,"id":3749},{"tipo":"inc","label":"I","texto":"a prestação de serviço cujo pagamento do ISSQN for realizado após a inscrição em Dívida Ativa;","paiId":3749,"id":3750},{"tipo":"inc","label":"II","texto":"a prestação de serviço por contribuinte submetido ao regime de pagamento do ISSQN a partir de base de cálculo estimada ou por valor fixo, assim entendido também o MEI.","paiId":3749,"id":3751},{"tipo":"par","label":"§5º","texto":"Não farão jus ao crédito e/ou ao pagamento de importância:","paiId":3745,"id":3752},{"tipo":"inc","label":"I","texto":"as pessoas naturais que não possuam inscrição no Cadastro de Pessoas Físicas (CPF) do Governo Federal;","paiId":3752,"id":3753},{"tipo":"inc","label":"II","texto":"as pessoas físicas que não tiverem seu CPF aposto na Nota Fiscal de Serviços eletrônica pelo prestador do serviço.","paiId":3752,"id":3754},{"tipo":"capitulo","label":"Capítulo XVI","texto":"DA FISCALIZAÇÃO, INFRAÇÕES E PENALIDADES","paiId":3459,"id":3755},{"tipo":"art","label":"Art. 54.","texto":"Fica o Poder Executivo autorizado a utilizar a autorregularização como instrumento de incentivo aos contribuintes que se encontrem com obrigações tributárias pendentes perante a Fazenda Municipal, procedimento que consiste no saneamento voluntário das irregularidades decorrentes de divergências ou inconsistências identificadas pelo Fisco no exercício regular de sua atividade.","paiId":3755,"id":3756},{"tipo":"par","label":"§1º","texto":"O procedimento de autorregularização de que trata o caput se iniciará com a notificação do sujeito passivo, na qual serão indicadas as pendências ou inconsistências tributárias encontradas pela fiscalização de tributos.","paiId":3756,"id":3757},{"tipo":"par","label":"§2º","texto":"A emissão da notificação de que trata o parágrafo anterior não configura início de ação fiscal e deverá estabelecer o prazo máximo para a autorregularização do contribuinte, que não será superior a 90 (noventa) dias.","paiId":3756,"id":3758},{"tipo":"art","label":"Art. 55.","texto":"O descumprimento das normas relativas às obrigações principais e acessórias do Imposto Sobre Serviços de Qualquer Natureza, quando apurados em regular procedimento fiscal, serão puníveis com as sanções dispostas neste capítulo.","paiId":3755,"id":3759},{"tipo":"par","label":"Parágrafo único","texto":"A imposição de quaisquer das penalidades previstas neste Capítulo não exime o sujeito passivo:","paiId":3759,"id":3760},{"tipo":"inc","label":"I","texto":"da obrigação de pagar o tributo devido com a incidência da correção monetária, da multa de mora e dos juros legalmente previstos;","paiId":3760,"id":3761},{"tipo":"inc","label":"II","texto":"do cumprimento das obrigações acessórias tributárias;","paiId":3760,"id":3762},{"tipo":"inc","label":"III","texto":"do cumprimento de quaisquer outras sanções civis, administrativas ou criminais previstas no ordenamento jurídico.","paiId":3760,"id":3763},{"tipo":"art","label":"Art. 56.","texto":"O descumprimento da obrigação principal, quando ocorrer falta de pagamento ou pagamento a menor do tributo devido apurado em procedimento fiscal regular, resultará nas seguintes penalidades aplicadas ao sujeito passivo obrigado:","paiId":3755,"id":3764},{"tipo":"inc","label":"IV","texto":"nos casos de condutas não tipificadas na legislação como crimes contra a ordem tributária, multa de 75% (setenta e cinco por cento) do montante do tributo devido em UFIMA.","paiId":3764,"id":3765},{"tipo":"inc","label":"V","texto":"nos casos de condutas tipificadas na legislação como crimes contra a ordem tributária, multa de 150% (cento e cinquenta por cento) do montante do tributo devido em UFIMA, independentemente da representação fiscal para fins penais.","paiId":3764,"id":3766},{"tipo":"art","label":"Art. 57.","texto":"As infrações a qualquer obrigação acessória prevista na legislação do ISSQN, apuradas por meio de regular procedimento fiscal, ficam, por competência mensal, sujeitas a aplicação das seguintes multas:","paiId":3755,"id":3767},{"tipo":"inc","label":"I","texto":"1 (um) UFIMA ou 20% (vinte por cento) do imposto devido, o que for maior, quando se tratar de pessoa jurídica ou equiparada não enquadrada nos incisos II e III deste artigo;","paiId":3767,"id":3768},{"tipo":"inc","label":"II","texto":"5 (cinco) UFIMA ou 20% (vinte por cento) do imposto devido, o que for maior, quando se tratar de notários e oficiais de registro de imóveis ou seus prepostos;","paiId":3767,"id":3769},{"tipo":"inc","label":"III","texto":"20 (dez) UFIMA ou 20% (vinte por cento) do imposto devido, o que for maior, quando se tratar de instituição financeira ou equiparada.","paiId":3767,"id":3770},{"tipo":"art","label":"Art. 58.","texto":"Será aplicada multa de 20 (vinte) UFIMA, sem prejuízo da representação fiscal para fins penais, quando houver embaraço a ação fiscal, não for fornecida informação exigida pela Administração Tributária ou for fornecida em desacordo com a verdade material dos atos e fatos ocorridos.","paiId":3755,"id":3771},{"tipo":"par","label":"§1º","texto":"Quando o embaraço à ação fiscal impossibilitar a apuração direta e real do crédito tributário, além da multa por embaraço já aplicada durante o procedimento fiscal, será imposta multa no valor correspondente ao dobro da multa prevista no caput deste artigo, sem prejuízo da constituição do crédito tributário por arbitramento.","paiId":3771,"id":3772},{"tipo":"par","label":"§2º","texto":"Havendo embaraço à ação fiscal que motive a extinção de crédito tributário por decadência, além da imposição da multa prevista no caput deste artigo, será imposta a multa de 200% (duzentos por cento) do valor atualizado do crédito extinto.","paiId":3771,"id":3773},{"tipo":"art","label":"Art. 59.","texto":"Na reincidência, a infração será punida com o dobro da penalidade a ela correspondente.","paiId":3755,"id":3774},{"tipo":"par","label":"§1º","texto":"Entende-se por reincidência o cometimento de nova infração, depois de tornar-se definitiva a decisão administrativa que tenha confirmado infração anterior.","paiId":3774,"id":3775},{"tipo":"par","label":"§2º","texto":"Para efeitos de reincidência não prevalecerá a decisão definitiva anterior se entre a sua data e a da prática da nova infração tiver decorrido período de tempo superior a 5 (cinco) anos.","paiId":3774,"id":3776},{"tipo":"par","label":"§3º","texto":"No caso de instituições financeiras, o embaraço à fiscalização pela não entrega de documentos ou informações solicitadas pelo fisco mediante instauração de Processo Administrativo Tributário, acarretará multa de 25 (vinte e cinco) UFIMA por documento não entregue e/ou informação não prestada, sem prejuízo da penalidade prevista no § 1º deste artigo.","paiId":3774,"id":3777},{"tipo":"art","label":"Art. 60.","texto":"As multas relativas à falta de prestação de informações ou à incorreção no cumprimento de obrigações acessórias, quando em valor fixo, terão redução de:","paiId":3755,"id":3778},{"tipo":"inc","label":"I","texto":"90% (noventa por cento) para os Microempreendedor Individual (MEI);","paiId":3778,"id":3779},{"tipo":"inc","label":"II","texto":"50% (cinquenta por cento) para as microempresas ou empresas de pequeno porte optantes pelo Simples Nacional.","paiId":3778,"id":3780},{"tipo":"par","label":"Parágrafo único","texto":"As reduções de que tratam os incisos I e II do caput não se aplicam na:","paiId":3778,"id":3781},{"tipo":"inc","label":"I","texto":"hipótese de fraude, resistência ou embaraço à fiscalização;","paiId":3781,"id":3782},{"tipo":"inc","label":"II","texto":"ausência de pagamento da multa no prazo de 30 (trinta) dias após a notificação.","paiId":3781,"id":3783},{"tipo":"titulo","label":"TÍTULO II","texto":"DAS DISPOSIÇÕES FINAIS E TRANSITÓRIAS","paiId":null,"id":3784},{"tipo":"art","label":"Art. 61.","texto":"Livros e os documentos fiscais impressos do contribuinte são, pelo prazo de 5 (cinco) anos de seu encerramento ou enquanto produzirem seus efeitos, o que ocorrer por último, de exibição obrigatória à fiscalização.","paiId":3784,"id":3785},{"tipo":"art","label":"Art. 62.","texto":"Os profissionais autônomos de nível superior cadastrados no Município como Arquiteto(a) ou Engenheiro(a) Civil e deverão efetuar seu recadastramento até 90 (noventa) dias após a publicação desta lei, sob pena de cancelamento de sua inscrição municipal, sem prejuízo da cobrança de débitos porventura existentes.","paiId":3784,"id":3786},{"tipo":"art","label":"Art. 63.","texto":"Esta Lei entra em vigor na data da sua publicação, revogando o artigo 278 da Lei 910 de 14 de dezembro de 1990 (Lei Complementar nº 005 de 30 de janeiro de 1991); a Lei Complementar nº 112 de 12 de dezembro de 2003; a Lei Complementar nº 136 de 17 de janeiro de 2006; a Lei Complementar nº 192 de 14 de outubro de 2009; os artigos 40 e 41 da Lei Complementar nº 195 de 30 de outubro de 2009; a Lei Complementar nº 210 de 1º de julho de 2010; a Lei Complementar nº 213 de 02 de dezembro de 2010; os artigos 1º, 2º e 3º da Lei Complementar nº 240 de 08 de maio de 2014; a Lei Complementar nº 290 de 16 de novembro de 2017; a Lei Complementar 320 de 03 de dezembro de 2019; a Lei Complementar nº 323 de 11 de dezembro de 2019; a Lei Complementar nº 332 de 22 de dezembro de 2020; os artigos 13, 14, 15 e 16 e os Anexos I e II da Lei Complementar nº 357 de 30 de dezembro de 2021.","paiId":3784,"id":3787}],"anexos":[{"id":901,"nome":"ANEXO I","descricao":"TABELA DE ALÍQUOTAS DO IMPOSTO SOBRE SERVIÇOS DE QUALQUER NATUREZA INCIDENTES SOBRE O PREÇO D ","link":"JOM 1.631, de 23/08/2024","artigos":[{"tipo":"art","label":"Art. 1º","texto":"Inclui o inciso IV ao artigo 191 da Lei Complementar Municipal nº 005, de 30 de janeiro de 1991 - Código Tributário Municipal, que passa a viger com a seguinte forma e redação:␞__CITACAO__␞\"Art. 191. (…)\nIV – tratando-se de Domicílio Tributário Eletrônico (DTE), o regularmente instituído e implementado em ambiente virtual na rede mundial de computadores. (NR)\"","paiId":null,"id":3205},{"tipo":"art","label":"Art. 2º","texto":"Inclui o artigo 191-A e seus parágrafos na Lei Complementar Municipal nº 005, de 30 de janeiro de 1991 - Código Tributário Municipal, que passa a viger com a seguinte forma e redação:␞__CITACAO__␞\"Art. 191-A. Fica instituído o Domicílio Tributário Eletrônico – DTE, portal que será acessado por intermédio da página da Secretaria responsável pela administração tributária na internet, e implementado em ambiente virtual na rede mundial de computadores, a ser disciplinado em instrução normativa pelo titular do órgão fazendário.\n§1º É obrigatório o credenciamento para as pessoas jurídicas e físicas exercentes de atividades econômicas, inclusive aquelas que gozam de isenção ou imunidade, observada a cientificação do sujeito passivo tributário quanto ao credenciamento no DTE para a criação da caixa de notificações, bem como a forma, condições e prazos previstos em instrução normativa pelo titular do órgão fazendário.\n§2º A Fazenda Pública Municipal poderá utilizar o Domicílio Tributário Eletrônico (DTE) para, dentre outras finalidades:\nI – encaminhar notificações e intimações;\nII – cientificar o sujeito passivo de quaisquer tipos de atos administrativos, incluindo autos de infração, decisões finais, interlocutórias e outros atos processuais em processos administrativos-tributários, resposta e outros atos processuais relativos ao processo de consulta tributária, notificações de lançamento, formalização de lançamento de tributos, Termo de Início de Ação Fiscal e intimações de qualquer natureza;\nIII – encaminhar guias para recolhimento de tributos;\nIV – cientificar o sujeito passivo de pedido de diligência em processo de seu interesse;\nV – expedir quaisquer outros avisos, comunicações e solicitações no interesse da administração tributária;\nVI – expedir avisos e comunicações em geral.\n§3º O Domicílio Tributário Eletrônico (DTE) será disciplinado e regulamentado por meio de Instrução Normativa a ser expedida pelo titular do órgão fazendário, dispondo, dentre outros, sobre:\nI – as pessoas físicas e jurídicas obrigadas ao credenciamento e a utilização do Domicílio Tributário Eletrônico;\nII – a forma de credenciamento no referido ambiente virtual, o modo de acesso e os requisitos de sigilo e segurança relativos às suas diversas funcionalidades, bem como todas as obrigações acessórias concernentes à sua utilização;\nIII – a forma pela qual deverá se operar a comunicação eletrônica entre a Fazenda Pública Municipal e os contribuintes e responsáveis tributários;\nIV – a forma pela qual se dará a comunicação aos contribuintes e responsáveis tributários, individual ou globalmente, sobre o lançamento de tributos e suas ulteriores modificações, bem como a intimação da lavratura do auto de infração, ao infrator;\nV – o cronograma de credenciamento dos sujeitos passivos tributários;\nVI – quaisquer outras questões necessárias para o adequado funcionamento do DTE no município de Maricá.\n§4º As pessoas físicas e jurídicas, bem como seus representantes legais, ficam obrigados a se credenciarem junto à Fazenda Pública municipal na forma e a partir da vigência do ato normativo a que se refere o § 2º.\n§5º A comunicação realizada por meio do DTE será considerada de natureza pessoal para todos os efeitos legais, dispensando-se, nesse caso, a comunicação por qualquer outro meio.\n§6º O documento eletrônico transmitido na forma estabelecida nesta lei, com garantia de autoria, autenticidade e integridade será considerado original para todos os efeitos legais, considerando-se, ainda que:\nI – os documentos digitalizados e transmitidos na forma estabelecida nesta Lei têm a mesma força probante dos originais, ressalvada a alegação motivada e fundamentada de adulteração antes ou durante o processo de digitalização;\nII – os originais dos documentos digitalizados deverão ser preservados pelo seu detentor enquanto os fatos a que se referem não forem atingidos por decadência ou prescrição, na forma da legislação tributária, ou até que o crédito tributário esteja definitivamente constituído, em caso de suspensão por existir processo administrativo fiscal contencioso em andamento;\nIII – desde que devidamente motivado, poderá ser exigido, a qualquer tempo, do sujeito passivo a apresentação dos documentos originais no prazo de 10 (dez) dias, sendo que a sua não apresentação resultará na desconsideração dos documentos eletrônicos, fazendo prova unicamente a favor da administração.\n§7º Devem ser asseguradas formas de revogação ou de cancelamento definitivo do meio utilizado para as assinaturas previstas em instrução normativa, sobretudo em casos de comprometimento de sua segurança ou de vazamento de dados.\"","paiId":null,"id":3206},{"tipo":"art","label":"Art. 3º","texto":"Inclui o artigo 191-B na Lei Complementar Municipal nº 005, de 30 de janeiro de 1991 - Código Tributário Municipal, que passa a viger com a seguinte forma e redação:␞__CITACAO__␞\"Art. 191-B. A recusa ou ausência de credenciamento ao domicílio tributário eletrônico (DTE), após 30 (trinta) dias da regular notificação pela autoridade fiscal, ensejará multa no valor de 5 (cinco) vezes a Unidade Fiscal de Maricá (UFIMA), no caso de pessoa jurídica, e 1 (uma) vez a Unidade Fiscal de Maricá (UFIMA), no caso de MEI (Microempreendedor Individual), sem prejuízo de outras medidas administrativas cabíveis.\"","paiId":null,"id":3207},{"tipo":"art","label":"Art. 4º","texto":"Inclui o inciso II ao art. 313 da Lei Complementar Municipal nº 005, de 30 de janeiro de 1991 - Código Tributário Municipal, que passa a viger com a seguinte forma e redação:␞__CITACAO__␞\"Art. 313. (…)\nII – no domicílio tributário eletrônico (DTE), nos termos deste Código Tributário.\"","paiId":null,"id":3208},{"tipo":"art","label":"Art. 5º","texto":"Inclui o inciso IV ao art. 314 da Lei Complementar Municipal nº 005, de 30 de janeiro de 1991 - Código Tributário Municipal, que passa a viger com a seguinte forma e redação:␞__CITACAO__␞\"Art. 314. (…)\nIV – quando, no domicílio tributário eletrônico (DTE), o contribuinte efetivar a consulta eletrônica ao seu teor ou, tacitamente, após 15 (quinze) dias da disponibilização da mensagem se essa não for acessada dentro deste prazo.\"","paiId":null,"id":3209},{"tipo":"art","label":"Art. 6º","texto":"Altera o caput do art. 322 da Lei Complementar Municipal nº 005, de 30 de janeiro de 1991 - Código Tributário Municipal, que passa a viger com a seguinte redação:␞__CITACAO__␞\"Art. 322. O impugnador será notificado do despacho no próprio processo, mediante assinatura, por via postal registrada, ou por meio do DTE, na forma de Instrução Normativa, ou, ainda, por edital quando se encontrar em local incerto e não sabido.\"","paiId":null,"id":3210},{"tipo":"art","label":"Art. 7º","texto":"Fica revogado o art. 315 da Lei Complementar Municipal nº 005, de 30 de janeiro de 1991 - Código Tributário Municipal.","paiId":null,"id":3211},{"tipo":"art","label":"Art. 8º","texto":"Esta Lei Complementar entra em vigor na data de sua publicação.","paiId":null,"id":3212}],"anexos":[],"preambulo":"INSTITUI O DOMICÍLIO TRIBUTÁRIO ELETRÔNICO (DTE) NO MUNICÍPIO DE MARICÁ, ALTERANDO DISPOSITIVOS DA LEI COMPLEMENTAR Nº 005, DE 30 DE JANEIRO DE 1991 - CÓDIGO TRIBUTÁRIO MUNICIPAL.","formulaPromulgacao":"O POVO DO MUNICÍPIO DE MARICÁ, por seus representantes na Câmara Municipal, aprovou e o Prefeito Municipal, em seu nome sanciona a seguinte Lei Complementar:","dataExtenso":"21 DE AGOSTO DE 2024","assinatura":"Fabiano Taques Horta \nPREFEITO DO MUNICÍPIO DE MARICÁ","municipio":"Estado do Rio de Janeiro, RJ"},{"id":6,"tipo":"lc","num":"413","ano":"2025","ementa":"Dispõe sobre isenção fiscal, anistia e remissão de ISSQN para pescadores profissionais autônomos.","tributo":"issqn","situacao":"vigente","link":"JOM 1.72, de 22/08/2025","artigos":[{"tipo":"art","label":"Art. 1º","texto":"Concede aos pescadores profissionais do Município de Maricá, atividade 60048, isenção, remissão","paiId":null,"id":4186},{"tipo":"art","label":"Art. 2º","texto":"Farão jus à isenção, remissão e anistia os pescadores profissionais cadastrados como autônomos","paiId":null,"id":4187},{"tipo":"par","label":"Parágrafo único","texto":"Compreende-se como regime familiar o trabalho dos membros da mesma família, indispensável à própria subsistência e realizado em condições de mútua dependência e colaboração, sem a utilização de empregados.","paiId":4187,"id":4188},{"tipo":"art","label":"Art. 3º","texto":"Ficam isentos do pagamento do Imposto Sobre Serviços de Qualquer Natureza – ISSQN, os profissionais liberais e autônomos, que tenham inscrição como pessoa física no Cadastro de Contribuintes Mobiliários – CCM, atividade 60048, a partir do exercício de 2025, mediante reconhecimento anual pelo Poder Executivo.","paiId":null,"id":4189},{"tipo":"par","label":"§1º","texto":"O reconhecimento da isenção será concedido mediante requerimento do interessado, que deverá comprovar anualmente o atendimento aos requisitos estabelecidos nesta Lei Complementar.","paiId":4189,"id":4190},{"tipo":"par","label":"§2º","texto":"O requerimento de isenção deverá ser apresentado ao órgão responsável pela pasta Tributária e Fiscal","paiId":4189,"id":4191},{"tipo":"par","label":"§3º","texto":"Para o exercício fiscal de 2025, o requerimento de isenção deverá ser apresentado ao órgão responsável pela pasta Tributária e Fiscal até o dia 31 de outubro desse ano.","paiId":4189,"id":4192},{"tipo":"par","label":"§4º","texto":"A ausência do requerimento ou a falta de comprovação das condições exigidas resultará na revogação da isenção.","paiId":4189,"id":4193},{"tipo":"art","label":"Art. 4º","texto":"Ficam remitidos os créditos tributários, constituídos ou não, inscritos ou não em Dívida Ativa, relativos ao Imposto Sobre Serviços de Qualquer Natureza – ISSQN, bem como anistiadas as infrações relacionadas à falta de recolhimento do imposto incidente sobre os fatos geradores relacionados aos serviços a que se refere o artigo 1º, ocorridos até a data de publicação desta Lei Complementar.","paiId":null,"id":4194},{"tipo":"art","label":"Art. 5º","texto":"A remissão e a anistia previstas nesta Lei Complementar не geram direito à restituição de qualquer quantia que tiver sido paga.","paiId":null,"id":4195},{"tipo":"art","label":"Art. 6º","texto":"ºNo caso dos parcelamentos em curso a remissão e a anistia somente incidirão sobre os créditos tributários relativos às parcelas que ainda não tenham sido quitadas.","paiId":null,"id":4196},{"tipo":"art","label":"Art. 7º","texto":"Na hipótese de desistência em ação judicial o contribuinte deverá arcar com o recolhimento das custas e encargos porventura devidos.","paiId":null,"id":4197},{"tipo":"art","label":"Art. 8º","texto":"A remissão e a anistia previstas nesta Lei Complementar не geram direito adquirido e serão canceladas de ofício sempre que se apure que o beneficiado não satisfazia ou deixou de satisfazer as condições ou não cumpria ou deixou de cumprir os requisitos para a concessão do favor cobrando-se o crédito acrescido de juros de mora observado o disposto no parágrafo único do art. 172 e no parágrafo único do art. 182 ambos da Lei Federal nº 5.172 de 1966.","paiId":null,"id":4198},{"tipo":"art","label":"Art. 9º","texto":"Esta Lei Complementar entra em vigor na data de sua publicação.␞__CITACAO__␞\"ERRATA DA PUBLICAÇÃO DA LEI COMPLEMENTAR Nº 413, DE 21 DE AGOSTO DE 2025, PUBLICADA NO JOM Nº 1772, DE 22 DE AGOSTO DE 2025.\nOnde se lê:\n“Art. 5º A remissão e a anistia previstas nesta Lei Complementar не geram direito à restituição de qualquer quantia que tiver sido paga.\n(...)\nArt. 8º A remissão e a anistia previstas nesta Lei Complementar не geram direito adquirido e serão canceladas de ofício sempre que se apure que o beneficiado não satisfazia ou deixou de satisfazer as condições ou não cumpria ou deixou de cumprir os requisitos para a concessão do favor cobrando-se o crédito acrescido de juros de mora observado o disposto no parágrafo único do art. 172 e no parágrafo único do art. 182 ambos da Lei Federal nº 5.172 de 1966.”\nLeia-se:\n“Art. 5º A remissão e a anistia previstas nesta Lei Complementar não geram direito à restituição de qualquer quantia que tiver sido paga.\n(...)\nArt. 8º A remissão e a anistia previstas nesta Lei Complementar não geram direito adquirido e serão canceladas de ofício sempre que se apure que o beneficiado não satisfazia ou deixou de satisfazer as condições ou não cumpria ou deixou de cumprir os requisitos para a concessão do favor cobrando-se o crédito acrescido de juros de mora observado o disposto no parágrafo único do art. 172 e no parágrafo único do art. 182 ambos da Lei Federal nº 5.172 de 1966.\"\nMaricá, 27 de agosto de 2025. JOM Especial nº 355, de 28 de agosto de 2025\"","paiId":null,"id":4199}],"anexos":[],"preambulo":"DISPÕES SOBRE A CONCESSÃO DE ISENÇÃO FISCAL, ANISTIA E REMISSÃO RELATIVAS AO IMPOSTO SOBRE SERVIÇOS DE QUALQUER NATUREZA - ISSQN, NO CASO DOS PESCADORES PROFISSIONAIS REGISTRADOS COMO AUTÔNOMOS, NAS CONDIÇÕES QUE ESTABELECE.","formulaPromulgacao":"O povo do Município de Maricá, por seus representantes na Câmara Municipal aprovou e o Prefeito Municipal, em seu nome, sanciona a seguinte Lei Complementar:","dataExtenso":"21 DE AGOSTO DE 2025","assinatura":"Washington Luiz Cardoso Siqueira\nPREFEITO DO MUNICÍPIO DE MARICÁ","municipio":"Estado do Rio de Janeiro, RJ"},{"id":7,"tipo":"lc","num":"419","ano":"2025","ementa":"Altera dispositivos da Lei Complementar nº 389/2023 – ISSQN no Município de Maricá.","tributo":"issqn","situacao":"vigente","link":"JOM 1.804, de 07/11/2025","artigos":[{"tipo":"art","label":"Art. 1º","texto":"Os arts. 9º, 12, 14, 16, 17, 24, 47, 49, 56 e 57 da Lei Complementar nº 389, de 20 de dezembro de 2023, passam a vigorar com a seguinte redação:␞__CITACAO__␞\"Art. 9º ...........................................................\n...........................................................\nII – a pessoa jurídica, exceto MEI, ainda que imune ou isenta, tomadora ou intermediária dos serviços descritos nos subitens 3.05, 7.02, 7.04, 7.05, 7.09, 7.10, 7.11, 7.12, 7.16, 7.17, 7.18, 7.19, 11.01, 11.02, 11.04, item 12 (exceto o subitem 12.13), 16.01, 16.02, 17.05, 17.10 e item 20 do Anexo I desta Lei;\n...........................................................\n§3º Os responsáveis mencionados nos incisos do caput deste artigo ficam obrigados ao recolhimento integral do imposto devido, inclusive multa e acréscimos legais, independentemente de sua efetiva retenção na fonte, excetuando-se, quanto à multa e aos acréscimos, os órgãos da administração direta, as autarquias, fundações, empresas públicas e sociedades de economia mista dependentes do Município de Maricá.\n...........................................................\" (NR)␞__CITACAO__␞\"Art. 12 ...........................................................\n...........................................................\nIV – o titular de direitos sobre imóvel, inclusive o proprietário, o possuidor ou o contratante da obra, sobre os serviços de construção civil, reforma, demolição, manutenção ou congêneres executados no respectivo imóvel, independentemente da pessoa do prestador de serviços ou da existência de vínculo contratual direto;\n...........................................................\nXIX – o prestador de serviços, quando, por erro, omissão ou prestação de informações falsas ou incompletas, der causa à falta de recolhimento do ISS, ainda que tenha sido emitido documento fiscal.\" (NR)␞__CITACAO__␞\"Art. 14. Na prestação de serviços por agências de publicidade, quando o serviço de publicidade e propaganda, no todo ou em parte, for executado por terceiros, a agência deverá discriminar, nas informações prestadas ao cliente, os valores correspondentes aos seus próprios honorários e comissões, bem como os valores relativos aos serviços executados por terceiros, devidamente respaldados por documentos fiscais emitidos pelos respectivos prestadores.\nParágrafo único. Na prestação de serviços descritos no caput, os valores referentes aos serviços executados por terceiros não integrarão a base de cálculo do ISS devido pela agência, desde que devidamente identificados e segregados, sob pena de inclusão do valor total do serviço contratado na base de cálculo do imposto.\" (NR)␞__CITACAO__␞\"Art. 16. A base de cálculo do Imposto Sobre Serviços de Qualquer Natureza – ISSQN, nos serviços descritos nos itens 7.02 e 7.05 do Anexo I desta Lei, compreende o valor total do serviço, incluindo os materiais fornecidos pelo prestador, ainda que produzidos ou adquiridos por ele, salvo quando os materiais forem produzidos fora do local da obra e comercializados separadamente, com a incidência de ICMS, acompanhados de documentação fiscal apropriada e compatível com a operação.\n...........................................................\" (NR)␞__CITACAO__␞\"Art. 17. O preço do serviço é a receita bruta a ele correspondente, sem quaisquer deduções, exceto aquelas expressamente previstas nesta Lei.\n...........................................................\n§7º Nos serviços de intermediação, definidos como aqueles em que o intermediário aproxima partes interessadas na realização de negócio ou contratação de serviço, sem executar diretamente o objeto pactuado nem assumir responsabilidade técnica por sua execução, a base de cálculo do imposto será exclusivamente o valor da comissão ou remuneração recebida pela intermediação.\" (NR)␞__CITACAO__␞\"Art. 24 ..........................................................\n...........................................................\nII – mensalmente, na forma estabelecida em regulamento, em relação aos serviços efetivamente prestados e tomados no período, independentemente do pagamento, quando o prestador for empresa, e o imposto seja devido no Município, na forma do art. 6º;\n...........................................................\" (NR)␞__CITACAO__␞\"Art. 47. Será pessoalmente responsável pelas obrigações tributárias resultantes de atos praticados com infração da presente lei o gerente, diretor e/ou representante de cada agência das instituições financeiras.\" (NR)␞__CITACAO__␞\"Art. 47-A. No momento da conclusão da prestação de serviço de execução de obra de construção civil, demolição, reparação, conservação ou reforma de determinado edifício, deverão ser declarados todos os serviços executados, com os respectivos documentos fiscais, bem como os dados do imóvel necessários à tributação, na forma e condições estabelecidas no regulamento.\n§1º A declaração de que trata o caput será realizada pelo responsável pela obra ou pelo sujeito passivo do IPTU referente ao imóvel objeto do serviço.\n§2º As edificações presumem-se concluídas ou modificadas na data informada, pelo responsável pela declaração, como sendo a data de finalização da obra.\n§3º O preenchimento e a confirmação de envio da declaração configuram confissão irretratável de dívida em relação aos valores nela declarados, podendo os créditos tributários correspondentes ser inscritos diretamente em dívida ativa.\n§4º A não apresentação da declaração no prazo regulamentar ou a apresentação incompleta ou com informações falsas sujeitarão o responsável ao lançamento de ofício do ISSQN, com aplicação da multa prevista na legislação tributária municipal, sem prejuízo de outras sanções cabíveis.\"␞__CITACAO__␞\"Art. 49. As informações prestadas na Nota Fiscal de Serviços Eletrônica – NFS-e, bem como na escrituração dos serviços prestados e tomados, configuram confissão de dívida do Imposto Sobre Serviços de Qualquer Natureza incidente na operação, ficando a falta de seu recolhimento sujeita aos procedimentos de cobrança administrativa ou judicial, observados os procedimentos regulamentares.\" (NR)␞__CITACAO__␞\"Art. 56 ...........................................................\nI – nos casos de condutas não tipificadas na legislação como crimes contra a ordem tributária, multa de 75% (setenta e cinco por cento) do montante do tributo devido em UFIMA;\nII – nos casos de condutas tipificadas como crimes contra a ordem tributária, multa de 100% (cem por cento) do montante do tributo devido em UFIMA, sem prejuízo da representação fiscal para fins penais.\" (NR)␞__CITACAO__␞\"Art. 57 ...........................................................\n...........................................................\nIII – 20 (vinte) UFIMA ou 20% (vinte por cento) do imposto devido, o que for maior, quando se tratar de instituição financeira ou equiparada;\nIV – 1 (uma) UFIMA ou 20% (vinte por cento) do imposto devido, o que for maior, quando se tratar da declaração obrigatória prevista no art. 47-A desta Lei Complementar, apresentada fora do prazo, com omissão ou inexatidão de informações.\" (NR)","paiId":null,"id":3213},{"tipo":"art","label":"Art. 2º","texto":"O Anexo I da Lei Complementar nº 389, de 20 de dezembro de 2023, passa a vigorar com a redação do Anexo I desta Lei Complementar.","paiId":null,"id":3214},{"tipo":"art","label":"Art. 3º","texto":"Revogam-se, a partir de 1º de janeiro de 2026:","paiId":null,"id":3215},{"tipo":"inc","label":"I","texto":"o §1º e seus incisos I, II, III e IV do art. 16 da Lei Complementar nº 389, de 20 de dezembro de 2023;","paiId":3215,"id":3216},{"tipo":"inc","label":"II","texto":"o art. 21, caput, e seu parágrafo único da Lei Complementar nº 389, de 20 de dezembro de 2023;","paiId":3215,"id":3217},{"tipo":"inc","label":"III","texto":"as alíneas \"a\" e \"b”
