space;font-size:13px;color:var(--navy)\">a) – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">o prestador de serviços for empresa que, legalmente obrigada, não emitir nota fiscal ou outro documento permitido contendo no mínimo, seu endereço e número de inscrição no Cadastro Mobiliário do Município;</span></div><div style=\"margin-left: 40px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">b) – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">o serviço for prestado em caráter pessoal ou por sociedade, e o prestador não apresentar comprovante de inscrição no Cadastro Mobiliário Município recolhimento atualizado do imposto;</span></div><div style=\"margin-left: 40px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">c) – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">o prestador de serviço alegar, mas não comprovar imunidade ou isenção.</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">VI – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">os órgãos e entidades da administração direta e indireta da União, dos Estados, do Distrito Federal e dos Municípios, em relação aos serviços por eles tomados ou intermediados, exceto quando relativos aos subitens 10.01, 10.02, 10.03, 10.04, 10.05, 21.01, 22.01 e 26.01 e ao item 15 e seus subitens do Anexo I;</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§1º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">No caso dos serviços prestados pelas administradoras de cartão de crédito e débito, descritos no subitem 15.01 do Anexo I, os terminais eletrônicos ou as máquinas das operações efetivadas deverão ser registradas no local do domicílio do tomador do serviço.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§2º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Compete às administradoras de cartão de crédito e débito providenciar o registro a que se refere o § 1º deste artigo.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(30, 95, 168, 0.06); border-left: 3px solid var(--blue); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><div style=\"font-size:13px;font-family:monospace;\"><span style=\"font-weight:700;color:var(--blue)\">§3º  </span><span style=\"color:var(--muted);text-decoration:line-through\">Os responsáveis a que se referem os incisos do caput deste artigo estão obrigados ao recolhimento integral do imposto devido, multa e acréscimos legais, independentemente de ter sido efetuada sua retenção na fonte; exceção feita aos órgãos da administração direta, autarquias e fundações públicas de direito público do Município de Maricá, quanto à multa e aos acréscimos.</span></div><div style=\"font-size:13px;font-family:monospace;margin-top:3px\"><span style=\"font-weight:700;color:var(--blue)\">§3º  </span><span style=\"color:var(--text)\">Os responsáveis mencionados nos incisos do caput deste artigo ficam obrigados ao recolhimento integral do imposto devido, inclusive multa e acréscimos legais, independentemente de sua efetiva retenção na fonte, excetuando-se, quanto à multa e aos acréscimos, os órgãos da administração direta, as autarquias, fundações, empresas públicas e sociedades de economia mista dependentes do Município de Maricá.</span><br><span class=\"doc-art-nota\">(Redação dada pela Lei Complementar nº 419/2025)</span></div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§4º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Caso o tomador ou intermediário do serviço não seja estabelecido ou domiciliado no território do município, o prestador, desde que estabelecido no município de Maricá, fará o recolhimento do tributo.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 10.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A retenção na fonte será cumprida pelo recolhimento do imposto na rede bancária autorizada através do Documento de Arrecadação da Receita Municipal – DARM.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Parágrafo único  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O responsável pelo recolhimento dará ao prestador de serviço uma via do DARM quitado a qual lhe servirá como comprovante do pagamento do imposto.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 11.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Para a retenção na fonte o imposto será calculado aplicando-se, independentemente da natureza jurídica do prestador, alíquota sobre o preço do serviço.</span></div><div class=\"doc-est-secao\"><div class=\"doc-est-label\">SEÇÃO II</div><div class=\"doc-est-nome\">Solidariedade</div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 12.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">São solidariamente responsáveis pelo recolhimento do imposto:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">os construtores, empreiteiros principais e administradores de obras hidráulicas, de construção civil ou de reparação de edifícios, estradas, logradouros, pontes e congêneres, pelo imposto relativo aos serviços prestados por subempreiteiros, exclusivamente de mão de obra;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">os administradores de obras, pelo imposto relativo à mão de obra, inclusive de subcontratos, ainda que o pagamento dos serviços seja feito diretamente pelo dono da obra ou contratante;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">III – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">os construtores, os empreiteiros principais ou quaisquer outros contratantes de obras de construção civil, pelo imposto devido por empreiteiros ou subempreiteiros não estabelecidos no Município;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(30, 95, 168, 0.06); border-left: 3px solid var(--blue); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><div style=\"font-size:13px;font-family:monospace;\"><span style=\"color:var(--blue)\">IV – </span><span style=\"color:var(--muted);text-decoration:line-through\">os titulares de direitos sobre prédios ou os contratantes de obras e serviços, se não identificarem os construtores ou os empreiteiros de construção, reconstrução, reforma, reparação ou acréscimo desses bens, pelo imposto devido pelos construtores ou empreiteiros;</span></div><div style=\"font-size:13px;font-family:monospace;margin-top:3px\"><span style=\"color:var(--blue)\">IV – </span><span style=\"color:var(--text)\">o titular de direitos sobre imóvel, inclusive o proprietário, o possuidor ou o contratante da obra, sobre os serviços de construção civil, reforma, demolição, manutenção ou congêneres executados no respectivo imóvel, independentemente da pessoa do prestador de serviços ou da existência de vínculo contratual direto;</span><br><span class=\"doc-art-nota\">(Redação dada pela Lei Complementar nº 419/2025)</span></div></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">V – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">os locadores de máquinas, aparelhos e equipamentos instalados, pelo imposto devido pelos locatários estabelecidos no Município e relativo à exploração desses bens;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">VI – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">os titulares dos estabelecimentos onde se instalarem máquinas, aparelhos e equipamentos, pelo imposto devido pelos respectivos proprietários não estabelecidos no Município, e relativo à exploração destes bens;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">VII – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">os que permitirem em seus estabelecimentos ou domicílios exploração de atividade tributável sem estar o prestador do serviço inscrito no órgão fiscal competente, pelo imposto devido sobre essa atividade;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">VIII – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">os que efetuarem pagamento de serviços a terceiros não identificados, pelo imposto cabível nas operações;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">IX – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">os que utilizarem serviços de empresas, pelo imposto incidente sobre as operações, se não exigirem dos prestadores documento fiscal idôneo;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">X – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">os que utilizarem serviços de profissionais autônomos, pelo imposto incidente sobre as operações, se não exigirem dos prestadores prova de inscrição no Cadastro Mobiliário do Município;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">XI – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">as empresas que explorem serviços de planos de saúde ou de assistência médica e hospitalar através de planos de medicina de grupo e convênios, pelo imposto devido sobre serviços a ela prestados por:</span></div><div style=\"margin-left: 40px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">a) – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">empresas que agenciem, intermedeiem ou façam corretagem dos referidos planos junto ao público;</span></div><div style=\"margin-left: 40px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">b) – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">hospitais, clínicas, sanatórios, laboratórios de análises, de patologia, de eletricidade médica e assemelhados, ambulatórios, prontos-socorros, manicômios, casa de saúde, de repouso e de recuperação e congêneres;</span></div><div style=\"margin-left: 40px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">c) – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">bancos de sangue, de pele, de olhos, de sêmen e congêneres;</span></div><div style=\"margin-left: 40px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">d) – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">empresas que executem remoção de doentes.</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">XII – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">os hospitais e clínicas privados, pelo imposto devido sobre os serviços a eles prestados:</span></div><div style=\"margin-left: 40px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">a) – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">por empresas de guarda e vigilância e de conservação e limpeza de imóveis;</span></div><div style=\"margin-left: 40px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">b) – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">por laboratórios de análises, de patologia e de eletricidade médica e assemelhados, quando a assistência a seus pacientes se fizer sem intervenção das empresas das atividades referidas no inciso anterior;</span></div><div style=\"margin-left: 40px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">c) – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">por bancos de sangue, de pele, de olhos, de sêmen e congêneres, bem como por empresas que executem remoção de pacientes, quando seu atendimento se fizer na forma referida na alínea anterior;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">XIII – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">os estabelecimentos particulares de ensino, pelo imposto devido sobre os serviços a eles prestados pelas empresas de guarda e vigilância e de conservação e limpeza de imóveis;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">XIV – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">os bancos e demais entidades financeiras, pelo imposto devido sobre os serviços a eles prestados pelas empresas de guarda e vigilância, de transporte de valores e de conservação e limpeza de imóveis.</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">XV – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">pessoas jurídicas administradoras de bingos e quaisquer outras modalidades de jogos, apostas ou sorteios, pelo imposto devido por suas contratantes, pessoas físicas ou jurídicas, autorizadas a explorar tais atividades;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">XVI – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">as concessionárias de serviços públicos de telecomunicações, pelo imposto incidente sobre a cota repassada às empresas administradoras ou promotoras de apostas ou sorteios;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">XVII – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">as empresas imobiliárias, incorporadoras e construtoras, pelo imposto devido sobre as comissões pagas às empresas corretoras de imóveis;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">XVIII – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">as empresas e entidades que explorem loterias e outros jogos permitidos, inclusive apostas, pelo imposto devido sobre as comissões pagas a seus agentes, revendedores ou concessionários;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(21, 95, 59, 0.06); border-left: 3px solid var(--green); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><span style=\"font-family:monospace;font-size:13px;color:var(--green)\">XIX – </span><span style=\"font-size:13px;font-family:monospace;color:var(--text)\">o prestador de serviços, quando, por erro, omissão ou prestação de informações falsas ou incompletas, der causa à falta de recolhimento do ISS, ainda que tenha sido emitido documento fiscal.</span><br><span class=\"doc-art-nota\">(Incluído pela Lei Complementar nº 419/2025)</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§1º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A responsabilidade de que trata este artigo será satisfeita mediante o pagamento:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">do imposto retido das pessoas físicas ou jurídicas, com base no preço do serviço prestado, aplicada a alíquota correspondente à atividade exercida;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">do imposto incidente sobre as operações, nos demais casos.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§2º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A responsabilidade prevista neste artigo é inerente a todas as pessoas físicas ou jurídicas, ainda que alcançadas por imunidade ou isenção tributária.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§3º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A retenção do imposto prevista neste artigo somente se aplica aos pagamentos de serviços tributáveis pelo Município.</span></div><div class=\"doc-est-capitulo\"><div class=\"doc-est-label\">CAPÍTULO VI</div><div class=\"doc-est-nome\">BASE DO CÁLCULO</div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 13.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A base de cálculo do imposto é o preço do serviço.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Parágrafo único  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Quando os serviços descritos pelo subitem 3.04 da lista anexa forem prestados no território de mais de um Município, a base de cálculo será proporcional, conforme o caso, à extensão da ferrovia, rodovia, dutos e condutos de qualquer natureza, cabos de qualquer natureza, ou ao número de postes, existentes no Município.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(30, 95, 168, 0.06); border-left: 3px solid var(--blue); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><div style=\"font-size:13px;font-family:monospace;\"><span style=\"font-weight:700;color:var(--blue)\">Art. 14.  </span><span style=\"color:var(--muted);text-decoration:line-through\">Em se tratando de prestação de serviços executados por empresas de publicidade, quando o serviço, ou parte dele, for executado por terceiros que emitam notas fiscais em nome da agência de publicidade, o preço do serviço desta será a diferença entre o valor da nota fiscal de serviços ao cliente e o valor da nota fiscal de serviços do executor à agência.</span></div><div style=\"font-size:13px;font-family:monospace;margin-top:3px\"><span style=\"font-weight:700;color:var(--blue)\">Art. 14.  </span><span style=\"color:var(--text)\">Na prestação de serviços por agências de publicidade, quando o serviço de publicidade e propaganda, no todo ou em parte, for executado por terceiros, a agência deverá discriminar, nas informações prestadas ao cliente, os valores correspondentes aos seus próprios honorários e comissões, bem como os valores relativos aos serviços executados por terceiros, devidamente respaldados por documentos fiscais emitidos pelos respectivos prestadores.</span><br><span class=\"doc-art-nota\">(Redação dada pela Lei Complementar nº 419/2025)</span></div></div><div style=\"margin-left: 0px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(30, 95, 168, 0.06); border-left: 3px solid var(--blue); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><div style=\"font-size:13px;font-family:monospace;\"><span style=\"font-weight:700;color:var(--blue)\">Parágrafo único  </span><span style=\"color:var(--muted);text-decoration:line-through\">No caso de o serviço ser prestado na forma do caput, na nota fiscal de serviços emitida pela agência de publicidade ao cliente, deverão constar os dados e informações das notas fiscais de serviços com os respectivos valores das deduções dos terceiros executores emitidos para a agência, sob pena de integrar-se à base de cálculo.</span></div><div style=\"font-size:13px;font-family:monospace;margin-top:3px\"><span style=\"font-weight:700;color:var(--blue)\">Parágrafo único  </span><span style=\"color:var(--text)\">Na prestação de serviços descritos no caput, os valores referentes aos serviços executados por terceiros não integrarão a base de cálculo do ISS devido pela agência, desde que devidamente identificados e segregados, sob pena de inclusão do valor total do serviço contratado na base de cálculo do imposto.</span><br><span class=\"doc-art-nota\">(Redação dada pela Lei Complementar nº 419/2025)</span></div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 15.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A base de cálculo do imposto a que se refere o subitem 21.01 do Anexo I desta lei complementar é o preço do serviço, calculado pelo valor total dos emolumentos e demais encargos, inclusive aqueles recebidos a título de reembolso, ressarcimento e reajustamento, independente de classificação contábil, e o imposto será cobrado de forma variável.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Parágrafo único  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Os valores a serem repassados aos Fundos Estaduais, por força expressa de previsão legal, não integram o preço do serviço.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(30, 95, 168, 0.06); border-left: 3px solid var(--blue); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><div style=\"font-size:13px;font-family:monospace;\"><span style=\"font-weight:700;color:var(--blue)\">Art. 16.  </span><span style=\"color:var(--muted);text-decoration:line-through\">Não se inclui na base de cálculo do Imposto Sobre Serviços de Qualquer Natureza o valor dos materiais fornecidos pelo prestador dos serviços previstos nos itens 7.02 e 7.05 do Anexo I desta Lei.</span></div><div style=\"font-size:13px;font-family:monospace;margin-top:3px\"><span style=\"font-weight:700;color:var(--blue)\">Art. 16.  </span><span style=\"color:var(--text)\">A base de cálculo do Imposto Sobre Serviços de Qualquer Natureza – ISSQN, nos serviços descritos nos itens 7.02 e 7.05 do Anexo I desta Lei, compreende o valor total do serviço, incluindo os materiais fornecidos pelo prestador, ainda que produzidos ou adquiridos por ele, salvo quando os materiais forem produzidos fora do local da obra e comercializados separadamente, com a incidência de ICMS, acompanhados de documentação fiscal apropriada e compatível com a operação.</span><br><span class=\"doc-art-nota\">(Redação dada pela Lei Complementar nº 419/2025)</span></div></div><div style=\"margin-left: 0px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(139, 26, 26, 0.06); border-left: 3px solid var(--red); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--red)\">§1º  </span><span style=\"font-size:13px;font-family:monospace;color:var(--red);text-decoration:line-through\">Em relação às não inclusões previstas neste artigo quanto às mercadorias, só serão admitidas deduções relativas aos materiais que se incorporem ou se consumam na execução das obras, excluídos:</span><br><span class=\"doc-art-nota\">(Revogado pela Lei Complementar nº 419/2025)</span></div><div style=\"margin-left: 20px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(139, 26, 26, 0.06); border-left: 3px solid var(--red); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><span style=\"font-family:monospace;font-size:13px;color:var(--red)\">I – </span><span style=\"font-size:13px;font-family:monospace;color:var(--red);text-decoration:line-through\">escoras, andaimes, torres e formas;</span><br><span class=\"doc-art-nota\">(Revogado pela Lei Complementar nº 419/2025)</span></div><div style=\"margin-left: 20px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(139, 26, 26, 0.06); border-left: 3px solid var(--red); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><span style=\"font-family:monospace;font-size:13px;color:var(--red)\">II – </span><span style=\"font-size:13px;font-family:monospace;color:var(--red);text-decoration:line-through\">ferramentas, equipamentos de proteção individual, máquinas e respectiva manutenção;</span><br><span class=\"doc-art-nota\">(Revogado pela Lei Complementar nº 419/2025)</span></div><div style=\"margin-left: 20px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(139, 26, 26, 0.06); border-left: 3px solid var(--red); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><span style=\"font-family:monospace;font-size:13px;color:var(--red)\">III – </span><span style=\"font-size:13px;font-family:monospace;color:var(--red);text-decoration:line-through\">materiais adquiridos para a formação de estoque ou armazenagem fora dos canteiros de obra antes de sua utilização;</span><br><span class=\"doc-art-nota\">(Revogado pela Lei Complementar nº 419/2025)</span></div><div style=\"margin-left: 20px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(139, 26, 26, 0.06); border-left: 3px solid var(--red); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><span style=\"font-family:monospace;font-size:13px;color:var(--red)\">IV – </span><span style=\"font-size:13px;font-family:monospace;color:var(--red);text-decoration:line-through\">materiais recebidos na obra após a sua conclusão.</span><br><span class=\"doc-art-nota\">(Revogado pela Lei Complementar nº 419/2025)</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§2º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">São irredutíveis os valores de quaisquer materiais cujos documentos não estejam revestidos das características ou formalidades legais, previstas na legislação federal, estadual ou municipal, especialmente no que se concerne à perfeita identificação do emitente e do destinatário, bem como das mercadorias e serviços.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§3º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Quando os serviços referidos neste artigo forem prestados sob o regime de administração, a base de cálculo incluirá, além dos honorários do prestador, as despesas gerais de administração, bem como as de mão de obra, encargos sociais e reajustamentos, ainda que tais despesas sejam de responsabilidade de terceiros.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§4º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Quando as deduções referidas no caput deste artigo superarem o limite de 50% (cinquenta por cento) do valor do contratado, a comprovação de todas as deduções aplicadas deverá ser feita à Fiscalização Tributária do Município ao encerramento da obra.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§5º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Independentemente do disposto no parágrafo anterior, as deduções aplicadas ficam sujeitas à comprovação enquanto não decorrido o prazo prescricional.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(30, 95, 168, 0.06); border-left: 3px solid var(--blue); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><div style=\"font-size:13px;font-family:monospace;\"><span style=\"font-weight:700;color:var(--blue)\">Art. 17.  </span><span style=\"color:var(--muted);text-decoration:line-through\">Preço do serviço é a receita bruta a ele correspondente, sem quaisquer deduções com exceção do fornecimento de materiais previsto no artigo 16.</span></div><div style=\"font-size:13px;font-family:monospace;margin-top:3px\"><span style=\"font-weight:700;color:var(--blue)\">Art. 17.  </span><span style=\"color:var(--text)\">O preço do serviço é a receita bruta a ele correspondente, sem quaisquer deduções, exceto aquelas expressamente previstas nesta Lei.</span><br><span class=\"doc-art-nota\">(Redação dada pela Lei Complementar nº 419/2025)</span></div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§1º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Considera-se preço do serviço, para efeito de cálculo do imposto, tudo o que for cobrado em virtude da prestação do serviço, em bens, serviços ou direitos, seja na conta ou não, inclusive a título de reembolso, reajustamento ou dispêndio de qualquer natureza, sem prejuízo do disposto neste Capítulo.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§2º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Constituem parte integrante do preço:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">os valores acrescidos e os encargos de qualquer natureza, ainda que de responsabilidade de terceiros;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">os ônus relativos à concessão de crédito, ainda que cobrados em separado, na hipótese de prestação de serviços a crédito, sob qualquer modalidade;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">III – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">as vantagens financeiras decorrentes da prestação de serviços, inclusive as relacionadas com a retenção periódica dos valores recebidos;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">IV – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">o valor recebido em material, estimado a preços correntes de mercado, nos serviços de demolição.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§3º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Serão diminuídos do preço do serviço os valores relativos a descontos ou abatimentos não sujeitos a condição, desde que prévia e expressamente contratados.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§4º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Quando a contraprestação se verificar através da troca de serviços ou o seu pagamento for realizado mediante o fornecimento de mercadorias, o preço do serviço para base cálculo do imposto será o preço corrente na praça ou o valor das mercadorias.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§5º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Na falta de preço, será tomado como base de cálculo o valor cobrado dos usuários ou contratantes de serviços similares.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§6º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Nos serviços contratados em moeda estrangeira, o preço será o valor resultante da sua conversão em moeda nacional, ao câmbio do dia da ocorrência do fato gerador.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(21, 95, 59, 0.06); border-left: 3px solid var(--green); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--green)\">§7º  </span><span style=\"font-size:13px;font-family:monospace;color:var(--text)\">Nos serviços de intermediação, definidos como aqueles em que o intermediário aproxima partes interessadas na realização de negócio ou contratação de serviço, sem executar diretamente o objeto pactuado nem assumir responsabilidade técnica por sua execução, a base de cálculo do imposto será exclusivamente o valor da comissão ou remuneração recebida pela intermediação.</span><br><span class=\"doc-art-nota\">(Incluído pela Lei Complementar nº 419/2025)</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 18.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Na hipótese de serviços prestados por empresas enquadráveis em mais de um dos itens da lista de serviços, o imposto será calculado aplicando-se a alíquota própria sobre o preço do serviço de cada atividade.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 19.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A apuração do preço do serviço será efetuada com base nos elementos em poder do sujeito passivo, ou de outros quaisquer, mesmo que em poder de terceiros, de forma que possa ser utilizado como paradigma para a obtenção da base de cálculo.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 20.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Quando se tratar de prestação de serviço sob a forma de trabalho pessoal do próprio contribuinte, o imposto será cobrado em valores fixos anuais, conforme estabelecido no Anexo II.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§1º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Na hipótese de serviços prestados sob a forma de trabalho pessoal do próprio contribuinte enquadráveis em mais de uma das atividades do Anexo II, o imposto será cobrado em relação a cada uma das atividades exercidas.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§2º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O disposto no caput deste artigo não se aplica:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">aos integrantes das sociedades profissionais relativamente à prestação de serviços alheios ao exercício da profissão para a qual se achem habilitados, bem como aos serviços que prestarem em nome próprio; e</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">às sociedades de prestação de serviços que não sejam constituídas exclusivamente de profissionais habilitados para o exercício da profissão correspondente aos serviços por elas prestados.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(139, 26, 26, 0.06); border-left: 3px solid var(--red); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--red)\">Art. 21.  </span><span style=\"font-size:13px;font-family:monospace;color:var(--red);text-decoration:line-through\">Equipara-se à pessoa jurídica a pessoa física que opte pela emissão de nota fiscal de serviço, que nesse caso passa a ter o ISSQN tributado na forma do inciso II do artigo 24.</span><br><span class=\"doc-art-nota\">(Revogado pela Lei Complementar nº 419/2025)</span></div><div style=\"margin-left: 0px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(139, 26, 26, 0.06); border-left: 3px solid var(--red); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--red)\">Parágrafo único  </span><span style=\"font-size:13px;font-family:monospace;color:var(--red);text-decoration:line-through\">A opção de que trata o caput deverá ser exercida anualmente, conforme dispuser o regulamento.</span><br><span class=\"doc-art-nota\">(Revogado pela Lei Complementar nº 419/2025)</span></div><div class=\"doc-est-capitulo\"><div class=\"doc-est-label\">CAPÍTULO VII</div><div class=\"doc-est-nome\">ALÍQUOTAS</div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 22.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">As alíquotas do imposto são as fixadas na tabela de Anexo I desta Lei.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§1º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">No caso de atividades tributadas com alíquotas diferentes, se não for possível a comprovação por meio de documento hábil da separação das operações por atividade, ficarão as operações, em sua totalidade, sujeitas à alíquota mais elevada.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§2º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Quando as atividades descritas no Anexo I desta lei forem prestadas por instituições financeiras e demais instituições autorizadas a funcionar pelo Banco Central do Brasil, o imposto deverá ser calculado na alíquota máxima prevista nesta Lei.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 23.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">As alíquotas mínima e máxima do Imposto Sobre Serviços de Qualquer Natureza são 2% (dois por cento) e 5% (cinco por cento), respectivamente.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Parágrafo único  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O imposto não será objeto de concessão de isenções, incentivos ou benefícios tributários ou financeiros, inclusive redução da base de cálculo ou de crédito presumido ou outorgado, ou sob qualquer outra forma que resulte, direta ou indiretamente, em carga tributária menor que a decorrente da aplicação da alíquota mínima estabelecida no caput, exceto para os serviços a que se referem os subitens 7.02, 7.05 e 16.01 do Anexo I desta Lei.</span></div><div class=\"doc-est-capitulo\"><div class=\"doc-est-label\">CAPÍTULO VIII</div><div class=\"doc-est-nome\">LANÇAMENTO</div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 24.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O lançamento do Imposto Sobre Serviços de Qualquer Natureza ocorrerá:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">uma única vez, na forma estabelecida em regulamento, no exercício a que corresponder o tributo, quando o serviço for prestado sob a forma de trabalho pessoal do próprio contribuinte ou pelas sociedades de prestação de serviços profissionais, observado o disposto no artigo 39;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(30, 95, 168, 0.06); border-left: 3px solid var(--blue); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><div style=\"font-size:13px;font-family:monospace;\"><span style=\"color:var(--blue)\">II – </span><span style=\"color:var(--muted);text-decoration:line-through\">mensalmente, na forma estabelecida em regulamento, em relação ao serviço efetivamente prestado no período, independentemente do pagamento, quando o prestador for:</span></div><div style=\"font-size:13px;font-family:monospace;margin-top:3px\"><span style=\"color:var(--blue)\">II – </span><span style=\"color:var(--text)\">mensalmente, na forma estabelecida em regulamento, em relação aos serviços efetivamente prestados e tomados no período, independentemente do pagamento, quando o prestador for empresa, e o imposto seja devido no Município, na forma do art. 6º;</span><br><span class=\"doc-art-nota\">(Redação dada pela Lei Complementar nº 419/2025)</span></div></div><div style=\"margin-left: 40px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(139, 26, 26, 0.06); border-left: 3px solid var(--red); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><span style=\"font-family:monospace;font-size:13px;color:var(--red)\">a) – </span><span style=\"font-size:13px;font-family:monospace;color:var(--red);text-decoration:line-through\">empresa; e</span><br><span class=\"doc-art-nota\">(Revogado pela Lei Complementar nº 419/2025)</span></div><div style=\"margin-left: 40px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(139, 26, 26, 0.06); border-left: 3px solid var(--red); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><span style=\"font-family:monospace;font-size:13px;color:var(--red)\">b) – </span><span style=\"font-size:13px;font-family:monospace;color:var(--red);text-decoration:line-through\">profissional autônomo ou liberal localizado que emita nota fiscal.</span><br><span class=\"doc-art-nota\">(Revogado pela Lei Complementar nº 419/2025)</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">III – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">tratando-se de lançamentos de ofício, será respeitado o intervalo mínimo de 30 (trinta) dias entre o lançamento e o prazo fixado para pagamento.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Parágrafo único  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A apuração de que trata o inciso II deverá ser efetuada até a data de vencimento do tributo estabelecida no Calendário de Recolhimento de Tributos Municipais - CATRIMA.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 25.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Os contribuintes sujeitos ao pagamento mensal do imposto ficam obrigados a:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">manter escrita fiscal destinada ao registro dos serviços prestados e tomados, ainda que não tributáveis;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">emitir notas fiscais de serviços ou outros documentos admitidos pela Administração, por ocasião da prestação dos serviços.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§1º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O Poder Executivo definirá os modelos de livros, notas fiscais e demais documentos a serem obrigatoriamente utilizados pelo contribuinte, bem como os contribuintes dispensados desta formalidade.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§2º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Constituem instrumentos auxiliares da escrita fiscal os livros de contabilidade geral do contribuinte, tanto os de uso obrigatório quanto os auxiliares, os documentos fiscais, as guias de pagamento do imposto e demais documentos ainda que pertencentes ao arquivo de terceiros, que se relacionem direta ou indiretamente com os lançamentos efetuados na escrita fiscal ou comercial do contribuinte ou responsável.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§3º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Cada estabelecimento terá escrituração tributária própria, salvo situações expressamente previstas em regulamento.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§4º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Sendo insatisfatórios os meios normais para fiscalização e tendo em vista a natureza do serviço prestado, o Poder Executivo poderá decretar, ou a autoridade administrativa por despacho fundamentado, permitir ou exigir, complementarmente ou em substituição, a adoção de instrumentos e documentos especiais necessários à perfeita apuração dos serviços prestados, da receita auferida e do imposto devido.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§5º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Durante o prazo de 5 (cinco) anos dado à Fazenda Pública para constituir o crédito tributário, o lançamento ficará sujeito a revisão, devendo o contribuinte manter à disposição do fisco os livros e os documentos tanto os obrigatórios como os instrumentos auxiliares.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 26.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Fica autorizado o Poder Executivo a criar ou aceitar documentação simplificada no caso de contribuintes optantes pelo Simples Nacional ou qualquer outro regime simplificado que venha a substituí-lo.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 27.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O lançamento do imposto não implica reconhecimento ou regularidade do exercício de atividade ou da legalidade das condições referentes a local, instalações, equipamentos ou obras.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 28.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Decorrido o prazo de 5 (cinco) anos contados a partir da ocorrência do fato gerador sem que a Fazenda Pública tenha se pronunciado, considera-se homologado o lançamento e definitivamente extinto o crédito, salvo se comprovada a ocorrência de dolo, fraude ou simulação.</span></div><div class=\"doc-est-capitulo\"><div class=\"doc-est-label\">CAPÍTULO IX</div><div class=\"doc-est-nome\">ARBITRAMENTO</div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 29.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A autoridade fiscal procederá ao arbitramento para a apuração do preço sempre que, fundamentalmente, incorrer em ao menos uma das seguintes situações:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">o contribuinte não possuir livros fiscais de utilização obrigatória ou estes não se encontrarem com sua escrituração atualizada, ou ainda nos casos de perda, extravio ou inutilização de livros ou documentos fiscais;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">o contribuinte reiteradamente violar o disposto na legislação tributária;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">III – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">o contribuinte, depois de intimado, deixar de exibir os livros fiscais de utilização obrigatória, ou não prestar os esclarecimentos exigidos pela fiscalização;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">IV – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">ocorrer fraude ou sonegação de dados julgados indispensáveis ao lançamento;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">V – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">sejam omissos, insuficientes ou não mereçam fé as declarações, os esclarecimentos prestados ou os livros e/ou os documentos expedidos pelo sujeito passivo;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">VI – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">o preço seja notoriamente inferior ao corrente no mercado ou desconhecido pela autoridade administrativa;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">VII – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">o contribuinte prestar serviço sem estar regularmente inscrito no Município de Maricá.</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">VIII – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">existência de atos qualificados em lei como crimes ou contravenções ou que, mesmo sem essa qualificação, sejam praticados com dolo, fraude ou simulação.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Parágrafo único  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O arbitramento referir-se-á, exclusivamente, aos fatos ocorridos no período em que se verificarem os pressupostos mencionados nos incisos deste artigo.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 30.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Nas hipóteses do artigo 29, o arbitramento poderá ser procedido pela autoridade administrativa levando-se em conta, entre outros os seguintes elementos:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">os recolhimentos feitos em períodos idênticos pelo contribuinte ou por outros contribuintes que exerçam a mesma atividade em condições semelhantes;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">os preços correntes dos serviços no mercado em vigor na época da apuração;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">III – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">as condições próprias do contribuinte, bem como os elementos que possam evidenciar sua situação econômico-financeira, abaixo descritas, acrescidos da margem de lucro praticada no mercado levando-se em consideração atividades semelhantes:</span></div><div style=\"margin-left: 40px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">a) – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">valor de matérias-primas, combustíveis e outros materiais consumidos ou aplicados no período;</span></div><div style=\"margin-left: 40px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">b) – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">folha de salários pagos, honorários de diretores, retiradas de sócios ou gerentes e respectivas obrigações trabalhistas e sociais;</span></div><div style=\"margin-left: 40px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">c) – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">despesas com fornecimentos de água, luz, força, telefone e demais encargos obrigatórios do contribuinte, inclusive tributos.</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">IV – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">as informações prestadas pelo titular da serventia à Corregedoria do Tribunal de Justiça ou dados obtidos junto ao Conselho Nacional de Justiça – CNJ, no caso dos serviços a que se refere o subitem 21.01 do Anexo I desta lei.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 31.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Para arbitramento da base de cálculo do ISSQN na construção civil de imóveis será utilizado o produto entre a área construída, reparada, conservada, reformada, modificada ou demolida e o Custo Unitário Base por metro quadrado (CUB/m²) Estadual, sem desonerações, calculado pelo Sindicato da Indústria da Construção Civil no Estado do Rio de Janeiro (Sinduscon-Rio), do mês imediatamente anterior ao do lançamento, de acordo com o projeto padrão utilizado para o cálculo do CUB/m² do tipo da construção em tela, deduzido do valor referente aos materiais, conforme definido em regulamento.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Parágrafo único  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A base de cálculo arbitrada na forma do caput deste artigo será ajustada para fração de seu valor nos seguintes casos:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">10% na demolição;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">25% na reparação, conservação, reforma e modificação sem acréscimo de área;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">III – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">20% na construção de piscinas e cisternas;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">IV – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">15% na construção de pátios descobertos;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">V – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">15% na construção de muros.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 32.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O arbitramento do preço dos serviços não exonera o contribuinte da imposição das penalidades cabíveis, quando for o caso.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 33.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O arbitramento só será revisto mediante apresentação de provas documentais que possam estabelecer a real base de cálculo.</span></div><div class=\"doc-est-capitulo\"><div class=\"doc-est-label\">CAPÍTULO X</div><div class=\"doc-est-nome\">ESTIMATIVA</div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 34.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A autoridade administrativa poderá, quando se tratar de atividades cujo exercício seja de natureza temporária ou transitória ou estejam vinculadas a fatores ou acontecimentos ocasionais ou excepcionais, fixar o valor do imposto a partir de uma base de cálculo estimada.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§1º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Na hipótese do que trata o caput deste artigo, o valor estimado do imposto deverá ser caucionado, conforme disposto em regulamento, antes da ocorrência do fato gerador e não poderá o contribuinte iniciar suas atividades sem efetuar a caução, sob pena de interdição do local, independentemente de qualquer formalidade.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§2º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Após a ocorrência do fato gerador a autoridade tributária apurará o valor do tributo a ser recolhido e fará encontro de contas entre o valor devido e o valor caucionado, no prazo 5 (cinco) dias úteis.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§3º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Caso o sujeito passivo não se apresente para a homologação do imposto no encontro de contas, será o valor caucionado convertido em renda, resguardado o direito da Fazenda Municipal de lançar eventuais diferenças constatadas entre o valor estimado e o valor arbitrado.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 35.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O valor do imposto lançado por estimativa levará em consideração:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">o tempo de duração e a natureza específica da atividade;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">o preço corrente dos serviços;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">III – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">o local do estabelecimento do contribuinte;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">IV – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">o volume da receita em períodos anteriores e sua projeção para os períodos seguintes, podendo ainda se basear na receita de outros contribuintes de idêntica atividade.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 36.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Os contribuintes que incorrerem na hipótese do § 3º do artigo 34 poderão, no prazo de 30 (trinta) dias a contar da ciência da respectiva notificação, apresentar impugnação contra o valor arbitrado, observado o disposto na legislação municipal.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Parágrafo único  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A impugnação prevista no caput deste conterá, obrigatoriamente, o valor que o interessado reputar justo e os elementos para sua aferição.</span></div><div class=\"doc-est-capitulo\"><div class=\"doc-est-label\">CAPÍTULO XI</div><div class=\"doc-est-nome\">PAGAMENTO E ARRECADAÇÃO</div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 37.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O imposto será recolhido, através da rede bancária autorizada, através do Documento de Arrecadação da Receita Municipal – DARM específico, emitida pela administração tributária.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 38.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">No caso do imposto calculado sobre a receita bruta mensal apurada ou estimada, o recolhimento deverá ser feito mensalmente aos cofres da Prefeitura Municipal, através dos bancos autorizados, independentemente de qualquer aviso ou notificação e do recebimento do preço do serviço ou da época do seu recebimento, até o dia 20 (vinte) do mês subsequente ao da ocorrência do fato gerador, conforme dispuser o regulamento.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Parágrafo único  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Os responsáveis pela retenção e pelo recolhimento do imposto o farão no prazo determinado no caput.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 39.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Quando os serviços forem prestados sob a forma de trabalho pessoal do próprio contribuinte o recolhimento do imposto se dará até 30 de junho de cada ano, de acordo com o Calendário de Recolhimento de Tributos Municipais - CATRIMA.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Parágrafo único  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">No caso de início de atividade o imposto será devido, antes do início da atividade, proporcionalmente ao número de meses restantes no ano.</span></div><div class=\"doc-est-capitulo\"><div class=\"doc-est-label\">CAPÍTULO XII</div><div class=\"doc-est-nome\">INSCRIÇÃO NO CADASTRO MOBILIÁRIO</div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 40.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O contribuinte domiciliado no Município de Maricá, com ou sem estabelecimento, ainda que isento ou imune, deve requerer sua inscrição no Cadastro Mobiliário do Município antes de iniciar suas atividades, fornecendo os elementos e as informações necessárias para a correta fiscalização do tributo.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§1º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O contribuinte ou responsável não domiciliado neste Município, que por conta da legislação aplicável deva recolher o tributo ao Município de Maricá deverá promover sua inscrição eventual, da forma como dispuser o regulamento.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§2º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O órgão responsável pelo Cadastro Mobiliário do Município, deverá promover de ofício a inscrição, a alteração ou a baixa, quando constatada situação de fato, quedando inerte a pessoa física ou jurídica responsável, ou por qualquer outro motivo, sem prejuízo das sanções previstas na legislação.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§3º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Fica adotada a Classificação Nacional de Atividades Econômicas – CNAE da Comissão Nacional de Classificação - CONCLA, como elemento base para o cadastramento e recadastramento das empresas localizadas no Município de Maricá.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§4º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Fica adotada a Classificação Brasileira de Ocupações – CBO da Comissão Nacional de Classificação - CONCLA, como elemento base para o cadastramento e recadastramento das ocupações econômicas no Município de Maricá.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 41.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Para cada estabelecimento o contribuinte deve fazer uma inscrição, exceto quando tratar-se de não-estabelecido, que fica sujeito à inscrição única por atividade.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 42.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Em se tratando de prestação dos Serviços de Registros Públicos, Cartorários e Notariais, previstos no subitem 21.01 do Anexo I desta lei, a inscrição municipal será feita em nome do titular da serventia.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 43.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A inscrição não presume a aceitação pela Prefeitura dos dados e das informações apresentadas pelo contribuinte.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 44.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O contribuinte deverá comunicar à Prefeitura no prazo de 30 (trinta) dias das seguintes ocorrências:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">alteração ou inclusão de novas atividades, alteração de contrato social ou de quaisquer outros dados cadastrais;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">cessação de atividades, a fim de obter a baixa de inscrição cadastral.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 45.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O contribuinte deverá comunicar à Prefeitura a paralisação de suas atividades com antecedência mínima de 72 (setenta e duas) horas da ocorrência, estabelecendo no comunicado o período da paralisação.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Parágrafo único  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Caso o contribuinte resolva retomar suas atividades antes do término do prazo constante do comunicado, deverá o mesmo proceder comunicado à Prefeitura de retorno de atividade obedecendo a mesma antecedência prevista no caput.</span></div><div class=\"doc-est-capitulo\"><div class=\"doc-est-label\">CAPÍTULO XIII</div><div class=\"doc-est-nome\">OBRIGAÇÕES ACESSÓRIAS ESPECÍFICAS</div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 46.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Fica adotada a Declaração Mensal de Serviços de Instituições Financeiras – DESIF, que consiste em sistema eletrônico para registro e apuração das contas tributáveis, cálculo e emissão do respectivo documento de arrecadação do ISSQN devido pelas instituições financeiras e equiparadas, autorizadas a funcionar pelo Banco Central do Brasil – BACEN, e demais pessoas jurídicas obrigadas a utilizar o Plano Contábil das Instituições do Sistema Financeiro Nacional – COSIF, conforme dispuser o regulamento.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(30, 95, 168, 0.06); border-left: 3px solid var(--blue); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><div style=\"font-size:13px;font-family:monospace;\"><span style=\"font-weight:700;color:var(--blue)\">Art. 47.  </span><span style=\"color:var(--muted);text-decoration:line-through\">Será pessoalmente responsável pelas obrigações tributárias resultantes de atos praticados com infração ao regulamento da DESIF o gerente, diretor e/ou representante de cada agência das instituições financeiras.</span></div><div style=\"font-size:13px;font-family:monospace;margin-top:3px\"><span style=\"font-weight:700;color:var(--blue)\">Art. 47.  </span><span style=\"color:var(--text)\">Será pessoalmente responsável pelas obrigações tributárias resultantes de atos praticados com infração da presente lei o gerente, diretor e/ou representante de cada agência das instituições financeiras.</span><br><span class=\"doc-art-nota\">(Redação dada pela Lei Complementar nº 419/2025)</span></div></div><div style=\"margin-left: 0px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(21, 95, 59, 0.06); border-left: 3px solid var(--green); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--green)\">Art. 47-A.  </span><span style=\"font-size:13px;font-family:monospace;color:var(--text)\">No momento da conclusão da prestação de serviço de execução de obra de construção civil, demolição, reparação, conservação ou reforma de determinado edifício, deverão ser declarados todos os serviços executados, com os respectivos documentos fiscais, bem como os dados do imóvel necessários à tributação, na forma e condições estabelecidas no regulamento.</span><br><span class=\"doc-art-nota\">(Incluído pela Lei Complementar nº 419/2025)</span></div><div style=\"margin-left: 0px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(21, 95, 59, 0.06); border-left: 3px solid var(--green); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--green)\">§1º  </span><span style=\"font-size:13px;font-family:monospace;color:var(--text)\">A declaração de que trata o caput será realizada pelo responsável pela obra ou pelo sujeito passivo do IPTU referente ao imóvel objeto do serviço.</span><br><span class=\"doc-art-nota\">(Incluído pela Lei Complementar nº 419/2025)</span></div><div style=\"margin-left: 0px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(21, 95, 59, 0.06); border-left: 3px solid var(--green); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--green)\">§2º  </span><span style=\"font-size:13px;font-fa
