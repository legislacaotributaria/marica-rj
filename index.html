--text)\">Na hipótese do que trata o caput deste artigo, o valor estimado do imposto deverá ser caucionado, conforme disposto em regulamento, antes da ocorrência do fato gerador e não poderá o contribuinte iniciar suas atividades sem efetuar a caução, sob pena de interdição do local, independentemente de qualquer formalidade.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§2º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Após a ocorrência do fato gerador a autoridade tributária apurará o valor do tributo a ser recolhido e fará encontro de contas entre o valor devido e o valor caucionado, no prazo 5 (cinco) dias úteis.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§3º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Caso o sujeito passivo não se apresente para a homologação do imposto no encontro de contas, será o valor caucionado convertido em renda, resguardado o direito da Fazenda Municipal de lançar eventuais diferenças constatadas entre o valor estimado e o valor arbitrado.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 35.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O valor do imposto lançado por estimativa levará em consideração:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">o tempo de duração e a natureza específica da atividade;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">o preço corrente dos serviços;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">III – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">o local do estabelecimento do contribuinte;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">IV – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">o volume da receita em períodos anteriores e sua projeção para os períodos seguintes, podendo ainda se basear na receita de outros contribuintes de idêntica atividade.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 36.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Os contribuintes que incorrerem na hipótese do § 3º do artigo 34 poderão, no prazo de 30 (trinta) dias a contar da ciência da respectiva notificação, apresentar impugnação contra o valor arbitrado, observado o disposto na legislação municipal.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Parágrafo único  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A impugnação prevista no caput deste conterá, obrigatoriamente, o valor que o interessado reputar justo e os elementos para sua aferição.</span></div><div class=\"doc-est-capitulo\"><div class=\"doc-est-label\">CAPÍTULO XI</div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 37.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O imposto será recolhido, através da rede bancária autorizada, através do Documento de Arrecadação da Receita Municipal – DARM específico, emitida pela administração tributária.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 38.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">No caso do imposto calculado sobre a receita bruta mensal apurada ou estimada, o recolhimento deverá ser feito mensalmente aos cofres da Prefeitura Municipal, através dos bancos autorizados, independentemente de qualquer aviso ou notificação e do recebimento do preço do serviço ou da época do seu recebimento, até o dia 20 (vinte) do mês subsequente ao da ocorrência do fato gerador, conforme dispuser o regulamento.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Parágrafo único  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Os responsáveis pela retenção e pelo recolhimento do imposto o farão no prazo determinado no caput.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 39.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Quando os serviços forem prestados sob a forma de trabalho pessoal do próprio contribuinte o recolhimento do imposto se dará até 30 de junho de cada ano, de acordo com o Calendário de Recolhimento de Tributos Municipais - CATRIMA.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Parágrafo único  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">No caso de início de atividade o imposto será devido, antes do início da atividade, proporcionalmente ao número de meses restantes no ano.</span></div><div class=\"doc-est-capitulo\"><div class=\"doc-est-label\">CAPÍTULO XII</div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 40.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O contribuinte domiciliado no Município de Maricá, com ou sem estabelecimento, ainda que isento ou imune, deve requerer sua inscrição no Cadastro Mobiliário do Município antes de iniciar suas atividades, fornecendo os elementos e as informações necessárias para a correta fiscalização do tributo.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§1º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O contribuinte ou responsável não domiciliado neste Município, que por conta da legislação aplicável deva recolher o tributo ao Município de Maricá deverá promover sua inscrição eventual, da forma como dispuser o regulamento.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§2º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O órgão responsável pelo Cadastro Mobiliário do Município, deverá promover de ofício a inscrição, a alteração ou a baixa, quando constatada situação de fato, quedando inerte a pessoa física ou jurídica responsável, ou por qualquer outro motivo, sem prejuízo das sanções previstas na legislação.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§3º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Fica adotada a Classificação Nacional de Atividades Econômicas – CNAE da Comissão Nacional de Classificação - CONCLA, como elemento base para o cadastramento e recadastramento das empresas localizadas no Município de Maricá.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§4º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Fica adotada a Classificação Brasileira de Ocupações – CBO da Comissão Nacional de Classificação - CONCLA, como elemento base para o cadastramento e recadastramento das ocupações econômicas no Município de Maricá.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 41.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Para cada estabelecimento o contribuinte deve fazer uma inscrição, exceto quando tratar-se de não-estabelecido, que fica sujeito à inscrição única por atividade.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 42.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Em se tratando de prestação dos Serviços de Registros Públicos, Cartorários e Notariais, previstos no subitem 21.01 do Anexo I desta lei, a inscrição municipal será feita em nome do titular da serventia.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 43.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A inscrição não presume a aceitação pela Prefeitura dos dados e das informações apresentadas pelo contribuinte.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 44.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O contribuinte deverá comunicar à Prefeitura no prazo de 30 (trinta) dias das seguintes ocorrências:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">alteração ou inclusão de novas atividades, alteração de contrato social ou de quaisquer outros dados cadastrais;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">cessação de atividades, a fim de obter a baixa de inscrição cadastral.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 45.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O contribuinte deverá comunicar à Prefeitura a paralisação de suas atividades com antecedência mínima de 72 (setenta e duas) horas da ocorrência, estabelecendo no comunicado o período da paralisação.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Parágrafo único  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Caso o contribuinte resolva retomar suas atividades antes do término do prazo constante do comunicado, deverá o mesmo proceder comunicado à Prefeitura de retorno de atividade obedecendo a mesma antecedência prevista no caput.</span></div><div class=\"doc-est-capitulo\"><div class=\"doc-est-label\">CAPÍTULO XIII</div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 46.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Fica adotada a Declaração Mensal de Serviços de Instituições Financeiras – DESIF, que consiste em sistema eletrônico para registro e apuração das contas tributáveis, cálculo e emissão do respectivo documento de arrecadação do ISSQN devido pelas instituições financeiras e equiparadas, autorizadas a funcionar pelo Banco Central do Brasil – BACEN, e demais pessoas jurídicas obrigadas a utilizar o Plano Contábil das Instituições do Sistema Financeiro Nacional – COSIF, conforme dispuser o regulamento.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(30, 95, 168, 0.06); border-left: 3px solid var(--blue); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><div style=\"font-size:13px;font-family:monospace;\"><span style=\"font-weight:700;color:var(--blue)\">Art. 47.  </span><span style=\"color:var(--muted);text-decoration:line-through\">Será pessoalmente responsável pelas obrigações tributárias resultantes de atos praticados com infração ao regulamento da DESIF o gerente, diretor e/ou representante de cada agência das instituições financeiras.</span></div><div style=\"font-size:13px;font-family:monospace;margin-top:3px\"><span style=\"font-weight:700;color:var(--blue)\">Art. 47.  </span><span style=\"color:var(--text)\">Será pessoalmente responsável pelas obrigações tributárias resultantes de atos praticados com infração da presente lei o gerente, diretor e/ou representante de cada agência das instituições financeiras.</span><br><span class=\"doc-art-nota\">(Redação dada pela Lei Complementar nº 419/2025)</span></div></div><div style=\"margin-left: 0px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(21, 95, 59, 0.06); border-left: 3px solid var(--green); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--green)\">Art. 47-A.  </span><span style=\"font-size:13px;font-family:monospace;color:var(--text)\">No momento da conclusão da prestação de serviço de execução de obra de construção civil, demolição, reparação, conservação ou reforma de determinado edifício, deverão ser declarados todos os serviços executados, com os respectivos documentos fiscais, bem como os dados do imóvel necessários à tributação, na forma e condições estabelecidas no regulamento.</span><br><span class=\"doc-art-nota\">(Incluído pela Lei Complementar nº 419/2025)</span></div><div style=\"margin-left: 0px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(21, 95, 59, 0.06); border-left: 3px solid var(--green); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--green)\">§1º  </span><span style=\"font-size:13px;font-family:monospace;color:var(--text)\">A declaração de que trata o caput será realizada pelo responsável pela obra ou pelo sujeito passivo do IPTU referente ao imóvel objeto do serviço.</span><br><span class=\"doc-art-nota\">(Incluído pela Lei Complementar nº 419/2025)</span></div><div style=\"margin-left: 0px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(21, 95, 59, 0.06); border-left: 3px solid var(--green); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--green)\">§2º  </span><span style=\"font-size:13px;font-family:monospace;color:var(--text)\">As edificações presumem-se concluídas ou modificadas na data informada, pelo responsável pela declaração, como sendo a data de finalização da obra.</span><br><span class=\"doc-art-nota\">(Incluído pela Lei Complementar nº 419/2025)</span></div><div style=\"margin-left: 0px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(21, 95, 59, 0.06); border-left: 3px solid var(--green); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--green)\">§3º  </span><span style=\"font-size:13px;font-family:monospace;color:var(--text)\">O preenchimento e a confirmação de envio da declaração configuram confissão irretratável de dívida em relação aos valores nela declarados, podendo os créditos tributários correspondentes ser inscritos diretamente em dívida ativa.</span><br><span class=\"doc-art-nota\">(Incluído pela Lei Complementar nº 419/2025)</span></div><div style=\"margin-left: 0px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(21, 95, 59, 0.06); border-left: 3px solid var(--green); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--green)\">§4º  </span><span style=\"font-size:13px;font-family:monospace;color:var(--text)\">A não apresentação da declaração no prazo regulamentar ou a apresentação incompleta ou com informações falsas sujeitarão o responsável ao lançamento de ofício do ISSQN, com aplicação da multa prevista na legislação tributária municipal, sem prejuízo de outras sanções cabíveis.</span><br><span class=\"doc-art-nota\">(Incluído pela Lei Complementar nº 419/2025)</span></div><div class=\"doc-est-capitulo\"><div class=\"doc-est-label\">CAPÍTULO XIV</div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 48.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A Nota Fiscal de Serviços eletrônica – NFS-e, documento gerado e armazenado eletronicamente no sistema gerenciador do ISSQN disponibilizado pela Prefeitura Municipal de Maricá, é o documento fiscal básico que objetiva registrar as operações relativas à prestação de serviços pelos prestadores de serviço estabelecidos no Município de Maricá.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Parágrafo único  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">As normas para autorização e emissão da NFS-e e as regras para operacionalização do Recibo Provisório de Serviço - RPS serão definidas em regulamento.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(30, 95, 168, 0.06); border-left: 3px solid var(--blue); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><div style=\"font-size:13px;font-family:monospace;\"><span style=\"font-weight:700;color:var(--blue)\">Art. 49.  </span><span style=\"color:var(--muted);text-decoration:line-through\">A emissão da NFS-e constitui confissão de dívida do Imposto Sobre Serviços de Qualquer Natureza incidente na operação, ficando a falta de seu recolhimento sujeita a cobrança administrativa ou judicial, observados os procedimentos regulamentares.</span></div><div style=\"font-size:13px;font-family:monospace;margin-top:3px\"><span style=\"font-weight:700;color:var(--blue)\">Art. 49.  </span><span style=\"color:var(--text)\">As informações prestadas na Nota Fiscal de Serviços Eletrônica – NFS-e, bem como na escrituração dos serviços prestados e tomados, configuram confissão de dívida do Imposto Sobre Serviços de Qualquer Natureza incidente na operação, ficando a falta de seu recolhimento sujeita aos procedimentos de cobrança administrativa ou judicial, observados os procedimentos regulamentares.</span><br><span class=\"doc-art-nota\">(Redação dada pela Lei Complementar nº 419/2025)</span></div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 50.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A Nota Fiscal Avulsa de Serviços eletrônica – NFAS-e, documento gerado e armazenado eletronicamente no sistema gerenciador do ISSQN disponibilizado pela Prefeitura Municipal de Maricá, destina-se às pessoas físicas ou jurídicas do Município de Maricá, ou de fora deste, que aqui prestem serviços eventuais, conforme definido em regulamento.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§1º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O ISSQN será exigido do prestador antecipadamente, por ocasião da emissão da NFAS-e, mediante alíquota especificada no Anexo I e II desta Lei.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§2º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A Nota Fiscal Avulsa de Serviços eletrônica:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">será fornecida pela autoridade fiscal, mediante solicitação do interessado, nos limites e termos a serem definidos em Resolução do órgão responsável pela arrecadação municipal;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">obedecerá a uma numeração anual geral e sequencial crescente, estabelecida pela administração;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">III – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">será automaticamente gravada na escrituração do tomador do serviço;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">IV – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">dispensa o tomador do serviço do recolhimento do ISSQN a ela relativo;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">V – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">não terá custo de emissão.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§3º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Não poderá ser fornecida NFAS-e, devendo o contribuinte regularizar sua atividade e solicitar autorização para emissão de Nota Fiscal de Serviços eletrônica – NFS-e, quando os serviços não se caracterizarem como eventuais.</span></div><div class=\"doc-est-capitulo\"><div class=\"doc-est-label\">CAPÍTULO XV</div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 51.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O Poder Executivo, no interesse da política fiscal de tributação, arrecadação e fiscalização, poderá conceder incentivos em favor da pessoa física que solicitar Nota Fiscal de Serviços eletrônica (NFS-e) das pessoas jurídicas ou equiparadas estabelecidas no Município de Maricá.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Parágrafo único  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A concessão e/ou utilização do incentivo poderá ser suspensa a qualquer tempo por ato do Poder Executivo, com fulcro no interesse público do Município.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 52.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O incentivo a que se refere o artigo 52 poderá consistir em uma das modalidades constantes nos incisos deste artigo ou em todas, conforme dispuser o regulamento:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">concessão de crédito, correspondente a percentual do montante do ISSQN relativo a cada NFS-e recebida pelo tomador, para fins de abatimento no Imposto sobre a Propriedade Predial e Territorial Urbana – IPTU lançado pelo Município de Maricá;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">participação em sorteio de prêmios;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">III – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">pagamento de importância, correspondente a percentual do montante do ISSQN relativo a cada NFS-e recebida pelo tomador, em moeda ou cujo valor nela se possa exprimir.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 53.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O crédito gerado e/ou o pagamento de importância observarão o percentual de até 30% (trinta por cento) aplicados sobre o montante do ISSQN.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§1º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O valor do crédito e/ou da importância somente será gerado após o pagamento do ISSQN relativo à NFS-e.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§2º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Quando o prestador de serviço for optante pelo Regime Especial Unificado de Arrecadação de Tributos e Contribuições devidos pelas Microempresas e Empresas de Pequeno Porte (Simples Nacional), será considerado como montante do ISSQN o resultado da aplicação da alíquota de 2% (dois por cento) sobre a base de cálculo.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§3º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O crédito terá validade até o dia trinta de setembro do segundo exercício seguinte àquele em que tiver sido gerado.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§4º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Não gerará crédito e/ou importância a ser paga:a prestação de serviço isenta, imune ou em que não houver incidência do ISSQN;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">a prestação de serviço cujo pagamento do ISSQN for realizado após a inscrição em Dívida Ativa;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">a prestação de serviço por contribuinte submetido ao regime de pagamento do ISSQN a partir de base de cálculo estimada ou por valor fixo, assim entendido também o MEI.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§5º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Não farão jus ao crédito e/ou ao pagamento de importância:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">as pessoas naturais que não possuam inscrição no Cadastro de Pessoas Físicas (CPF) do Governo Federal;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">as pessoas físicas que não tiverem seu CPF aposto na Nota Fiscal de Serviços eletrônica pelo prestador do serviço.</span></div><div class=\"doc-est-capitulo\"><div class=\"doc-est-label\">CAPÍTULO XVI</div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 54.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Fica o Poder Executivo autorizado a utilizar a autorregularização como instrumento de incentivo aos contribuintes que se encontrem com obrigações tributárias pendentes perante a Fazenda Municipal, procedimento que consiste no saneamento voluntário das irregularidades decorrentes de divergências ou inconsistências identificadas pelo Fisco no exercício regular de sua atividade.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§1º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O procedimento de autorregularização de que trata o caput se iniciará com a notificação do sujeito passivo, na qual serão indicadas as pendências ou inconsistências tributárias encontradas pela fiscalização de tributos.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§2º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A emissão da notificação de que trata o parágrafo anterior não configura início de ação fiscal e deverá estabelecer o prazo máximo para a autorregularização do contribuinte, que não será superior a 90 (noventa) dias.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 55.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O descumprimento das normas relativas às obrigações principais e acessórias do Imposto Sobre Serviços de Qualquer Natureza, quando apurados em regular procedimento fiscal, serão puníveis com as sanções dispostas neste capítulo.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Parágrafo único  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A imposição de quaisquer das penalidades previstas neste Capítulo não exime o sujeito passivo:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">da obrigação de pagar o tributo devido com a incidência da correção monetária, da multa de mora e dos juros legalmente previstos;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">do cumprimento das obrigações acessórias tributárias;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">III – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">do cumprimento de quaisquer outras sanções civis, administrativas ou criminais previstas no ordenamento jurídico.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 56.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O descumprimento da obrigação principal, quando ocorrer falta de pagamento ou pagamento a menor do tributo devido apurado em procedimento fiscal regular, resultará nas seguintes penalidades aplicadas ao sujeito passivo obrigado:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(30, 95, 168, 0.06); border-left: 3px solid var(--blue); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><div style=\"font-size:13px;font-family:monospace;\"><span style=\"color:var(--blue)\">IV – </span><span style=\"color:var(--muted);text-decoration:line-through\">nos casos de condutas não tipificadas na legislação como crimes contra a ordem tributária, multa de 75% (setenta e cinco por cento) do montante do tributo devido em UFIMA.</span></div><div style=\"font-size:13px;font-family:monospace;margin-top:3px\"><span style=\"color:var(--blue)\">IV – </span><span style=\"color:var(--text)\">I – nos casos de condutas não tipificadas na legislação como crimes contra a ordem tributária, multa de 75% (setenta e cinco por cento) do montante do tributo devido em UFIMA;</span><br><span class=\"doc-art-nota\">(Redação dada pela Lei Complementar nº 419/2025)</span></div></div><div style=\"margin-left: 20px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(30, 95, 168, 0.06); border-left: 3px solid var(--blue); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><div style=\"font-size:13px;font-family:monospace;\"><span style=\"color:var(--blue)\">V – </span><span style=\"color:var(--muted);text-decoration:line-through\">nos casos de condutas tipificadas na legislação como crimes contra a ordem tributária, multa de 150% (cento e cinquenta por cento) do montante do tributo devido em UFIMA, independentemente da representação fiscal para fins penais.</span></div><div style=\"font-size:13px;font-family:monospace;margin-top:3px\"><span style=\"color:var(--blue)\">V – </span><span style=\"color:var(--text)\">II – nos casos de condutas tipificadas como crimes contra a ordem tributária, multa de 100% (cem por cento) do montante do tributo devido em UFIMA, sem prejuízo da representação fiscal para fins penais.</span><br><span class=\"doc-art-nota\">(Redação dada pela Lei Complementar nº 419/2025)</span></div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 57.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">As infrações a qualquer obrigação acessória prevista na legislação do ISSQN, apuradas por meio de regular procedimento fiscal, ficam, por competência mensal, sujeitas a aplicação das seguintes multas:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">1 (um) UFIMA ou 20% (vinte por cento) do imposto devido, o que for maior, quando se tratar de pessoa jurídica ou equiparada não enquadrada nos incisos II e III deste artigo;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">5 (cinco) UFIMA ou 20% (vinte por cento) do imposto devido, o que for maior, quando se tratar de notários e oficiais de registro de imóveis ou seus prepostos;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(30, 95, 168, 0.06); border-left: 3px solid var(--blue); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><div style=\"font-size:13px;font-family:monospace;\"><span style=\"color:var(--blue)\">III – </span><span style=\"color:var(--muted);text-decoration:line-through\">20 (dez) UFIMA ou 20% (vinte por cento) do imposto devido, o que for maior, quando se tratar de instituição financeira ou equiparada.</span></div><div style=\"font-size:13px;font-family:monospace;margin-top:3px\"><span style=\"color:var(--blue)\">III – </span><span style=\"color:var(--text)\">20 (vinte) UFIMA ou 20% (vinte por cento) do imposto devido, o que for maior, quando se tratar de instituição financeira ou equiparada;</span><br><span class=\"doc-art-nota\">(Redação dada pela Lei Complementar nº 419/2025)</span></div></div><div style=\"margin-left: 20px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(21, 95, 59, 0.06); border-left: 3px solid var(--green); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><span style=\"font-family:monospace;font-size:13px;color:var(--green)\">IV – </span><span style=\"font-size:13px;font-family:monospace;color:var(--text)\">1 (uma) UFIMA ou 20% (vinte por cento) do imposto devido, o que for maior, quando se tratar da declaração obrigatória prevista no art. 47-A desta Lei Complementar, apresentada fora do prazo, com omissão ou inexatidão de informações.</span><br><span class=\"doc-art-nota\">(Incluído pela Lei Complementar nº 419/2025)</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 58.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Será aplicada multa de 20 (vinte) UFIMA, sem prejuízo da representação fiscal para fins penais, quando houver embaraço a ação fiscal, não for fornecida informação exigida pela Administração Tributária ou for fornecida em desacordo com a verdade material dos atos e fatos ocorridos.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§1º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Quando o embaraço à ação fiscal impossibilitar a apuração direta e real do crédito tributário, além da multa por embaraço já aplicada durante o procedimento fiscal, será imposta multa no valor correspondente ao dobro da multa prevista no caput deste artigo, sem prejuízo da constituição do crédito tributário por arbitramento.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§2º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Havendo embaraço à ação fiscal que motive a extinção de crédito tributário por decadência, além da imposição da multa prevista no caput deste artigo, será imposta a multa de 200% (duzentos por cento) do valor atualizado do crédito extinto.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 59.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Na reincidência, a infração será punida com o dobro da penalidade a ela correspondente.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§1º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Entende-se por reincidência o cometimento de nova infração, depois de tornar-se definitiva a decisão administrativa que tenha confirmado infração anterior.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§2º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Para efeitos de reincidência não prevalecerá a decisão definitiva anterior se entre a sua data e a da prática da nova infração tiver decorrido período de tempo superior a 5 (cinco) anos.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§3º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">No caso de instituições financeiras, o embaraço à fiscalização pela não entrega de documentos ou informações solicitadas pelo fisco mediante instauração de Processo Administrativo Tributário, acarretará multa de 25 (vinte e cinco) UFIMA por documento não entregue e/ou informação não prestada, sem prejuízo da penalidade prevista no § 1º deste artigo.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 60.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">As multas relativas à falta de prestação de informações ou à incorreção no cumprimento de obrigações acessórias, quando em valor fixo, terão redução de:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">90% (noventa por cento) para os Microempreendedor Individual (MEI);</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">50% (cinquenta por cento) para as microempresas ou empresas de pequeno porte optantes pelo Simples Nacional.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Parágrafo único  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">As reduções de que tratam os incisos I e II do caput não se aplicam na:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">hipótese de fraude, resistência ou embaraço à fiscalização;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">ausência de pagamento da multa no prazo de 30 (trinta) dias após a notificação.</span></div><div class=\"doc-est-titulo\"><div class=\"doc-est-label\">TÍTULO II</div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 61.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Livros e os documentos fiscais impressos do contribuinte são, pelo prazo de 5 (cinco) anos de seu encerramento ou enquanto produzirem seus efeitos, o que ocorrer por último, de exibição obrigatória à fiscalização.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 62.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Os profissionais autônomos de nível superior cadastrados no Município como Arquiteto(a) ou Engenheiro(a) Civil e deverão efetuar seu recadastramento até 90 (noventa) dias após a publicação desta lei, sob pena de cancelamento de sua inscrição municipal, sem prejuízo da cobrança de débitos porventura existentes.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 63.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Esta Lei entra em vigor na data da sua publicação, revogando o artigo 278 da Lei 910 de 14 de dezembro de 1990 (Lei Complementar nº 005 de 30 de janeiro de 1991); a Lei Complementar nº 112 de 12 de dezembro de 2003; a Lei Complementar nº 136 de 17 de janeiro de 2006; a Lei Complementar nº 192 de 14 de outubro de 2009; os artigos 40 e 41 da Lei Complementar nº 195 de 30 de outubro de 2009; a Lei Complementar nº 210 de 1º de julho de 2010; a Lei Complementar nº 213 de 02 de dezembro de 2010; os artigos 1º, 2º e 3º da Lei Complementar nº 240 de 08 de maio de 2014; a Lei Complementar nº 290 de 16 de novembro de 2017; a Lei Complementar 320 de 03 de dezembro de 2019; a Lei Complementar nº 323 de 11 de dezembro de 2019; a Lei Complementar nº 332 de 22 de dezembro de 2020; os artigos 13, 14, 15 e 16 e os Anexos I e II da Lei Complementar nº 357 de 30 de dezembro de 2021.</span></div><div><div class=\"doc-anexo-titulo\">ANEXO I</div><div class=\"doc-anexo-desc\">TABELA DE ALÍQUOTAS DO IMPOSTO SOBRE SERVIÇOS DE QUALQUER NATUREZA INCIDENTES SOBRE O PREÇO DO SERVIÇO</div><div class=\"anexo-vigencia\" style=\"font-size:12px;font-style:italic;color:var(--blue);padding:4px 12px 4px 12px;margin-bottom:4px;text-align:center;\">⚖ Vigência a partir de 01/01/2026</div><div class=\"anexo-sub-banner\">▶ ANEXO I substituído integralmente pela Lei Complementar nº 419/2025 — redação vigente abaixo:</div><div class=\"anexo-table-wrap\"><table class=\"anexo-table\"><thead><tr><th>ITEM</th><th>LISTA DE SERVIÇOS</th><th>ALÍQUOTA (%)</th></tr></thead><tbody><tr><td>1</td><td>1 - Serviços de informática e congêneres.</td><td>-</td></tr><tr><td>01.01</td><td>Análise e desenvolvimento de sistemas.</td><td>2%</td></tr><tr><td>01.02</td><td>Programação.</td><td>2%</td></tr><tr><td>01.03</td><td>Processamento, armazenamento ou hospedagem de dados, textos, imagens, vídeos, páginas eletrônicas, aplicativos e sistemas de informação, entre outros formatos e congêneres.</td><td>2%</td></tr><tr><td>01.04</td><td>Elaboração de programas de computadores, inclusive de jogos eletrônicos, independentemente da arquitetura construtiva da máquina em que o programa será executado, incluindo tablets, smartphones e congêneres.</td><td>2%</td></tr><tr><td>01.05</td><td>Licenciamento ou cessão de direito de uso de programas de computação</td><td>2%</td></tr><tr><td>01.06</td><td>Assessoria e consultoria em informática.</td><td>2%</td></tr><tr><td>01.07</td><td>Suporte técnico em informática, inclusive instalação, configuração e manutenção de programas de computação e bancos de dados.</td><td>2%</td></tr><tr><td>01.08</td><td>Planejamento, confecção, manutenção e atualização de páginas eletrônicas.</td><td>2%</td></tr><tr><td>01.09</td><td>Disponibilização, sem cessão definitiva, de conteúdos de áudio, vídeo, imagem e texto por meio da internet, respeitada a imunidade de livros, jornais e periódicos (exceto a distribuição de conteúdos pelas prestadoras de Serviço de Acesso Condicionado, de que trata a Lei nº 12.485 de 12 de setembro de 2011, sujeita ao ICMS)</td><td>2%</td></tr><tr><td>2</td><td>2 - Serviços de pesquisa e desenvolvimento de qualquer natureza.</td><td>-</td></tr><tr><td>02.01</td><td>Serviços de pesquisas e desenvolvimento de qualquer natureza.</td><td>2%</td></tr><tr><td>3</td><td>3 – Serviços prestados mediante locação, cessão de direito de uso e congêneres.</td><td>-</td></tr><tr><td>03.02</td><td>Cessão de direito de uso de marcas e de sinais de propaganda.</td><td>2%</td></tr><tr><td>03.03</td><td>Exploração de salões de festas, centro de convenções, escritórios virtuais, stands, quadras esportivas, estádios, ginásios, auditórios, casa de espetáculos, parques de diversões, canchas e congêneres, para realização de eventos ou negócios de qualquer natureza.</td><td>2%</td></tr><tr><td>03.04</td><td>Locação, sublocação, arrendamento, direito de passagem ou permissão de uso, compartilhado ou não, de ferrovia, rodovia, postes, cabos, dutos e condutos de qualquer natureza.</td><td>5%</td></tr><tr><td>03.05</td><td>Cessão de andaimes, palcos, coberturas e outras estruturas de uso temporário.</td><td>5%</td></tr><tr><td>4</td><td>Serviços de saúde, assistência médica e congêneres.</td><td>-</td></tr><tr><td>04.01</td><td>Medicina e biomedicina.</td><td>2%</td></tr><tr><td>04.02</td><td>Análises clínicas, patologia, eletricidade médica, radioterapia, quimioterapia, ultrassonografia, ressonância magnética, radiologia, tomografia e congêneres.</td><td>2%</td></tr><tr><td>04.03</td><td>Hospitais, clínicas, laboratórios, sanatórios, manicômios, casas de saúde, prontos-socorros, ambulatórios e congêneres.</td><td>2%</td></tr><tr><td>04.04</td><td>Instrumentação cirúrgica.</td><td>2%</td></tr><tr><td>04.05</td><td>Acupuntura.</td><td>2%</td></tr><tr><td>04.06</td><td>Enfermagem, inclusive serviços auxiliares.</td><td>2%</td></tr><tr><td>04.07</td><td>Serviços farmacêuticos.</td><td>2%</td></tr><tr><td>04.08</td><td>Terapia ocupacional, fisioterapia e fonoaudiologia.</td><td>2%</td></tr><tr><td>4.9</td><td>Terapias de qualquer espécie destinadas ao tratamento físico, orgânico e mental.</td><td>2%</td></tr><tr><td>4.10</td><td>Nutrição.</td><td>2%</td></tr><tr><td>4.11</td><td>Obstetrícia.</td><td>2%</td></tr><tr><td>4.12</td><td>Odontologia</td><td>2%</td></tr><tr><td>4.13</td><td>Ortóptica.</td><td>2%</td></tr><tr><td>4.14</td><td>Próteses sob encomenda.</td><td>2%</td></tr><tr><td>4.15</td><td>Psicanálise.</td><td>2%</td></tr><tr><td>4.16</td><td>Psicologia.</td><td>2%</td></tr><tr><td>4.17</td><td>Casas de repouso e de recuperação, creches, asilos e congêneres.</td><td>2%</td></tr><tr><td>4.18</td><td>Inseminação artificial, fertilização in vitro e congêneres.</td><td>2%</td></tr><tr><td>4.19</td><td>Bancos de sangue, leite, pele, olhos, óvulos, sêmen e congêneres.</td><td>2%</td></tr><tr><td>4.20</td><td>Coleta de sangue, leite, tecidos, sêmen, órgãos e materiais biológicos de qualquer espécie.</td><td>2%</td></tr><tr><td>4.21</td><td>Unidade de atendimento, assistência ou tratamento móvel e congêneres.</td><td>2%</td></tr><tr><td>4.22</td><td>Planos de medicina de grupo ou ransformação De Metais E De Compósitos</td><td>2</td></tr><tr><td>73</td><td>Trabalhadores Da Fabricação E Instalação Eletroeletrônica</td><td>2</td></tr><tr><td>74</td><td>Montadores De Aparelhos E Instrumentos De Precisão E Musicais</td><td>2</td></tr><tr><td>75</td><td>Joalheiros, Vidreiros, Ceramistas E Afins</td><td>2</td></tr><tr><td>76</td><td>Trabalhadores Nas Indústrias Têxtil, Do Curtimento, Do Vestúario E Das Artes Gráficas</td><td>2</td></tr><tr><td>77</td><td>Trabalhadores Das Indústrias De Madeira E Do Mobiliário</td><td>2</td></tr><tr><td>78</td><td>Trabalhadores De Funções Transversais</td><td>2</td></tr><tr><td>79</td><td>Trabalhadores Do Artesanato</td><td>1</td></tr><tr><td>81</td><td>Trabalhadores Em Indústrias De Processos Contínuos E Outras Indústrias</td><td>2</td></tr><tr><td>82</td><td>Trabalhadores De Instalações Siderúrgicas E De Materiais De Construção</td><td>2</td></tr><tr><td>83</td><td>Trabalhadores De Instalações E Máquinas De Fabricação De Celulose E Papel</td><td>2</td></tr><tr><td>84</td><td>Trabalhadores Da Fabricação De Alimentos, Bebidas E Fumo</td><td>2</td></tr><tr><td>86</td><td>Operadores De Produção, Captação, Tratamento E Distribuição (Energia, Água E Utilidades)</td><td>2</td></tr><tr><td>87</td><td>Operadores De Outras Instalações Industriais</td><td>2</td></tr><tr><td>91</td><td>Trabalhadores Em Serviços De Reparação E Manutenção Mecânica</td><td>2</td></tr><tr><td>95</td><td>Polimantenedores</td><td>2</td></tr><tr><td>99</td><td>Outros Trabalhadores Da Conservação, Manutenção E Reparação</td><td>1</td></tr></tbody></table></div></div>"},{"id":2073,"leiBaseId":2,"leiModId":8,"leiBaseNome":"Lei Complementar nº 358/2022","leiModNome":"Lei Complementar nº 426/2026","nalts":1,"data":"06/05/2026","alteracoes":[{"tipo":"alterado","disp":"Art. 7º","texto":"Será permitido o reparcelamento decorrente de inadimplência, uma única vez, desde que observado o pagamento inicial mínimo de 25% (vinte e cinco por cento) do saldo remanescente do parcelamento originário, acrescidos de juros, multas e encargos legais.","apos":"","textoAnt":"Tratando-se de crédito não ajuizado, será permitido o reparcelamento decorrente de inadimplência, desde que o observado o pagamento de mínimo 25% (vinte e cinco por cento) do saldo remanescente do parcelamento originário, acrescidos de juros, multas e encargos legais."}],"html":"<div class=\"doc-cabecalho\"><div class=\"doc-lei-id\">LEI COMPLEMENTAR Nº 358, DE 10 DE MARÇO DE 2022</div><div class=\"doc-ementa-bloco\"><div class=\"doc-ementa-txt\">DISPÕE SOBRE O PARCELAMENTO DOS CRÉDITOS DE NATUREZA TRIBUTÁRIA E NÃO TRIBUTÁRIA DE TITULARIDADE DO MUNICÍPIO DE MARICÁ; REVOGA ART. 284, DA LEI COMPLEMENTAR Nº 05, DE 30 DE JANEIRO DE 1991; E DÁ OUTRAS PROVIDÊNCIAS.</div></div><div class=\"doc-formula\">O POVO DO MUNICÍPIO DE MARICÁ, por seus representantes na Câmara Municipal, aprovou e o Prefeito Municipal, em seu nome sanciona a seguinte Lei Complementar:</div><div style=\"margin-top:.75rem\"><span class=\"doc-lei-cons\">Texto consolidado com as alterações da Lei Complementar nº 426/2026</span></div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 1º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Os créditos de natureza tributária e não tributária, de titularidade do Município de Maricá, inscritos ou não em dívida ativa, ajuizados ou por ajuizar, desde que vencidos, poderão ser parcelados em até 60 (sessenta) meses, observadas as condições fixadas nesta Lei Complementar e em regulamento específico editado pelo Chefe do Poder Executivo Municipal.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 2º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O valor da dívida parcelada será consolidado na data da efetivação do parcelamento, de acordo com os acréscimos legais previstos e será expresso em valores de moeda corrente nacional.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§1º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Por crédito consolidado compreende-se o total da dívida atinente ao pedido de parcelamento, computados os encargos e os acréscimos legais vencidos até a data da consolidação, monetariamente atualizado.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§2º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A consolidação do crédito não exclui a possibilidade de posterior verifi cação de sua exatidão e a cobrança ou devolução de eventuais diferenças.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§3º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O valor do crédito objeto do parcelamento corresponderá ao valor do crédito consolidado, deduzido o valor do pagamento a que se refere à entrada.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§4º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O sujeito passivo procederá ao pagamento dos débitos tributários e não tributários, em parcelas mensais, sucessivas, acrescidas de juros de 1% (um por cento) ao mês sobre o valor de cada parcela, calculados a partir do primeiro dia do mês subsequente ao vencimento do prazo até o último dia do mês anterior ao do pagamento.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§5º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">As parcelas obedecerão aos seguintes limites mínimos.</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">o valor de cada parcela para pessoa jurídica não poderá ser inferior a 1 (uma) Unidade Fiscal de Maricá - UFIMA;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">o valor de cada parcela para pessoa física não poderá ser inferior a 0,5 (cinco décimos) Unidade Fiscal de Maricá - UFIMA.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§6º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Lei específica versará sobre eventuais descontos de juros e multas, observadas as respectivas renúncias fiscais.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 3º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Não poderão ser reunidos no mesmo parcelamento os seguintes créditos:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">tributários com não tributários;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">relativos a tributos diferentes, com exceção daqueles cujos lançamentos são feitos conjuntamente;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">III – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">lançados de ofício mediante diferentes autos de infração ou notificações de lançamento;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">IV – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">lançados de ofício com outros lançados por homologação ou declaração; e</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">V – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">inscritos em dívida ativa com não inscritos em dívida ativa.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 4º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O número de parcelas fica condicionado ao respectivo valor total do crédito consolidado, de acordo com os parâmetros definidos a seguir:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">em até 48 (quarento e oito) parcelas mensais e sucessivas, quando os créditos não ultrapassarem o montante de 60 (sessenta) UFIMAS.</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">em até 54 (cinquenta e quatro) parcelas mensais e sucessivas, quando os créditos forem superiores a 60 (sessenta) UFIMAS e não ultrapassarem o montante de 600 (seiscentas) UFIMAS;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">III – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">em até 60 (sessenta) parcelas mensais e sucessivas, quando os créditos forem superiores a 600 (seiscentas) UFIMAS.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§1º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Pessoas físicas declaradas hipossuficientes ou que ganhem até 02 (dois) salários mínimo vigentes a época do requerimento do parcelamento, terão o prazo de até 60 (sessenta) meses, independentemente do valor do crédito tributário ou não tributário, desde que observado o artigo 2º, § 5º, desta lei.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§2º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O reconhecimento do direito previsto no parágrafo antecedente se dará no âmbito das atribuições dos órgãos descritas no art. 10 desta Lei Complementar.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 5º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O pedido de parcelamento de crédito constitui confi ssão extrajudicial irretratável e irrevogável do débito e aceitação plena e irrestrita das condições estabelecidas nesta Lei Complementar.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 6º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A falta de pagamento de 03 (três) parcelas consecutivas ou não, ou de qualquer parcela por mais de noventa dias, acarretará o cancelamento, independente de prévia notifi cação do contribuinte.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Parágrafo único  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O saldo devedor remanescente será objeto de prosseguimento de cobrança judicial, de inscrição em dívida ativa ou de ajuizamento, conforme o caso.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(30, 95, 168, 0.06); border-left: 3px solid var(--blue); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><div style=\"font-size:13px;font-family:monospace;\"><span style=\"font-weight:700;color:var(--blue)\">Art. 7º  </span><span style=\"color:var(--muted);text-decoration:line-through\">Tratando-se de crédito não ajuizado, será permitido o reparcelamento decorrente de inadimplência, desde que o observado o pagamento de mínimo 25% (vinte e cinco por cento) do saldo remanescente do parcelamento originário, acrescidos de juros, multas e encargos legais.</span></div><div style=\"font-size:13px;font-family:monospace;margin-top:3px\"><span style=\"font-weight:700;color:var(--blue)\">Art. 7º  </span><span style=\"color:var(--text)\">Será permitido o reparcelamento decorrente de inadimplência, uma única vez, desde que observado o pagamento inicial mínimo de 25% (vinte e cinco por cento) do saldo remanescente do parcelamento originário, acrescidos de juros, multas e encargos legais.</span><br><span class=\"doc-art-nota\">(Redação dada pela Lei Complementar nº 426/2026)</span></div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 8º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">É vedada a concessão de parcelamento relativos a esta Lei Complementar:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">ao contribuinte que tenha parcelamento em atraso, que não enseje o cancelamento, enquanto não regularizado o pagamento das parcelas vencidas e não pagas.</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">aos devedores que estejam sob ação fiscal, ressalvados os créditos anteriormente apurados, quando denunciados espontaneamente.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Parágrafo único  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A vedação que se trata o caput desse artigo é exclusiva para os créditos tributários e não tributários vencidos, observadas as vedações legais para os parcelamentos do Código Tributário Municipal.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 9º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O parcelamento somente será concedido mediante requerimento, protocolizado pessoalmente ou por procurador regulamente constituído, pelo contribuinte, responsável tributário ou devedor, ou ainda, por terceiro que demonstre ter legítimo interesse na liquidação do débito, importando na expressa confissão irretratável e indivisível, quanto a sua certeza, liquidez e exigibilidade.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§1º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Considera-se terceiro interessado o locatário, o cessionário, o usufrutuário, o donatário, o comodatário, o arrendatário, promitente comprador, posseiro, o cônjuge ou companheiro do proprietário ou terceiro, seus parentes, em linha reta ou colateral em até quarto grau, herdeiro ou inventariante, mediante prova documental idônea de uma dessas qualidades.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§2º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">No caso de terceiros interessados não conste dos cadastros municiais como contribuinte, responsável tributário ou devedor do crédito a ser parcelado, o parcelamento requerido nos termos do caput não suspende a exigibilidade do crédito e nem suspende ou não interrompe o decurso do prazo prescricional, salvo se apresentada declaração escrita com expresso reconhecimento do débito firmada pelo contribuinte, responsável tributário ou devedor do crédito.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§3º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Na hipótese prevista no §2º deste artigo, a data de vencimento da última parcela não poderá ser posterior ao sexto mês imediatamente anterior ao mês em que ocorrer o término do prazo prescricional da dívida original mais antiga incluída no parcelamento.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§4º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O terceiro interessado, defi nido no §1º deste artigo, não fará jus ao reparcelamento definido no art. 7º.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§5º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Para afastar as limitações previstas no § 2º deste artigo e no art. 7º deverá o solicitante do parcelamento promover as alterações cadastrais pertinentes junto ao Município.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 10.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A concessão e o controle do parcelamento e do reparcelamento dos créditos mencionados nesta Lei Complementar, bem como o seu cancelamento, incluem-se na competência:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">do Órgão Fazendário, relativamente aos créditos de natureza tributária e não tributária vencidos até a competência anterior e não inscritos em dívida ativa;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">da Procuradoria Geral do Município, relativamente aos créditos inscritos em dívida ativa ou ajuizados de natureza tributária e não tributária.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Parágrafo único  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O empresário ou a sociedade empresária que pleitear ou tiver deferido o processamento de recuperação judicial, poderá parcelar os seus débitos para com a Fazenda Municipal, ainda que não vencidos, nos termos do arts. 10-A, 10-B e 10-C da Lei Federal 10.522, de 19 de julho de 2002.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 11.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O disposto nesta Lei Complementar não se aplica aos créditos tributários relativos aos impostos cujo fato gerador tenha ocorrido quando o contribuinte era optante pelo Regime Especial Unificado de Arrecadação de Tributos e Contribuições devidos pelas Microempresas e Empresas de Pequeno Porte – SIMPLES NACIONAL, instituído pela Lei Complementar nº 123, de 14 de dezembro de 2006.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 12.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O Poder Executivo editará os atos necessários ao cumprimento desta Lei Complementar.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 13.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Ato conjunto do Órgão Fazendário e da Procuradoria Geral do Município regulamentará o procedimento de parcelamento on-line.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 14.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Fica revogado o art. 284, da Lei Complementar nº 05, de 30 de janeiro de 1991 - Código Tributário do Município de Maricá.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 15.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Esta Lei Complementar entra em vigor na data de sua publicação.</span></div><div class=\"doc-fecho\"><div class=\"doc-fecho-local\">GABINETE DO PREFEITO DO MUNICÍPIO DE MARICÁ, Estado do Rio de Janeiro, RJ, 10 DE MARÇO DE 2022.</div><div class=\"doc-fecho-assinatura\">Fabiano Taques Horta \nPREFEITO DO MUNICÍPIO DE MARICÁ</div></div>"}],"nid":4657}</textarea>
