 como as autarquias e fundações representadas judicialmente pela Procuradoria Geral do Município;","paiId":3869,"id":3870},{"tipo":"inc","label":"II","texto":"pelo dirigente máximo das entidades de direito público, diretamente ou mediante delegação, quando a controvérsia envolver as autarquias e fundações não representadas judicialmente pela Procuradoria Geral do Município;","paiId":3869,"id":3871},{"tipo":"inc","label":"III","texto":"pelo dirigente máximo das entidades de direito privado, diretamente ou mediante delegação, quando a controvérsia envolver as empresas públicas, as sociedades de economia mista e suas subsidiárias.","paiId":3869,"id":3872},{"tipo":"par","label":"Parágrafo único","texto":"A representação técnica das partes não será obrigatória. Entretanto, será realizada apenas por advogado por estas constituído, em qualquer etapa do processo de mediação e arbitragem.","paiId":3869,"id":3873},{"tipo":"secao","label":"Seção II","texto":"Da mediação e arbitragem","paiId":3850,"id":3874},{"tipo":"art","label":"Art. 7º","texto":"A Administração Pública Municipal Direta e Indireta poderá prever cláusulas de mediação e arbitragem nos editais, contratos administrativos, convênios, parcerias, contratos de gestão, de trabalho e instrumentos congêneres.","paiId":3874,"id":3875},{"tipo":"art","label":"Art. 8º","texto":"A Administração Pública Municipal Direta e Indireta poderá utilizar-se da mediação e arbitragem para dirimir conflitos relativos a essa lei.","paiId":3874,"id":3876},{"tipo":"par","label":"Parágrafo único","texto":"A Administração Pública Direta e Indireta deverá conveniar câmaras de mediação e arbitragem para a solução dos conflitos.","paiId":3876,"id":3877},{"tipo":"secao","label":"Seção III","texto":"Da transação tributária","paiId":3850,"id":3878},{"tipo":"art","label":"Art. 9º","texto":"O disposto nesta Seção estabelece os requisitos e as condições para que o município e os devedores ou as partes adversas realizem transação resolutiva de litígio, nos termos do art. 171 da lei nº 5.172/66.","paiId":3878,"id":3879},{"tipo":"par","label":"§1º","texto":"O município, antes da distribuição de eventuais execuções fiscais deverá, considerando o juízo de oportunidade, conveniência, celeridade e vantajosidade, celebrar transação através das câmaras de mediação e arbitragem, em quaisquer das modalidades de que se trata esta Seção.","paiId":3879,"id":3880},{"tipo":"par","label":"§2º","texto":"Para fins de aplicação e regulamentação desta Seção, serão observados, dentre outros, os princípios da isonomia, da capacidade contributiva, da transparência, da moralidade, da razoável duração dos processos e da eficiência e, resguardadas as informações protegidas por sigilo, o princípio da publicidade.","paiId":3879,"id":3881},{"tipo":"par","label":"§3º","texto":"Aplica-se o disposto nesta Seção:","paiId":3879,"id":3882},{"tipo":"inc","label":"I","texto":"à dívida ativa tributária cuja inscrição, cobrança ou representação incumbem à Procuradoria Geral do Município, às reclamações trabalhistas, aos contratos de natureza cível de toda Administração.","paiId":3882,"id":3883},{"tipo":"art","label":"Art. 10.","texto":"Para fins desta Seção, são modalidades de transação:","paiId":3878,"id":3884},{"tipo":"inc","label":"I","texto":"a proposta individual ou por adesão na cobrança da dívida ativa e cobrança de créditos tributários ainda não inscritos;","paiId":3884,"id":3885},{"tipo":"inc","label":"II","texto":"a adesão, nos demais casos de contencioso judicial ou administrativo tributário; e","paiId":3884,"id":3886},{"tipo":"inc","label":"III","texto":"a adesão no contencioso administrativo tributário de baixo valor;","paiId":3884,"id":3887},{"tipo":"inc","label":"IV","texto":"acordos celebrados nas reclamações trabalhistas;","paiId":3884,"id":3888},{"tipo":"inc","label":"V","texto":"clausulas de contratos firmados entre fornecedores ou prestadores de serviço e a Administração Publica Direta e/ou Indireta;","paiId":3884,"id":3889},{"tipo":"inc","label":"VI","texto":"acordos firmados para eventuais desapropriações;","paiId":3884,"id":3890},{"tipo":"inc","label":"VIII","texto":"acordos celebrados em matéria fundiária e ambientais.","paiId":3884,"id":3891},{"tipo":"art","label":"Art. 11.","texto":"A proposta de transação deverá expor os meios para a extinção dos créditos nela contemplados e estará condicionada, no mínimo, à assunção dos seguintes compromissos pelo devedor:","paiId":3878,"id":3892},{"tipo":"inc","label":"I","texto":"não utilização da transação de forma abusiva, com a finalidade de limitar, falsear ou prejudicar de qualquer forma a livre concorrência ou a livre iniciativa econômica;","paiId":3892,"id":3893},{"tipo":"inc","label":"II","texto":"não utilização da pessoa natural ou jurídica interposta para ocultar ou dissimular a origem ou a destinação de bens, de direitos e de valores, seus reais interesses ou a identidade dos beneficiários de seus atos, em prejuízo da Fazenda Pública municipal;","paiId":3892,"id":3894},{"tipo":"inc","label":"III","texto":"não alienação e oneração de bens ou direitos sem a devida comunicação ao órgão da Fazenda Pública municipal competente, quando exigível em decorrência de lei; e","paiId":3892,"id":3895},{"tipo":"inc","label":"IV","texto":"renuncia a quaisquer alegações de direito, atuais ou futuras, sobre as quais se fundem processos administrativos, ações judiciais, incluídas as coletivas ou recursos que tenham por objeto os créditos incluídos na transação, por meio de requerimento de extinção do respectivo processo com resolução de mérito, nos termos da alínea “c” do inciso III do caput do art. 487 da lei nº 13.105/15.","paiId":3892,"id":3896},{"tipo":"art","label":"Art. 12.","texto":"A proposta de transação aceita suspende a exigibilidade dos créditos por ela abrangidos e o andamento das respectivas execuções fiscais.","paiId":3878,"id":3897},{"tipo":"par","label":"§1º","texto":"As partes poderão transacionar cláusula expressa para a suspensão do processo judicial, conforme o disposto no inciso II do caput do art. 313 da lei nº 13.105/15.","paiId":3897,"id":3898},{"tipo":"par","label":"§2º","texto":"O termo de transação, quando cabível, preverá a anuência das partes para fins de suspensão convencional do processo de que trata o inciso II do caput do art. 313 da lei nº 13.105/15, até a extinção dos créditos nos termos do disposto no § 6º deste artigo ou eventual rescisão.","paiId":3897,"id":3899},{"tipo":"par","label":"§3º","texto":"A proposta de transação aceita e homologada suspende a exigibilidade dos créditos tributários e implica novação dos créditos por ela abrangidos.","paiId":3897,"id":3900},{"tipo":"par","label":"§4º","texto":"A aceitação da transação pelo devedor constitui confissão irretratável e irrevogável dos créditos por ela abrangidos.","paiId":3897,"id":3901},{"tipo":"par","label":"§5º","texto":"Os créditos abrangidos pela transação somente serão extintos quando integralmente cumpridas as condições previstas no respectivo termo.","paiId":3897,"id":3902},{"tipo":"art","label":"Art. 13.","texto":"Implicará a rescisão da transação:","paiId":3878,"id":3903},{"tipo":"inc","label":"I","texto":"o descumprimento das condições, das cláusulas ou dos compromissos assumidos;","paiId":3903,"id":3904},{"tipo":"inc","label":"II","texto":"a contrariedade de decisão judicial definitiva prolatada antes da celebração da transação;","paiId":3903,"id":3905},{"tipo":"inc","label":"III","texto":"a comprovação da existência de prevaricação, concussão ou corrupção passiva na sua formação;","paiId":3903,"id":3906},{"tipo":"inc","label":"IV","texto":"a ocorrência de dolo, fraude, simulação, erro essencial quanto à pessoa ou quanto ao objeto do conflito;","paiId":3903,"id":3907},{"tipo":"inc","label":"V","texto":"a constatação da inobservância de quaisquer disposições desta lei.","paiId":3903,"id":3908},{"tipo":"inc","label":"VI","texto":"a constatação, pelo credor, de ato tendente ao esvaziamento patrimonial do devedor como forma de fraudar o cumprimento da transação, ainda que realizado anteriormente à sua celebração;","paiId":3903,"id":3909},{"tipo":"inc","label":"VII","texto":"a ocorrência de alguma das hipóteses rescisórias adicionalmente previstas no respectivo termo de transação; ou","paiId":3903,"id":3910},{"tipo":"inc","label":"VIII","texto":"a comprovação de falsa declaração que ensejou a transação.","paiId":3903,"id":3911},{"tipo":"par","label":"§1º","texto":"A rescisão da transação e sua eventual adesão por parte do sujeito passivo não autorizam a restituição ou a compensação de importâncias pagas, compensadas ou incluídas em parcelamentos cuja opção tenha ocorrido anteriormente à celebração do respectivo termo.","paiId":3903,"id":3912},{"tipo":"par","label":"§2º","texto":"É admitida a regularização do vício que ensejaria a rescisão durante o prazo concedido para a impugnação, preservada a transação em todos os seus termos.","paiId":3903,"id":3913},{"tipo":"art","label":"Art. 14.","texto":"A rescisão da transação:","paiId":3878,"id":3914},{"tipo":"inc","label":"I","texto":"implicará o afastamento dos benefícios concedidos e a cobrança integral das dívidas, deduzidos os valores pagos; e","paiId":3914,"id":3915},{"tipo":"inc","label":"II","texto":"autorizará a Fazenda Pública a requerer a convolação da recuperação judicial em falência ou a ajuizar ação de falência, conforme o caso.","paiId":3914,"id":3916},{"tipo":"secao","label":"Seção III","texto":"Da Transação por Adesão","paiId":3850,"id":3917},{"tipo":"art","label":"Art. 15.","texto":"A proposta de transação por adesão será divulgada no Jornal Oficial de Maricá - JOM e nos sítios dos respectivos órgãos na internet, mediante edital que especifique, de maneira objetiva, as hipóteses fáticas e jurídicas nas quais a fazenda municipal propõe a transação no contencioso às condições previstas nesta Seção e no edital.","paiId":3917,"id":3918},{"tipo":"par","label":"§1º","texto":"O edital definirá as exigências a serem cumpridas, as reduções ou concessões oferecidas, os prazos e as formas de pagamento admitidas.","paiId":3918,"id":3919},{"tipo":"par","label":"§2º","texto":"É vedada a acumulação das reduções oferecidas pelo edital com quaisquer outras asseguradas na legislação em relação aos créditos abrangidos pela proposta de transação.","paiId":3918,"id":3920},{"tipo":"par","label":"§3º","texto":"O edital estabelecerá o prazo para adesão à transação e eventual limitação de sua abrangência a determinados créditos tributários ou que sejam referentes a certos períodos de competência.","paiId":3918,"id":3921},{"tipo":"par","label":"§4º","texto":"A celebração de transação, nos termos definidos no edital de que se trata o caput, compete:","paiId":3918,"id":3922},{"tipo":"inc","label":"I","texto":"à secretaria municipal responsável pela arrecadação, no âmbito do contencioso administrativo; e","paiId":3922,"id":3923},{"tipo":"inc","label":"II","texto":"à Procuradoria-Geral do Município, nas demais hipóteses legais.","paiId":3922,"id":3924},{"tipo":"art","label":"Art. 16.","texto":"As câmaras de mediação e arbitragem conveniadas poderão levar a protesto a sentença arbitral, acordo e certidão de dívida ativa (CDA) não cumpridos e enviados pela secretaria municipal competente para cobrança judicial, independentemente do valor do crédito, cujos efeitos do protesto alcançarão, igualmente, os responsáveis tributários apontados no art. 135 do Código Tributário Nacional, desde que seus nomes constem da Certidão de Dívida Ativa.","paiId":3917,"id":3925},{"tipo":"par","label":"§1º","texto":"Não tendo o devedor quitado o débito, na fase administrativa de cobrança, será emitida a certidão de dívida ativa (CDA) pela secretaria municipal competente, em favor do município de Maricá, ficando a Procuradoria Geral do Município autorizada a levar a protesto o documento, antes do ajuizamento da ação de execução fiscal, com a inclusão de honorários advocatícios, como encargos de cobrança da dívida ativa, pelos percentuais mínimos previstos nos incisos I a V do § 3º do art. 85 do Código de Processo Civil.","paiId":3925,"id":3926},{"tipo":"par","label":"§2º","texto":"O protesto é autorizado inclusive quanto à certidão de dívida ativa (CDA) em execução e ainda não protestada, caso em que se poderá requerer a suspensão da execução para a efetivação do protesto.","paiId":3925,"id":3927},{"tipo":"par","label":"§3º","texto":"Efetivado o protesto, sem que o devedor tenha no prazo legal quitado o débito, a Procuradoria Geral do Município fica autorizada a ajuizar a ação executiva do título com todos os valores devidamente atualizados ou requerer o andamento da execução, se esta estiver suspensa, sem prejuízo da manutenção do protesto no cartório competente.","paiId":3925,"id":3928},{"tipo":"par","label":"§4º","texto":"Uma vez quitado integralmente ou parcelado o débito pelo devedor, inclusive dos honorários advocatícios e dos emolumentos cartorários, a Procuradoria Geral do Município requererá a baixa do protesto, bem como a extinção ou a suspensão da ação de execução ajuizada.","paiId":3925,"id":3929},{"tipo":"par","label":"§5º","texto":"Na hipótese de descumprimento do parcelamento, a Procuradoria Geral do Município fica autorizada a levar a protesto a integralidade do valor remanescente devido ao município de Maricá, bem como os honorários advocatícios.","paiId":3925,"id":3930},{"tipo":"art","label":"Art. 17.","texto":"A Administração Pública Municipal Direta e Indireta poderá programar nas câmaras de mediação e arbitragem conveniadas, mutirões de conciliação para a redução do estoque de processos administrativos e judiciais.","paiId":3917,"id":3931},{"tipo":"par","label":"Parágrafo único","texto":"O disposto neste artigo poderá compreender a elaboração de desenho de sistemas de disputas para os casos adequados.","paiId":3931,"id":3932},{"tipo":"capitulo","label":"CAPÍTULO III","texto":"DAS DISPOSIÇÕES FINAIS","paiId":null,"id":3933},{"tipo":"art","label":"Art. 18.","texto":"O município de Maricá, por meio de sua Procuradoria Geral, e as câmara de mediação e arbitragem devidamente conveniadas poderão firmar convênios dispondo sobre as condições para a realização dos protestos dos títulos de que trata esta lei.","paiId":3933,"id":3934},{"tipo":"art","label":"Art. 19.","texto":"Toda custo do processo junto às câmaras de mediação e arbitragem deverá seguir o valor da tabela fixada no instrumento do convênio firmado com a municipalidade, em caso de gratuidade deverá ser observado as disposição da lei federal nº 1.060/50 e do Código de Processo Civil, bem como o Código Civil, ocasião que o município deverá arcará como valor.","paiId":3933,"id":3935},{"tipo":"par","label":"Parágrafo único","texto":"As custas adiantadas pela municipalidade poderão ser ressarcidas na celebração da transação entre as partes.","paiId":3935,"id":3936},{"tipo":"art","label":"Art. 20.","texto":"As câmara de mediação e arbitragem indicarão, para cada processo em que couber mediação e/ou arbitragem, um mediador e/ou árbitro para conduzir o procedimento de comunicação entre as partes, buscando o entendimento e o consenso e facilitando a resolução do conflito. Essa escolha deverá ser realizada na forma das respectivas regras das Câmaras conveniadas.","paiId":3933,"id":3937},{"tipo":"art","label":"Art. 21.","texto":"Os honorários devidos aos procuradores do município pelo devedor contribuinte na conciliação, mediação ou arbitragem, observará os percentuais mínimos previstos nos incisos I a V do § 3º do art. 85 do Código de Processo Civil.","paiId":3933,"id":3938},{"tipo":"art","label":"Art. 22.","texto":"O município de Maricá poderá efetuar convênio com a 38ª Subseção da OAB-Maricá para a constituição de observatório e comitê regulador visando a fiscalização da política de Desjudicialização e para a divulgação e celebração de cursos de aperfeiçoamento aos advogados.","paiId":3933,"id":3939},{"tipo":"art","label":"Art. 23.","texto":"O Poder Executivo regulamentará esta Lei no prazo de 90 (noventa) dias, contados de sua publicação.","paiId":3933,"id":3940},{"tipo":"art","label":"Art. 24.","texto":"As despesas decorrentes da execução desta Lei correrão por conta de dotações orçamentárias próprias, suplementadas se necessário.","paiId":3933,"id":3941},{"tipo":"art","label":"Art. 25.","texto":"Esta Lei entrará em vigor na data de sua publicação.","paiId":3933,"id":3942}],"anexos":[],"preambulo":"INSTITUI NO ÂMBITO DA ADMINISTRAÇÃO PÚBLICA DIRETA E INDIRETA NORMAS ESPECÍFICAS PARA CONVÊNIOS E FORMAS DE COMPOSIÇÃO DE LITÍGIO ATRAVÉS DE MEDIAÇÃO, CONCILIAÇÃO, ARBITRAGEM E COBRANÇA EXTRAJUDICIAL DE CRÉDITOS TRIBUTÁRIOS, CÍVEIS, AMBIENTAIS, MATÉRIA FUNDIÁRIA E CONTRATUAIS, INCLUSIVE EM SITUAÇÃO DE DESAPROPRIAÇÃO E FACULTA A RESOLUÇÃO DOS CONFLITOS.","formulaPromulgacao":"A CÂMARA MUNICIPAL DE MARICÁ, expressão legítima da Democracia representativa, aprovou e o seu Presidente promulga a seguinte Lei:","dataExtenso":"27 DE OUTUBRO DE 2023","municipio":"Maricá, Estado do Rio de Janeiro, RJ","fechoTexto":"CAMARA MUNICIPAL DE MARICÁ, Estado do Rio de Janeiro, em 27 de outubro de 2023.","assinatura":"Aldair Nunes Elias \nVereador"},{"id":36,"tipo":"lei","num":"3.358","ano":"2023","ementa":"Institui o Programa de Educação Fiscal do município de Maricá.","tributo":"geral","situacao":"vigente","link":"JOM 1.493, de 28/08/2023","artigos":[{"tipo":"titulo","label":"TÍTULO I","texto":"DO PROGRAMA DE EDUCAÇÃO FISCAL","paiId":null,"id":3789},{"tipo":"art","label":"Art. 1º","texto":"Fica instituído o Programa de Educação Fiscal do Município de Maricá - PMEFM, de acordo com o Programa Nacional de Educação Fiscal – PNEF e o Programa Estadual de Educação Fiscal do Estado do Rio de Janeiro - PEFRJ, a ser desenvolvido, de forma sistemática e permanente, nas escolas de ensino fundamental e médio da rede oficial e privada, nos órgãos públicos, nas universidades, sindicatos, associações, conselhos representativos de classes, fundações e em todos seguimentos da sociedade civil.","paiId":3789,"id":3790},{"tipo":"par","label":"Parágrafo único","texto":"As ações previstas nesta Lei serão regulamentadas, no que for necessário, por decreto municipal.","paiId":3790,"id":3791},{"tipo":"art","label":"Art. 2º","texto":"Considera-se Educação Fiscal, para fins desta Lei, o conjunto de ações mediante as quais o indivíduo e a coletividade constroem valores, conhecimentos e atitudes, voltados ao planejamento, à gestão, transparência e ao controle dos recursos públicos, de forma responsável, com base no exercício da cidadania fiscal e da corresponsabilidade, visando o bem comum, a melhoria da qualidade de vida e maior conscientização quanto aos gastos públicos.","paiId":3789,"id":3792},{"tipo":"art","label":"Art. 3º","texto":"São Objetivos do Programa de Educação Fiscal do Município de Maricá:","paiId":3789,"id":3793},{"tipo":"inc","label":"I","texto":"promover e institucionalizar a Educação Fiscal para o pleno exercício da cidadania;","paiId":3793,"id":3794},{"tipo":"inc","label":"II","texto":"conscientizar o cidadão sobre a importância da função socioeconômica do tributo;","paiId":3793,"id":3795},{"tipo":"inc","label":"III","texto":"incentivar a participação do cidadão na aplicação dos recursos públicos, dotando-o de conhecimentos específi cos sobre as obrigações do poder público;","paiId":3793,"id":3796},{"tipo":"inc","label":"IV","texto":"fomentar a confi ança entre o poder público e o cidadão, incentivando a transparência à aplicação dos recursos gerados com a arrecadação dos tributos pagos pelos contribuintes;","paiId":3793,"id":3797},{"tipo":"inc","label":"V","texto":"promover ações integradas de combate à sonegação fiscal;","paiId":3793,"id":3798},{"tipo":"inc","label":"VI","texto":"levar conhecimentos à população em geral sobre administração pública, arrecadação e controle de gastos públicos;","paiId":3793,"id":3799},{"tipo":"inc","label":"VII","texto":"contribuir permanentemente para a formação do indivíduo, visando ao desenvolvimento da conscientização sobre seus direitos e deveres no tocante ao valor social do tributo e ao controle social do Estado democrático;","paiId":3793,"id":3800},{"tipo":"inc","label":"VIII","texto":"aumentar a eficiência e transparência das receitas e despesas públicas; e","paiId":3793,"id":3801},{"tipo":"inc","label":"IX","texto":"valorizar o comércio, a indústria, a prestação de serviços e a produção primária do Município.","paiId":3793,"id":3802},{"tipo":"art","label":"Art. 4º","texto":"A implementação do Programa de Educação Fiscal ficará a cargo do Grupo de Trabalho para a Educação Fiscal do Município de Maricá – GTEFM, coordenado pela Secretaria de Planejamento, Orçamento e Fazenda e com apoio da Secretaria Municipal de Educação, composto pelas seguintes secretarias: Secretaria de Comunicação, Secretaria de Governo, Procuradoria Geral do Município, Secretaria de Habitação, Secretaria de Assistência Social, Secretaria de Cultura, Secretaria de Esporte e Lazer e Controladoria Geral do Município de Maricá devendo ser regulamentado, mediante ato do Poder Executivo, que regulamentará suas atribuições.","paiId":3789,"id":3803},{"tipo":"art","label":"Art. 5º","texto":"Compete ao Grupo de Trabalho de Educação Fiscal Municipal de Maricá - GTEFM:","paiId":3789,"id":3804},{"tipo":"inc","label":"I","texto":"planejar, executar, acompanhar e avaliar as ações necessárias à implantação do Programa no Município;","paiId":3804,"id":3805},{"tipo":"inc","label":"II","texto":"elaborar e desenvolver os projetos municipais;","paiId":3804,"id":3806},{"tipo":"inc","label":"III","texto":"buscar fontes de recursos para implantar e executar o programa no Município;","paiId":3804,"id":3807},{"tipo":"inc","label":"IV","texto":"buscar apoio de outras Secretarias Municipais e de outras organizações visando a ampliação do tema;","paiId":3804,"id":3808},{"tipo":"inc","label":"V","texto":"implantar as ações decorrentes de suas decisões;","paiId":3804,"id":3809},{"tipo":"inc","label":"VI","texto":"manter projetos de integração municipal entre os participantes do Programa;","paiId":3804,"id":3810},{"tipo":"inc","label":"VII","texto":"estimular a implantação do programa no âmbito do Município, subsidiado tecnicamente pelo Programa Estadual de Educação Fiscal;","paiId":3804,"id":3811},{"tipo":"inc","label":"VIII","texto":"elaborar e produzir material de divulgação e orientação;","paiId":3804,"id":3812},{"tipo":"inc","label":"IX","texto":"documentar, organizar e manter a memória do Programa no município, no âmbito de sua atuação;","paiId":3804,"id":3813},{"tipo":"art","label":"Art. 6º","texto":"As ações do Programa de Educação Fiscal do Município de Maricá poderão ser implantadas por meio de acordos ou convênios de cooperação técnica ou financeira em parceria com:","paiId":3789,"id":3814},{"tipo":"inc","label":"I","texto":"a União e o Estado;","paiId":3814,"id":3815},{"tipo":"inc","label":"II","texto":"órgãos de fiscalização, como Ministério Público e Tribunal de Contas do Estado do Rio de Janeiro e Tribunal de Justiça do Estado do Rio de Janeiro;","paiId":3814,"id":3816},{"tipo":"inc","label":"III","texto":"entidades e instituições de ensinos públicas ou privadas; e","paiId":3814,"id":3817},{"tipo":"inc","label":"IV","texto":"organizações da Sociedade Civil - ONGS.","paiId":3814,"id":3818},{"tipo":"art","label":"Art. 7º","texto":"Fica o Poder Executivo autorizado a contratar serviços ou adquirir materiais, inclusive de divulgação, para o programa, com recursos próprios e/ou participação de terceiros, entre as despesas relacionadas ao objeto de que trata esta Lei.","paiId":3789,"id":3819},{"tipo":"art","label":"Art. 8º","texto":"O Programa Municipal de Educação Fiscal de Maricá, será implantado com recursos próprios do orçamento da Secretaria de Planejamento, Orçamento e Fazenda.","paiId":3789,"id":3820},{"tipo":"art","label":"Art. 9º","texto":"Esta Lei entra em vigor na data de sua publicação.","paiId":3789,"id":3821}],"anexos":[],"preambulo":"INSTITUI O PROGRAMA DE EDUCAÇÃO FISCAL DO MUNICÍPIO DE MARICÁ E DÁ OUTRAS PROVIDÊNCIAS.","formulaPromulgacao":"O POVO DO MUNICÍPIO DE MARICÁ, por seus representantes na Câmara Municipal, aprovou e o Prefeito Municipal, em seu nome, sanciona a seguinte Lei:","dataExtenso":"23 DE AGOSTO DE 2023","municipio":"Estado do Rio de Janeiro, RJ","fechoTexto":"","assinatura":"FABIANO TAQUES HORTA \nPREFEITO DO MUNICÍPIO DE MARICÁ"},{"id":37,"tipo":"lei","num":"3.285","ano":"2023","ementa":"Dispõe sobre o acesso a meios de pagamento digitais para quitação de débitos tributários e não tributários.","tributo":"geral","situacao":"vigente","link":"JOM Especial 317, de 16/02/2023","artigos":[{"tipo":"art","label":"Art. 1º","texto":"Poderá o Poder Executivo, caso haja disponibilidade técnica e financeira, permitir ao contribuinte municipal o acesso a meios e formas de pagamento digitais para a quitação de débitos de natureza tributária e não-tributária no Município, tais como PIX e operações realizadas através de cartão de débito.","paiId":null,"id":3822},{"tipo":"par","label":"Parágrafo único","texto":"O Poder Executivo poderá disponibilizar em seu site institucional a opção de impressão de boleto de pagamento dos tributos com código “QR CODE”, de forma a possibilitar que os contribuintes realizem o pagamento do tributo por meio de aplicativo bancário.","paiId":3822,"id":3823},{"tipo":"art","label":"Art. 2º","texto":"O governo municipal poderá celebrar convênio com instituições bancárias visando à implantação do pagamento instantâneo através do PIX e do pagamento com cartão de débito.","paiId":null,"id":3824},{"tipo":"art","label":"Art. 3º","texto":"As despesas para a execução da presente lei correrão por conta das dotações orçamentárias próprias, podendo ser suplementadas, se necessário.","paiId":null,"id":3825},{"tipo":"art","label":"Art. 4º","texto":"Esta Lei entra em vigor na data de sua publicação.","paiId":null,"id":3826}],"anexos":[],"preambulo":"DISPÕE SOBRE PERMITIR AO CONTRIBUINTE MUNICIPAL O ACESSO A MEIO E FORMAS DE PAGAMENTO DIGITAIS PARA A QUITAÇÃO DE DÉBITOS DE NATUREZA TRIBUTÁRIA E NÃO TRIBUTÁRIA NO MUNICÍPIO.","formulaPromulgacao":"A CÂMARA MUNICIPAL DE MARICÁ, expressão legítima da Democracia representativa, aprovou e o seu Presidente promulga a seguinte Lei:","dataExtenso":"10 DE FEVEREIRO DE 2023","municipio":"","fechoTexto":"CÂMARA MUNICIPAL DE MARICÁ, Estado do Rio de Janeiro, em de 15 de fevereiro de 2023.","assinatura":"Vereador ALDAIR NUNES ELIAS \n(ALDAIR DE LINDA) \nPRESIDENTE"},{"id":38,"tipo":"lei","num":"3.280","ano":"2023","ementa":"Institui o Estatuto da Desburocratização no município de Maricá.","tributo":"geral","situacao":"vigente","link":"JOM 1.415, de 06/02/2023","artigos":[{"tipo":"art","label":"Art. 1º","texto":"Esta Lei estabelece normas básicas sobre o processo administrativo no âmbito da Administração Municipal direta e indireta, no município de Maricá visando, em especial, a simplificação de atos administrativos, no curso da prestação do serviço público.","paiId":null,"id":3953},{"tipo":"art","label":"Art. 2º","texto":"A Administração Pública municipal obedecerá, dentre outros, aos princípios da Legalidade, Finalidade, Motivação, Razoabilidade, Proporcionalidade, Moralidade, Ampla Defesa, Contraditório, Segurança Jurídica, Interesse Público e Eficiência.","paiId":null,"id":3954},{"tipo":"art","label":"Art. 3º","texto":"Os atos administrativos não dependem de forma determinada, salvo quando a Lei expressamente exigir.","paiId":null,"id":3955},{"tipo":"art","label":"Art. 4º","texto":"É dispensada a exigência de:","paiId":null,"id":3956},{"tipo":"inc","label":"I","texto":"reconhecimento de firma, devendo o agente administrativo, confrontando a assinatura com aquela constante no documento de identidade do signatário, ou estando presente e assinado o documento diante do agente, lavrar sua autenticidade no próprio documento;","paiId":3956,"id":3957},{"tipo":"inc","label":"II","texto":"autenticação de cópia de documento, cabendo ao agente administrativo, mediante comparação entre o original e a cópia, atestar a autenticidade;","paiId":3956,"id":3958},{"tipo":"inc","label":"III","texto":"juntada de documento pessoal do usuário do serviço público, que poderá ser substituído por cópia autenticada pelo próprio agente administrativo;","paiId":3956,"id":3959},{"tipo":"inc","label":"IV","texto":"apresentação de Certidão de Nascimento, que poderá ser substituída por Cédula de Identidade, Título de Eleitor, Identidade expedida por Conselho regional de Fiscalização Profissional, Carteira de Trabalho, Certificado de Prestação ou de Isenção do Serviço Militar, Passaporte ou Identidade Funcional expedida por órgão público.","paiId":3956,"id":3960},{"tipo":"par","label":"§1º","texto":"É vedada a exigência de prova relativa a fato que já houver sido comprovado pela apresentação de outro documento válido.","paiId":3956,"id":3961},{"tipo":"par","label":"§2º","texto":"Cabe ao usuário do serviço público a prova dos fatos que tenha alegado.","paiId":3956,"id":3962},{"tipo":"par","label":"§3º","texto":"VETADO.","paiId":3956,"id":3963},{"tipo":"art","label":"Art. 5º","texto":"VETADO.","paiId":null,"id":3964},{"tipo":"inc","label":"I","texto":"VETADO.","paiId":3964,"id":3965},{"tipo":"inc","label":"II","texto":"VETADO.","paiId":3964,"id":3966},{"tipo":"art","label":"Art. 6º","texto":"As despesas com a execução desta Lei correrão por conta de dotações orçamentárias próprias, suplementadas próprias, suplementadas se necessário.","paiId":null,"id":3967},{"tipo":"art","label":"Art. 7º","texto":"Esta Lei entra em vigor na data de sua publicação.","paiId":null,"id":3968}],"anexos":[],"preambulo":"INSTITUI O ESTATUTO DA DESBUROCRATIZAÇÃO NO MUNICÍPIO DE MARICÁ.","formulaPromulgacao":"O POVO DO MUNICÍPIO DE MARICÁ, por seus representantes na Câmara Municipal, aprovou e o Prefeito Municipal, em seu nome, sanciona a seguinte Lei:","dataExtenso":"01 DE FEVEREIRO DE 2023","municipio":"Maricá, Estado do Rio de Janeiro, RJ","fechoTexto":"","assinatura":"Fabiano Taques Horta \nPREFEITO DO MUNICÍPIO DE MARICÁ"},{"id":39,"tipo":"lei","num":"3.276","ano":"2023","ementa":"Dispõe sobre a cassação do Alvará de funcionamento de empresas que descartam lixo de forma irregular.","tributo":"geral","situacao":"vigente","link":"JOM 1.415, de 06/02/2023","artigos":[{"tipo":"art","label":"Art. 1º","texto":"Autoriza o Poder Executivo municipal a cassar o alvará de funcionamento de empresas que sejam flagradas descartando, resíduos sólidos ou químicos em vias públicas ou lugares não autorizados pela prefeitura de Maricá/RJ.","paiId":null,"id":3943},{"tipo":"par","label":"Parágrafo único","texto":"Aplica-se o disposto neste artigo àquelas empresas flagradas de alguma forma, realizando o descarte indevido ou lançamento irregular em rodovias, avenidas, ruas, vielas, praças, parques, terrenos, outras áreas protegidas e demais logradouros públicos.","paiId":3943,"id":3944},{"tipo":"art","label":"Art. 2º","texto":"O Poder Executivo fiscalizará o cumprimento desta Lei, e em caso de não atendimento, estarão sujeitas as seguintes sanções:","paiId":null,"id":3945},{"tipo":"inc","label":"I","texto":"notifi cação por escrito;","paiId":3945,"id":3946},{"tipo":"inc","label":"II","texto":"após a notifi cação e persistindo a infração, será aplicada multa de até 100 (cem) UFIMA’s, de acordo com a gravidade do ato;","paiId":3945,"id":3947},{"tipo":"inc","label":"III","texto":"suspensão das atividades por até 60 (sessenta) dias, de acordo com a gravidade do ato;","paiId":3945,"id":3948},{"tipo":"inc","label":"IV","texto":"cancelamento definitivo do Alvará de Funcionamento, em caso de nova reincidência.","paiId":3945,"id":3949},{"tipo":"art","label":"Art. 3º","texto":"Os sócios de tais empresas flagradas efetuando os descartes de forma irregular e tiverem seu alvará cassado, não poderão abrir empresas futuras com o mesmo Cadastro de Contribuintes Mobiliários (CCM).","paiId":null,"id":3950},{"tipo":"art","label":"Art. 4º","texto":"VETADO.","paiId":null,"id":3951},{"tipo":"art","label":"Art. 5º","texto":"Esta Lei entra em vigor na data de sua publicação.","paiId":null,"id":3952}],"anexos":[],"preambulo":"DISPÕE SOBRE A CASSAÇÃO DO ALVARÁ DE FUNCIONAMENTO DE EMPRESAS QUE DESCARTEM LIXO DE FORMA IRREGULAR NO MUNICÍPIO DE MARICÁ/RJ.","formulaPromulgacao":"O POVO DO MUNICÍPIO DE MARICÁ, por seus representantes na Câmara Municipal, aprovou e o Prefeito Municipal, em seu nome, sanciona a seguinte Lei:","dataExtenso":"01 DE FEVEREIRO DE 2023","municipio":"Estado do Rio de Janeiro, RJ","fechoTexto":"","assinatura":"Fabiano Taques Horta \nPREFEITO DO MUNICÍPIO DE MARICÁ"},{"id":41,"tipo":"lei","num":"3.182","ano":"2022","ementa":"Dispõe sobre a criação do Programa Nota Fiscal Premiada.","tributo":"issqn","situacao":"vigente","link":"JOM 1.347, de 19/08/2022","artigos":[{"tipo":"art","label":"Art. 1º","texto":"Fica criado o programa Nota Fiscal Premiada que consistirá em sorteios de prêmios em moeda social Mumbuca sendo destinado a pessoas físicas que solicitarem nota fiscal lei, cujos objetivos são:","paiId":null,"id":3969},{"tipo":"inc","label":"I","texto":"incentivar a regularização de empreendedores/empreendimentos;","paiId":3969,"id":3970},{"tipo":"inc","label":"II","texto":"reprimir a sonegação fiscal;","paiId":3969,"id":3971},{"tipo":"inc","label":"III","texto":"estimular a emissão de nota fiscal;","paiId":3969,"id":3972},{"tipo":"inc","label":"IV","texto":"fomentar o desenvolvimento da economia local através da circulação da moeda social Mumbuca;","paiId":3969,"id":3973},{"tipo":"inc","label":"V","texto":"aumentar a arrecadação do Município de Maricá.","paiId":3969,"id":3974},{"tipo":"inc","label":"VI","texto":"estimular a cultura e a educação fiscal dos cidadãos.","paiId":3969,"id":3975},{"tipo":"art","label":"Art. 2º","texto":"Poderão participar dos sorteios pessoas físicas que solicitarem nota fiscal de compra de produtos ou de serviço, emitida no município de Maricá, a partir de 50,00 Mumbucas e as cadastrarem na plataforma do programa.","paiId":null,"id":3976},{"tipo":"par","label":"Parágrafo único","texto":"Será estabelecido por meio de decreto o quantitativo de cupons ofertados, de acordo com os valores concedidos.","paiId":3976,"id":3977},{"tipo":"art","label":"Art. 3º","texto":"Os sorteios mensais de premiações correntes não excederão o montante total de R$ 30.000,00, pagos em moeda social Mumbuca sem possibilidade de conversão.","paiId":null,"id":3978},{"tipo":"par","label":"§1º","texto":"Fica definida a realização de sorteios especiais em datas comemorativas cujo montante sorteado não superará o valor de R$ 140.000,00 anuais, pagos em moeda social Mumbuca sem possibilidade de conversão.","paiId":3978,"id":3979},{"tipo":"par","label":"§2º","texto":"As definições dos valores das premiações individuais, tanto nos sorteios correntes quanto nos especiais serão definidas por regulamentação desta Lei.","paiId":3978,"id":3980},{"tipo":"art","label":"Art. 4º","texto":"Fica estabelecido o limite orçamentário anual de R$ 500.000,00 (quinhentos mil reais) para execução do Programa de que trata esta Lei.","paiId":null,"id":3981},{"tipo":"art","label":"Art. 5º","texto":"Para fins de fiscalização dos sorteios tratados por esta Lei, será criada comissão composta por servidores da Prefeitura Municipal de Maricá.","paiId":null,"id":3982},{"tipo":"art","label":"Art. 6º","texto":"Caso seja identificada inconsistência na documentação apresentada pelo ganhador do sorteio, respeitado os princípios da ampla defesa e contraditório, o consumidor será proibido de participar dos sorteios futuros, sem prejuízo de outras penalidades administrativas, cíveis e criminais.","paiId":null,"id":3983},{"tipo":"art","label":"Art. 7º","texto":"O disposto nesta lei poderá ser regulamentado por meio de decreto.","paiId":null,"id":3984}],"anexos":[],"preambulo":"DISPÕE SOBRE A CRIAÇÃO DO PROGRAMA NOTA FISCAL PREMIADA.","formulaPromulgacao":"O POVO DO MUNICÍPIO DE MARICÁ, por seus  alínea \"a\" ao art. 2º II; inclui inciso VIII ao art. 17; altera arts. 112 a 115; inclui arts. 352, 359, 360 e 361.","tributo":"geral","situacao":"vigente","link":"","artigos":[],"anexos":[]}],"consolidacoes":[{"id":2425,"leiBaseId":4,"leiModId":7,"leiBaseNome":"Lei Complementar nº 389/2023","leiModNome":"Lei Complementar nº 419/2025","nalts":31,"data":"04/05/2026","alteracoes":[{"tipo":"alterado","disp":"TÍTULO I – Capítulo XIII – Art. 47.","texto":"Será pessoalmente responsável pelas obrigações tributárias resultantes de atos praticados com infração da presente lei o gerente, diretor e/ou representante de cada agência das instituições financeiras.","apos":"","textoAnt":"Será pessoalmente responsável pelas obrigações tributárias resultantes de atos praticados com infração ao regulamento da DESIF o gerente, diretor e/ou representante de cada agência das instituições financeiras."},{"tipo":"incluido","disp":"TÍTULO I – Capítulo XIII – Art. 47-A.","texto":"No momento da conclusão da prestação de serviço de execução de obra de construção civil, demolição, reparação, conservação ou reforma de determinado edifício, deverão ser declarados todos os serviços executados, com os respectivos documentos fiscais, bem como os dados do imóvel necessários à tributação, na forma e condições estabelecidas no regulamento.","apos":"TÍTULO I – Capítulo XIII – Art. 47.","textoAnt":""},{"tipo":"incluido","disp":"TÍTULO I – Capítulo XIII – Art. 47-A. – §1º","texto":"A declaração de que trata o caput será realizada pelo responsável pela obra ou pelo sujeito passivo do IPTU referente ao imóvel objeto do serviço.","apos":"TÍTULO I – Capítulo XIII – Art. 47-A.","textoAnt":""},{"tipo":"incluido","disp":"TÍTULO I – Capítulo XIII – Art. 47-A. – §2º","texto":"As edificações presumem-se concluídas ou modificadas na data informada, pelo responsável pela declaração, como sendo a data de finalização da obra.","apos":"TÍTULO I – Capítulo XIII – Art. 47-A. – §1º","textoAnt":""},{"tipo":"incluido","disp":"TÍTULO I – Capítulo XIII – Art. 47-A. – §3º","texto":"O preenchimento e a confirmação de envio da declaração configuram confissão irretratável de dívida em relação aos valores nela declarados, podendo os créditos tributários correspondentes ser inscritos diretamente em dívida ativa.","apos":"TÍTULO I – Capítulo XIII – Art. 47-A. – §2º","textoAnt":""},{"tipo":"incluido","disp":"TÍTULO I – Capítulo XIII – Art. 47-A. – §4º","texto":"A não apresentação da declaração no prazo regulamentar ou a apresentação incompleta ou com informações falsas sujeitarão o responsável ao lançamento de ofício do ISSQN, com aplicação da multa prevista na legislação tributária municipal, sem prejuízo de outras sanções cabíveis.","apos":"TÍTULO I – Capítulo XIII – Art. 47-A. – §3º","textoAnt":""},{"tipo":"alterado","disp":"TÍTULO I – Capítulo V – SEÇÃO I – Art. 9º – II","texto":"a pessoa jurídica, exceto MEI, ainda que imune ou isenta, tomadora ou intermediária dos serviços descritos nos subitens 3.05, 7.02, 7.04, 7.05, 7.09, 7.10, 7.11, 7.12, 7.16, 7.17, 7.18, 7.19, 11.01, 11.02, 11.04, item 12 (exceto o subitem 12.13), 16.01, 16.02, 17.05, 17.10 e item 20 do Anexo I desta Lei;","apos":"","textoAnt":"a pessoa jurídica, exceto MEI, ainda que imune ou isenta, tomadora ou intermediária dos serviços descritos nos subitens 3.05, 7.02, 7.04, 7.05, 7.09, 7.10, 7.11, 7.12, 7.16, 7.17, 7.18, 7.19, 11.02, 16.02, 17.05 e 17.10 do Anexo I desta Lei."},{"tipo":"alterado","disp":"TÍTULO I – Capítulo V – SEÇÃO I – Art. 9º – §3º","texto":"Os responsáveis mencionados nos incisos do caput deste artigo ficam obrigados ao recolhimento integral do imposto devido, inclusive multa e acréscimos legais, independentemente de sua efetiva retenção na fonte, excetuando-se, quanto à multa e aos acréscimos, os órgãos da administração direta, as autarquias, fundações, empresas públicas e sociedades de economia mista dependentes do Município de Maricá.","apos":"","textoAnt":"Os responsáveis a que se referem os incisos do caput deste artigo estão obrigados ao recolhimento integral do imposto devido, multa e acréscimos legais, independentemente de ter sido efetuada sua retenção na fonte; exceção feita aos órgãos da administração direta, autarquias e fundações públicas de direito público do Município de Maricá, quanto à multa e aos acréscimos."},{"tipo":"alterado","disp":"TÍTULO I – Capítulo V – SEÇÃO II – Art. 12. – IV","texto":"o titular de direitos sobre imóvel, inclusive o proprietário, o possuidor ou o contratante da obra, sobre os serviços de construção civil, reforma, demolição, manutenção ou congêneres executados no respectivo imóvel, independentemente da pessoa do prestador de serviços ou da existência de vínculo contratual direto;","apos":"","textoAnt":"os titulares de direitos sobre prédios ou os contratantes de obras e serviços, se não identificarem os construtores ou os empreiteiros de construção, reconstrução, reforma, reparação ou acréscimo desses bens, pelo imposto devido pelos construtores ou empreiteiros;"},{"tipo":"incluido","disp":"TÍTULO I – Capítulo V – SEÇÃO II – Art. 12. – XIX","texto":"o prestador de serviços, quando, por erro, omissão ou prestação de informações falsas ou incompletas, der causa à falta de recolhimento do ISS, ainda que tenha sido emitido documento fiscal.","apos":"TÍTULO I – Capítulo V – SEÇÃO II – Art. 12. – XVIII","textoAnt":""},{"tipo":"alterado","disp":"TÍTULO I – Capítulo VI – Art. 14.","texto":"Na prestação de serviços por agências de publicidade, quando o serviço de publicidade e propaganda, no todo ou em parte, for executado por terceiros, a agência deverá discriminar, nas informações prestadas ao cliente, os valores correspondentes aos seus próprios honorários e comissões, bem como os valores relativos aos serviços executados por terceiros, devidamente respaldados por documentos fiscais emitidos pelos respectivos prestadores.","apos":"","textoAnt":"Em se tratando de prestação de serviços executados por empresas de publicidade, quando o serviço, ou parte dele, for executado por terceiros que emitam notas fiscais em nome da agência de publicidade, o preço do serviço desta será a diferença entre o valor da nota fiscal de serviços ao cliente e o valor da nota fiscal de serviços do executor à agência."},{"tipo":"alterado","disp":"TÍTULO I – Capítulo VI – Art. 14. – Parágrafo único","texto":"Na prestação de serviços descritos no caput, os valores referentes aos serviços executados por terceiros não integrarão a base de cálculo do ISS devido pela agência, desde que devidamente identificados e segregados, sob pena de inclusão do valor total do serviço contratado na base de cálculo do imposto.","apos":"","textoAnt":"No caso de o serviço ser prestado na forma do caput, na nota fiscal de serviços emitida pela agência de publicidade ao cliente, deverão constar os dados e informações das notas fiscais de serviços com os respectivos valores das deduções dos terceiros executores emitidos para a agência, sob pena de integrar-se à base de cálculo."},{"tipo":"alterado","disp":"TÍTULO I – Capítulo VI – Art. 16.","texto":"A base de cálculo do Imposto Sobre Serviços de Qualquer Natureza – ISSQN, nos serviços descritos nos itens 7.02 e 7.05 do Anexo I desta Lei, compreende o valor total do serviço, incluindo os materiais fornecidos pelo prestador, ainda que produzidos ou adquiridos por ele, salvo quando os materiais forem produzidos fora do local da obra e comercializados separadamente, com a incidência de ICMS, acompanhados de documentação fiscal apropriada e compatível com a operação.","apos":"","textoAnt":"Não se inclui na base de cálculo do Imposto Sobre Serviços de Qualquer Natureza o valor dos materiais fornecidos pelo prestador dos serviços previstos nos itens 7.02 e 7.05 do Anexo I desta Lei."},{"tipo":"revogado","disp":"TÍTULO I – Capítulo VI – Art. 16. – §1º","texto":"","apos":"","textoAnt":"Em relação às não inclusões previstas neste artigo quanto às mercadorias, só serão admitidas deduções relativas aos materiais que se incorporem ou se consumam na execução das obras, excluídos:"},{"tipo":"revogado","disp":"TÍTULO I – Capítulo VI – Art. 16. – §1º – I","texto":"","apos":"","textoAnt":"escoras, andaimes, torres e formas;"},{"tipo":"revogado","disp":"TÍTULO I – Capítulo VI – Art. 16. – §1º – II","texto":"","apos":"","textoAnt":"ferramentas, equipamentos de proteção individual, máquinas e respectiva manutenção;"},{"tipo":"revogado","disp":"TÍTULO I – Capítulo VI – Art. 16. – §1º – III","texto":"","apos":"","textoAnt":"materiais adquiridos para a formação de estoque ou armazenagem fora dos canteiros de obra antes de sua utilização;"},{"tipo":"revogado","disp":"TÍTULO I – Capítulo VI – Art. 16. – §1º – IV","texto":"","apos":"","textoAnt":"materiais recebidos na obra após a sua conclusão."},{"tipo":"alterado","disp":"TÍTULO I – Capítulo VI – Art. 17.","texto":"O preço do serviço é a receita bruta a ele correspondente, sem quaisquer deduções, exceto aquelas expressamente previstas nesta Lei.","apos":"","textoAnt":"Preço do serviço é a receita bruta a ele correspondente, sem quaisquer deduções com exceção do fornecimento de materiais previsto no artigo 16."},{"tipo":"incluido","disp":"TÍTULO I – Capítulo VI – Art. 17. – §7º","texto":"Nos serviços de intermediação, definidos como aqueles em que o intermediário aproxima partes interessadas na realização de negócio ou contratação de serviço, sem executar diretamente o objeto pactuado nem assumir responsabilidade técnica por sua execução, a base de cálculo do imposto será exclusivamente o valor da comissão ou remuneração recebida pela intermediação.","apos":"TÍTULO I – Capítulo VI – Art. 17. – §6º","textoAnt":""},{"tipo":"revogado","disp":"TÍTULO I – Capítulo VI – Art. 21.","texto":"","apos":"","textoAnt":"Equipara-se à pessoa jurídica a pessoa física que opte pela emissão de nota fiscal de serviço, que nesse caso passa a ter o ISSQN tributado na forma do inciso II do artigo 24."},{"tipo":"revogado","disp":"TÍTULO I – Capítulo VI – Art. 21. – Parágrafo único","texto":"","apos":"","textoAnt":"A opção de que trata o caput deverá ser exercida anualmente, conforme dispuser o regulamento."},{"tipo":"alterado","disp":"TÍTULO I – Capítulo VIII – Art. 24. – II","texto":"mensalmente, na forma estabelecida em regulamento, em relação aos serviços efetivamente prestados e tomados no período, independentemente do pagamento, quando o prestador for empresa, e o imposto seja devido no Município, na forma do art. 6º;","apos":"","textoAnt":"mensalmente, na forma estabelecida em regulamento, em relação ao serviço efetivamente prestado no período, independentemente do pagamento, quando o prestador for:"},{"tipo":"revogado","disp":"TÍTULO I – Capítulo VIII – Art. 24. – II – a)","texto":"","apos":"","textoAnt":"empresa; e"},{"tipo":"revogado","disp":"TÍTULO I – Capítulo VIII – Art. 24. – II – b)","texto":"","apos":"","textoAnt":"profissional autônomo ou liberal localizado que emita nota fiscal."},{"tipo":"alterado","disp":"TÍTULO I – Capítulo XIV – Art. 49.","texto":"As informações prestadas na Nota Fiscal de Serviços Eletrônica – NFS-e, bem como na escrituração dos serviços prestados e tomados, configuram confissão de dívida do Imposto Sobre Serviços de Qualquer Natureza incidente na operação, ficando a falta de seu recolhimento sujeita aos procedimentos de cobrança administrativa ou judicial, observados os procedimentos regulamentares.","apos":"","textoAnt":"A emissão da NFS-e constitui confissão de dívida do Imposto Sobre Serviços de Qualquer Natureza incidente na operação, ficando a falta de seu recolhimento sujeita a cobrança administrativa ou judicial, observados os procedimentos regulamentares."},{"tipo":"alterado","disp":"TÍTULO I – Capítulo XVI – Art. 56. – IV","texto":"I – nos casos de condutas não tipificadas na legislação como crimes contra a ordem tributária, multa de 75% (setenta e cinco por cento) do montante do tributo devido em UFIMA;","apos":"","textoAnt":"nos casos de condutas não tipificadas na legislação como crimes contra a ordem tributária, multa de 75% (setenta e cinco por cento) do montante do tributo devido em UFIMA."},{"tipo":"alterado","disp":"TÍTULO I – Capítulo XVI – Art. 56. – V","texto":"II – nos casos de condutas tipificadas como crimes contra a ordem tributária, multa de 100% (cem por cento) do montante do tributo devido em UFIMA, sem prejuízo da representação fiscal para fins penais.","apos":"","textoAnt":"nos casos de condutas tipificadas na legislação como crimes contra a ordem tributária, multa de 150% (cento e cinquenta por cento) do montante do tributo devido em UFIMA, independentemente da representação fiscal para fins penais."},{"tipo":"alterado","disp":"TÍTULO I – Capítulo XVI – Art. 57. – III","texto":"20 (vinte) UFIMA ou 20% (vinte por cento) do imposto devido, o que for maior, quando se tratar de instituição financeira ou equiparada;","apos":"","textoAnt":"20 (dez) UFIMA ou 20% (vinte por cento) do imposto devido, o que for maior, quando se tratar de instituição financeira ou equiparada."},{"tipo":"incluido","disp":"TÍTULO I – Capítulo XVI – Art. 57. – IV","texto":"1 (uma) UFIMA ou 20% (vinte por cento) do imposto devido, o que for maior, quando se tratar da declaração obrigatória prevista no art. 47-A desta Lei Complementar, apresentada fora do prazo, com omissão ou inexatidão de informações.","apos":"TÍTULO I – Capítulo XVI – Art. 57. – III","textoAnt":""},{"tipo":"anexo_substituido","disp":"Anexo: ANEXO I","anexoId":901,"novasColunas":["ITEM","LISTA DE SERVIÇOS","ALÍQUOTA (%)"],"novasLinhas":[["1","1 - Serviços de informática e congêneres.","-"],["01.01","Análise e desenvolvimento de sistemas.","2%"],["01.02","Programação.","2%"],["01.03","Processamento, armazenamento ou hospedagem de dados, textos, imagens, vídeos, páginas eletrônicas, aplicativos e sistemas de informação, entre outros formatos e congêneres.","2%"],["01.04","Elaboração de programas de computadores, inclusive de jogos eletrônicos, independentemente da arquitetura construtiva da máquina em que o programa será executado, incluindo tablets, smartphones e congêneres.","2%"],["01.05","Licenciamento ou cessão de direito de uso de programas de computação","2%"],["01.06","Assessoria e consultoria em informática.","2%"],["01.07","Suporte técnico em informática, inclusive instalação, configuração e manutenção de programas de computação e bancos de dados.","2%"],["01.08","Planejamento, confecção, manutenção e atualização de páginas eletrônicas.","2%"],["01.09","Disponibilização, sem cessão definitiva, de conteúdos de áudio, vídeo, imagem e texto por meio da internet, respeitada a imunidade de livros, jornais e periódicos (exceto a distribuição de conteúdos pelas prestadoras de Serviço de Acesso Condicionado, de que trata a Lei nº 12.485 de 12 de setembro de 2011, sujeita ao ICMS)","2%"],["2","2 - Serviços de pesquisa e desenvolvimento de qualquer natureza.","-"],["02.01","Serviços de pesquisas e desenvolvimento de qualquer natureza.","2%"],["3","3 – Serviços prestados mediante locação, cessão de direito de uso e congêneres.","-"],["03.02","Cessão de direito de uso de marcas e de sinais de propaganda.","2%"],["03.03","Exploração de salões de festas, centro de convenções, escritórios virtuais, stands, quadras esportivas, estádios, ginásios, auditórios, casa de espetáculos, parques de diversões, canchas e congêneres, para realização de eventos ou negócios de qualquer natureza.","2%"],["03.04","Locação, sublocação, arrendamento, direito de passagem ou permissão de uso, compartilhado ou não, de ferrovia, rodovia, postes, cabos, dutos e condutos de qualquer natureza.","5%"],["03.05","Cessão de andaimes, palcos, coberturas e outras estruturas de uso temporário.","5%"],["4","Serviços de saúde, assistência médica e congêneres.","-"],["04.01","Medicina e biomedicina.","2%"],["04.02","Análises clínicas, patologia, eletricidade médica, radioterapia, quimioterapia, ultrassonografia, ressonância magnética, radiologia, tomografia e congêneres.","2%"],["04.03","Hospitais, clínicas, laboratórios, sanatórios, manicômios, casas de saúde, prontos-socorros, ambulatórios e congêneres.","2%"],["04.04","Instrumentação cirúrgica.","2%"],["04.05","Acupuntura.","2%"],["04.06","Enfermagem, inclusive serviços auxiliares.","2%"],["04.07","Serviços farmacêuticos.","2%"],["04.08","Terapia ocupacional, fisioterapia e fonoaudiologia.","2%"],["4.9","Terapias de qualquer espécie destinadas ao tratamento físico, orgânico e mental.","2%"],["4.10","Nutrição.","2%"],["4.11","Obstetrícia.","2%"],["4.12","Odontologia","2%"],["4.13","Ortóptica.","2%"],["4.14","Próteses sob encomenda.","2%"],["4.15","Psicanálise.","2%"],["4.16","Psicologia.","2%"],["4.17","Casas de repouso e de recuperação, creches, asilos e congêneres.","2%"],["4.18","Inseminação artificial, fertilização in vitro e congêneres.","2%"],["4.19","Bancos de sangue, leite, pele, olhos, óvulos, sêmen e congêneres.","2%"],["4.20","Coleta de sangue, leite, tecidos, sêmen, órgãos e materiais biológicos de qualquer espécie.","2%"],["4.21","Unidade de atendimento, assistência ou tratamento móvel e congêneres.","2%"],["4.22","Planos de medicina de grupo ou individual e convênios para prestação de assistência médica, hospitalar, odontológica e congêneres.","5%"],["4.23","Outros planos de saúde que se cumpram através de serviços de terceiros contratados, credenciados, cooperados ou apenas pagos pelo operador do plano mediante indicação do beneficiário.","5%"],["5","Serviços de medicina e assistência veterinária e congêneres.","-"],["05.01","Medicina veterinária e zootecnia.","2%"],["05.02","Hospitais, clínicas, ambulatórios, prontos-socorros e congêneres, na área veterinária.","2%"],["05.03","Laboratórios de análise na área veterinária.","2%"],["05.04","Inseminação artificial, fertilização in vitro e congêneres.","2%"],["05.05","Bancos de sangue e de órgãos e congêneres.","2%"],["05.06","Coleta de sangue, leite, tecidos, sêmen, órgãos e materiais biológicos de qualquer espécie.","2%"],["05.07","Unidade de atendimento, assistência ou tratamento móvel e congêneres.","2%"],["05.08","Guarda, tratamento, amestramento, embelezamento, alojamento e congêneres.","2%"],["05.09","Planos de atendimento e assistência médico-veterinária.","5%"],["6","Serviços de cuidados pessoais, estética, atividades físicas e congêneres.","-"],["06.01","Barbearia, cabeleireiros, manicuros, pedicuros e congêneres.","2%"],["06.02","Esteticistas, tratamento de pele, depilação e congêneres.","2%"],["06.03","Banhos, duchas, sauna, massagens e congêneres.","2%"],["06.04","Ginástica, dança, esportes, natação, artes marciais e demais atividades físicas.","2%"],["06.05","Centros de emagrecimento, spa e congêneres.","2%"],["06.06","Aplicação de tatuagens, piercings e congêneres.","2%"],["7","Serviços relativos a engenharia, arquitetura, geologia, urbanismo, construção civil, manutenção, limpeza, meio ambiente, saneamento e congêneres.","-"],["07.01","Engenharia, agronomia, agrimensura, arquitetura, geologia, urbanismo, paisagismo e congêneres.","2%"],["07.02","Execução, por administração, empreitada ou subempreitada, de obras de construção civil, hidráulica ou elétrica e de outras obras semelhantes, inclusive sondagem, perfuração de poços, escavação, drenagem e irrigação, terraplanagem, pavimentação, concretagem e a instalação e montagem de produtos, peças e equipamentos (exceto o fornecimento de mercadorias produzidas pelo prestador dos serviços fora do local da prestação dos serviços, que fica sujeito ao ICMS).","5%"],["07.03","Elaboração de planos diretores, estudos de viabilidade, estudos organizacionais e outros, relacionados com obras e serviços de engenharia; elaboração de anteprojetos, projetos básicos e projetos executivos para trabalhos de engenharia.","2%"],["07.04","Demolição.","5%"],["07.05","Reparação, conservação e reforma de edifícios, estradas, pontes, portos e congêneres (exceto o fornecimento de mercadorias produzidas pelo prestador dos serviços fora do loca ,["39","Serviços de ourivesaria e lapidação.","-"],["39.01","Serviços de ourivesaria e lapidação (quando o material for fornecido pelo tomador do serviço).","2%"],["40","Serviços relativos a obras de arte sob encomenda.","-"],["40.01","Obras de arte sob encomenda.","2%"]],"texto":""}],"html":"<div class=\"doc-cabecalho\"><div class=\"doc-lei-id\">LEI COMPLEMENTAR Nº 389, DE 20 de dezembro de 2023</div><div class=\"doc-ementa-bloco\"><div class=\"doc-ementa-txt\">DEFINE A FORMA DE TRIBUTAÇÃO, NO MUNICÍPIO DE MARICÁ, DO IMPOSTO SOBRE SERVIÇOS DE QUALQUER NATUREZA – ISSQN, PREVISTO NO INCISO III DO ARTIGO 156 DA CONSTITUIÇÃO DA REPÚBLICA FEDERATIVA DO BRASIL DE 1988.</div></div><div class=\"doc-formula\">O POVO DO MUNICÍPIO DE MARICÁ, por seus representantes na Câmara Municipal, aprovou e o Prefeito Municipal, em seu nome, sanciona a seguinte Lei Complementar:</div><div style=\"margin-top:.75rem\"><span class=\"doc-lei-cons\">Texto consolidado com as alterações da Lei Complementar nº 419/2025</span></div></div><div class=\"doc-est-titulo\"><div class=\"doc-est-label\">TÍTULO I</div></div><div class=\"doc-est-capitulo\"><div class=\"doc-est-label\">CAPÍTULO I</div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 1º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O Imposto Sobre Serviços de Qualquer Natureza, tem como fato gerador a prestação dos serviços constantes dos Anexos desta Lei, ainda que esses não se constituam como atividade preponderante do prestador.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§1º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A hipótese de incidência do imposto se configura independentemente:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">da existência de estabelecimento fixo;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">do resultado financeiro do exercício da atividade;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">III – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">do cumprimento de qualquer exigência legal ou regulamentar, sem prejuízo das penalidades cabíveis;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">IV – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">do pagamento ou não do preço do serviço no mesmo mês ou exercício;</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§2º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O imposto incide também sobre:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">o serviço proveniente do exterior do País ou cuja prestação se tenha iniciado no exterior do País;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">os serviços prestados mediante a utilização de bens e serviços públicos explorados economicamente mediante autorização, permissão ou concessão, com o pagamento de tarifa, preço ou pedágio pelo usuário final do serviço.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§3º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Ressalvadas as exceções expressas no Anexo I desta Lei, os serviços nela mencionados não ficam sujeitos ao Imposto Sobre Operações Relativas à Circulação de Mercadorias e Prestações de Serviços de Transporte Interestadual e Intermunicipal e de Comunicação – ICMS, ainda que sua prestação envolva fornecimento de mercadorias.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 2º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Considera-se ocorrido o fato gerador do imposto e existentes os seus efeitos:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">desde o momento em que se verificarem as circunstâncias materiais necessárias para que a prestação dos serviços previstos na lista de serviços do Anexo I produza os efeitos que normalmente lhe são próprios;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">mensalmente, no caso da prestação de serviços em caráter continuado, considerando-se as frações de mês;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">III – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">na data de início de atividade e em cada dia 1º de janeiro dos exercícios subsequentes, até o término das atividades, no caso de contribuintes sujeitos à tributação por valores fixos anuais.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Parágrafo único  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Considera-se prestação de serviços em caráter continuado aquela em que o decurso de tempo superior a um mês é condição necessária para o seu cumprimento.</span></div><div class=\"doc-est-capitulo\"><div class=\"doc-est-label\">CAPÍTULO II</div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 3º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O Imposto sobre Serviços de Qualquer Natureza não incide sobre:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">a prestação de serviços de transportes interestadual e intermunicipal e de comunicação;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">as exportações de serviços para o exterior do País;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">III – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">a prestação de serviços em relação de emprego, dos trabalhadores avulsos, dos diretores e membros de conselho consultivo ou de conselho fiscal de sociedades e fundações, bem como dos sócios-gerentes e dos gerentes-delegados; e</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">IV – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">o valor intermediado no mercado de títulos e valores mobiliários, o valor dos depósitos bancários, o principal, juros e acréscimos moratórios relativos a operações de crédito realizadas por instituições financeiras.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Parágrafo único  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Não se enquadram no disposto no inciso II os serviços desenvolvidos no Município, cujo resultado aqui se verifique, ainda que o pagamento seja feito por residente no exterior.</span></div><div class=\"doc-est-capitulo\"><div class=\"doc-est-label\">CAPÍTULO III</div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 4º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Ficam isentos do imposto:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">os serviços prestados por associações culturais, associações comunitárias e clubes de serviço, cuja finalidade essencial, nos termos do respectivo estatuto e tendo em vista os atos efetivamente praticados, esteja voltada para o desenvolvimento da comunidade;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">os serviços de diversão pública e de competições desportivas com fins beneficentes ou considerados de interesse da comunidade pelo órgão de educação e cultura do Município ou órgão similar.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Parágrafo único  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">As isenções a que se referem os incisos I e II do caput não se aplicam às receitas decorrentes de:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">serviços prestados a não-sócios;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">serviços descritos no item 19 do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">III – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">serviços não compreendidos nas finalidades especificadas em seu Estatuto ou Contrato Social e de acordo com o art. 4º deste Lei.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 5º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">As isenções serão solicitadas em requerimento, acompanhado das provas de que o contribuinte preenche os requisitos necessários à obtenção do benefício.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§1º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Nos casos de início de atividade, o pedido de isenção deve ser feito por ocasião da concessão da licença para localização e/ou funcionamento de estabelecimentos.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§2º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A documentação apresentada com o primeiro pedido de isenção poderá servir para os demais exercícios, devendo o requerimento de renovação de isenção a ele referir-se, apresentando as provas relativas ao novo exercício.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§3º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">As renovações de isenções devem ser requeridas até o último dia de expediente na repartição fazendária do exercício anterior ao que se pleiteia o benefício, sob pena de perda do mesmo.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§4º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">As isenções serão revistas:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">por requerimento do contribuinte comunicando a extinção ou modificação das condições de prestação do serviço beneficiadas pelas hipóteses de isenção do artigo 4º;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">de ofício a qualquer tempo em que se constate a modificação das condições de prestação do serviço, por parte do contribuinte, de forma que não mais se enquadre nas hipóteses de isenção do artigo 4º, podendo ser promovido o seu cancelamento, se for o caso e nos termos da lei, independentemente das demais sanções cabíveis.</span></div><div class=\"doc-est-capitulo\"><div class=\"doc-est-label\">CAPÍTULO IV</div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 6º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O serviço considera-se prestado, e o imposto devido, no local do estabelecimento prestador ou, na falta do estabelecimento, no local do domicílio do prestador, exceto nas hipóteses previstas nos incisos abaixo, quando o imposto será devido no local:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">do estabelecimento do tomador ou intermediário do serviço ou, na falta de estabelecimento, onde ele estiver domiciliado, na hipótese do inciso I do parágrafo 2º do artigo 1º;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">da instalação dos andaimes, palcos, coberturas e outras estruturas, no caso dos serviços descritos no subitem 3.05 da tabela do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">III – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">da execução da obra, no caso dos serviços descritos subitens 7.02 e 7.19 do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">IV – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">da demolição, no caso dos serviços descritos no subitem 7.04 do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">V – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">das edificações em geral, estradas, pontes, portos e congêneres, no caso dos serviços descritos no subitem 7.05 do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">VI – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">da execução da varrição, coleta, remoção, incineração, tratamento, reciclagem, separação e destinação final de lixo, rejeitos e outros resíduos quaisquer, no caso dos serviços descritos no subitem 7.09 do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">VII – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">da execução da limpeza, manutenção e conservação de vias e logradouros públicos, imóveis, chaminés, piscinas, parques, jardins e congêneres, no caso dos serviços descritos no subitem 7.10 do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">VIII – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">da execução da decoração e jardinagem, do corte e poda de árvores, no caso dos serviços descritos no subitem 7.11 do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">IX – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">do controle e tratamento do efluente de qualquer natureza e de agentes físicos, químicos e biológicos, no caso dos serviços descritos no subitem 7.12 do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">X – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">do florestamento, reflorestamento, semeadura, adubação, reparação de solo, plantio, silagem, colheita, corte, descascamento de árvores, silvicultura, exploração florestal e serviços congêneres indissociáveis da formação, manutenção e colheita de florestas para quaisquer fins e por quaisquer meios, no caso dos serviços descritos no subitem 7.16 do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">XI – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">da execução dos serviços de escoramento, contenção de encostas e congêneres, no caso dos serviços descritos no subitem 7.17 do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">XII – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">da limpeza e dragagem, no caso dos serviços descritos no subitem 7.18 do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">XIII – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">onde o bem estiver guardado ou estacionado, no caso dos serviços descritos no subitem 11.01 do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">XIV – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">dos bens, dos semoventes ou do domicílio das pessoas vigiados, segurados ou monitorados, no caso dos serviços descritos no subitem 11.02 do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">XV – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">do armazenamento, depósito, carga, descarga, arrumação e guarda do bem, no caso dos serviços descritos no subitem 11.04 do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">XVI – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">da execução dos serviços de diversão, lazer, entretenimento e congêneres, no caso dos serviços descritos nos subitens do item 12, exceto o 12.13, do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">XVII – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">do Município onde está sendo executado o transporte, no caso dos serviços descritos pelo item 16 do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">XVIII – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">do estabelecimento do tomador da mão de obra ou, na falta de estabelecimento, onde ele estiver domiciliado, no caso dos serviços descritos pelo subitem 17.05 do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">XIX – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">da feira, exposição, congresso ou congênere a que se referir o planejamento, organização e administração, no caso dos serviços descritos pelo subitem 17.10 do Anexo I desta Lei;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">XX – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">do porto, aeroporto, ferroporto, terminal rodoviário, ferroviário ou metroviário, no caso dos serviços descritos pelo item 20 do Anexo I desta Lei.</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">XXI – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">do domicílio do tomador dos serviços dos subitens 4.22, 4.23 e 5.09 do Anexo I;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:
