uxo de atendimento, promovendo, quando necessário, o remanejamento e o reforço de pessoal;\n> II – subsidiar, orientar e apoiar ações voltadas para a execução das atividades relacionadas à melhoria, à inovação e ao gerenciamento de projetos e processos institucionais dos SIM;\n> III – orientar a conservação e utilização de móveis, utensílios e materiais em estoque, providenciando as condições necessárias para evitar deterioração e perda;\n> IV – monitorar e avaliar a qualidade dos atendimentos realizados, propondo melhorias nos processos e nas práticas de atendimento;\n> V – adotar medidas para a racionalização e simplificação dos procedimentos de rotina, instando à melhoria do atendimento ao contribuinte;\n> VI – receber sugestões, questionamentos, críticas, elogios e providenciar as medidas e respostas cabíveis encaminhando as demandas e questionamentos para o setor responsável;\n> VII – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\nArt. 44. Integra a estrutura da Gerência de Relacionamento com o Cidadão, o Setor de Call Center, que compete:\n> I – prestar atendimento eletrônico e telefônico aos contribuintes, esclarecendo dúvidas e fornecendo informações relacionadas aos Cadastros de Pessoas, Atividades Econômicas, Cadastro Imobiliário ou Geral do Município, bem como sobre débitos, parcelamentos, pagamentos e demais assuntos tributários ou créditos municipais;\n> II – comunicar aos contribuintes e servidores as decisões proferidas em processos administrativos, consultas e requerimentos, assegurando clareza e objetividade;\n> III – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\nArt. 45. Integra a estrutura da Gerência de Relacionamento com o Cidadão, o Setor de Cobrança, que compete:\n> I – programar, coordenar, executar e controlar as atividades de cobrança de débitos tributários diversos e de combate à inadimplência;\n> II – encaminhar para a análise e eventual inscrição da dívida os créditos tributários ou quaisquer outras receitas não recolhidas no período regulamentar quando esgotados os recursos de cobrança administrativa;\n> III – prestar informação em processos administrativos quanto à existência de débitos fiscais de contribuintes;\n> IV – manter controle de contribuintes inadimplentes na área de sua competência;\n> V – gerenciar as atividades relacionadas com acompanhamento econômico-tributário dos grandes contribuintes;\n> VI – gerar relatórios de monitoramento de débitos para subsidiar a Gerência de Administração do Crédito Tributário;\n> VII – apoiar a elaboração de relatório mensal consolidado dos créditos recebidos, dos processos de cobrança administrativa em andamento e do quantitativo inscrito em dívida ativa, pelo Setor de Cobrança e Dívida Ativa;\n> VIII – pronunciar-se sobre manifestação do contribuinte em relação a avisos de cobrança;\n> IX – emitir as Certidões Negativa, Positiva e/ou Positiva com Efeito de Negativa de Débitos, quando solicitado;\n> X – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\n## Capítulo III\n## DOS ÓRGÃOS DE ADMINISTRAÇÃO COLEGIADA\n\nArt. 46. Ao Conselho de Contribuintes compete rever, em grau de recurso, as decisões de 1ª instância, nos termos dos arts. 341 a 346 do Código Tributário Municipal e suas competências e atribuições serão regulamentadas em ato específico do Poder Executivo.\n\nArt. 47. As competências da 16ª Delegacia de Maricá – JUCERJA são regulamentadas pela Junta Comercial do Estado do Rio de Janeiro, cuja síntese se reproduz a seguir:\n> I – receber processos físicos para registro empresário e das diversas formas de sociedades, conforme disciplinado pela JUCERJA;\n> II – protocolar os atos constitutivos, alterações contratuais, abertura de filiais, distratos sociais, enquadramentos, desenquadramentos, reenquadramentos, arquivamentos de balanço patrimonial, comunicados de paralisação, comunicados de funcionamento, transformação, arquivamentos de procuração para autenticação de livros ou demais procurações;\n> III – orientar e sanar dúvidas, tanto presencialmente quanto por outros meios de comunicação;\n> IV – autenticar livros mercantis;\n> V – digitalizar documentos recebidos pelo Protocolo;\n> VI – dar suporte técnico referente a problemas envolvendo a funcionalidade dos Sistemas de Registro;\n> VII – solicitar treinamento para servidores;\n> VIII – solicitar acessos para usuários dos sistemas;\n> IX – sanar dúvidas pertinentes as Instruções Normativas da JUCERJA conforme o caso ou direcionar o usuário para o setor responsável na sede da Junta Comercial;\n> X – elaborar ofícios, comunicados, avisos, colher as assinaturas dos responsáveis pela Delegacia e encaminhar os documentos pertinentes ao registro de empresas e livros mercantis por malotes;\n> XI – esclarecer ao usuário quanto a dúvidas sobre exigências formalizadas nos processos pelo Julgador Singular e, quando não for possível, encaminhá-lo para o atendimento da coordenação da sede da Junta;\n> XII – participar de treinamentos quando solicitado pela sede da JUCERJA;\n> XIII – controlar os equipamentos emprestados pela sede da Junta Comercial do Estado do Rio de Janeiro e os materiais para uso diário da rotina da 16ª Delegacia;\n> XIII – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\n## TÍTULO IV\n## DAS VINCULAÇÕES TÉCNICAS, NORMATIVAS E ARTICULAÇÕES\n\nArt. 48. A subordinação hierárquica das unidades que compõe a Secretaria de Gestão Tributária e Fiscal se define por sua composição na estrutura administrativa prevista neste Regimento Interno.\n\nArt. 49. As unidades se relacionam entre si, na conformidade dos vínculos hierárquicos e funcionais expressos na estrutura e no enunciado de suas competências:\n> I – entre cada uma delas e os órgãos e entidades do Município de Maricá, na conformidade do definido pelos sistemas a que estão relacionadas;\n> II – entre cada uma delas e os órgãos e entidades externas do Município de Maricá, quando tiverem ou lhes for delegada essa competência, na pertinência de assuntos comuns.\n\n§ 1º O relacionamento com órgãos ou entidades externas ao Município de Maricá, será exercido pelo(a) Secretário(a) de Gestão Tributária e Fiscal.\n\n§ 2º Em ocasiões ou situação especial, o(a) Secretário(a) de Gestão Tributária e Fiscal delegará a incumbência referida no parágrafo anterior à Subsecretaria Tributária ou um servidor por ele designado, ressalvadas as matérias de sua exclusiva responsabilidade ou competência.\n\n§ 3º O(A) Secretário(a) designará o seu substituto em suas ausências, afastamentos e impedimentos, por meio de portaria.\n\n## TÍTULO V\n## DAS DISPOSIÇÕES FINAIS\n\nArt. 50. Os casos omissos e as dúvidas que venham a surgir, na aplicação do presente Regimento Interno, serão resolvidos pelo(a) Secretário(a) de Gestão Tributária e Fiscal.\n\nArt. 51. Este Regimento entra em vigor na data de sua publicação.","rodape":""}],"preambulo":"APROVA O REGIMENTO INTERNO E CONSOLIDA A ESTRUTURA ORGANIZACIONAL DA SECRETARIA DE GESTÃO TRIBUTÁRIA E FISCAL.","formulaPromulgacao":"CONSIDERANDO que a Lei Orgânica do Município de Maricá, nos termos dos artigos nº 107, III e 127, XXIV, estabelece que compete ao Prefeito a iniciativa das leis relativas à criação, estruturação e atribuições das Secretarias, Departamentos ou Diretorias equivalentes e Órgãos da Administração Pública, bem como organizar os serviços internos das repartições criadas por lei, com observância do limite das dotações a elas destinadas;\nCONSIDERANDO que o art. 2º, § 1º, I, p e art. 19 da Lei Complementar Municipal nº 398, de 12 de dezembro de 2024, instituiu a Secretaria de Gestão Tributária e Fiscal do Município de Maricá e estabeleceu as suas competências; \nCONSIDERANDO, ainda, que o artigo 58 da Lei Complementar Municipal nº 398, de 12 de dezembro de 2024, estabelece a obrigatoriedade de elaborar o Organograma e Regimento Interno para análise e posterior regulamentação, mediante Decreto Municipal, a ser assinado pelo Prefeito e devidamente publicado no Diário Oficial do Município. \nO Prefeito Municipal de Maricá, no uso de suas atribuições legais; DECRETA:","dataExtenso":"08 DE MAIO DE 2025","municipio":"Estado do Rio de Janeiro, RJ","assinatura":"Washington Luiz Cardoso Siqueira \nPREFEITO DO MUNICÍPIO DE MARICÁ"},{"id":11,"tipo":"dec","num":"145","ano":"2025","ementa":"Dispõe sobre a política de Governança Pública no âmbito da SEGET.","tributo":"geral","situacao":"vigente","link":"JOM 1.759, de 21/07/2025","artigos":[{"tipo":"capitulo","label":"CAPÍTULO I","texto":"DAS DISPOSIÇÕES GERAIS","paiId":null,"id":3354},{"tipo":"art","label":"Art. 1º","texto":"Fica instituída a Política de Governança Pública no âmbito da Secretaria de Gestão Tributária e","paiId":3354,"id":3355},{"tipo":"art","label":"Art. 2º","texto":"Para assegurar a efetividade das ações de governança, este Decreto adota os seguintes conceitos:","paiId":3354,"id":3356},{"tipo":"inc","label":"I","texto":"Governança pública: conjunto de mecanismos de liderança, estratégia e controle voltado para avaliar,","paiId":3356,"id":3357},{"tipo":"inc","label":"II","texto":"Valor público: resultados entregues pela SEGET que atendem às demandas da sociedade e contribuem","paiId":3356,"id":3358},{"tipo":"inc","label":"III","texto":"Alta administração: composta pelos ocupantes de cargos de natureza política, incluindo o(a)","paiId":3356,"id":3359},{"tipo":"inc","label":"IV","texto":"Gestão de riscos: conjunto de práticas voltadas à identificação, avaliação, tratamento e monitoramento de eventos incertos que possam impactar negativa ou positivamente os objetivos da SEGET, contribuindo para decisões mais seguras e para o aprimoramento da gestão institucional.","paiId":3356,"id":3360},{"tipo":"capitulo","label":"CAPÍTULO II","texto":"DOS PRINCÍPIOS E DIRETRIZES DA GOVERNANÇA","paiId":null,"id":3361},{"tipo":"art","label":"Art. 3º","texto":"São princípios da governança pública:","paiId":3361,"id":3362},{"tipo":"inc","label":"I","texto":"capacidade de resposta;","paiId":3362,"id":3363},{"tipo":"inc","label":"II","texto":"integridade;","paiId":3362,"id":3364},{"tipo":"inc","label":"III","texto":"confiabilidade;","paiId":3362,"id":3365},{"tipo":"inc","label":"IV","texto":"melhoria regulatória;","paiId":3362,"id":3366},{"tipo":"inc","label":"V","texto":"prestação de contas e responsabilidade; e","paiId":3362,"id":3367},{"tipo":"inc","label":"VI","texto":"transparência.","paiId":3362,"id":3368},{"tipo":"art","label":"Art. 4º","texto":"São diretrizes da governança pública na SEGET:","paiId":3361,"id":3369},{"tipo":"inc","label":"I","texto":"direcionar ações para a busca de resultados que promovam justiça fiscal, eficiência arrecadatória e melhoria na relação fisco-contribuinte, propondo soluções tempestivas e inovadoras para lidar com a limitação de recursos, a complexidade tributária e as mudanças na gestão fiscal;","paiId":3369,"id":3370},{"tipo":"inc","label":"II","texto":"promover a desburocratização e a racionalização dos procedimentos tributários e fiscais, a modernização da administração tributária e a integração dos serviços oferecidos ao contribuinte, especialmente por meios eletrônicos;","paiId":3369,"id":3371},{"tipo":"inc","label":"III","texto":"monitorar o desempenho institucional e avaliar a concepção, a implementação e os resultados das","paiId":3369,"id":3372},{"tipo":"inc","label":"IV","texto":"promover a integração e o intercâmbio de informações com os demais órgãos da administração municipal, estadual e federal, especialmente os de fiscalização, controle e arrecadação, com vistas a fortalecer a eficiência da gestão tributária e a entrega de valor público;","paiId":3369,"id":3373},{"tipo":"inc","label":"V","texto":"incentivar a incorporação de padrões elevados de ética e conduta pela alta administração da SEGET,","paiId":3369,"id":3374},{"tipo":"inc","label":"VI","texto":"avaliar as propostas de criação, alteração ou aperfeiçoamento de políticas fiscais e tributárias, aferindo, sempre que possível, seus custos, benefícios e impactos sobre a arrecadação, o contribuinte e a","paiId":3369,"id":3375},{"tipo":"inc","label":"VII","texto":"avaliar a conformidade da execução das políticas públicas com as diretrizes de planejamento estratégico;","paiId":3369,"id":3376},{"tipo":"inc","label":"VIII","texto":"manter processo decisório orientado por evidências técnicas e legais, prezando pela qualidade normativa, pela simplificação administrativa e pela participação da sociedade nos temas de interesse tributário;","paiId":3369,"id":3377},{"tipo":"inc","label":"IX","texto":"editar e revisar atos normativos no âmbito de sua competência, com base em boas práticas regulatórias, assegurando a legitimidade, previsibilidade, estabilidade e coerência do ordenamento jurídico tributário municipal, realizando consultas públicas e processos participativos sempre que oportuno;","paiId":3369,"id":3378},{"tipo":"inc","label":"X","texto":"promover a participação social e o controle social por meio de comunicação aberta, acessível e transparente sobre as ações, resultados e indicadores da SEGET, fortalecendo o acesso à informação e a","paiId":3369,"id":3379},{"tipo":"inc","label":"XI","texto":"promover a tomada de decisão estratégica considerando a avaliação contínua do ambiente interno e","paiId":3369,"id":3380},{"tipo":"capitulo","label":"CAPÍTULO III","texto":"DOS MECANISMOS DE GOVERNANÇA PÚBLICA","paiId":null,"id":3381},{"tipo":"art","label":"Art. 5º","texto":"São mecanismos para o exercício da governança pública no âmbito da Secretaria de Gestão Tributária e Fiscal – SEGET:","paiId":3381,"id":3382},{"tipo":"inc","label":"I","texto":"Liderança: conjunto de práticas de natureza ética, técnica e comportamental exercidas no âmbito da","paiId":3382,"id":3383},{"tipo":"inc","label":"II","texto":"Estratégia: definição de diretrizes, objetivos, metas, planos e ações estratégicas da SEGET, com critérios claros de priorização e alinhamento com o planejamento municipal e os interesses da sociedade,","paiId":3382,"id":3384},{"tipo":"inc","label":"III","texto":"Controle: estruturação e aplicação de processos de controle e monitoramento orientados à mitigação","paiId":3382,"id":3385},{"tipo":"art","label":"Art. 6º","texto":"A implementação da governança pública na SEGET, e seu aprimoramento contínuo, será conduzida","paiId":3381,"id":3386},{"tipo":"inc","label":"I","texto":"Assessoria de Governança: unidade de assessoramento técnico, diretamente subordinada ao(à)","paiId":3386,"id":3387},{"tipo":"inc","label":"II","texto":"Alta Administração: instância colegiada composta pelo(a) Secretário(a), Subsecretários(as) e Assessores vinculados ao Gabinete da SEGET, responsável por definir estratégias, supervisionar a gestão, deliberar sobre temas estratégicos e assegurar a implementação e o acompanhamento das políticas públicas e dos objetivos institucionais da Secretaria;","paiId":3386,"id":3388},{"tipo":"inc","label":"III","texto":"Comitê de Governança: instância consultiva e de apoio à gestão estratégica, composta por representantes da Alta Administração e das unidades técnico- administrativas da SEGET, com a finalidade de acompanhar a execução das iniciativas de governança, propor melhorias, promover a integração entre as","paiId":3386,"id":3389},{"tipo":"art","label":"Art. 7º","texto":"Compete à estrutura de governança da SEGET, por meio da atuação integrada entre a Assessoria","paiId":3381,"id":3390},{"tipo":"inc","label":"I","texto":"mecanismos de monitoramento de resultados que assegurem a efetividade e o alinhamento das ações","paiId":3390,"id":3391},{"tipo":"inc","label":"II","texto":"iniciativas que promovam a melhoria contínua da gestão e do desempenho organizacional;","paiId":3390,"id":3392},{"tipo":"inc","label":"III","texto":"instrumentos de suporte à decisão baseados em dados, evidências e análises técnicas.","paiId":3390,"id":3393},{"tipo":"par","label":"§1º","texto":"Compete à Assessoria de Governança coordenar tecnicament tras Secretarias e órgãos municipais;","paiId":3399,"id":3406},{"tipo":"inc","label":"VIII","texto":"aprovar manuais e guias com medidas, mecanismos e práticas organizacionais que contribuam para","paiId":3399,"id":3407},{"tipo":"inc","label":"IX","texto":"emitir recomendações à Assessoria de Governança, sempre que pertinente, com vistas à qualificação","paiId":3399,"id":3408},{"tipo":"par","label":"Parágrafo único","texto":"As competências aqui previstas não substituem nem se sobrepõem às atribuições da","paiId":3399,"id":3409},{"tipo":"art","label":"Art. 10.","texto":"O Comitê será composto por:","paiId":3396,"id":3410},{"tipo":"inc","label":"I","texto":"o(a) Secretário(a) da SEGET, que o presidirá;","paiId":3410,"id":3411},{"tipo":"inc","label":"II","texto":"os(as) Subsecretários(as);","paiId":3410,"id":3412},{"tipo":"inc","label":"III","texto":"o(a) Chefe da Assessoria de Governança;","paiId":3410,"id":3413},{"tipo":"inc","label":"IV","texto":"o(a) Chefe da Assessoria de Controle Interno e Compliance;","paiId":3410,"id":3414},{"tipo":"inc","label":"V","texto":"um(a) representante indicado(a) por cada unidade técnico-administrativa da SEGET.","paiId":3410,"id":3415},{"tipo":"par","label":"§1º","texto":"Poderão ser convidados, a critério do Comitê, servidores de outras unidades, especialistas ou representantes de órgãos parceiros, conforme a natureza dos temas em pauta.","paiId":3410,"id":3416},{"tipo":"par","label":"§2º","texto":"Os membros exercerão suas funções sem prejuízo de suas atribuições ordinárias.","paiId":3410,"id":3417},{"tipo":"par","label":"§3º","texto":"A designação dos membros integrantes do Comitê dar-se-á por meio de portaria da autoridade competente.","paiId":3410,"id":3418},{"tipo":"art","label":"Art. 11.","texto":"O Comitê reunir-se-á ordinariamente a cada dois meses e, extraordinariamente, sempre que convocado pelo(a) Presidente ou por solicitação da Assessoria de Governança.","paiId":3396,"id":3419},{"tipo":"capitulo","label":"CAPÍTULO V","texto":"DO PLANEJAMENTO ESTRATÉGICO E DA GESTÃO DE RISCOS","paiId":null,"id":3420},{"tipo":"art","label":"Art. 12.","texto":"O planejamento estratégico da SEGET constitui o principal instrumento de orientação das ações","paiId":3420,"id":3421},{"tipo":"par","label":"§1º","texto":"O planejamento estratégico estabelecerá metas claras, indicadores mensuráveis, prazos definidos e","paiId":3421,"id":3422},{"tipo":"par","label":"§2º","texto":"A revisão do planejamento estratégico será realizada periodicamente, com base na análise dos resultados obtidos, no monitoramento dos indicadores e na identificação de novos riscos, oportunidades ou","paiId":3421,"id":3423},{"tipo":"art","label":"Art. 13.","texto":"A gestão de riscos na SEGET é uma prática contínua que visa identificar, analisar, tratar e acompanhar situações que possam afetar o cumprimento dos objetivos institucionais.","paiId":3420,"id":3424},{"tipo":"par","label":"§1º","texto":"O processo deverá envolver as unidades da Secretaria de forma integrada, utilizando metodologias","paiId":3424,"id":3425},{"tipo":"par","label":"§2º","texto":"A gestão de riscos abrangerá, no mínimo, as etapas de identificação, avaliação, tratamento e monitoramento dos riscos institucionais.","paiId":3424,"id":3426},{"tipo":"par","label":"§3º","texto":"Os riscos levantados deverão subsidiar a tomada de decisão e orientar a adoção de medidas preventivas e corretivas para fortalecer a gestão e preservar os resultados esperados.","paiId":3424,"id":3427},{"tipo":"capitulo","label":"CAPÍTULO VI","texto":"DA TRANSPARÊNCIA","paiId":null,"id":3428},{"tipo":"art","label":"Art. 14.","texto":"A transparência será adotada como princípio essencial da governança pública na SEGET, com o","paiId":3428,"id":3429},{"tipo":"par","label":"§1º","texto":"Serão disponibilizadas, de forma clara e acessível, informações como relatórios de desempenho institucional, dados fiscais, informações sobre fiscalização, metas alcançadas e ações estratégicas desenvolvidas."," ,"texto":"Divulgados de forma transparente.","paiId":3442,"id":3445},{"tipo":"art","label":"Art. 18.","texto":"A Assessoria de Governança será responsável por coordenar a coleta, análise e divulgação dos","paiId":3441,"id":3446},{"tipo":"par","label":"Parágrafo único","texto":"Os relatórios mencionados no caput deverão ser apresentados à Alta Administração e ao","paiId":3446,"id":3447},{"tipo":"art","label":"Art. 19.","texto":"A Assessoria de Governança, em conjunto com a Assessoria de Controle Interno e Compliance, instituirá o Programa de Integridade da SEGET, com o objetivo de promover medidas destinadas à prevenção,","paiId":3441,"id":3448},{"tipo":"par","label":"§1º","texto":"O Programa de Integridade será estruturado com base nos seguintes eixos:","paiId":3448,"id":3449},{"tipo":"inc","label":"I","texto":"Comprometimento e apoio da Alta administração;","paiId":3449,"id":3450},{"tipo":"inc","label":"II","texto":"Existência de unidade responsável pela implementação na Secretaria;","paiId":3449,"id":3451},{"tipo":"inc","label":"III","texto":"Análise, avaliação e gestão dos riscos associados ao tema da integridade; e","paiId":3449,"id":3452},{"tipo":"inc","label":"IV","texto":"Monitoramento contínuo dos atributos do programa de integridade.","paiId":3449,"id":3453},{"tipo":"par","label":"§2º","texto":"O Comitê de Governança acompanhará a implementação e evolução do Programa de Integridade, podendo emitir recomendações e propor ações complementares que promovam sua efetividade institucional.","paiId":3448,"id":3454},{"tipo":"capitulo","label":"CAPÍTULO IX","texto":"DAS DISPOSIÇÕES FINAIS","paiId":null,"id":3455},{"tipo":"art","label":"Art. 20.","texto":"A Assessoria de Governança pode editar atos complementares e estabelecer procedimentos para","paiId":3455,"id":3456},{"tipo":"art","label":"Art. 21.","texto":"A participação no Comitê de Governança e grupos de trabalho constituídos é considerada prestação","paiId":3455,"id":3457},{"tipo":"art","label":"Art. 22.","texto":"Este Decreto entra em vigor na data de sua publicação.","paiId":3455,"id":3458}],"anexos":[],"preambulo":"DISPÕE SOBRE A POLÍTICA DE GOVERNANÇA PÚBLICA NO ÂMBITO DA SECRETARIA DE GESTÃO TRIBUTÁRIA E FISCAL – SEGET","formulaPromulgacao":"O Prefeito Municipal de Maricá, no uso de suas atribuições legais;\nDECRETA:","dataExtenso":"21 DE JULHO DE 2025","municipio":"Estado do Rio de Janeiro, RJ","assinatura":"Washington Luiz Cardoso Siqueira\nPREFEITO DO MUNICÍPIO DE MARICÁ"},{"id":12,"tipo":"dec","num":"173","ano":"2025","ementa":"Institui o CATRIMA e fixa o valor da UFIMA para 2026.","tributo":"geral","situacao":"vigente","link":"JOM 1.774, de 27/08/2025","artigos":[{"tipo":"capitulo","label":"Capítulo I","texto":"Disposição Preliminar","paiId":null,"id":2960},{"tipo":"art","label":"Art. 1º","texto":"Este Decreto institui o Calendário de Recolhimento de Tributos Municipais de Maricá (CATRIMA) e fixa o valor da Unidade Fiscal de Maricá (UFIMA) para o exercício de 2026, nos termos do § 1º do art. 355 da Lei Complementar nº 005, de 30 de janeiro de 1991, aplicando-se aos tributos de competência do Município de Maricá.","paiId":2960,"id":2961},{"tipo":"capitulo","label":"Capítulo II","texto":"Do Calendário de Recolhimento de Tributos","paiId":null,"id":2962},{"tipo":"secao","label":"Seção I","texto":"Das Regras Gerais de Vencimento","paiId":2962,"id":2963},{"tipo":"art","label":"Art. 2º","texto":"As datas e os prazos para pagamento de tributos municipais no exercício de 2026 são os fixados no Anexo I deste Decreto.","paiId":2963,"id":2964},{"tipo":"par","label":"§1º","texto":"Na hipótese de não funcionamento da rede bancária autorizada na data prevista para o vencimento do tributo, este será prorrogado para o primeiro dia útil imediatamente subsequente.","paiId":2964,"id":2965},{"tipo":"par","label":"§2º","texto":"Fica vedada a emissão de guias de pagamento com vencimento no último dia útil do exercício ou em data posterior.","paiId":2964,"id":2966},{"tipo":"art","label":"Art. 3º","texto":"As datas e os prazos fixados no Anexo I poderão ser alterados por ato do titular da Fazenda Municipal, na ocorrência de fatos que justifiquem a medida, devendo ser dada ciência aos contribuintes por meio de publicação no Jornal Oficial de Maricá (JOM).","paiId":2963,"id":2967},{"tipo":"art","label":"Art. 4º","texto":"O não pagamento de tributo até a data de vencimento implicará a incidência de multa e juros moratórios, bem como a inscrição do débito em dívida ativa, nos termos do art. 281 da Lei Complementar nº 005, de 30 de janeiro de 1991.","paiId":2963,"id":2968},{"tipo":"secao","label":"Seção II","texto":"Do Recolhimento do IPTU e da TCL","paiId":2962,"id":2969},{"tipo":"art","label":"Art. 5º","texto":"O contribuinte poderá recolher o IPTU (Imposto sobre a Propriedade Predial e Territorial Urbana) e a Taxa de Coleta de Lixo (TCL) em cota única, com desconto de 15% (quinze por cento), ou em até 10 (dez) cotas mensais, com desconto de 10% (dez por cento) em cada parcela, nos termos do § 1º do art. 16 da Lei Complementar nº 005, de 30 de janeiro de 1991, desde que o pagamento seja efetuado até a data de","paiId":2969,"id":2970},{"tipo":"par","label":"§1º","texto":"O não pagamento no prazo fixado no Anexo I acarretará a perda dos descontos previstos, bem como a incidência de acréscimos moratórios.","paiId":2970,"id":2971},{"tipo":"par","label":"§2º","texto":"A Taxa de Coleta de Lixo (TCL) será lançada conjuntamente com o IPTU, na forma do art. 6º deste Decreto, resguardada sua identificação individualizada no demonstrativo de cálculo.","paiId":2970,"id":2972},{"tipo":"par","label":"§3º","texto":"O desconto concedido sobre o IPTU não é aplicável ao valor da TCL.","paiId":2970,"id":2973},{"tipo":"art","label":"Art. 6º","texto":"A notificação do lançamento do IPTU e da TCL, relativos ao exercício de 2026, dar-se-á mediante publicação de edital no Jornal Oficial do Município, na forma do inciso II do § 1º do art. 13 da Lei Complementar nº 005, de 30 de janeiro de 1991.","paiId":2969,"id":2974},{"tipo":"par","label":"§1º","texto":"Não serão encaminhados carnês físicos ao domicílio fiscal dos contribuintes.","paiId":2974,"id":2975},{"tipo":"par","label":"§2º","texto":"As guias para pagamento da cota única ou das cotas mensais deverão ser retiradas, a partir de 09 de janeiro de 2026, por meio dos seguintes canais:","paiId":2974,"id":2976},{"tipo":"inc","label":"I","texto":"pela internet, no endereço: https://sim.marica.rj.gov.br/;","paiId":2976,"id":2977},{"tipo":"inc","label":"II","texto":"presencialmente, em qualquer unidade dos SIM – Serviços Integrados Municipais.","paiId":2976,"id":2978},{"tipo":"par","label":"§3º","texto":"A segunda via das guias poderá ser obtida pelos mesmos canais indicados no § 2º deste artigo.","paiId":2974,"id":2979},{"tipo":"secao","label":"Seção III","texto":"Dos Pedidos de Isenção de IPTU e de Revisão do Valor Venal de Imóveis","paiId":2962,"id":2980},{"tipo":"art","label":"Art. 7º","texto":"Os pedidos de reconhecimento ou renovação de isenção de IPTU para o exercício de 2027 deverão ser protocolados até o dia 31 de julho de 2026, na forma do art. 18, caput, da Lei Complementar nº 005, de","paiId":2980,"id":2981},{"tipo":"par","label":"Parágrafo único","texto":"Os processos protocolados fora do prazo serão indeferidos de plano.","paiId":2981,"id":2982},{"tipo":"art","label":"Art. 8º","texto":"Os pedidos de revisão do valor venal de imóveis, nos termos do § 6º do art. 13 da Lei Complementar nº 005, de 30 de janeiro de 1991, deverão ser protocolados até 30 de junho de 2026.","paiId":2980,"id":2983},{"tipo":"par","label":"§1º","texto":"Os pedidos a que se refere o caput serão analisados com efeitos no mesmo exercício, desde que o requerente comprove que a situação alegada já se verificava anteriormente.","paiId":2983,"id":2984},{"tipo":"par","label":"§2º","texto":"As alterações cadastrais decorrentes de processos de regularização de obras produzirão efeitos a partir do exercício seguinte, nos termos do § 2º do art. 22 da Lei Complementar nº 005, de 30 de janeiro de 1991.","paiId":2983,"id":2985},{"tipo":"capitulo","label":"Capítulo III","texto":"Do Índice de Atualização e da Unidade Fiscal de Maricá (UFIMA)","paiId":null,"id":2986},{"tipo":"art","label":"Art. 9º","texto":"Fica fixado o índice de atualização da UFIMA em 5,18% (cinco inteiros e dezoito centésimos por cento), com base na variação acumulada do INPC/IBGE entre julho de 2024 e junho de 2025, nos termos do §1º do art. 355 da Lei Complementar n° 005, de 30 de janeiro de 1991.","paiId":2986,"id":2987},{"tipo":"par","label":"§1º","texto":"As tabelas de atualização encontram-se no Anexo II deste Decreto.","paiId":2987,"id":2988},{"tipo":"par","label":"§2º","texto":"O valor da UFIMA será arredondado para o centavo par mais próximo, por conveniência do sistema informatizado.","paiId":2987,"id":2989},{"tipo":"art","label":"Art. 10.","texto":"A UFIMA, para o exercício de 2026, fica fixada em R$ 220,74 (duzentos e vinte reais e setenta e quatro centavos).","paiId":2986,"id":2990},{"tipo":"par","label":"§1º","texto":"O valor mínimo do IPTU para o exercício de 2026 será de 1 (uma) UFIMA - R$ 220,74 (duzentos e vinte reais e setenta e quatro centavos), nos moldes da alínea “f” do inciso I do Anexo XIII da Lei Complementar nº 005, de 30 de janeiro de 1991.","paiId":2990,"id":2991},{"tipo":"par","label":"§2º","texto":"O valor mínimo das cotas do IPTU para o exercício de 2026 será de 0,5 (meia) UFIMA - R$ 110,37 (cento e dez reais e trinta e sete centavos), nos moldes do § 2º do art. 16 da Lei Complementar nº 005, de 30 de janeiro de 1991.","paiId":2990,"id":2992},{"tipo":"art","label":"Art. 11.","texto":"Este Decreto entra em vigor na data de sua publicação, produzindo seus efeitos a partir de 1º de janeiro de 2026.","paiId":2986,"id":2993}],"anexos":[],"preambulo":"Institui o Calendário de Recolhimento de Tributos Municipais de Maricá (CATRIMA) e fixa o índice de atualização e o valor monetário da Unidade Fiscal de Maricá (UFIMA) para o exercício de 2026.","formulaPromulgacao":"CONSIDERANDO a necessidade de estabelecer com antecedência os prazos para cumprimento das obrigações tributárias municipais, nos termos do art. 16 da Lei Complementar nº 005, de 30 de janeiro de 1991 (Código Tributário Municipal), e dos arts. 24, 38 e 39 da Lei Complementar nº 389, de 20 de dezembro de 2023;\n\nCONSIDERANDO a importância da publicação anual do Calendário de Recolhimento de Tributos Municipais (CATRIMA), instrumento de transparência e previsibilidade fiscal;\n\nCONSIDERANDO, ainda, a necessidade de fixar o valor da UFIMA para o exercício de 2026, conforme o disposto no § 1º do art. 355 da Lei Complementar nº 005, de 30 de janeiro de 1991;\n\nO prefeito do município de Maricá, no uso das atribuições que lhe são conferidas, especialmente a determinada pelo inciso VII do art. 127, da Lei Orgânica do Município de Maricá,\nDECRETA:","dataExtenso":"25 DE AGOSTO DE 2025","municipio":"Estado do Rio de Janeiro, RJ","assinatura":"Washington Luiz Cardoso Siqueira\nPREFEITO DO MUNICÍPIO DE MARICÁ"},{"id":13,"tipo":"dec","num":"286","ano":"2025","ementa":"Dispõe sobre a obrigatoriedade de emissão de NFS-e de padrão nacional.","tributo":"issqn","situacao":"vigente","link":"JOM 1.821, de 22/12/2025","artigos":[{"tipo":"art","label":"Art. 1º","texto":"A partir de 1º de janeiro de 2026, os contribuintes que, nos termos dos arts. 25 e 26 da Lei Complementar Municipal nº 389, de 20 de dezembro de 2023, estejam sujeitos à emissão de Nota Fiscal de Serviços Eletrônica (NFS-e), deverão emiti-la exclusivamente no padrão nacional (NFS-e Nacional), conforme previsão do art. 62, §1º, I, da Lei Complementar Federal nº 214, de 16 de janeiro de 2025.","paiId":null,"id":2994},{"tipo":"par","label":"Parágrafo único","texto":"Os prestadores de serviços sujeitos à emissão da Nota Fiscal de Serviços Eletrônica no padrão nacional (NFS-e Nacional) deverão observar as orientações, FAQ, os manuais, os tutoriais e a documentação técnica disponíveis no Portal da NFS-e Nacional, acessível por meio do endereço eletrônico: https://www.gov.br/nfse/pt-br.","paiId":2994,"id":2995},{"tipo":"art","label":"Art. 2º","texto":"Fica vedada a utilização do emissor próprio do Município (Nota Maricá), por qualquer prestador de serviços, independentemente de estarem ou não obrigados à emissão de Nota Fiscal de Serviços Eletrônica","paiId":null,"id":2996},{"tipo":"par","label":"Parágrafo único","texto":"A vedação prevista no caput aplica-se exclusivamente ao módulo de emissão da NFS-e, permanecendo ativo e obrigatório o uso do Sistema Gerenciador do ISSQN municipal (Nota Maricá) para:","paiId":2996,"id":2997},{"tipo":"inc","label":"I","texto":"escrituração dos serviços prestados e tomados e entrega da Declaração de Serviços, nos termos do art. 25 da Lei Complementar Municipal nº 389, de 20 de dezembro de 2023;","paiId":2997,"id":2998},{"tipo":"inc","label":"II","texto":"escrituração e registro das NFS-e emitidas no padrão nacional;","paiId":2997,"id":2999},{"tipo":"inc","label":"III","texto":"apuração do imposto devido;","paiId":2997,"id":3000},{"tipo":"inc","label":"IV","texto":"geração de guias e documentos de arrecadação;","paiId":2997,"id":3001},{"tipo":"inc","label":"V","texto":"cumprimento das obrigações acessórias previstas na legislação municipal;","paiId":2997,"id":3002},{"tipo":"inc","label":"VI","texto":"registro, consulta e controle fiscal do ISSQN.","paiId":2997,"id":3003},{"tipo":"art","label":"Art. 3º","texto":"Compete ao órgão municipal responsável pela administração tributária editar normas complementares para regulamentar procedimentos operacionais, tecnológicos e de integração relacionados à emissão da","paiId":null,"id":3004},{"tipo":"art","label":"Art. 4º","texto":"Revoga-se o Decreto nº 793, de 29 de dezembro de 2021.","paiId":null,"id":3005},{"tipo":"art","label":"Art. 5º","texto":"Este Decreto entra em vigor na data de sua publicação.","paiId":null,"id":3006}],"anexos":[],"preambulo":"Dispõe sobre a obrigatoriedade de emissão de Nota Fiscal de Serviços Eletrônica de padrão nacional (NFS-e).","formulaPromulgacao":"CONSIDERANDO o disposto no art. 48, da Lei nº 389, de 20 de dezembro de 2023;\nCONSIDERANDO o disposto no art. 62, §1º, I, da Lei Complementar Federal nº 214, de 16 de janeiro de 2025, que instituiu o Imposto sobre Bens e Serviços (IBS);\nCONSIDERANDO a necessidade de adequar a emissão de Nota Fiscal de Serviços Eletrônica (NFS-e) no município de Maricá ao que dispõe a Lei Complementar Federal nº 214, de 16 de janeiro de 2025;\nO PREFEITO MUNICIPAL DE MARICÁ, no uso das atribuições que lhe são conferidas, em conformidade com o inciso VII do art. 127, da Lei Orgânica do Município de Maricá,\nDECRETA:","dataExtenso":"22 DE DEZEMBRO DE 2025","municipio":"Estado do Rio de Janeiro, RJ","assinatura":"Washington Luiz Cardoso Siqueira\nPREFEITO DO MUNICÍPIO DE MARICÁ"},{"id":14,"tipo":"dec","num":"1.494","ano":"2024","ementa":"Regulamenta arts. da LC 389/2023 — arbitramento da base de cálculo do ISS na construção civil.","tributo":"issqn","situacao":"vigente","link":"JOM 1.623, de 02/08/2024","artigos":[{"tipo":"capitulo","label":"Capítulo I","texto":"DAS DISPOSIÇÕES GERAIS","paiId":null,"id":4409},{"tipo":"art","label":"Art. 1º","texto":"O lançamento de ofício a partir do arbitramento da base de cálculo do Imposto Sobre Serviços de Qualquer Natureza (ISS) nos casos de prestação de serviço de construção civil, serão realizados na forma e modo estabelecidos neste Decreto.","paiId":4409,"id":4410},{"tipo":"par","label":"§1º","texto":"O lançamento de ofício do ISS na Prestação de Serviços de Construção Civil (ISSMO) respeitará intervalo mínimo de 30 (trinta) dias entre o lançamento e o prazo fixado para pagamento.","paiId":4410,"id":4411},{"tipo":"par","label":"§2º","texto":"O contribuinte do imposto é o prestador do serviço.","paiId":4410,"id":4412},{"tipo":"par","label":"§3º","texto":"São solidariamente responsáveis pelo recolhimento do imposto:","paiId":4410,"id":4413},{"tipo":"inc","label":"I","texto":"os construtores, empreiteiros principais e administradores de obras hidráulicas, de construção civil ou de reparação de edifícios, estradas, logradouros, pontes e congêneres, pelo imposto relativo aos serviços prestados por subempreiteiros, exclusivamente de mão de obra;","paiId":4413,"id":4414},{"tipo":"inc","label":"II","texto":"os administradores de obras, pelo imposto relativo à mão de obra, inclusive de subcontratos, ainda que o pagamento dos serviços seja feito diretamente pelo dono da obra ou contratante;","paiId":4413,"id":4415},{"tipo":"inc","label":"III","texto":"os construtores, os empreiteiros principais ou quaisquer outros contratantes de obras de construção civil, pelo imposto devido por empreiteiros ou subempreiteiros não estabelecidos no Município;","paiId":4413,"id":4416},{"tipo":"inc","label":"IV","texto":"os titulares de direitos sobre prédios ou os contratantes de obras e serviços, se não identificarem os construtores ou os empreiteiros de construção, reconstrução, reforma, reparação ou acréscimo desses bens, pelo imposto devido pelos construtores ou empreiteiros.","paiId":4413,"id":4417},{"tipo":"art","label":"Art. 2º","texto":"Sem prejuízo das penalidades cabíveis, e mediante processo regular, o arbitramento da base de cálculo do ISS na Prestação de Serviços de Construção Civil (ISSMO) pela autoridade fiscal ocorrerá sempre que, fundamentalmente, for verificada a ocorrência de pelo menos uma das seguintes situações:","paiId":4409,"id":4418},{"tipo":"inc","label":"I","texto":"o contribuinte não possuir livros fiscais de utilização obrigatória ou estes não se encontrarem com sua escrituração atualizada, ou ainda nos casos de perda, extravio ou inutilização de livros ou documentos fiscais;","paiId":4418,"id":4419},{"tipo":"inc","label":"II","texto":"o contribuinte reiteradamente violar o disposto na legislação tributária;","paiId":4418,"id":4420},{"tipo":"inc","label":"III","texto":"o contribuinte, depois de intimado, deixar de exibir os livros fiscais de utilização obrigatória, ou não prestar os esclarecimentos exigidos pela fiscalização;","paiId":4418,"id":4421},{"tipo":"inc","label":"IV","texto":"ocorrer fraude ou sonegação de dados julgados indispensáveis ao lançamento;","paiId":4418,"id":4422},{"tipo":"inc","label":"V","texto":"sejam omissos, insuficientes ou não mereçam fé as declarações, os esclarecimentos prestados ou os livros e/ou os documentos expedidos pelo sujeito passivo;","paiId":4418,"id":4423},{"tipo":"inc","label":"VI","texto":"o preço seja notoriamente inferior ao corrente no mercado ou desconhecido pela autoridade administrativa;","paiId":4418,"id":4424},{"tipo":"inc","label":"VII","texto":"o contribuinte prestar serviço sem estar regularmente inscrito no Município de Maricá;","paiId":4418,"id":4425},{"tipo":"inc","label":"VIII","texto":"existência de atos qualificados em lei como crimes ou contravenções ou que, mesmo sem essa qualificação, sejam praticados com dolo, fraude ou simulação.","paiId":4418,"id":4426},{"tipo":"par","label":"§1º","texto":"O arbitramento referir-se-á, exclusivamente, aos fatos ocorridos no período em que se verificarem os pressupostos mencionados nos incisos deste artigo.","paiId":4418,"id":4427},{"tipo":"par","label":"§2º","texto":"Nas hipóteses do caput, o arbitramento poderá ser procedido pela autoridade administrativa levando-se em conta, entre outros, os seguintes elementos:","paiId":4418,"id":4428},{"tipo":"inc","label":"I","texto":"os recolhimentos feitos em períodos idênticos pelo contribuinte ou por outros contribuintes que exerçam a mesma atividade em condições semelhantes;","paiId":4428,"id":4429},{"tipo":"inc","label":"II","texto":"os preços correntes dos serviços no mercado em vigor na época da apuração;","paiId":4428,"id":4430},{"tipo":"inc","label":"III","texto":"as condições próprias do contribuinte, bem como os elementos que possam evidenciar sua situação econômico-financeira, abaixo descritas, acrescidos da margem de lucro praticada no mercado levando-se em consideração atividades semelhantes:","paiId":4428,"id":4431},{"tipo":"ali","label":"a)","texto":"valor de matérias-primas, combustíveis e outros materiais consumidos ou aplicados no período;","paiId":4431,"id":4432},{"tipo":"ali","label":"b)","texto":"folha de salários pagos, honorários de diretores, retiradas de sócios ou gerentes e respectivas obrigações trabalhistas e sociais;","paiId":4431,"id":4433},{"tipo":"ali","label":"c)","texto":"despesas com fornecimentos de água, luz, força, telefone e demais encargos obrigatórios do contribuinte, inclusive tributos.","paiId":4431,"id":4434},{"tipo":"par","label":"§3º","texto":"O arbitramento será efetivado mediante Termo de Arbitramento Fiscal, referindo-se, exclusivamente, aos fatos geradores ocorridos no período em que se verificarem as hipóteses mencionadas no caput deste artigo, e terá por base representação circunstanciada dos fatos que o motivaram.","paiId":4418,"id":4435},{"tipo":"par","label":"§4º","texto":"Entende-se por processo regular os procedimentos relativos ao lançamento do imposto e sua notificação ao sujeito passivo, o qual, se discordar do valor arbitrado, poderá apresentar avaliação contraditória por ocasião da impugnação do lançamento, dentro do prazo de 20 (vinte) dias contados da publicação no órgão oficial, da afixação do edital ou do recebimento do aviso, a ser julgada juntamente com o processo administrativo fiscal respectivo.","paiId":4418,"id":4436},{"tipo":"art","label":"Art. 3º","texto":"O arbitramento da base de cálculo do ISSMO incidente sobre os serviços de construção civil terá como parâmetro o custo unitário básico da construção (CUB/m²) em vigor no mês anterior à data do lançamento, conforme os padrões estabelecidos em tabela específica publicada pelo Sindicato da Indústria da Construção Civil do Estado do Rio de Janeiro (Sinduscon-Rio), levando-se em conta os elementos dispostos no § 2º, do Art. 2º.","paiId":4409,"id":4437},{"tipo":"par","label":"Parágrafo único","texto":"Para fins do disposto neste Decreto, considera-se o Custo Unitário Básico (CUB/m²) o custo por metro quadrado de construção, de acordo com o projeto-padrão considerado, divulgado mensalmente, até o dia 5 (cinco) de cada mês, pelos sindicatos estaduais da indústria da construção civil (Sinduscon), que serve de base para avaliação dos custos de construção das edificações.","paiId":4437,"id":4438},{"tipo":"capitulo","label":"Capítulo II","texto":"DO TERMO DO ARBITRAMENTO FISCAL","paiId":null,"id":4439},{"tipo":"secao","label":"SEÇÃO I","texto":"Da Documentação para o Arbitramento","paiId":4439,"id":4440},{"tipo":"art","label":"Art. 4º","texto":"A autoridade fiscal que proceder ao arbitramento da base de cálculo lavrará Termo de Arbitramento, que integrará a Notificação Fiscal e deverá conter o seguinte:","paiId":4440,"id":4441},{"tipo":"inc","label":"I","texto":"a identificação do sujeito passivo;","paiId":4441,"id":4442},{"tipo":"inc","label":"II","texto":"a identificação do processo administrativo que deu origem ao arbitramento;","paiId":4441,"id":4443},{"tipo":"inc","label":"III","texto":"o motivo do arbitramento;","paiId":4441,"id":4444},{"tipo":"inc","label":"IV","texto":"a descrição das operações e atividades desenvolvidas;","paiId":4441,"id":4445},{"tipo":"inc","label":"V","texto":"as datas inicial e final, ainda que aproximadas, de cada período em que tenham sido desenvolvidas as operações e atividades;","paiId":4441,"id":4446},{"tipo":"inc","label":"VI","texto":"o valor da base de cálculo arbitrada, correspondente ao total das prestações realizadas em cada um dos períodos considerados;","paiId":4441,"id":4447},{"tipo":"inc","label":"VII","texto":"o ciente do sujeito passivo ou, se for o caso, a indicação de que este se negou a apor o ciente.","paiId":4441,"id":4448},{"tipo":"par","label":"§1º","texto":"As cópias dos documentos que serviram de base para o arbitramento deverão acompanhar o termo, salvo quando extraídas de documentos pertencentes ao sujeito passivo, caso em que serão identificados.","paiId":4441,"id":4449},{"tipo":"par","label":"§2º","texto":"Não se aplica o disposto neste artigo quando o fisco dispuser de elementos suficientes para determinar o valor real das prestações de serviços, hipótese em que o fiscal de tributos fará apenas a notificação de lançamento ao sujeito passivo.","paiId":4441,"id":4450},{"tipo":"secao","label":"SEÇÃO II","texto":"Da Documentação para Revisão do Arbitramento","paiId":4439,"id":4451},{"tipo":"art","label":"Art. 5º","texto":"Caso o sujeito passivo ou responsável, após o recebimento do termo de arbitramento e notificação de lançamento, decida impugnar o lançamento de ofício e apresentar a documentação necessária à exata apuração da base de cálculo do ISS, optando pela dedução dos materiais, deverá anexar ao processo administrativo, no prazo de 20 (vinte) dias, contados da publicação no órgão oficial, da afixação do edital ou do recebimento da notificação:","paiId":4451,"id":4452},{"tipo":"inc","label":"I","texto":"a identificação do sujeito passivo ou responsável;","paiId":4452,"id":4453},{"tipo":"inc","label":"II","texto":"o contrato de prestação de serviço com pessoa física ou jurídica para a execução da obra, devidamente assinado pelas partes em que estejam discriminados os montantes dos valores referentes aos materiais e à mão-de-obra;","paiId":4452,"id":4454},{"tipo":"inc","label":"III","texto":"as notas fiscais emitidas pelos prestadores de serviços e os comprovantes da quitação do imposto quando o recolhimento for devido ao município de Maricá.","paiId":4452,"id":4455},{"tipo":"par","label":"§1º","texto":"O arbitramento só será revisto mediante apresentação de provas documentais que possam estabelecer a real base de cálculo.","paiId":4452,"id":4456},{"tipo":"par","label":"§2º","texto":"O arbitramento da base de cálculo do imposto não impede que a operação seja, em outro momento, alvo de procedimento fiscal realizado pela autoridade fazendária.","paiId":4452,"id":4457},{"tipo":"capitulo","label":"Capítulo III","texto":"DO CÁLCULO PARA ARBITRAMENTO DO ISSMO","paiId":null,"id":4458},{"tipo":"secao","label":"SEÇÃO I","texto":"Da Data de Ocorrência do Fato Gerador","paiId":4458,"id":4459},{"tipo":"art","label":"Art. 6º","texto":"Para fins do arbitramento do ISSMO e lançamento de ofício do tributo, considera-se ocorrido o fato gerador do imposto e existentes os seus efeitos desde o momento em que se verificarem as circunstâncias materiais necessárias para que a prestação dos serviços previstos na lista de serviços do Anexo I produza os efeitos que normalmente lhe são próprios, especialmente nos seguintes casos:","paiId":4459,"id":4460},{"tipo":"inc","label":"I","texto":"quando a fiscalização de tributos apurar efetivamente o fato através de ação ou análise fiscal, incluindo: imóveis edificados, com ou sem “habite-se”, ocupados ou não, construções, reformas, instalações em geral, acréscimos ou demolições sem licença ou em desacordo com licença;","paiId":4460,"id":4461},{"tipo":"inc","label":"II","texto":"quando o fato for apurado em procedimento de recadastramento realizado por órgão da Prefeitura;","paiId":4460,"id":4462},{"tipo":"inc","label":"III","texto":"quando o fato for constatado em decorrência de procedimento realizado pela fiscalização de obras;","paiId":4460,"id":4463},{"tipo":"inc","label":"IV","texto":"na data da emissão do habite-se;","paiId":4460,"id":4464},{"tipo":"inc","label":"V","texto":"na data de lançamento de ofício do imóvel.","paiId":4460,"id":4465},{"tipo":"par","label":"Parágrafo único","texto":"Poderão ser utilizadas plantas aerofotogramétricas, imagens de satélites e de ruas de aplicativos de grande utilização pública ou documento equivalente relativos ao período abrangido pela decadência para fins de determinação da data de ocorrência do fato gerador.","paiId":4460,"id":4466},{"tipo":"secao","label":"SEÇÃO II","texto":"Da Base de Cálculo Arbitrada do ISSMO","paiId":4458,"id":4467},{"tipo":"art","label":"Art. 7º","texto":"A apuração da base de cálculo arbitrada será efetuada multiplicando-se a área tributável pelo valor do Custo Unitário Básico - CUB/m² divulgado, do mês imediatamente anterior ao do lançamento, pelo Sindicato da Indústria da Construção Civil do Estado do Rio de Janeiro - SINDUSCON-RIO nos termos do art. 54 da Lei Federal nº 4.591, de 16 de dezembro de 1964, conforme fórmula presente no Anexo I deste Decreto.","paiId":4467,"id":4468},{"tipo":"par","label":"§1º","texto":"A área total construída é a área tributável e representará o somatório, em metros quadrados, das áreas cobertas da construção, das áreas cobertas e descobertas de terraços e varandas, das áreas descobertas com acesso permanente em pavimentos acima do térreo e das áreas de espelho d’água, inclusive das piscinas descobertas.","paiId":4468,"id":4469},{"tipo":"par","label":"§2º","texto":"Os valores do CUB a serem utilizados serão os referentes ao CUB Mão de Obra do respectivo Projeto Padrão, sendo desconsideradas as parcelas relativas às despesas administrativas, de equipamentos e de materiais.","paiId":4468,"id":4470},{"tipo":"par","label":"§3º","texto":"Quando a opção for pela dedução de materiais, conforme disposto no Art. 12, a composição do CUB/m² para fins de arbitramento deverá ser alterada para aquela que considerar também os valores dos materiais.","paiId":4468,"id":4471},{"tipo":"par","label":"§4º","texto":"O valor do Custo Unitário Básico do CUB/m² será obtido a partir do enquadramento das obras conforme procedimentos descritos nos §5º ao §20.","paiId":4468,"id":4472},{"tipo":"par","label":"§5º","texto":"O CUB/m², utilizado como critério de arbitramento da base de cálculo do imposto, será aquele relativo ao respectivo projeto-padrão, conforme os seguintes critérios:","paiId":4468,"id":4473},{"tipo":"inc","label":"I","texto":"R1, para os projetos residenciais unifamiliares, independentemente do número de pavimentos;","paiId":4473,"id":4474},{"tipo":"inc","label":"II","texto":"RP1Q, para edificação residencial unifamiliar popular, independentemente do número de pavimentos;","paiId":4473,"id":4475},{"tipo":"inc","label":"III","texto":"PIS, para os projetos residenciais unifamiliares e multifamiliares de interesse social, independentemente do número de pavimentos;","paiId":4473,"id":4476},{"tipo":"inc","label":"IV","texto":"PP4, para edificação residencial multifamiliar - Prédio Popular, independentemente do número de pavimentos;","paiId":4473,"id":4477},{"tipo":"inc","label":"V","texto":"MR1, para edificação residencial multifamiliar horizontal, independentemente do número de pavimentos de cada unidade autônoma;","paiId":4473,"id":4478},{"tipo":"inc","label":"VI","texto":"R8, para os projetos residenciais multifamiliares verticais com até 8 pavimentos;","paiId":4473,"id":4479},{"tipo":"inc","label":"VII","texto":"R16, para projetos residências multifamiliares verticais com 9 ou mais pavimentos;","paiId":4473,"id":4480},{"tipo":"inc","label":"VIII","texto":"CSL8, para projetos comerciais – salas e lojas com até 8 pavimentos;","paiId":4473,"id":4481},{"tipo":"inc","label":"IX","texto":"CSL16, para projetos comerciais – salas e lojas com 9 ou mais pavimentos;","paiId":4473,"id":4482},{"tipo":"inc","label":"X","texto":"CAL8, para projetos comerciais – andar livre, independentemente do número de pavimentos;","paiId":4473,"id":4483},{"tipo":"inc","label":"XI","texto":"GI, para projetos de galpão industrial.","paiId":4473,"id":4484},{"tipo":"par","label":"§6º","texto":"O número de pavimentos da obra será calculado considerando-se todos os pavimentos construídos, incluindo-se os subsolos, garagens, sótãos com acesso permanente, térreo e pilotis, excluindo-se o pavimento telhado dos edifícios.","paiId":4468,"id":4485},{"tipo":"par","label":"§7º","texto":"A caracterização do padrão de construção para fins de apuração do CUB/m², divulgado pelo Sinduscon-Rio, será realizado de acordo com o uso da edificação, o tipo de projeto e, conforme o caso, com o padrão de acabamento do imóvel, nos seguintes termos:","paiId":4468,"id":4486},{"tipo":"inc","label":"I","texto":"em residenciais, quando se destinarem a:","paiId":4486,"id":4487},{"tipo":"ali","label":"a)","texto":"residência unifamiliar;","paiId":4487,"id":4488},{"tipo":"ali","label":"b)","texto":"residência multifamiliar vertical (edifícios de apartamentos, conjuntos habitacionais de edifícios);","paiId":4487,"id":4489},{"tipo":"ali","label":"c)","texto":"residência multifamiliar horizontal (condomínios ou conjuntos habitacionais de casa e vilas);","paiId":4487,"id":4490},{"tipo":"ali","label":"d)","texto":"casa popular;","paiId":4487,"id":4491},{"tipo":"ali","label":"e)","texto":"prédio popular;","paiId":4487,"id":4492},{"tipo":"ali","label":"f)","texto":"hotel, motel, apart hotel, flat servisse, spa, hospital, casa de repouso e congêneres;","paiId":4487,"id":4493},{"tipo":"ali","label":"g)","texto":"demais imóveis onde haja hospedagem ou pernoite;","paiId":4487,"id":4494},{"tipo":"inc","label":"II","texto":"em comerciais – andares livres, quando se destinarem a:","paiId":4486,"id":4495},{"tipo":"ali","label":"a)","texto":"teatro, cinema, boate, bar ou casa de shows;","paiId":4495,"id":4496},{"tipo":"ali","label":"b)","texto":"supermercado ou hipermercado;","paiId":4495,"id":4497},{"tipo":"ali","label":"c)","texto":"templo religioso;","paiId":4495,"id":4498},{"tipo":"ali","label":"d)","texto":"posto de gasolina, inclusive a área destinada às bombas;","paiId":4495,"id":4499},{"tipo":"ali","label":"e)","texto":"casa de festas;","paiId":4495,"id":4500},{"tipo":"ali","label":"f)","texto":"clínicas ou postos de saúde em que não haja internação;","paiId":4495,"id":4501},{"tipo":"ali","label":"g)","texto":"pet shop;","paiId":4495,"id":4502},{"tipo":"ali","label":"h)","texto":"lava jato;","paiId":4495,"id":4503},{"tipo":"ali","label":"i)","texto":"demais salas comerciais ou lojas com área livre acima de 100 m² (cem metros quadrados), sem paredes divisórias de alvenaria.","paiId":4495,"id":4504},{"tipo":"inc","label":"III","texto":"em comerciais – salas e lojas, quando se destinarem a:","paiId":4486,"id":4505},{"tipo":"ali","label":"a)","texto":"prédio de garagens;","paiId":4505,"id":4506},{"tipo":"ali","label":"b)","texto":"escritório ou consultório;","paiId":4505,"id":4507},{"tipo":"ali","label":"c)","texto":"shopping center ou centro comercial;","paiId":4505,"id":4508},{"tipo":"ali","label":"d)","texto":"lanchonete, padaria ou restaurante;","paiId":4505,"id":4509},{"tipo":"ali","label":"e)","texto":"dependências de clube recreativo;","paiId":4505,"id":4510},{"tipo":"ali","label":"f)","texto":"escola e cursos;","paiId":4505,"id":4511},{"tipo":"ali","label":"g)","texto":"academia de ginástica;","paiId":4505,"id":4512},{"tipo":"ali","label":"h)","texto":"mercado popular;","paiId":4505,"id":4513},{"tipo":"ali","label":"i)","texto":"autoescola;","paiId":4505,"id":4514},{"tipo":"ali","label":"j)","texto":"demais salas comerciais ou lojas com área livre até 100 m² (cem metros quadrados), sem paredes divisórias de alvenaria.","paiId":4505,"id":4515},{"tipo":"inc","label":"IV","texto":"em galpão industrial quando se destinarem a:","paiId":4486,"id":4516},{"tipo":"ali","label":"a)","texto":"indústria;","paiId":4516,"id":4517},{"tipo":"ali","label":"b)","texto":"oficina mecânica;","paiId":4516,"id":4518},{"tipo":"ali","label":"c)","texto":"pavilhão para feiras, eventos ou exposições;","paiId":4516,"id":4519},{"tipo":"ali","label":"d)","texto":"depósito fechado;","paiId":4516,"id":4520},{"tipo":"ali","label":"e)","texto":"telheiro;","paiId":4516,"id":4521},{"tipo":"ali","label":"f)","texto":"silo, tanque ou reservatório;","paiId":4516,"id":4522},{"tipo":"ali","label":"g)","texto":"barracão;","paiId":4516,"id":4523},{"tipo":"ali","label":"h)","texto":"hangar;","paiId":4516,"id":4524},{"tipo":"ali","label":"i)","texto":"ginásio de esportes e estádio de futebol;","paiId":4516,"id":4525},{"tipo":"ali","label":"j)","texto":"transformadores elétricos, geradores, antenas de celular, contêineres e semelhantes;","paiId":4516,"id":4526},{"tipo":"ali","label":"k)","texto":"estábulo;","paiId":4516,"id":4527},{"tipo":"ali","label":"l)","texto":"muro.","paiId":4516,"id":4528},{"tipo":"inc","label":"V","texto":"em Projeto de interesse Social, quando se destinarem a:","paiId":4486,"id":4529},{"tipo":"ali","label":"a)","texto":"projetos que forem classificados como Projeto de Interesse Social na forma da legislação municipal.","paiId":4529,"id":4530},{"tipo":"par","label":"§8º","texto":"O enquadramento de obra não prevista nos incisos I a V, do parágrafo 7º, deverá ser realizado de acordo com aquela que mais se aproxime de suas características, seja pela destinação do imóvel ou por sua semelhança com as construções constantes do rol.","paiId":4468,"id":4531},{"tipo":"par","label":"§9º","texto":"O CUB/m² do projeto-padrão PIS somente será utilizado para empreendimentos habitacionais já classificados como de interesse social pela Secretaria de Urbanismo e pela Secretaria de Habitação e Assentos Urbanos, conforme art. 10 da Lei Municipal nº 2.301, de novembro de 2009.","paiId":4468,"id":4532},{"tipo":"par","label":"§10.","texto":"O CUB/m² do projeto-padrão MR1 previsto no inciso V do §7º corresponderá ao CUB/m² do R1.","paiId":4468,"id":4533},{"tipo":"par","label":"§11.","texto":"A caracterização do padrão de acabamento para fins de apuração do CUB/m², para fins fiscais, será realizada nos seguintes padrões:","paiId":4468,"id":4534},{"tipo":"inc","label":"I","texto":"projetos residenciais unifamiliares:","paiId":4534,"id":4535},{"tipo":"ali","label":"a)","texto":"padrão baixo, para unidades autônomas com até 2 (dois) dormitórios/escritórios, desde que a área construída seja de até 80m²;","paiId":4535,"id":4536},{"tipo":"ali","label":"b)","texto":"padrão normal, para unidades autônomas com até 3 (três) dormitórios/escritórios, desde que a área construída seja de até 150m²;","paiId":4535,"id":4537},{"tipo":"ali","label":"c)","texto":"padrão alto, para unidades autônomas com 4 (quatro) dormitórios/escritórios ou mais, ou que, independentemente do número de dormitórios/escritórios, tenham área construída maior que 150m²;","paiId":4535,"id":4538},{"tipo":"inc","label":"II","texto":"projetos residenciais multifamiliares até 8 pavimentos:","paiId":4534,"id":4539},{"tipo":"ali","label":"a)","texto":"padrão baixo, para unidades autônomas com até 2 (dois) dormitórios/escritórios, desde que a área construída seja de até 80m²;","paiId":4539,"id":4540},{"tipo":"ali","label":"b)","texto":"padrão normal, para unidades autônomas com 3 (três) dormitórios/escritórios, desde que a área construída seja de até 150m²;","paiId":4539,"id":4541},{"tipo":"ali","label":"c)","texto":"padrão alto, para unidades autônomas com 4 (quatro) dormitórios/escritórios ou mais, ou que, independentemente do número de dormitórios/escritórios, tenham área construída maior que 150m²;","paiId":4539,"id":4542},{"tipo":"inc","label":"III","texto":"projetos residenciais multifamiliares horizontais:","paiId":4534,"id":4543},{"tipo":"ali","label":"a)","texto":"padrão baixo, para unidades autônomas com até 2 (dois) dormitórios/escritórios; desde que a área construída seja de até 80m²;","paiId":4543,"id":4544},{"tipo":"ali","label":"b)","texto":"padrão normal, para unidades autônomas com 3 (três) dormitórios/escritórios, desde que a área construída seja de até 150m²;","paiId":4543,"id":4545},{"tipo":"ali","label":"c)","texto":"padrão alto, para unidades autônomas com 4 (quatro) dormitórios/escritórios ou mais, ou que, independentemente do número de dormitórios/escritórios, tenham área construída maior que 150m²;","paiId":4543,"id":4546},{"tipo":"inc","label":"IV","texto":"projetos residenciais multifamiliares de 9 até 16 pavimentos:","paiId":4534,"id":4547},{"tipo":"ali","label":"a)","texto":"padrão normal, para unidades autônomas com 3 (três) dormitórios/escritórios, desde que a área construída seja de até 150m²;","paiId":4547,"id":4548},{"tipo":"ali","label":"b)","texto":"padrão alto, para unidades autônomas com 4 (quatro) dormitórios/escritórios ou mais, ou que, independentemente do número de dormitórios/escritórios, tenham área construída maior que 150m²;","paiId":4547,"id":4549},{"tipo":"inc","label":"V","texto":"prédio Popular","paiId":4534,"id":4550},{"tipo":"ali","label":"a)","texto":"padrão baixo, para unidades autônomas com até 2 (dois) dormitórios/escritórios;","paiId":4550,"id":4551},{"tipo":"ali","label":"b)","texto":"padrão normal, para unidades autônomas com 3 (três) dormitórios/escritórios;","paiId":4550,"id":4552},{"tipo":"inc","label":"VI","texto":"projeto comercial - andar livre, padrão normal;","paiId":4534,"id":4553},{"tipo":"inc","label":"VII","texto":"projeto Comercial - salas e lojas, padrão normal.","paiId":4534,"id":4554},{"tipo":"par","label":"§12.","texto":"Os projetos definidos como de Interesse Social terão enquadramento único em Projeto de Interesse Social (PIS), previsto no inciso III, do §5º.","paiId":4468,"id":4555},{"tipo":"par","label":"§13.","texto":"O enquadramento, previsto no §11, será efetuado de ofício pelo fiscal de tributos em função do número de dormitórios/escritórios e área construída para os projetos residenciais e no padrão normal para os projetos comerciais, independentemente do material utilizado.","paiId":4468,"id":4556},{"tipo":"par","label":"§14.","texto":"As edificações destinadas a hotel, motel, apart hotel, flat servisse, spa, hospital, casa de repouso e áreas comuns do conjunto habitacional horizontal serão enquadradas como uma unidade autônoma nos padrões alto, normal e baixo, na forma dos incisos I, II, III e IV do §11.","paiId":4468,"id":4557},{"tipo":"par","label":"§15.","texto":"Quando o tipo de projeto tiver designação RP1Q, PIS ou G1, não haverá avaliação quanto ao padrão de acabamento para fins de apuração do CUB.","paiId":4468,"id":4558},{"tipo":"par","label":"§16.","texto":"Quando o tipo de projeto tiver designação MR1, conforme inciso V do §5º, o padrão de acabamento será enquadrado conforme o inciso III do §11.","paiId":4468,"id":4559},{"tipo":"par","label":"§17.","texto":"Nos projetos em que constem áreas com características Residenciais, Comerciais – Andar Livre e/ou Comercial – Salas e Lojas, o enquadramento na tabela CUB/m² será feito pela área preponderante, respeitando, sempre que houver coincidência de áreas, as seguintes prevalências:","paiId":4468,"id":4560},{"tipo":"inc","label":"I","texto":"o Projeto Residencial prevalecerá sobre qualquer Projeto Comercial;","paiId":4560,"id":4561},{"tipo":"inc","label":"II","texto":"o Projeto Comercial – Andar livre prevalecerá sobre o projeto Comercial – Salas e Lojas.","paiId":4560,"id":4562},{"tipo":"par","label":"§18.","texto":"Prevalecendo a área residencial, o enquadramento da edificação será pelo projeto residencial e o padrão será de acordo com o número de dormitórios/escritórios e área construída da maioria das unidades residenciais.","paiId":4468,"id":4563},{"tipo":"par","label":"§19.","texto":"Prevalecendo a área comercial, o enquadramento será no padrão normal do projeto comercial considerado.","paiId":4468,"id":4564},{"tipo":"par","label":"§20.","texto":"Nos projetos de Galpão Industrial em que constem, também, áreas comerciais e/ou residenciais, deverão ser realizados enquadramentos específicos para cada área, sendo a área de galpão industrial considerada acréscimo das áreas comerciais e/ou industriais.","paiId":4468,"id":4565},{"tipo":"art","label":"Art. 8º","texto":"No ato da aferição, o CUB/m² será ajustado para a seguinte fração de seu valor original:","paiId":4467,"id":4566},{"tipo":"inc","label":"I","texto":"10% na demolição;","paiId":4566,"id":4567},{"tipo":"inc","label":"II","texto":"25% na reparação, conservação, reforma e modificação sem acréscimo de área;","paiId":4566,"id":4568},{"tipo":"inc","label":"III","texto":"20% na construção de piscinas e cisternas;","paiId":4566,"id":4569},{"tipo":"inc","label":"IV","texto":"15% na construção de pátios descobertos;","paiId":4566,"id":4570},{"tipo":"inc","label":"V","texto":"15% na construção de muros.","paiId":4566,"id":4571},{"tipo":"par","label":"§1º","texto":"O valor do CUB será o normal para as demais áreas, inclusive para as varandas, sejam estas cobertas ou descobertas.","paiId":4566,"id":4572},{"tipo":"par","label":"§2º","texto":"Compete exclusivamente à Subsecretaria de Fazenda, a aplicação de percentuais de redução e a verificação das áreas reais de construção, apuradas com base nas informações prestadas pelos contribuintes ou responsáveis legais, confrontadas com as áreas discriminadas no projeto arquitetônico aprovado pela Secretaria Municipal de Urbanismo acompanhado da ART registrada no CREA.","paiId":4566,"id":4573},{"tipo":"par","label":"§3º","texto":"O preço dos serviços de construção civil, nos casos de construção de muro, será obtido a partir da multiplicação do CUB/m² correspondente ao projeto padrão de Galpão Industrial - GI pela sua área total.","paiId":4566,"id":4574},{"tipo":"par","label":"§4º","texto":"Os preços dos serviços de construção civil, nos casos de demolição e reforma, serão obtidos a partir da multiplicação do CUB/m² correspondente pela área demolida ou reformada.","paiId":4566,"id":4575},{"tipo":"par","label":"§5º","texto":"Não havendo discriminação das áreas passíveis de redução no projeto arquitetônico, o cálculo será efetuado pela área total, sem utilização de redutores.","paiId":4566,"id":4576},{"tipo":"par","label":"§6º","texto":"Jardins, quintais e playgrounds sobre terreno natural não são considerados área construída e não deverão ser incluídos na base de cálculo arbitrada.","paiId":4566,"id":4577},{"tipo":"art","label":"Art. 9º","texto":"Sobre o valor arbitrado da base de cálculo será aplicada a alíquota vigente à data da ocorrência do fato gerador.","paiId":4467,"id":4578},{"tipo":"secao","label":"SEÇÃO III","texto":"Do CUB/m² desonerado","paiId":4458,"id":4579},{"tipo":"art","label":"Art. 10.","texto":"Os valores do CUB/m² desonerado são calculados sem os encargos sociais incidentes sobre a folha de pagamentos da mão de obra na Construção Civil e somente podem ser utilizados pelas empresas do setor cuja atividade principal, assim considerada aquela de maior receita auferida ou esperada, esteja enquadrada nos seguintes grupos da CNAE 2.0:","paiId":4579,"id":4580},{"tipo":"inc","label":"I","texto":"412 - Construção de edifícios;","paiId":4580,"id":4581},{"tipo":"inc","label":"II","texto":"432 - Instalações elétricas, hidráulicas e outras;","paiId":4580,"id":4582},{"tipo":"inc","label":"III","texto":"433 - Obras de acabamento;","paiId":4580,"id":4583},{"tipo":"inc","label":"IV","texto":"439 - Outros serviços especializados para construção.","paiId":4580,"id":4584},{"tipo":"art","label":"Art. 11.","texto":"A base de cálculo arbitrada para os demais prestadores de serviços da construção civil, incluindo para empresas do setor cuja atividade principal esteja enquadrada como incorporação de empreendimentos imobiliários no grupo 411 da CNAE 2.0, deverá levar em conta os valores do Custo Unitário Básico (CUB/m²) padrão com encargos sociais.","paiId":4579,"id":4585},{"tipo":"capitulo","label":"Capítulo IV","texto":"DA DEDUÇÕES RELATIVAS AO ISSMO","paiId":null,"id":4586},{"tipo":"secao","label":"SEÇÃO I","texto":"Da Dedução Padrão dos Materiais Fornecidos pelo Prestador de Serviços","paiId":4586,"id":4587},{"tipo":"art","label":"Art. 12.","texto":"Quando as deduções referidas no Art. 16, § 4º, da Lei Complementar nº 389, de 20 de dezembro de 2023, forem iguais ou inferiores a 50% (cinquenta por cento) do preço total do serviço, ficam dispensadas de comprovação por documento as deduções a que se refere o Art. 16, caput, da Lei Complementar nº 389, de 20 de dezembro de 2023.","paiId":4587,"id":4588},{"tipo":"par","label":"Parágrafo único","texto":"A dedução acima do percentual estabelecido no caput somente será admitida com as devidas comprovações em conformidade com o § 2º, do Art. 16, da Lei Complementar nº 389, de 20 de dezembro de 2023.","paiId":4588,"id":4589},{"tipo":"secao","label":"Seção II","texto":"Das Outras Deduções do ISSMO","paiId":4586,"id":4590},{"tipo":"art","label":"Art. 13.","texto":"No caso do sujeito passivo apresentar comprovantes de pagamentos do ISS referentes à prestação de serviços cuja base de cálculo foi arbitrada na forma deste Decreto, os valores dos recolhimentos serão corrigidos monetariamente de acordo com o mesmo índice utilizado para a correção dos tributos municipais e aproveitados para efeito de apuração do ISS devido.","paiId":4590,"id":4591},{"tipo":"art","label":"Art. 14.","texto":"Os pagamentos dos serviços prestados que já tiverem sido efetuados deverão ser deduzidos da base de cálculo, desde que comprovado o recolhimento do Imposto Sobre Serviço em favor do município.","paiId":4590,"id":4592},{"tipo":"par","label":"§1º","texto":"As notas fiscais apresentadas devem conter vinculação com a obra, tendo como referência o seu endereço ou código da obra – inscrito no CNO (Cadastro Nacional de Obras) ou no sistema de notas da administração municipal -, para que sejam passíveis de análise para fins de dedução.","paiId":4592,"id":4593},{"tipo":"par","label":"§2º","texto":"Só serão aceitas as notas fiscais cujas datas de emissão estejam compreendidas entre a data inicial e final da obra.","paiId":4592,"id":4594},{"tipo":"par","label":"§3º","texto":"Os valores retidos e recolhidos com base em alíquotas menores do que as vigentes na legislação municipal, terão o abatimento proporcional de acordo com o valor recolhido em favor deste município.","paiId":4592,"id":4595},{"tipo":"par","label":"§4º","texto":"Serão respeitadas as alíquotas das empresas prestadoras de serviço optantes pelo Simples Nacional, preservando-se o valor total do serviço prestado, para fins de abatimento da base de cálculo arbitrada, desde que comprovada a vinculação com o sistema simplificado de arrecadação.","paiId":4592,"id":4596},{"tipo":"capitulo","label":"Capítulo V","texto":"DAS ISENÇÕES E NÃO INCIDÊNCIAS DO ISSMO","paiId":null,"id":4597},{"tipo":"art","label":"Art. 15.","texto":"Não haverá a incidência do ISS sobre a atividade de incorporação imobiliária, quando a construção for feita pelo incorporador em terreno próprio, por sua conta e risco.","paiId":4597,"id":4598},{"tipo":"par","label":"Parágrafo único","texto":"A não incidência do ISS nos casos de incorporação imobiliária não exclui a responsabilidade do incorporador de exigir as notas fiscais daqueles que lhe prestarem serviço (pessoa física ou jurídica) e, quando for o caso, de realizar a retenção na fonte do ISS.","paiId":4598,"id":4599},{"tipo":"capitulo","label":"Capítulo VI","texto":"DAS DISPOSIÇÕES FINAIS","paiId":null,"id":4600},{"tipo":"art","label":"Art. 16.","texto":"Concluído o procedimento de arbitramento, o fisco municipal poderá, enquanto não se cumprir o prazo decadencial, apurar a ocorrência de novos fatos relativos à obra ou aos prestadores de serviço que possam ensejar o lançamento complementar do ISS.","paiId":4600,"id":4601},{"tipo":"art","label":"Art. 17.","texto":"O arbitramento do preço dos serviços não exonera o contribuinte da imposição das penalidades cabíveis, quando for o caso.","paiId":4600,"id":4602},{"tipo":"art","label":"Art. 18.","texto":"Este Decreto entra em vigor na data de sua publicação.","paiId":4600,"id":4603}],"anexos":[{"id":4604,"nome":"ANEXO I","descricao":"","tipo":"secoes","secoes":[{"titulo":"Base de Cálculo para Arbitramento do ISS Incidente Sobre os Serviços de Construção Civil","colunas":["BC = ATC x CUB da categoria"],"linhas":[],"rodape":""}],"rodape":"Onde,\nBC = base de cálculo arbitrada do ISS.\nATC = área total construída.\nCUB = custo unitário básico, de acordo com a categoria da construção.","colunas":[],"linhas":[]}],"preambulo":"REGULAMENTA OS ARTS. 2º, 7º, 24, 29 e 31 DA LEI COMPLEMENTAR Nº 389/2023, DISPONDO SOBRE O ARBITRAMENTO DA BASE DE CÁLCULO DO ISS NA PRESTAÇÃO DE SERVIÇOS DE CONSTRUÇÃO CIVIL.","formulaPromulgacao":"O PREFEITO MUNICIPAL DE MARICÁ, no uso das suas atribuições legais, DECRETA:","dataExtenso":"31 DE JULHO DE 2024","municipio":"Maricá, Estado do Rio de Janeiro, RJ","assinatura":"FABIANO TAQUES HORTA\nPREFEITO"},{"id":15,"tipo":"dec","num":"1.193","ano":"2023","ementa":"Dispõe sobre a retenção na fonte de tributos no pagamento a fornecedores pela Administração Pública Municipal.","tributo":"geral","situacao":"vigente","link":"JOM 1.503, de 22/09/2023","artigos":[],"anexos":[]},{"id":16,"tipo":"dec","num":"826","ano":"2022","ementa":"Disciplina o protesto extrajudicial de certidões da dívida ativa no Município de Maricá.","tributo":"geral","situacao":"vigente","link":"JOM 1.283, de 09/03/2022","artigos":[],"anexos":[]},{"id":17,"tipo":"dec","num":"862","ano":"2022","ementa":"Institui a Comissão Especial para validação e atualização anual da Planta Genérica de Valores Venais.","tributo":"iptu","situacao":"vigente","link":"JOM 1.324, de 24/06/2022","artigos":[{"tipo":"capitulo","label":"Capítulo I","texto":"DAS DISPOSIÇÕES GERAIS","paiId":null,"id":4620},{"tipo":"art","label":"Art. 1º","texto":"Fica instituída a Comissão Especial para validação e atualização anual da Planta Genérica de Valores Venais dos Imóveis do Município de Maricá (CEPGV), cuja finalidade é a atualização periódica do valor venal dos imóveis em função dos equipamentos urbanos e das melhorias decorrentes de obras públicas recebidas pela área onde se localizem, bem como os preços correntes do mercado, nos termos do artigo 11 da Lei Complementar 005 de 30 de janeiro de 1990.","paiId":4620,"id":4621},{"tipo":"par","label":"Parágrafo único","texto":"A CEPGV terá prazo de duração de 12 (doze) meses, podendo ser prorrogada por ato do Poder Executivo.","paiId":4621,"id":4622},{"tipo":"capitulo","label":"Capítulo II","texto":"ESTRUTURA ADMINISTRATIVA","paiId":null,"id":4623},{"tipo":"art","label":"Art. 2º","texto":"A CEPGV ficará vinculada administrativamente à Secretaria de Planejamento, Orçamento e Fazenda.","paiId":4623,"id":4624},{"tipo":"capitulo","label":"Capítulo III","texto":"CONSTITUIÇÃO","paiId":null,"id":4625},{"tipo":"art","label":"Art. 3º","texto":"A CEPGV será composta por 14 (quatorze) membros nomeados pelo Secretário de Planejamento, Orçamento e Fazenda, respeitando os seguintes quantitativos:","paiId":4625,"id":4626},{"tipo":"par","label":"§1º","texto":"Deverão ser nomeados ao menos:","paiId":4626,"id":4627},{"tipo":"inc","label":"I","texto":"2 (dois) servidores vinculados à Secretaria de Urbanismo;","paiId":4627,"id":4628},{"tipo":"inc","label":"II","texto":"1 (um) servidor vinculado ao Gabinete da Secretaria de Planejamento, Orçamento e Fazenda;","paiId":4627,"id":4629},{"tipo":"inc","label":"III","texto":"1 (um) servidor vinculado à Secretaria de Governo;","paiId":4627,"id":4630},{"tipo":"inc","label":"IV","texto":"1 (um) servidor, de preferência procurador, vinculado à Procuradoria Geral do Município.","paiId":4627,"id":4631},{"tipo":"inc","label":"V","texto":"os demais servidores, serão nomeados de acordos com critérios técnicos e de expertise de atuação dentro das áreas de inerência que trata esse decreto.","paiId":4627,"id":4632},{"tipo":"par","label":"§2º","texto":"Serão nomeados ainda, 1 (um) presidente e 1 (um) suplente, para além do quantitativo indicado no parágrafo anterior.","paiId":4626,"id":4633},{"tipo":"par","label":"§3º","texto":"A qualquer tempo, qualquer membro poderá ser substituído a critério do Secretário de Planejamento, Orçamento e Fazenda.","paiId":4626,"id":4634},{"tipo":"par","label":"§4º","texto":"Dentre os membros da Comissão deverá haver sempre, no mínimo um profissional Engenheiro Civil ou Arquiteto.","paiId":4626,"id":4635},{"tipo":"art","label":"Art. 4º","texto":"Perderá o cargo o membro que deixar de comparecer a 3 (três) reuniões consecutivas ou 6 (seis) intercaladas, no mesmo exercício financeiro, excluindo-se os períodos de afastamento previstos no Estatuto do Servidor Público.","paiId":4625,"id":4636},{"tipo":"capitulo","label":"Capítulo IV","texto":"COMPETÊNCIA","paiId":null,"id":4637},{"tipo":"art","label":"Art. 5º","texto":"Compete exclusivamente à CEPGV realizar a análise dos valores venais praticados no mercado imobiliário do Município, consolidando-os por meio de relatórios conclusivos, a fim de embasar a Planta Genérica de Valores mencionada no artigo 205 do Código Tributário Municipal.","paiId":4637,"id":4638},{"tipo":"art","label":"Art. 6º","texto":"A presente Comissão poderá ser consultada para fins de aferição de valores de aluguéis, de indenizações e revisões de lançamentos tributários, para manifestação em processos tributários administrativos de contencioso relativo à presunção de valores venais, com a manifestação de pelo menos a maioria dos seus membros.","paiId":4637,"id":4639},{"tipo":"art","label":"Art. 7º","texto":"A CEPGV, por meio de seu presidente, tem legitimidade para requerer aos diversos órgãos da Prefeitura, informações necessárias ao desenvolvimento de seus trabalhos, além de requerer, quando necessário, profissional habilitado para a prestação de serviços como estudos, projetos, análises, avaliações, vistorias, perícias, pareceres e divulgação técnica, nos termos do artigo 7º, “c” da Lei Federal nº 5.194/66 que regula o exercício das profissões de Engenheiro, Arquiteto e Engenheiro-Agrônomo, e dá outras providências.","paiId":4637,"id":4640},{"tipo":"capitulo","label":"Capítulo V","texto":"DO DESENVOLVIMENTO DOS TRABALHOS","paiId":null,"id":4641},{"tipo":"art","label":"Art. 8º","texto":"A Comissão Especial se reunirá ordinariamente pelo menos duas vezes ao mês.","paiId":4641,"id":4642},{"tipo":"par","label":"§1º","texto":"As reuniões realizadas pela Comissão deverão possuir o quórum mínimo 4 (quatro) membros.","paiId":4642,"id":4643},{"tipo":"par","label":"§2º","texto":"Caberá ao Presidente da CEPGV fazer a convocação dos membros para as reuniões.","paiId":4642,"id":4644},{"tipo":"art","label":"Art. 9º","texto":"A CEPGV utilizará no processo de avaliação dos valores venais praticados no mercado imobiliário do Município as recomendações e especificações da Norma Brasileira NBR - ABNT – relativas à avaliação de imóveis territoriais e prediais urbanos.","paiId":4641,"id":4645},{"tipo":"par","label":"Parágrafo único","texto":"Os valores mencionados no caput serão analisados a partir de amostras de dados coletados nos diversos distritos e bairros da cidade ou, alternativamente, tomando-se por base estudos realizados por profissionais e empresas especializadas em avaliação imobiliária.","paiId":4645,"id":4646},{"tipo":"art","label":"Art. 10.","texto":"As Atas das reuniões realizadas pela CEPGV deverão ser entregues ao Secretário de Planejamento, Orçamento e Fazenda até 15 (quinze) dias após a realização da reunião a que se refere.","paiId":4641,"id":4647},{"tipo":"capitulo","label":"Capítulo VI","texto":"REMUNERAÇÃO","paiId":null,"id":4648},{"tipo":"art","label":"Art. 11.","texto":"Os integrantes da CEPGV farão jus ao adicional de serviço extraordinário, na forma de Jeton, nos termos do artigo 89 da Lei Complementar n° 01 de 09 de maio de 1990, equivalente ao valor de 2,5 UFIMA por reunião a que efetivamente comparecerem, até o limite de quatro reuniões mensais, a serem realizadas fora do horário de trabalho ordinário.","paiId":4648,"id":4649},{"tipo":"par","label":"§1º","texto":"O pagamento dos “jetons” aos membros da Comissão será efetuado mediante a apresentação de relatório mensal e a aprovação prévia do Secretário de Planejamento Orçamento e Fazenda.","paiId":4649,"id":4650},{"tipo":"par","label":"§2º","texto":"Terão direito aos ‘jetons’ os membros que confirmarem participação pela assinatura da ata de reunião correspondente que será encaminhada pelo Presidente, junto com a folha de resumo, ao Setor de RH da Prefeitura.","paiId":4649,"id":4651},{"tipo":"capitulo
