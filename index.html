mily:monospace;color:var(--text)\">As edificações presumem-se concluídas ou modificadas na data informada, pelo responsável pela declaração, como sendo a data de finalização da obra.</span><br><span class=\"doc-art-nota\">(Incluído pela Lei Complementar nº 419/2025)</span></div><div style=\"margin-left: 0px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(21, 95, 59, 0.06); border-left: 3px solid var(--green); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--green)\">§3º  </span><span style=\"font-size:13px;font-family:monospace;color:var(--text)\">O preenchimento e a confirmação de envio da declaração configuram confissão irretratável de dívida em relação aos valores nela declarados, podendo os créditos tributários correspondentes ser inscritos diretamente em dívida ativa.</span><br><span class=\"doc-art-nota\">(Incluído pela Lei Complementar nº 419/2025)</span></div><div style=\"margin-left: 0px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(21, 95, 59, 0.06); border-left: 3px solid var(--green); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--green)\">§4º  </span><span style=\"font-size:13px;font-family:monospace;color:var(--text)\">A não apresentação da declaração no prazo regulamentar ou a apresentação incompleta ou com informações falsas sujeitarão o responsável ao lançamento de ofício do ISSQN, com aplicação da multa prevista na legislação tributária municipal, sem prejuízo de outras sanções cabíveis.</span><br><span class=\"doc-art-nota\">(Incluído pela Lei Complementar nº 419/2025)</span></div><div class=\"doc-est-capitulo\"><div class=\"doc-est-label\">CAPÍTULO XIV</div><div class=\"doc-est-nome\">DA NOTA FISCAL DE SERVIÇOS ELETRÔNICA E NOTA FISCAL AVULSA</div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 48.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A Nota Fiscal de Serviços eletrônica – NFS-e, documento gerado e armazenado eletronicamente no sistema gerenciador do ISSQN disponibilizado pela Prefeitura Municipal de Maricá, é o documento fiscal básico que objetiva registrar as operações relativas à prestação de serviços pelos prestadores de serviço estabelecidos no Município de Maricá.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Parágrafo único  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">As normas para autorização e emissão da NFS-e e as regras para operacionalização do Recibo Provisório de Serviço - RPS serão definidas em regulamento.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(30, 95, 168, 0.06); border-left: 3px solid var(--blue); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><div style=\"font-size:13px;font-family:monospace;\"><span style=\"font-weight:700;color:var(--blue)\">Art. 49.  </span><span style=\"color:var(--muted);text-decoration:line-through\">A emissão da NFS-e constitui confissão de dívida do Imposto Sobre Serviços de Qualquer Natureza incidente na operação, ficando a falta de seu recolhimento sujeita a cobrança administrativa ou judicial, observados os procedimentos regulamentares.</span></div><div style=\"font-size:13px;font-family:monospace;margin-top:3px\"><span style=\"font-weight:700;color:var(--blue)\">Art. 49.  </span><span style=\"color:var(--text)\">As informações prestadas na Nota Fiscal de Serviços Eletrônica – NFS-e, bem como na escrituração dos serviços prestados e tomados, configuram confissão de dívida do Imposto Sobre Serviços de Qualquer Natureza incidente na operação, ficando a falta de seu recolhimento sujeita aos procedimentos de cobrança administrativa ou judicial, observados os procedimentos regulamentares.</span><br><span class=\"doc-art-nota\">(Redação dada pela Lei Complementar nº 419/2025)</span></div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 50.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A Nota Fiscal Avulsa de Serviços eletrônica – NFAS-e, documento gerado e armazenado eletronicamente no sistema gerenciador do ISSQN disponibilizado pela Prefeitura Municipal de Maricá, destina-se às pessoas físicas ou jurídicas do Município de Maricá, ou de fora deste, que aqui prestem serviços eventuais, conforme definido em regulamento.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§1º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O ISSQN será exigido do prestador antecipadamente, por ocasião da emissão da NFAS-e, mediante alíquota especificada no Anexo I e II desta Lei.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§2º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A Nota Fiscal Avulsa de Serviços eletrônica:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">será fornecida pela autoridade fiscal, mediante solicitação do interessado, nos limites e termos a serem definidos em Resolução do órgão responsável pela arrecadação municipal;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">obedecerá a uma numeração anual geral e sequencial crescente, estabelecida pela administração;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">III – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">será automaticamente gravada na escrituração do tomador do serviço;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">IV – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">dispensa o tomador do serviço do recolhimento do ISSQN a ela relativo;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">V – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">não terá custo de emissão.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§3º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Não poderá ser fornecida NFAS-e, devendo o contribuinte regularizar sua atividade e solicitar autorização para emissão de Nota Fiscal de Serviços eletrônica – NFS-e, quando os serviços não se caracterizarem como eventuais.</span></div><div class=\"doc-est-capitulo\"><div class=\"doc-est-label\">CAPÍTULO XV</div><div class=\"doc-est-nome\">DOS INCENTIVOS FISCAIS</div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 51.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O Poder Executivo, no interesse da política fiscal de tributação, arrecadação e fiscalização, poderá conceder incentivos em favor da pessoa física que solicitar Nota Fiscal de Serviços eletrônica (NFS-e) das pessoas jurídicas ou equiparadas estabelecidas no Município de Maricá.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Parágrafo único  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A concessão e/ou utilização do incentivo poderá ser suspensa a qualquer tempo por ato do Poder Executivo, com fulcro no interesse público do Município.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 52.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O incentivo a que se refere o artigo 52 poderá consistir em uma das modalidades constantes nos incisos deste artigo ou em todas, conforme dispuser o regulamento:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">concessão de crédito, correspondente a percentual do montante do ISSQN relativo a cada NFS-e recebida pelo tomador, para fins de abatimento no Imposto sobre a Propriedade Predial e Territorial Urbana – IPTU lançado pelo Município de Maricá;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">participação em sorteio de prêmios;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">III – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">pagamento de importância, correspondente a percentual do montante do ISSQN relativo a cada NFS-e recebida pelo tomador, em moeda ou cujo valor nela se possa exprimir.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 53.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O crédito gerado e/ou o pagamento de importância observarão o percentual de até 30% (trinta por cento) aplicados sobre o montante do ISSQN.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§1º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O valor do crédito e/ou da importância somente será gerado após o pagamento do ISSQN relativo à NFS-e.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§2º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Quando o prestador de serviço for optante pelo Regime Especial Unificado de Arrecadação de Tributos e Contribuições devidos pelas Microempresas e Empresas de Pequeno Porte (Simples Nacional), será considerado como montante do ISSQN o resultado da aplicação da alíquota de 2% (dois por cento) sobre a base de cálculo.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§3º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O crédito terá validade até o dia trinta de setembro do segundo exercício seguinte àquele em que tiver sido gerado.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§4º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Não gerará crédito e/ou importância a ser paga:a prestação de serviço isenta, imune ou em que não houver incidência do ISSQN;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">a prestação de serviço cujo pagamento do ISSQN for realizado após a inscrição em Dívida Ativa;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">a prestação de serviço por contribuinte submetido ao regime de pagamento do ISSQN a partir de base de cálculo estimada ou por valor fixo, assim entendido também o MEI.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§5º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Não farão jus ao crédito e/ou ao pagamento de importância:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">as pessoas naturais que não possuam inscrição no Cadastro de Pessoas Físicas (CPF) do Governo Federal;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">as pessoas físicas que não tiverem seu CPF aposto na Nota Fiscal de Serviços eletrônica pelo prestador do serviço.</span></div><div class=\"doc-est-capitulo\"><div class=\"doc-est-label\">CAPÍTULO XVI</div><div class=\"doc-est-nome\">DA FISCALIZAÇÃO, INFRAÇÕES E PENALIDADES</div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 54.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Fica o Poder Executivo autorizado a utilizar a autorregularização como instrumento de incentivo aos contribuintes que se encontrem com obrigações tributárias pendentes perante a Fazenda Municipal, procedimento que consiste no saneamento voluntário das irregularidades decorrentes de divergências ou inconsistências identificadas pelo Fisco no exercício regular de sua atividade.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§1º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O procedimento de autorregularização de que trata o caput se iniciará com a notificação do sujeito passivo, na qual serão indicadas as pendências ou inconsistências tributárias encontradas pela fiscalização de tributos.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§2º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A emissão da notificação de que trata o parágrafo anterior não configura início de ação fiscal e deverá estabelecer o prazo máximo para a autorregularização do contribuinte, que não será superior a 90 (noventa) dias.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 55.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O descumprimento das normas relativas às obrigações principais e acessórias do Imposto Sobre Serviços de Qualquer Natureza, quando apurados em regular procedimento fiscal, serão puníveis com as sanções dispostas neste capítulo.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Parágrafo único  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">A imposição de quaisquer das penalidades previstas neste Capítulo não exime o sujeito passivo:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">da obrigação de pagar o tributo devido com a incidência da correção monetária, da multa de mora e dos juros legalmente previstos;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">do cumprimento das obrigações acessórias tributárias;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">III – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">do cumprimento de quaisquer outras sanções civis, administrativas ou criminais previstas no ordenamento jurídico.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 56.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">O descumprimento da obrigação principal, quando ocorrer falta de pagamento ou pagamento a menor do tributo devido apurado em procedimento fiscal regular, resultará nas seguintes penalidades aplicadas ao sujeito passivo obrigado:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(30, 95, 168, 0.06); border-left: 3px solid var(--blue); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><div style=\"font-size:13px;font-family:monospace;\"><span style=\"color:var(--blue)\">IV – </span><span style=\"color:var(--muted);text-decoration:line-through\">nos casos de condutas não tipificadas na legislação como crimes contra a ordem tributária, multa de 75% (setenta e cinco por cento) do montante do tributo devido em UFIMA.</span></div><div style=\"font-size:13px;font-family:monospace;margin-top:3px\"><span style=\"color:var(--blue)\">IV – </span><span style=\"color:var(--text)\">I – nos casos de condutas não tipificadas na legislação como crimes contra a ordem tributária, multa de 75% (setenta e cinco por cento) do montante do tributo devido em UFIMA;</span><br><span class=\"doc-art-nota\">(Redação dada pela Lei Complementar nº 419/2025)</span></div></div><div style=\"margin-left: 20px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(30, 95, 168, 0.06); border-left: 3px solid var(--blue); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><div style=\"font-size:13px;font-family:monospace;\"><span style=\"color:var(--blue)\">V – </span><span style=\"color:var(--muted);text-decoration:line-through\">nos casos de condutas tipificadas na legislação como crimes contra a ordem tributária, multa de 150% (cento e cinquenta por cento) do montante do tributo devido em UFIMA, independentemente da representação fiscal para fins penais.</span></div><div style=\"font-size:13px;font-family:monospace;margin-top:3px\"><span style=\"color:var(--blue)\">V – </span><span style=\"color:var(--text)\">II – nos casos de condutas tipificadas como crimes contra a ordem tributária, multa de 100% (cem por cento) do montante do tributo devido em UFIMA, sem prejuízo da representação fiscal para fins penais.</span><br><span class=\"doc-art-nota\">(Redação dada pela Lei Complementar nº 419/2025)</span></div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 57.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">As infrações a qualquer obrigação acessória prevista na legislação do ISSQN, apuradas por meio de regular procedimento fiscal, ficam, por competência mensal, sujeitas a aplicação das seguintes multas:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">1 (um) UFIMA ou 20% (vinte por cento) do imposto devido, o que for maior, quando se tratar de pessoa jurídica ou equiparada não enquadrada nos incisos II e III deste artigo;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">5 (cinco) UFIMA ou 20% (vinte por cento) do imposto devido, o que for maior, quando se tratar de notários e oficiais de registro de imóveis ou seus prepostos;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(30, 95, 168, 0.06); border-left: 3px solid var(--blue); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><div style=\"font-size:13px;font-family:monospace;\"><span style=\"color:var(--blue)\">III – </span><span style=\"color:var(--muted);text-decoration:line-through\">20 (dez) UFIMA ou 20% (vinte por cento) do imposto devido, o que for maior, quando se tratar de instituição financeira ou equiparada.</span></div><div style=\"font-size:13px;font-family:monospace;margin-top:3px\"><span style=\"color:var(--blue)\">III – </span><span style=\"color:var(--text)\">20 (vinte) UFIMA ou 20% (vinte por cento) do imposto devido, o que for maior, quando se tratar de instituição financeira ou equiparada;</span><br><span class=\"doc-art-nota\">(Redação dada pela Lei Complementar nº 419/2025)</span></div></div><div style=\"margin-left: 20px; margin-bottom: 0.625rem; line-height: 1.75; background: rgba(21, 95, 59, 0.06); border-left: 3px solid var(--green); padding: 7px 12px; border-radius: 0px 6px 6px 0px;\"><span style=\"font-family:monospace;font-size:13px;color:var(--green)\">IV – </span><span style=\"font-size:13px;font-family:monospace;color:var(--text)\">1 (uma) UFIMA ou 20% (vinte por cento) do imposto devido, o que for maior, quando se tratar da declaração obrigatória prevista no art. 47-A desta Lei Complementar, apresentada fora do prazo, com omissão ou inexatidão de informações.</span><br><span class=\"doc-art-nota\">(Incluído pela Lei Complementar nº 419/2025)</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 58.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Será aplicada multa de 20 (vinte) UFIMA, sem prejuízo da representação fiscal para fins penais, quando houver embaraço a ação fiscal, não for fornecida informação exigida pela Administração Tributária ou for fornecida em desacordo com a verdade material dos atos e fatos ocorridos.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§1º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Quando o embaraço à ação fiscal impossibilitar a apuração direta e real do crédito tributário, além da multa por embaraço já aplicada durante o procedimento fiscal, será imposta multa no valor correspondente ao dobro da multa prevista no caput deste artigo, sem prejuízo da constituição do crédito tributário por arbitramento.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§2º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Havendo embaraço à ação fiscal que motive a extinção de crédito tributário por decadência, além da imposição da multa prevista no caput deste artigo, será imposta a multa de 200% (duzentos por cento) do valor atualizado do crédito extinto.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 59.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Na reincidência, a infração será punida com o dobro da penalidade a ela correspondente.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§1º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Entende-se por reincidência o cometimento de nova infração, depois de tornar-se definitiva a decisão administrativa que tenha confirmado infração anterior.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§2º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Para efeitos de reincidência não prevalecerá a decisão definitiva anterior se entre a sua data e a da prática da nova infração tiver decorrido período de tempo superior a 5 (cinco) anos.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">§3º  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">No caso de instituições financeiras, o embaraço à fiscalização pela não entrega de documentos ou informações solicitadas pelo fisco mediante instauração de Processo Administrativo Tributário, acarretará multa de 25 (vinte e cinco) UFIMA por documento não entregue e/ou informação não prestada, sem prejuízo da penalidade prevista no § 1º deste artigo.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 60.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">As multas relativas à falta de prestação de informações ou à incorreção no cumprimento de obrigações acessórias, quando em valor fixo, terão redução de:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">90% (noventa por cento) para os Microempreendedor Individual (MEI);</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">50% (cinquenta por cento) para as microempresas ou empresas de pequeno porte optantes pelo Simples Nacional.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Parágrafo único  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">As reduções de que tratam os incisos I e II do caput não se aplicam na:</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">I – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">hipótese de fraude, resistência ou embaraço à fiscalização;</span></div><div style=\"margin-left: 20px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;color:var(--navy)\">II – </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">ausência de pagamento da multa no prazo de 30 (trinta) dias após a notificação.</span></div><div class=\"doc-est-titulo\"><div class=\"doc-est-label\">TÍTULO II</div><div class=\"doc-est-nome\">DAS DISPOSIÇÕES FINAIS E TRANSITÓRIAS</div></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 61.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Livros e os documentos fiscais impressos do contribuinte são, pelo prazo de 5 (cinco) anos de seu encerramento ou enquanto produzirem seus efeitos, o que ocorrer por último, de exibição obrigatória à fiscalização.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 62.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Os profissionais autônomos de nível superior cadastrados no Município como Arquiteto(a) ou Engenheiro(a) Civil e deverão efetuar seu recadastramento até 90 (noventa) dias após a publicação desta lei, sob pena de cancelamento de sua inscrição municipal, sem prejuízo da cobrança de débitos porventura existentes.</span></div><div style=\"margin-left: 0px; margin-bottom: 0.25rem; line-height: 1.75;\"><span style=\"font-family:monospace;font-size:13px;font-weight:700;color:var(--navy)\">Art. 63.  </span><span style=\"font-family:monospace;font-size:13px;color:var(--text)\">Esta Lei entra em vigor na data da sua publicação, revogando o artigo 278 da Lei 910 de 14 de dezembro de 1990 (Lei Complementar nº 005 de 30 de janeiro de 1991); a Lei Complementar nº 112 de 12 de dezembro de 2003; a Lei Complementar nº 136 de 17 de janeiro de 2006; a Lei Complementar nº 192 de 14 de outubro de 2009; os artigos 40 e 41 da Lei Complementar nº 195 de 30 de outubro de 2009; a Lei Complementar nº 210 de 1º de julho de 2010; a Lei Complementar nº 213 de 02 de dezembro de 2010; os artigos 1º, 2º e 3º da Lei Complementar nº 240 de 08 de maio de 2014; a Lei Complementar nº 290 de 16 de novembro de 2017; a Lei Complementar 320 de 03 de dezembro de 2019; a Lei Complementar nº 323 de 11 de dezembro de 2019; a Lei Complementar nº 332 de 22 de dezembro de 2020; os artigos 13, 14, 15 e 16 e os Anexos I e II da Lei Complementar nº 357 de 30 de dezembro de 2021.</span></div><div class=\"doc-fecho\"><div class=\"doc-fecho-local\">GABINETE DO PREFEITO DO MUNICÍPIO DE MARICÁ, Estado do Rio de Janeiro, RJ, 20 de dezembro de 2023.</div><div class=\"doc-fecho-assinatura\">FABIANO TAQUES HORTA\nPREFEITO</div></div><div><div class=\"doc-anexo-titulo\">ANEXO I</div><div class=\"doc-anexo-desc\">TABELA DE ALÍQUOTAS DO IMPOSTO SOBRE SERVIÇOS DE QUALQUER NATUREZA INCIDENTES SOBRE O PREÇO DO SERVIÇO</div><div class=\"anexo-vigencia\" style=\"font-size:12px;font-style:italic;color:var(--blue);padding:4px 12px 4px 12px;margin-bottom:4px;text-align:center;\">⚖ Vigência a partir de 01/01/2026</div><div class=\"anexo-sub-banner\">▶ ANEXO I substituído integralmente pela Lei Complementar nº 419/2025 — redação vigente abaixo:</div><div class=\"anexo-table-wrap\"><table class=\"anexo-table\"><thead><tr><th>ITEM</th><th>LISTA DE SERVIÇOS</th><th>ALÍQUOTA (%)</th></tr></thead function computePaths(artigos){
  // mapa id→dispositivo
  const byId={};
  artigos.forEach(function(d){ byId[d.id]=d; });
  artigos.forEach(function(d){
    if(!d.paiId){
      d._path = d.label;
    } else {
      const pai = byId[d.paiId];
      const paiPath = pai ? pai._path : '';
      d._path = paiPath ? paiPath + ' – ' + d.label : d.label;
    }
  });
}
var ESTRUT=new Set(['titulo','capitulo','secao','subsecao']);
var IND_ML={titulo:0,capitulo:0,secao:0,subsecao:0,art:0,par:0,inc:20,ali:40,ite:60};
/* ── Renderização de tabela com suporte a rowspan/colspan e rodapé ──
   Células especiais:
     ^  → mescla verticalmente com a célula acima (rowspan)
     >  → mescla horizontalmente com a célula à esquerda (colspan)
   Rodapé: campo "rodape" no objeto do anexo ou da seção.
*/
function renderTabelaMerge(colunas, linhas, celMap, rodape){
  var nCols = colunas.length;
  var nRows = linhas.length;

  var rowspanMap = [], colspanMap = [], skip = [];
  for(var ri=0;ri<nRows;ri++){
    rowspanMap[ri]=[];colspanMap[ri]=[];skip[ri]=[];
    for(var ci=0;ci<nCols;ci++){rowspanMap[ri][ci]=1;colspanMap[ri][ci]=1;skip[ri][ci]=false;}
  }

  // Resolver colspan (>)
  for(var ri=0;ri<nRows;ri++){
    var row=linhas[ri];
    for(var ci=0;ci<row.length;ci++){
      if(row[ci]==='>'){
        var anchor=ci-1;
        while(anchor>=0 && (row[anchor]==='>' || skip[ri][anchor])) anchor--;
        if(anchor>=0){ colspanMap[ri][anchor]++; skip[ri][ci]=true; }
      }
    }
  }

  // Resolver rowspan (^)
  for(var ri=0;ri<nRows;ri++){
    var row=linhas[ri];
    for(var ci=0;ci<row.length;ci++){
      if(skip[ri][ci]) continue;
      if(row[ci]==='^'){
        var anchor=ri-1;
        while(anchor>=0 && linhas[anchor][ci]==='^') anchor--;
        if(anchor>=0 && !skip[anchor][ci]){ rowspanMap[anchor][ci]++; skip[ri][ci]=true; }
      }
    }
  }

  // Verificar se há alguma célula mesclada (para desativar listra)
  var hasMerge=false;
  for(var ri=0;ri<nRows&&!hasMerge;ri++)
    for(var ci=0;ci<nCols&&!hasMerge;ci++)
      if(rowspanMap[ri][ci]>1||colspanMap[ri][ci]>1) hasMerge=true;

  var tableClass='anexo-table'+(hasMerge?' no-stripe':'');

  // Cabeçalho
  var h='<div class="anexo-table-wrap"><table class="'+tableClass+'"><thead><tr>';
  for(var ci=0;ci<colunas.length;ci++){
    var col=colunas[ci];
    if(col==='>') continue;
    var cs=1, nci=ci+1;
    while(nci<colunas.length && colunas[nci]==='>'){cs++;nci++;}
    h+='<th'+(cs>1?' colspan="'+cs+'"':'')+'>'+(col==='^'?'':col)+'</th>';
  }
  h+='</tr></thead><tbody>';

  // Linhas
  for(var ri=0;ri<nRows;ri++){
    h+='<tr>';
    var row=linhas[ri];
    for(var ci=0;ci<nCols;ci++){
      if(skip[ri][ci]) continue;
      var key=ri+':'+ci, ac=celMap?celMap[key]:null;
      var rs=rowspanMap[ri][ci], cs2=colspanMap[ri][ci];
      var cel=ci<row.length?row[ci]:'';
      var attrs='';
      if(rs>1) attrs+=' rowspan="'+rs+'"';
      if(cs2>1) attrs+=' colspan="'+cs2+'"';
      if(ac) h+='<td'+attrs+' class="cel-alt"><span class="cel-ant">'+ac.ant+'</span><span class="cel-nov">'+ac.nov+'</span></td>';
      else h+='<td'+attrs+'>'+(cel==='^'||cel==='>'?'':cel)+'</td>';
    }
    h+='</tr>';
  }
  h+='</tbody></table>';
  if(rodape) h+='<div class="anexo-rodape">'+rodape+'</div>';
  h+='</div>';
  return h;
}

function renderTabela(anexo, celMap){
  return renderTabelaMerge(anexo.colunas||[], anexo.linhas||[], celMap||{}, anexo.rodape||'');
}

function renderAnexoSecao(secao){
  var h='<div style="margin:1rem 0 .25rem;font-size:13px;font-weight:600;color:var(--navy);font-family:monospace;padding:4px 0;border-bottom:1px solid var(--bord)">'
    +secao.titulo+'</div>';
  h+=renderTabelaMerge(secao.colunas||[], secao.linhas||[], {}, secao.rodape||'');
  return h;
}

function renderAnexoCompleto(anx){
  var tipo=anx.tipo||'tabela';
  var h='<div><div class="doc-anexo-titulo">'+(anx.nome||'')+'</div>';
  if(anx.descricao) h+='<div class="doc-anexo-desc">'+anx.descricao+'</div>';
  if(tipo==='tabela'){
    if(anx.colunas&&anx.colunas.length) h+=renderTabela(anx,{});
  } else if(tipo==='secoes'){
    (anx.secoes||[]).forEach(function(s){h+=renderAnexoSecao(s);});
    if(anx.rodape) h+='<div class="anexo-rodape">'+anx.rodape+'</div>';
  } else if(tipo==='imagem'){
    if(anx.imgData) h+='<div style="text-align:center;margin:.75rem 0"><img src="'+anx.imgData+'" style="max-width:100%;border:1px solid var(--bord);border-radius:6px"></div>';
    if(anx.legenda) h+='<p style="text-align:center;font-size:12px;color:var(--muted);margin-top:.25rem">'+anx.legenda+'</p>';
  }
  h+='</div>';
  return h;
}

function renderArtSimples(d,todos,container){var tp=d.tipo||'art';if(ESTRUT.has(tp)){var div=document.createElement('div');div.className='doc-est-'+tp;var up=tp!=='secao';var em=(d.texto&&d.texto.trim()&&d.texto.trim()!==d.label.trim())?d.texto.trim():'';div.innerHTML='<div class="doc-est-label">'+(up?d.label.toUpperCase():d.label)+'</div>'+(em?'<div class="doc-est-nome">'+(up?em.toUpperCase():em)+'</div>':'');container.appendChild(div);todos.filter(function(x){return x.paiId===d.id;}).forEach(function(f){renderArtSimples(f,todos,container);});return;}var ml=IND_ML[tp]||0,bold=(tp==='art'||tp==='par')?'font-weight:700;':'';var txtRaw=d.texto||'';

  rowHtml='<span class="doc-art-num" style="'+bold+'">'+esc(d.label)+'</span>'
    +'<div style="display:block;flex:1;min-width:0;">'

    +'</div>';
}else{

var row=document.createElement('div');row.className='doc-art-row';row.style.marginLeft=ml+'px';row.innerHTML=rowHtml;container.appendChild(row);todos.filter(function(x){return x.paiId===d.id;}).forEach(function(f){renderArtSimples(f,todos,container);});}
function abrirNorma(id){
  var l=leis.find(function(x){return x.id===id;});
  if(!l) return;
  var corp=document.getElementById('mcorp');
  corp.innerHTML='';

  // Cabeçalho
  var cab=document.createElement('div');
  cab.className='doc-cabecalho';
  var tf=tipoFull(l.tipo).toUpperCase();
  var cabH='<div class="doc-lei-id">'+tf+' Nº '+l.num+', DE '+(l.dataExtenso||l.ano)+'</div>';
  if(l.preambulo) cabH+='<div class="doc-ementa-bloco"><div class="doc-ementa-txt">'+l.preambulo+'</div></div>';
  else cabH+='<div style="font-size:13px;color:var(--muted);font-style:italic;margin-bottom:1.2rem;text-align:center">'+esc(l.ementa)+'</div>';
  if(l.formulaPromulgacao) cabH+='<div class="doc-formula">'+l.formulaPromulgacao+'</div>';
  cab.innerHTML=cabH;
  corp.appendChild(cab);

  // Artigos
  var artDiv=document.createElement('div');
  if(l.artigos&&l.artigos.length){
    computePaths(l.artigos);
    l.artigos.filter(function(a){return !a.paiId;}).forEach(function(a){renderArtSimples(a,l.artigos,artDiv);});
  } else {
    artDiv.innerHTML='<div class="empty"><div class="empty-ico">📋</div><p>Texto ainda não cadastrado.</p></div>';
  }
  corp.appendChild(artDiv);

  // Fecho — antes dos anexos
  if(l.fechoTexto||l.dataExtenso||l.assinatura){
    var fecho=document.createElement('div');
    fecho.className='doc-fecho';
    var loc=l.municipio||'Maricá, Estado do Rio de Janeiro, RJ';
    if(l.fechoTexto){
      fecho.innerHTML+='<div class="doc-fecho-local">'+l.fechoTexto+'</div>';
    } else if(l.dataExtenso){
      fecho.innerHTML+='<div class="doc-fecho-local">GABINETE DO PREFEITO DO MUNICÍPIO DE MARICÁ, '+loc+', '+l.dataExtenso+'.</div>';
    }
    if(l.assinatura) fecho.innerHTML+='<div class="doc-fecho-assinatura">'+l.assinatura+'</div>';
    corp.appendChild(fecho);
  }

  // Anexos — após o fecho
  if(l.anexos&&l.anexos.length){
    l.anexos.forEach(function(anexo){
      var ac=document.createElement('div');
      ac.innerHTML=renderAnexoCompleto(anexo);
      corp.appendChild(ac);
    });
  }
  abrir(tipoFull(l.tipo)+' nº '+l.num+'/'+l.ano);}

function renderTabela(anexo, celMap){

  anexo.colunas.forEach(function(c){h+='<th>'+c+'</th>';});
  h+='</tr></thead><tbody>';
  (anexo.linhas||[]).forEach(function(linha,ri){
    h+='<tr>';
    linha.forEach(function(cel,ci){
      var key=ri+':'+ci, ac=celMap[key];
      if(ac) h+='<td class="cel-alt"><span class="cel-ant">'+ac.ant+'</span><span class="cel-nov">'+ac.nov+'</span></td>';
      else h+='<td>'+cel+'</td>';

    h+='</tr>';
  });
  h+='</tbody></table></div>';

}
function renderAnexosConsolidado(cont, modNome){

      var s=subMap[anexo.id];

      div.innerHTML+='<div class="anexo-sub-banner">▶ '+anexo.nome+' substituído integralmente pela '+modNome+' — redação vigente abaixo:</div>';

        +'</div>'

        +'<p style="font-size:11px;color:var(--red);font-style:italic;margin-bottom:6px">⚠ Redação revogada — exibida apenas para consulta histórica de alíquotas</p>'

        +'</div>';

      var cels=celMap[anexo.id]||{};
      div.innerHTML+=renderTabela(anexo,cels);

        div.innerHTML+='<p style="font-size:11px;color:var(--muted);margin-top:4px;font-style:italic">(Células em azul alteradas pela '+modNome+')</p>';

function toggleAnexoHist(uid){

var S={leiBaseId:null,leiModId:null,artigos:[],alteracoes:[],anexos:[]};
var IND_PX={titulo:0,capitulo:0,secao:0,art:0,par:0,inc:20,ali:40,ite:60};
var ESTRUTURA=new Set(['titulo','capitulo','secao']);
function renderHierDoc(d, todos, altMap, modNome, container){
  var tp = d.tipo||'art';
  var ml = IND_PX[tp]||0;

  // Separadores estruturais (título, capítulo, seção)
  if(ESTRUTURA.has(tp)){
    var div=document.createElement('div');
    div.className='doc-est-'+tp;
    var up=tp!=='secao';
    var ementa=(d.texto&&d.texto.trim()&&d.texto.trim()!==d.label.trim())?d.texto.trim():'';
    div.innerHTML='<div class="doc-est-label">'+(up?d.label.toUpperCase():d.label)+'</div>'
                 +(ementa?'<div class="doc-est-nome">'+(up?ementa.toUpperCase():ementa)+'</div>':'');
    container.appendChild(div);
    todos.filter(function(x){return x.paiId===d.id;}).forEach(function(f){return renderHierDoc(f,todos,altMap,modNome,container)});
    return;
  }

  var dPath = d._path||d.label;
  function normPath(s){ 
    if(!s) return ''; 
    return s.toLowerCase()
            .replace(/[º°]/g,'')
            .replace(/§\s+/g,'§')
            .replace(/art\.\s*/g,'art')
            .replace(/\s*–\s*/g,'–')
            .replace(/\s+/g,'')
            .trim(); 
  }
  var dNorm = normPath(dPath);
  var alt = S.alteracoes.find(function(a){return normPath(a.disp) === dNorm;});
  var dash = (tp==='inc'||tp==='ali'||tp==='ite') ? ' – ' : '  ';
  var bold = (tp==='art'||tp==='par') ? 'font-weight:700;' : '';

  var wrapper = document.createElement('div');
  wrapper.style.marginLeft = ml+'px';
  wrapper.style.marginBottom = '.25rem';
  wrapper.style.lineHeight = '1.75';

  if(!alt){
    // sem modificação — linha normal
    wrapper.innerHTML='<span style="font-family:monospace;font-size:13px;'+bold+'color:var(--navy)">'+d.label+dash+'</span>'
                     +'<span style="font-family:monospace;font-size:13px;color:var(--text)">'+d.texto+'</span>';
  } else {
    // com modificação — bloco colorido
    var cores={alterado:'var(--blue)',revogado:'var(--red)',incluido:'var(--green)'};
    var bgCor={alterado:'rgba(30,95,168,.06)',revogado:'rgba(139,26,26,.06)',incluido:'rgba(21,95,59,.06)'};
    var bdCor={alterado:'var(--blue)',revogado:'var(--red)',incluido:'var(--green)'};
    var nota={alterado:'(Redação dada pela '+modNome+')',revogado:'(Revogado pela '+modNome+')',incluido:'(Incluído pela '+modNome+')'};
    wrapper.style.background=bgCor[alt.tipo];
    wrapper.style.borderLeft='3px solid '+bdCor[alt.tipo];
    wrapper.style.padding='7px 12px';
    wrapper.style.borderRadius='0 6px 6px 0';
    wrapper.style.marginBottom='.625rem';

    var inner='';

    if(alt.tipo==='incluido'){
      inner='<span style="font-family:monospace;font-size:13px;'+bold+'color:var(--green)">'+d.label+dash+'</span>'
           +'<span style="font-size:13px;font-family:monospace;color:var(--text)">'+(alt.texto||d.texto)+'</span>'
           +'<br><span class="doc-art-nota">'+nota.incluido+'</span>';
    } else if(alt.tipo==='revogado'){
      inner='<span style="font-family:monospace;font-size:13px;'+bold+'color:var(--red)">'+d.label+dash+'</span>'
           +'<span style="font-size:13px;font-family:monospace;color:var(--red);text-decoration:line-through">'+d.texto+'</span>'
           +'<br><span class="doc-art-nota">'+nota.revogado+'</span>';
    } else {
      inner='<div style="font-size:13px;font-family:monospace;">'
           +'<span style="'+bold+'color:var(--blue)">'+d.label+dash+'</span>'
           +'<span style="color:var(--muted);text-decoration:line-through">'+(alt.textoAnt||d.texto)+'</span>'
           +'</div>'
           +'<div style="font-size:13px;font-family:monospace;margin-top:3px">'
           +'<span style="'+bold+'color:var(--blue)">'+d.label+dash+'</span>'
           +'<span style="color:var(--text)">'+alt.texto+'</span>'
           +'<br><span class="doc-art-nota">'+nota.alterado+'</span>'
           +'</div>';
    }
    wrapper.innerHTML=inner;
  }

  container.appendChild(wrapper);
  todos.filter(function(x){return x.paiId===d.id;}).forEach(function(f){return renderHierDoc(f,todos,altMap,modNome,container)});
}
function abrirCons(id){
  // Compara id como número e como string para segurança
  var c = cons.find(function(x){ return x.id===id || x.id===Number(id) || String(x.id)===String(id); });
  if(!c){ alert('Consolidação não encontrada.'); return; }

  var corp = document.getElementById('mcorp');
  corp.innerHTML = '';

  // Se tem HTML pré-renderizado salvo, usa diretamente (mais rápido e confiável)
  if(c.html){
    corp.innerHTML = c.html;
    // Injeta link clicável para a lei modificadora no cabeçalho
    var lMod2 = leis.find(function(l){ return l.id===c.leiModId; });
    if(lMod2){
      var cabecalho = corp.querySelector('.doc-cabecalho');
      if(cabecalho){
        var badge = cabecalho.querySelector('.doc-lei-cons');
        if(badge && badge.parentNode) badge.parentNode.removeChild(badge);
        var linkDiv = document.createElement('div');
        linkDiv.style.marginTop = '.75rem';
        var linkSpan = document.createElement('span');
        linkSpan.className = 'doc-lei-cons-link';
        linkSpan.title = 'Abrir ' + leiNomeC(lMod2);
        linkSpan.innerHTML = '&#x1F4CE; Texto consolidado com as altera\u00e7\u00f5es da ' + leiNomeC(lMod2);
        linkSpan.onclick = function(){ fechar(); setTimeout(function(){ abrirNorma(lMod2.id); }, 80); };
        linkDiv.appendChild(linkSpan);
        cabecalho.appendChild(linkDiv);
      }
    }
    abrir('Texto Consolidado \u2014 ' + c.leiBaseNome);
    return;
  }

  // Caso contrário, renderiza do zero
  var lBase = leis.find(function(l){ return l.id===c.leiBaseId; });
  var lMod  = leis.find(function(l){ return l.id===c.leiModId; });
  if(!lBase||!lMod){ alert('Dados incompletos.'); return; }

  S.leiBaseId  = c.leiBaseId;
  S.leiModId   = c.leiModId;
  S.artigos    = JSON.parse(JSON.stringify(lBase.artigos||[]));
  S.alteracoes = JSON.parse(JSON.stringify(c.alteracoes||[]));
  S.anexos     = JSON.parse(JSON.stringify(lBase.anexos||[]));
  computePaths(S.artigos);

  var cab = document.createElement('div');
  cab.className = 'doc-cabecalho';
  var tf = tipoFull(lBase.tipo).toUpperCase();
  var cabH = '<div class="doc-lei-id">'+tf+' Nº '+lBase.num+', DE '+(lBase.dataExtenso||lBase.ano)+'</div>';
  if(lBase.preambulo) cabH += '<div class="doc-ementa-bloco"><div class="doc-ementa-txt">'+lBase.preambulo+'</div></div>';
  if(lBase.formulaPromulgacao) cabH += '<div class="doc-formula">'+lBase.formulaPromulgacao+'</div>';
  cabH += '<div style="margin-top:.75rem"><span class="doc-lei-cons-link" onclick="fechar();setTimeout(function(){abrirNorma('+lMod.id+')},80)" title="Abrir '+leiNomeC(lMod)+'">📎 Texto consolidado com as alterações da '+leiNomeC(lMod)+'</span></div>';
  cab.innerHTML = cabH;
  corp.appendChild(cab);

  var modNome = leiNomeC(lMod);
  var altMap = {};
  S.alteracoes.forEach(function(a){ altMap[a.disp]=a; if(a.apos) altMap[a.apos+'__'+a.disp]=a; });

  var todosDisps = JSON.parse(JSON.stringify(S.artigos));
  computePaths(todosDisps);

  function normP(s){ if(!s)return ''; return s.toLowerCase().replace(/[ºo°]/g,'').replace(/§\s+/g,'§').replace(/art\.\s*/g,'art').replace(/\s*–\s*/g,'–').replace(/\s+/g,'').trim(); }
  function tipoD(s){ s=s.trim(); if(/^Art/i.test(s))return 'art'; if(/^§|^Par[áa]grafo/i.test(s))return 'par'; if(/^[IVXLCDM]+$/i.test(s.replace(/[.\-–\s]/g,'')))return 'inc'; if(/^[a-z]\)/.test(s))return 'ali'; return 'art'; }
  function labelD(s){ s=s.trim(); if(s.includes(' – '))s=s.split(' – ').pop().trim(); if(/^§/.test(s)){var n=parseInt(s.replace(/[^0-9]/g,''));return isNaN(n)?s:(n<=9?'§'+n+'º':'§'+n+'.');} if(/^Art/i.test(s)){var n=parseInt(s.replace(/[^0-9]/g,''));return isNaN(n)?s:(n<=9?'Art. '+n+'º':'Art. '+n+'.');} return s.replace(/[.\-–\s]/g,'').toUpperCase()||s; }

  var incluidos = S.alteracoes.filter(function(a){ return a.tipo==='incluido'; });
  var ordenados=[],pendentes=incluidos.slice(),maxI=incluidos.length*2+1;
  while(pendentes.length&&maxI-->0){
    var prog=false;
    for(var i=pendentes.length-1;i>=0;i--){
      var inc=pendentes[i],aN=normP(inc.apos||'');
      var ok=!inc.apos||todosDisps.find(function(d){return normP(d._path)===aN;})||ordenados.find(function(o){return normP(o.disp)===aN;});
      if(ok){ordenados.push(inc);pendentes.splice(i,1);prog=true;}
    }
    if(!prog) break;
  }
  pendentes.forEach(function(p){ordenados.push(p);});
  ordenados.forEach(function(inc){
    if(todosDisps.find(function(d){return normP(d._path)===normP(inc.disp);})) return;
    var aN=normP(inc.apos||''),paiId=null,insertIdx=-1;
    if(inc.apos){
      var ri=todosDisps.findIndex(function(d){return normP(d._path)===aN;});
      if(ri>=0){insertIdx=ri+1;var ref=todosDisps[ri];var tN=tipoD(inc.disp.includes(' – ')?inc.disp.split(' – ').pop().trim():inc.disp);var hier={par:['art'],inc:['art','par'],ali:['inc']};paiId=((hier[tN]||[]).indexOf(ref.tipo)>=0)?ref.id:ref.paiId;}
    }
    var lbl=labelD(inc.disp),novoId='inc_'+Math.random().toString(36).slice(2);
    todosDisps.splice(insertIdx>=0?insertIdx:todosDisps.length,0,{id:novoId,tipo:tipoD(lbl),label:lbl,texto:inc.texto,paiId:paiId});
    computePaths(todosDisps);
  });

  var cont2 = document.createElement('div');
  todosDisps.filter(function(d){return !d.paiId;}).forEach(function(d){renderHierDoc(d,todosDisps,altMap,modNome,cont2);});
  corp.appendChild(cont2);
  renderAnexosConsolidado(corp,modNome);

  if(lBase.dataExtenso||lBase.assinatura){
    var fecho=document.createElement('div'); fecho.className='doc-fecho';
    var loc=lBase.municipio||'Maricá, Estado do Rio de Janeiro, RJ';
    if(lBase.dataExtenso) fecho.innerHTML+='<div class="doc-fecho-local">GABINETE DO PREFEITO DO MUNICÍPIO DE MARICÁ, '+loc+', '+lBase.dataExtenso+'.</div>';
    if(lBase.assinatura) fecho.innerHTML+='<div class="doc-fecho-assinatura">'+lBase.assinatura+'</div>';
    corp.appendChild(fecho);
  }
  abrir('Texto Consolidado — '+c.leiBaseNome);
}

function abrir(titulo){document.getElementById('mtit').textContent=titulo;document.getElementById('modal').classList.add('open');document.getElementById('mcorp').scrollTop=0;document.getElementById('mfooter').style.display='flex';}
function fechar(){document.getElementById('modal').classList.remove('open');document.getElementById('mfooter').style.display='none';}

function docGetTexto(){
  // Extrair texto puro do conteúdo do modal
  var el=document.getElementById('mcorp');
  if(!el) return '';
  // Clonar para não afetar o DOM
  var clone=el.cloneNode(true);
  // Remover elementos de interface (botões, etc)
  clone.querySelectorAll('button,input,select').forEach(function(e){e.remove();});
  // Substituir <br> por \n e blocos por \n
  clone.querySelectorAll('br').forEach(function(e){e.replaceWith('\n');});
  // Retornar textContent com normalização de espaços em branco
  return clone.innerText||clone.textContent||'';
}

function docCopiarTexto(){
  var txt=docGetTexto();
  if(!txt){alert('Nenhum conteúdo para copiar.');return;}
  navigator.clipboard.writeText(txt).then(function(){
    var btn=event.currentTarget;
    var orig=btn.innerHTML;
    btn.innerHTML='✅ Copiado!';
    setTimeout(function(){btn.innerHTML=orig;},2000);
  }).catch(function(){
    // Fallback
    var ta=document.createElement('textarea');
    ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();document.execCommand('copy');
    document.body.removeChild(ta);
    alert('Texto copiado!');
  });
}
