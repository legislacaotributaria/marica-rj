<script>
var DB = JSON.parse(document.getElementById('db-data').value);
var leis = DB.leis;
var cons = DB.consolidacoes;
var filtroAtivo = 'todos';
var buscaAtiva = '';

const tipoFull  = t => ({lc:'Lei Complementar',lei:'Lei',dec:'Decreto',in:'Instrução Normativa',port:'Portaria',res:'Resolução',ot:'Orientação Técnica',edital:'Edital de Notificação'}[t]||t);
const tipoLabel = t => ({lc:'LC',lei:'Lei',dec:'Decreto',in:'IN',port:'Portaria',res:'Resolução',ot:'OT',edital:'Edital'}[t]||t);
function tipoPill(t){
  const cls={lc:'p-lc',lei:'p-lei',dec:'p-dec',in:'p-in',port:'p-port',res:'p-res',ot:'p-ot',edital:'p-edital'};
  const lbl={lc:'LC',lei:'Lei',dec:'Decreto',in:'IN',port:'Portaria',res:'Res.',ot:'OT'};
  return '<span class="pill '+(cls[t]||'p-ot')+'">'+(lbl[t]||t)+'</span>';
}
const leiNome   = l => ''+(tipoFull(l.tipo))+' nº '+(l.num)+'/'+(l.ano)+'';
const leiNomeC  = l => ''+(tipoLabel(l.tipo))+' nº '+(l.num)+'/'+(l.ano)+'';
const tribLabel = t => ({issqn:'ISSQN',iptu:'IPTU',itbi:'ITBI',taxas:'Taxas',cosip:'COSIP',geral:'Geral'}[t]||t);
function esc(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''; }
function nomeCurto(l){var t={lc:'LC',lei:'Lei',dec:'Dec.',in:'IN',port:'Port.',res:'Res.',ot:'OT',edital:'Edital'};return (t[l.tipo]||l.tipo.toUpperCase())+' '+l.num+'/'+l.ano;}
function filtrar(f,btn){filtroAtivo=f;document.querySelectorAll('.fb').forEach(function(b){b.classList.remove('on');});if(btn)btn.classList.add('on');buscaAtiva='';document.getElementById('q').value='';render();}
function buscar(){buscaAtiva=document.getElementById('q').value.toLowerCase().trim();filtroAtivo='todos';document.querySelectorAll('.fb').forEach(function(b){b.classList.remove('on');});document.querySelector('.fb').classList.add('on');render();}
function leiFiltrada(l){var tribs=['issqn','iptu','itbi','taxas'];if(tribs.indexOf(filtroAtivo)>=0){if(l.tributo!==filtroAtivo)return false;}else if(filtroAtivo==='in'){if(['in','port','res','ot','edital'].indexOf(l.tipo)<0)return false;}else if(filtroAtivo!=='todos'){if(l.tipo!==filtroAtivo)return false;}if(buscaAtiva){return (nomeCurto(l)+' '+l.ementa+' '+(l.tributo||'')).toLowerCase().indexOf(buscaAtiva)>=0;}return true;}
function cardN(l){var t=l.artigos&&l.artigos.length,rev=l.situacao==='revogada',alt=l.situacao==='vigente-alt';return '<div class="cn'+(rev?' rev':'')+(t?'':' st')+'" onclick="abrirNorma('+l.id+')">'+'<div class="cn-top"><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">'+tipoPill(l.tipo)+'<span class="cn-num">'+esc(nomeCurto(l))+'</span></div>'+'<div style="display:flex;gap:4px;flex-shrink:0">'+(alt?'<span class="b-alt">ALT</span>':'')+(rev?'<span class="b-rev">REV</span>':'')+'</div></div>'+'<div class="cn-em">'+esc(l.ementa.length>95?l.ementa.slice(0,95)+'...':l.ementa)+'</div>'+'<div class="cn-ft">'+(t?'📄 '+t+' dispositivos':'📋 sem texto')+'</div>'+(t?'<span class="cn-arrow">→</span>':'')+'</div>';}
function cardMod(l){return '<div class="cm" onclick="abrirNorma('+l.id+')" title="'+esc(l.ementa)+'"><div style="display:flex;align-items:center;gap:6px">'+tipoPill(l.tipo)+'<span class="cm-num">'+esc(nomeCurto(l))+'</span></div><div class="cm-em">'+esc(l.ementa.slice(0,65))+(l.ementa.length>65?'...':'')+'</div></div>';}
function cardCons(c){return '<div class="cc" onclick="abrirCons('+c.id+')"><div class="cc-tipo">TEXTO CONSOLIDADO</div><div class="cc-titulo">'+esc(c.leiBaseNome)+'</div><div class="cc-sub">Com alterações da '+esc(c.leiModNome)+' · '+esc(c.data)+'</div><span class="cc-badge">📑 '+c.nalts+' modificações — clique para ler →</span></div>';}


function renderStats(){
  var lcV=leis.filter(function(l){return l.tipo==='lc'&&l.situacao!=='revogada';}).length;
  var decV=leis.filter(function(l){return l.tipo==='dec'&&l.situacao!=='revogada';}).length;
  var inV=leis.filter(function(l){return ['in','port','res','ot'].indexOf(l.tipo)>=0&&l.situacao!=='revogada';}).length;
  var revV=leis.filter(function(l){return l.situacao==='revogada';}).length;
  var el=document.getElementById('stats');
  el.innerHTML='';
  function stat(n,label,cls,fn){
    var d=document.createElement('div');
    d.className='stat'+(cls?' '+cls:'');
    d.style.cursor='pointer';
    d.innerHTML='<div class="stat-n"'+( cls==='blue'?' style="color:var(--blue)"':'')+'>'+n+'</div><div class="stat-l">'+label+'</div>';
    d.onclick=fn;
    el.appendChild(d);
  }
  stat(lcV,'Leis Compl.','gold',function(){filtrar_stat('lc');});
  stat(cons.length,'Consolidados','blue',function(){rolaPara('sec-cons');});
  stat(decV,'Decretos','',function(){filtrar_stat('dec');});
  stat(inV,'INs / Port.','',function(){filtrar_stat('in');});
  stat(revV,'Revogadas','',function(){rolaPara('sec-rev');});
}



function render(){
  renderStats();
  var visBusca=buscaAtiva||filtroAtivo!=='todos';
  var cont=document.getElementById('cont');
  if(visBusca){
    var lista=leis.filter(leiFiltrada);
    cont.innerHTML=lista.length
      ?'<p style="font-size:12px;color:var(--muted);margin-bottom:12px">'+lista.length+' resultado(s)</p><div class="grid">'+lista.map(cardN).join('')+'</div>'
      :'<div class="empty"><div class="empty-ico">&#x1F50D;</div><p>Nenhuma norma encontrada.</p></div>';
    return;
  }
  var h='';
  if(cons.length) h+='<div class="sec" id="sec-cons"><div class="sec-hdr"><span class="sec-titulo">&#x1F4D1; Textos Consolidados</span><span class="sec-n">'+cons.length+'</span></div><div class="grid">'+cons.map(cardCons).join('')+'</div></div>';
  var ctm=leis.filter(function(l){return l.tipo==='lc'&&String(l.num)==='005';});
  var _lcModIds=[5,3,2,2443,2444,2445,2446,2447,2448,2449,2450,2451,2452,2453,2454,2455,2456,2457,2458];var lcMod=leis.filter(function(l){return _lcModIds.indexOf(l.id)!==-1;});
  if(ctm.length||lcMod.length){
    var corpo='';
    if(ctm.length) corpo+='<div class="grid" style="margin-bottom:12px">'+ctm.map(cardN).join('')+'</div>';
    if(lcMod.length){
    var ddId='dd-lcmod';
    corpo+='<div class="subsec">'
      +'<div class="subsec-dd-hdr" onclick="toggleLcMod()" id="'+ddId+'-hdr">'
      +'<span class="subsec-titulo">Leis complementares incorporadas ao Código <span style="font-weight:400;color:var(--muted);font-size:10px;margin-left:4px">('+lcMod.length+')</span></span>'
      +'<span class="subsec-dd-arrow" id="'+ddId+'-arrow">▼</span>'
      +'</div>'
      +'<div class="subsec-dd-body" id="'+ddId+'-body">'
      +'<div class="grid-sm" style="margin-top:10px">'+lcMod.map(cardMod).join('')+'</div>'
      +'</div>'
      +'</div>';
  }
    h+='<div class="sec" id="sec-cod"><div class="sec-hdr"><span class="sec-titulo">&#x1F4D6; I &mdash; Código Tributário Municipal</span><span class="sec-n">'+(ctm.length+lcMod.length)+'</span></div>'+corpo+'</div>';
  }
  var tribs=[{id:'issqn',e:'&#x2696;',n:'ISSQN'},{id:'iptu',e:'&#x1F3E0;',n:'IPTU'},{id:'itbi',e:'&#x1F511;',n:'ITBI'},{id:'taxas',e:'&#x1F4CB;',n:'Taxas'}];
  var tCorpo='';
  tribs.forEach(function(t){
    var g=leis.filter(function(l){return l.tributo===t.id&&l.situacao!=='revogada'&&!(l.tipo==='lc'&&String(l.num)==='005');});
    if(g.length) tCorpo+='<div class="subsec"><div class="subsec-titulo">'+t.e+' '+t.n+'</div><div class="grid">'+g.map(cardN).join('')+'</div></div>';
  });
  if(tCorpo) h+='<div class="sec" id="sec-trib"><div class="sec-hdr"><span class="sec-titulo">&#x2696; II &mdash; Normas Tributárias por Espécie</span></div>'+tCorpo+'</div>';

  // ── SEÇÃO III — BENEFÍCIOS FISCAIS ──────────────────────────────
  // ── SEÇÃO III — BENEFÍCIOS FISCAIS ──────────────────────────────
  var bIds = [9, 6];  // Lei 3.624/2025, LC 413/2025
  var bLeis = bIds.map(function(id){ return leis.find(function(l){ return l.id===id; }); }).filter(Boolean);
  var bPend = [
    {tipo:'lei', num:'Lei 3.428/2023', desc:'Programa Passaporte Universitário — isenção de tributos para instituições de ensino'},
    {tipo:'lc',  num:'LC 357/2021',    desc:'Incentivos fiscais de ISS, IPTU e Taxas — Programa DESENVOLVE MARICÁ'},
    {tipo:'lc',  num:'LC 251/2014',    desc:'Isenção do Estado do RJ e suas autarquias de taxas e contribuições'},

function computePaths(artigos){

  const byId={};
  artigos.forEach(function(d){ byId[d.id]=d; });
  artigos.forEach(function(d){
    if(!d.paiId){
      d._path = d.label;
    } else {

      const paiPath = pai ? pai._path : '';
      d._path = paiPath ? paiPath + ' – ' + d.label : d.label;
    }
  });

/* ── Renderização de tabela com suporte a rowspan/colspan e rodapé ──
   Células especiais:
     ^  → mescla verticalmente com a célula acima (rowspan)
     >  → mescla horizontalmente com a célula à esquerda (colspan)
   Rodapé: campo "rodape" no objeto do anexo ou da seção.
*/
function renderTabelaMerge(colunas, linhas, celMap, rodape){
  var nCols = colunas.length;
  var nRows = linhas.length;

  var rowspanMap = [], colspanMap = [], skip = [];
  for(var ri=0;ri<nRows;ri++){
    rowspanMap[ri]=[];colspanMap[ri]=[];skip[ri]=[];
    for(var ci=0;ci<nCols;ci++){rowspanMap[ri][ci]=1;colspanMap[ri][ci]=1;skip[ri][ci]=false;}
  }

  // Resolver colspan (>)
  for(var ri=0;ri<nRows;ri++){
    var row=linhas[ri];
    for(var ci=0;ci<row.length;ci++){
      if(row[ci]==='>'){
        var anchor=ci-1;
        while(anchor>=0 && (row[anchor]==='>' || skip[ri][anchor])) anchor--;
        if(anchor>=0){ colspanMap[ri][anchor]++; skip[ri][ci]=true; }
      }
    }
  }

  // Resolver rowspan (^)
  for(var ri=0;ri<nRows;ri++){
    var row=linhas[ri];
    for(var ci=0;ci<row.length;ci++){
      if(skip[ri][ci]) continue;
      if(row[ci]==='^'){
        var anchor=ri-1;
        while(anchor>=0 && linhas[anchor][ci]==='^') anchor--;
        if(anchor>=0 && !skip[anchor][ci]){ rowspanMap[anchor][ci]++; skip[ri][ci]=true; }
      }
    }
  }

  // Verificar se há alguma célula mesclada (para desativar listra)
  var hasMerge=false;
  for(var ri=0;ri<nRows&&!hasMerge;ri++)
    for(var ci=0;ci<nCols&&!hasMerge;ci++)
      if(rowspanMap[ri][ci]>1||colspanMap[ri][ci]>1) hasMerge=true;

  var tableClass='anexo-table'+(hasMerge?' no-stripe':'');

  // Cabeçalho
  var h='<div class="anexo-table-wrap"><table class="'+tableClass+'"><thead><tr>';
  for(var ci=0;ci<colunas.length;ci++){
    var col=colunas[ci];
    if(col==='>') continue;
    var cs=1, nci=ci+1;
    while(nci<colunas.length && colunas[nci]==='>'){cs++;nci++;}
    h+='<th'+(cs>1?' colspan="'+cs+'"':'')+'>'+(col==='^'?'':col)+'</th>';
  }
  h+='</tr></thead><tbody>';

  // Linhas
  for(var ri=0;ri<nRows;ri++){
    h+='<tr>';
    var row=linhas[ri];
    for(var ci=0;ci<nCols;ci++){
      if(skip[ri][ci]) continue;
      var key=ri+':'+ci, ac=celMap?celMap[key]:null;
      var rs=rowspanMap[ri][ci], cs2=colspanMap[ri][ci];
      var cel=ci<row.length?row[ci]:'';
      var attrs='';
      if(rs>1) attrs+=' rowspan="'+rs+'"';
      if(cs2>1) attrs+=' colspan="'+cs2+'"';
      if(ac) h+='<td'+attrs+' class="cel-alt"><span class="cel-ant">'+ac.ant+'</span><span class="cel-nov">'+ac.nov+'</span></td>';
      else h+='<td'+attrs+'>'+(cel==='^'||cel==='>'?'':cel)+'</td>';
    }
    h+='</tr>';
  }
  h+='</tbody></table>';
  if(rodape) h+='<div class="anexo-rodape">'+rodape+'</div>';
  h+='</div>';
  return h;
}

function renderTabela(anexo, celMap){

function renderAnexoTexto(textoLivre, rodape){
  var linhas=textoLivre.split('\n');
  var h='<div style="font-size:13px;line-height:1.8;color:var(--text);">';
  var paraAtual='';
  function flushPara(){
    if(paraAtual.trim()) h+='<p style="margin:.5rem 0;text-align:justify;">'+paraAtual.trim()+'</p>';
    paraAtual='';
  }
  linhas.forEach(function(l){
    if(l.startsWith('## ')){
      flushPara();
      h+='<div style="font-weight:700;color:var(--navy);margin:1rem 0 .25rem;text-align:center;border-bottom:1px solid var(--bord);padding-bottom:3px;">'+l.slice(3).trim()+'</div>';
    } else if(l.startsWith('> ')){
      flushPara();
      h+='<div style="margin:.35rem 0 .35rem 24px;text-align:justify;">'+l.slice(2).trim()+'</div>';
    } else if(l.trim()===''){
      flushPara();
    } else {
      paraAtual=paraAtual?paraAtual+' '+l.trim():l.trim();
    }
  });
  flushPara();
  h+='</div>';
  if(rodape) h+='<div class="anexo-rodape">'+rodape+'</div>';
  return h;
}

function renderAnexoCompleto(anx){

           +'<span style="color:var(--muted);text-decoration:line-through">'+(alt.textoAnt||d.texto)+'</span>'
           +'</div>'
           +'<div style="font-size:13px;font-family:monospace;margin-top:3px">'
           +'<span style="'+bold+'color:var(--blue)">'+d.label+dash+'</span>'
           +'<span style="color:var(--text)">'+alt.texto+'</span>'
           +'<br><span class="doc-art-nota">'+nota.alterado+'</span>'
           +'</div>';
    }
    wrapper.innerHTML=inner;
  }

  container.appendChild(wrapper);
  todos.filter(function(x){return x.paiId===d.id;}).forEach(function(f){return renderHierDoc(f,todos,altMap,modNome,container)});
}
function abrirCons(id){
  // Compara id como número e como string para segurança
  var c = cons.find(function(x){ return x.id===id || x.id===Number(id) || String(x.id)===String(id); });
  if(!c){ alert('Consolidação não encontrada.'); return; }

  var corp = document.getElementById('mcorp');
  corp.innerHTML = '';

  // Se tem HTML pré-renderizado salvo, usa diretamente (mais rápido e confiável)
  if(c.html){
    corp.innerHTML = c.html;
    // Injeta link clicável para a lei modificadora no cabeçalho
    var lMod2 = leis.find(function(l){ return l.id===c.leiModId; });
    if(lMod2){
      var cabecalho = corp.querySelector('.doc-cabecalho');
      if(cabecalho){
        var badge = cabecalho.querySelector('.doc-lei-cons');
        if(badge && badge.parentNode) badge.parentNode.removeChild(badge);
        var linkDiv = document.createElement('div');
        linkDiv.style.marginTop = '.75rem';
        var linkSpan = document.createElement('span');
        linkSpan.className = 'doc-lei-cons-link';
        linkSpan.title = 'Abrir ' + leiNomeC(lMod2);
        linkSpan.innerHTML = '&#x1F4CE; Texto consolidado com as altera\u00e7\u00f5es da ' + leiNomeC(lMod2);
        linkSpan.onclick = function(){ fechar(); setTimeout(function(){ abrirNorma(lMod2.id); }, 80); };
        linkDiv.appendChild(linkSpan);
        cabecalho.appendChild(linkDiv);
      }
    }
    abrir('Texto Consolidado \u2014 ' + c.leiBaseNome);
    return;
  }

  // Caso contrário, renderiza do zero
  var lBase = leis.find(function(l){ return l.id===c.leiBaseId; });
  var lMod  = leis.find(function(l){ return l.id===c.leiModId; });
  if(!lBase||!lMod){ alert('Dados incompletos.'); return; }

  S.leiBaseId  = c.leiBaseId;
  S.leiModId   = c.leiModId;
  S.artigos    = JSON.parse(JSON.stringify(lBase.artigos||[]));
  S.alteracoes = JSON.parse(JSON.stringify(c.alteracoes||[]));
  S.anexos     = JSON.parse(JSON.stringify(lBase.anexos||[]));
  computePaths(S.artigos);

  var cab = document.createElement('div');
  cab.className = 'doc-cabecalho';
  var tf = tipoFull(lBase.tipo).toUpperCase();
  var cabH = '<div class="doc-lei-id">'+tf+' Nº '+lBase.num+', DE '+(lBase.dataExtenso||lBase.ano)+'</div>';
  if(lBase.preambulo) cabH += '<div class="doc-ementa-bloco"><div class="doc-ementa-txt">'+lBase.preambulo+'</div></div>';
  if(lBase.formulaPromulgacao) cabH += '<div class="doc-formula">'+lBase.formulaPromulgacao+'</div>';
  cabH += '<div style="margin-top:.75rem"><span class="doc-lei-cons-link" onclick="fechar();setTimeout(function(){abrirNorma('+lMod.id+')},80)" title="Abrir '+leiNomeC(lMod)+'">📎 Texto consolidado com as alterações da '+leiNomeC(lMod)+'</span></div>';
  cab.innerHTML = cabH;
  corp.appendChild(cab);

  var modNome = leiNomeC(lMod);
  var altMap = {};
  S.alteracoes.forEach(function(a){ altMap[a.disp]=a; if(a.apos) altMap[a.apos+'__'+a.disp]=a; });

  var todosDisps = JSON.parse(JSON.stringify(S.artigos));
  computePaths(todosDisps);

  function normP(s){ if(!s)return ''; return s.toLowerCase().replace(/[ºo°]/g,'').replace(/§\s+/g,'§').replace(/art\.\s*/g,'art').replace(/\s*–\s*/g,'–').replace(/\s+/g,'').trim(); }
  function tipoD(s){ s=s.trim(); if(/^Art/i.test(s))return 'art'; if(/^§|^Par[áa]grafo/i.test(s))return 'par'; if(/^[IVXLCDM]+$/i.test(s.replace(/[.\-–\s]/g,'')))return 'inc'; if(/^[a-z]\)/.test(s))return 'ali'; return 'art'; }
  function labelD(s){ s=s.trim(); if(s.includes(' – '))s=s.split(' – ').pop().trim(); if(/^§/.test(s)){var n=parseInt(s.replace(/[^0-9]/g,''));return isNaN(n)?s:(n<=9?'§'+n+'º':'§'+n+'.');} if(/^Art/i.test(s)){var n=parseInt(s.replace(/[^0-9]/g,''));return isNaN(n)?s:(n<=9?'Art. '+n+'º':'Art. '+n+'.');} return s.replace(/[.\-–\s]/g,'').toUpperCase()||s; }

  var incluidos = S.alteracoes.filter(function(a){ return a.tipo==='incluido'; });
  var ordenados=[],pendentes=incluidos.slice(),maxI=incluidos.length*2+1;
  while(pendentes.length&&maxI-->0){
    var prog=false;
    for(var i=pendentes.length-1;i>=0;i--){
      var inc=pendentes[i],aN=normP(inc.apos||'');
      var ok=!inc.apos||todosDisps.find(function(d){return normP(d._path)===aN;})||ordenados.find(function(o){return normP(o.disp)===aN;});
      if(ok){ordenados.push(inc);pendentes.splice(i,1);prog=true;}
    }
    if(!prog) break;
  }
  pendentes.forEach(function(p){ordenados.push(p);});
  ordenados.forEach(function(inc){
    if(todosDisps.find(function(d){return normP(d._path)===normP(inc.disp);})) return;
    var aN=normP(inc.apos||''),paiId=null,insertIdx=-1;
    if(inc.apos){
      var ri=todosDisps.findIndex(function(d){return normP(d._path)===aN;});
      if(ri>=0){insertIdx=ri+1;var ref=todosDisps[ri];var tN=tipoD(inc.disp.includes(' – ')?inc.disp.split(' – ').pop().trim():inc.disp);var hier={par:['art'],inc:['art','par'],ali:['inc']};paiId=((hier[tN]||[]).indexOf(ref.tipo)>=0)?ref.id:ref.paiId;}
    }
    var lbl=labelD(inc.disp),novoId='inc_'+Math.random().toString(36).slice(2);
    todosDisps.splice(insertIdx>=0?insertIdx:todosDisps.length,0,{id:novoId,tipo:tipoD(lbl),label:lbl,texto:inc.texto,paiId:paiId});
    computePaths(todosDisps);
  });

  var cont2 = document.createElement('div');
  todosDisps.filter(function(d){return !d.paiId;}).forEach(function(d){renderHierDoc(d,todosDisps,altMap,modNome,cont2);});
  corp.appendChild(cont2);
  renderAnexosConsolidado(corp,modNome);

  if(lBase.dataExtenso||lBase.assinatura){
    var fecho=document.createElement('div'); fecho.className='doc-fecho';
    var loc=lBase.municipio||'Maricá, Estado do Rio de Janeiro, RJ';
    if(lBase.dataExtenso) fecho.innerHTML+='<div class="doc-fecho-local">GABINETE DO PREFEITO DO MUNICÍPIO DE MARICÁ, '+loc+', '+lBase.dataExtenso+'.</div>';
    if(lBase.assinatura) fecho.innerHTML+='<div class="doc-fecho-assinatura">'+lBase.assinatura+'</div>';
    corp.appendChild(fecho);
  }
  abrir('Texto Consolidado — '+c.leiBaseNome);
}

function carregarBackup(inp){
  var file=inp.files[0];
  if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    var msg=document.getElementById('sync-msg');
    var bk;
    try{ bk=JSON.parse(e.target.result); }
    catch(err){
      msg.style.cssText='display:block;background:#fef2f2;border:1px solid #fca5a5;color:#991b1b';
      msg.textContent='Arquivo inválido. Selecione o .json exportado pelo consolidador.';
      return;
    }
    if(!bk.leis||!Array.isArray(bk.leis)){
      msg.style.cssText='display:block;background:#fef2f2;border:1px solid #fca5a5;color:#991b1b';
      msg.textContent='Formato inválido.';
      return;
    }

    // IDs das LCs históricas cadastradas manualmente — preservar sempre
    var idsPreservar=[2443,2444,2445,2446,2447,2448,2449,2450,2451,2452,2453,2454,2455,2456,2457,2458,
                     4657,4658,4659,4660,4661,4662,4663,4664,4665,4666,4667,4668,4669,4670,4671,4672];
    var preservadas=DB.leis.filter(function(l){return idsPreservar.indexOf(l.id)>=0;});
    var bkIds=bk.leis.map(function(l){return l.id;});
    var novasLeis=bk.leis.concat(preservadas.filter(function(l){return bkIds.indexOf(l.id)<0;}));

    // Consolidações: mesclar por par leiBaseId:leiModId, mantendo HTML maior
    var novasCons=[];
    var idxPar={};
    DB.consolidacoes.forEach(function(c){ idxPar[c.leiBaseId+':'+c.leiModId]=c; });
    (bk.consolidacoes||[]).forEach(function(cBk){
      var k=cBk.leiBaseId+':'+cBk.leiModId;
      var cIdx=idxPar[k];
      if(cIdx){
        novasCons.push({id:cIdx.id,leiBaseId:cBk.leiBaseId,leiModId:cBk.leiModId,
          leiBaseNome:cBk.leiBaseNome||cIdx.leiBaseNome,leiModNome:cBk.leiModNome||cIdx.leiModNome,
          nalts:cBk.nalts||cIdx.nalts,data:cBk.data||cIdx.data,
          alteracoes:cBk.alteracoes||cIdx.alteracoes||[],
          html:(cBk.html||cIdx.html||'')});
        delete idxPar[k];
      } else { novasCons.push(cBk); }
    });
    for(var k in idxPar) novasCons.push(idxPar[k]);

    // Aplicar
    DB.leis=novasLeis; DB.consolidacoes=novasCons;
    DB.nid=Math.max(DB.nid||0,bk.nid||0)+1;
    leis=DB.leis; cons=DB.consolidacoes;
    render();

    // Contar leis com anexos no backup
    var leisComAnexos=bk.leis.filter(function(l){return l.anexos&&l.anexos.length>0;});
    var totalAnexos=bk.leis.reduce(function(acc,l){return acc+(l.anexos?l.anexos.length:0);},0);

    msg.style.cssText='display:block;background:#f0fdf4;border:1px solid #86efac;color:#166534';
    msg.innerHTML='<strong>✅ Feito!</strong> '
      +novasLeis.length+' normas, '+novasCons.length+' consolidação(ões).<br>'
      +totalAnexos+' anexo(s) em '+leisComAnexos.length+' norma(s).<br>'
      +'Confira o index atualizado acima.<br>'
      +'Quando estiver pronto, clique em <strong>💾 Salvar index.html</strong> e suba para o GitHub.';
    document.getElementById('sync-btns').style.display='flex';
  };
  reader.readAsText(file);
}

// Captura o HTML original no momento do carregamento da página
var _htmlOriginal = (function(){
  var abre='<textarea id="db-data" style="display:none">';
  var fecha='</textarea>';
  var html=document.documentElement.outerHTML;
  var p1=html.indexOf(abre);
  var p2=html.indexOf(fecha, p1+abre.length);
  if(p1<0||p2<0) return null;
  // Guardar: parte antes do JSON + parte depois
  return {antes: html.slice(0,p1+abre.length), depois: html.slice(p2)};
})();

function gerarDownloadIndex(){
  if(!_htmlOriginal){
    alert('Erro: não foi possível capturar o HTML original. Tente recarregar a página.');
    return;
  }
  var dbStr=JSON.stringify(DB);
  var novoHtml=_htmlOriginal.antes+dbStr+_htmlOriginal.depois;
  var blob=new Blob([novoHtml],{type:'text/html;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  var d=new Date();
  a.download='index_'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'.html';
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}



function docGetTexto(){
  // Extrair texto puro do conteúdo do modal
  var el=document.getElementById('mcorp');
  if(!el) return '';
  // Clonar para não afetar o DOM
  var clone=el.cloneNode(true);
  // Remover elementos de interface (botões, etc)
  clone.querySelectorAll('button,input,select').forEach(function(e){e.remove();});
  // Substituir <br> por \n e blocos por \n
  clone.querySelectorAll('br').forEach(function(e){e.replaceWith('\n');});
  // Retornar textContent com normalização de espaços em branco
  return clone.innerText||clone.textContent||'';
}

function docCopiarTexto(){
  var txt=docGetTexto();
  if(!txt){alert('Nenhum conteúdo para copiar.');return;}
  navigator.clipboard.writeText(txt).then(function(){
    var btn=event.currentTarget;
    var orig=btn.innerHTML;
    btn.innerHTML='✅ Copiado!';
    setTimeout(function(){btn.innerHTML=orig;},2000);
  }).catch(function(){
    // Fallback
    var ta=document.createElement('textarea');
    ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();document.execCommand('copy');
    document.body.removeChild(ta);
    alert('Texto copiado!');
  });
}
