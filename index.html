a transação;","paiId":3330,"id":3331},{"tipo":"inc","label":"II","texto":"a legitimidade para formalizar acordo de transação, seja por proposta individual ou por adesão, consideradas as regras de responsabilidade tributária previstas na Lei Federal nº 5.172, de 25 de outubro de 1966 (Código Tributário Nacional) e na Lei nº 910, de 14 de dezembro de 1990, renomeada pela Lei Complementar nº 005, de 30 de janeiro de 1991 (Código Tributário Municipal);","paiId":3330,"id":3332},{"tipo":"inc","label":"III","texto":"as normas necessárias ao funcionamento da comissão prevista no Parágrafo 4º do artigo 10 desta Lei para processamento, instrução e decisão ou homologação do termo de transação;","paiId":3330,"id":3333},{"tipo":"inc","label":"IV","texto":"a possibilidade de se condicionar a transação ao pagamento de entrada, à apresentação de garantia e à manutenção das garantias já existentes;","paiId":3330,"id":3334},{"tipo":"inc","label":"V","texto":"as situações em que a transação somente poderá ser celebrada por adesão, autorizado o não conhecimento de eventuais propostas de transação individual;","paiId":3330,"id":3335},{"tipo":"inc","label":"VI","texto":"o formato e os requisitos da proposta de transação, bem como os documentos que deverão ser apresentados por ocasião de sua formulação;","paiId":3330,"id":3336},{"tipo":"inc","label":"VII","texto":"os critérios e parâmetros para aferição do grau de recuperabilidade das dívidas e para a concessão de descontos;","paiId":3330,"id":3337},{"tipo":"inc","label":"VIII","texto":"os critérios, procedimento e demais condições para a efetivação do protesto extrajudicial; e","paiId":3330,"id":3338},{"tipo":"inc","label":"IX","texto":"as demais questões eventualmente omissas nessa Lei.","paiId":3330,"id":3339},{"tipo":"art","label":"Art. 32.","texto":"O Município, através da Procuradoria Geral, fica autorizado a firmar convênio com o Tribunal de Justiça do Estado do Rio de Janeiro ou com o Tribunal Regional Federal para operacionalização dos acordos de transação previstos nesta Lei.","paiId":3327,"id":3340},{"tipo":"art","label":"Art. 33.","texto":"O órgão municipal responsável pelos sistemas informatizados de gestão do crédito fiscal deverá adequar as suas funcionalidades ao disposto nesta Lei.","paiId":3327,"id":3341},{"tipo":"art","label":"Art. 34.","texto":"Fica o Poder Executivo autorizado a instituir, por meio de Decreto, programas de incentivo à quitação à vista de débitos inscritos em dívida ativa, ajuizados ou não, com a concessão de desconto de até 100% (cem por cento) sobre os juros e multa.","paiId":3327,"id":3342},{"tipo":"par","label":"§1º","texto":"O programa de incentivo previsto pelo caput independe da classificação do crédito previsto no art. 12 desta Lei.","paiId":3342,"id":3343},{"tipo":"par","label":"§2º","texto":"O Poder Executivo poderá, excepcionalmente, dividir os débitos em até 10 (dez) parcelas mensais e sucessivas, observando os descontos previstos no caput.","paiId":3342,"id":3344},{"tipo":"par","label":"§3º","texto":"O Decreto a que se refere o caput definirá o período de vigência e as condições para adesão ao programa, observadas as normas orçamentárias e financeiras.","paiId":3342,"id":3345},{"tipo":"art","label":"Art. 35.","texto":"Em qualquer modalidade de transação, o percentual dos honorários devidos ao Fundo Especial da Procuradoria Geral do Município será aquele fixado pelo artigo 18 da Lei Complementar Municipal nº 246, de 23 de setembro de 2014, se o débito não estiver ajuizado. Se o débito estiver ajuizado, o percentual será fixado pelo juízo competente, nos termos do Código de Processo Civil e da Lei nº 6.830/1980, e, se não fixado, será considerado o percentual fixado pelo artigo 22 da Lei Complementar Municipal nº 218, de 20 de março de 2012, alterado pela Lei Complementar Municipal nº 273, de 10 de dezembro de 2015.","paiId":3327,"id":3346},{"tipo":"art","label":"Art. 36.","texto":"O protesto da certidão de dívida ativa será realizado exclusivamente pela Procuradoria Geral do Município.","paiId":3327,"id":3347},{"tipo":"art","label":"Art. 37.","texto":"A Procuradoria Geral do Município poderá criar câmaras de prevenção e resolução administrativa de conflitos, nos termos da Lei nº 13.140, de 26 de junho de 2015, e/ou realizar convênios com câmaras de mediação e arbitragem para auxiliá-la na composição de litígios.","paiId":3327,"id":3348},{"tipo":"art","label":"Art. 38.","texto":"O ajuizamento de execuções fiscais para a cobrança de créditos do Município fica condicionado a um valor mínimo de alçada, a ser fixado por ato do Procurador-Geral do Município, com base em critérios de eficiência administrativa e no custo estimado do processo judicial.","paiId":3327,"id":3349},{"tipo":"art","label":"Art. 39.","texto":"O art. 7º da Lei Complementar Municipal 385/2022 passa a vigorar com a seguinte redação:␞__CITACAO__␞\"Art. 7º. Será permitido o reparcelamento decorrente de inadimplência, uma única vez, desde que observado o pagamento inicial mínimo de 25% (vinte e cinco por cento) do saldo remanescente do parcelamento originário, acrescidos de juros, multas e encargos legais. (NR)\"","paiId":3327,"id":3350},{"tipo":"art","label":"Art. 40.","texto":"Ficam definidos no âmbito do Município de Maricá, suas autarquias e fundações, como obrigações de pequeno valor a que aludem os §§ 3º e 4º do art. 100 da Constituição Federal, os créditos oriundos de decisão judicial transitada em julgado, cujo valor total atualizado não exceda a 10 (dez) salários mínimos.","paiId":3327,"id":3351},{"tipo":"art","label":"Art. 41.","texto":"Revogam-se as disposições em contrário.","paiId":3327,"id":3352},{"tipo":"art","label":"Art. 42.","texto":"Esta Lei Complementar entra em vigor na data de sua publicação.","paiId":3327,"id":3353}],"anexos":[],"preambulo":"DISPÕE SOBRE AS CONDIÇÕES E REQUISITOS PARA A CELEBRAÇÃO DE TRANSAÇÃO FISCAL COMO MEIO DE EXTINÇÃO DE CRÉDITOS TRIBUTÁRIOS E NÃO TRIBUTÁRIOS, E O VALOR A SER CONSIDERADO COMO LIMITE MÁXIMO PARA PAGAMENTOS DE REQUISIÇÕES DE PEQUENO VALOR (RPV) NO ÂMBITO DO MUNICÍPIO DE MARICÁ E DÁ OUTRAS PROVIDÊNCIAS.","formulaPromulgacao":"O POVO DO MUNICÍPIO DE MARICÁ, por seus representantes na Câmara Municipal, aprovou e o Prefeito Municipal, em seu nome sanciona a seguinte Lei Complementar:","dataExtenso":"11 DE MARÇO DE 2026","municipio":"Estado do Rio de Janeiro, RJ","assinatura":"Washington Luiz Cardoso Siqueira \nPREFEITO DO MUNICÍPIO DE MARICÁ"},{"id":9,"tipo":"lei","num":"3.624","ano":"2025","ementa":"Dispõe sobre isenção de IPTU, ISS e taxas para imóveis e serviços de templos de qualquer culto.","tributo":"geral","situacao":"vigente","link":"JOM 1.797, de 20/10/2025","artigos":[{"tipo":"art","label":"Art. 1º","texto":"Ficam isentos do pagamento do Imposto Predial e Territorial Urbano (IPTU) e de quaisquer taxas municipais relativas à propriedade, ocupação, edificação, conservação ou funcionamento os imóveis","paiId":null,"id":2902},{"tipo":"art","label":"Art. 2º","texto":"A isenção prevista no artigo anterior aplica-se:","paiId":null,"id":2903},{"tipo":"inc","label":"I","texto":"aos imóveis pertencentes ou utilizados por entidades religiosas, desde que comprovadamente destinados ao exercício das atividades essenciais de culto, celebrações e funções administrativas;","paiId":2903,"id":2904},{"tipo":"inc","label":"II","texto":"aos imóveis cedidos em comodato ou locação gratuita para uso religioso, desde que cumpridos os","paiId":2903,"id":2905},{"tipo":"inc","label":"III","texto":"às taxas de localização, funcionamento, vistoria e fiscalização urbana ou sanitária, quando incidentes sobre templos de qualquer culto.","paiId":2903,"id":2906},{"tipo":"art","label":"Art. 3º","texto":"Fica reconhecida a imunidade tributária dos templos de qualquer culto em relação ao Imposto Sobre","paiId":null,"id":2907},{"tipo":"par","label":"§1º","texto":"Não serão exigidos, lançados ou cobrados valores a título de ISS sobre serviços religiosos, litúrgicos, administrativos ou sociais prestados por entidades religiosas no exercício de suas funções institucionais.","paiId":2907,"id":2908},{"tipo":"par","label":"§2º","texto":"Ficam declarados inexigíveis os créditos tributários relativos ao ISS, constituídos ou não, cujo fato gerador tenha ocorrido anteriormente à vigência desta Lei, desde que vinculados a atividades essenciais da entidade religiosa.","paiId":2907,"id":2909},{"tipo":"art","label":"Art. 4º","texto":"Ficam declarados inexigíveis os créditos tributários municipais, constituídos ou não, relativos a IPTU e taxas incidentes sobre imóveis utilizados por templos de qualquer culto, cujo fato gerador seja anterior à data de vigência desta Lei.","paiId":null,"id":2910},{"tipo":"par","label":"Parágrafo único","texto":"A inexigibilidade prevista neste artigo alcança débitos ainda não quitados, protestados ou inscritos em dívida ativa, desde que estejam relacionados a imóveis de efetiva e comprovada destinação religiosa.","paiId":2910,"id":2911},{"tipo":"art","label":"Art. 5º","texto":"Para a obtenção do reconhecimento da isenção, a entidade religiosa deverá apresentar requerimento à Secretaria Municipal de Fazenda, instruído com:","paiId":null,"id":2912},{"tipo":"inc","label":"I","texto":"prova da titularidade ou da posse legítima do imóvel;","paiId":2912,"id":2913},{"tipo":"inc","label":"II","texto":"comprovação da atividade religiosa desenvolvida no local;","paiId":2912,"id":2914},{"tipo":"inc","label":"III","texto":"declaração de que o imóvel é utilizado exclusiva ou predominantemente como templo.","paiId":2912,"id":2915},{"tipo":"art","label":"Art. 6º","texto":"Ficam os órgãos da administração pública municipal autorizados a promover os registros, cancelamentos e demais procedimentos necessários para o cumprimento desta Lei.","paiId":null,"id":2916},{"tipo":"art","label":"Art. 7º","texto":"A inexigibilidade prevista nesta Lei não enseja direito à restituição de quaisquer valores eventualmente pagos antes da sua entrada em vigor.","paiId":null,"id":2917},{"tipo":"art","label":"Art. 8º","texto":"Nos casos de parcelamentos tributários em curso, a inexigibilidade aplicar-se-á exclusivamente às","paiId":null,"id":2918},{"tipo":"art","label":"Art. 9º","texto":"Na hipótese de desistência de ação judicial com fundamento nesta Lei, caberá ao contribuinte o","paiId":null,"id":2919},{"tipo":"art","label":"Art. 10.","texto":"A inexigibilidade prevista nesta Lei não constitui direito adquirido, podendo ser revogada de ofício caso se constate que o beneficiário:","paiId":null,"id":2920},{"tipo":"inc","label":"I","texto":"não preenchia ou deixou de preencher os requisitos legais;","paiId":2920,"id":2921},{"tipo":"inc","label":"II","texto":"prestou informações falsas ou omitiu dados relevantes;","paiId":2920,"id":2922},{"tipo":"inc","label":"III","texto":"descumpriu, por qualquer meio, as condições previstas nesta Lei.","paiId":2920,"id":2923},{"tipo":"par","label":"Parágrafo único","texto":"Nessas hipóteses, o crédito tributário será restabelecido com acréscimos legais, incluindo juros de mora, conforme previsto na legislação vigente.","paiId":2920,"id":2924},{"tipo":"art","label":"Art. 11.","texto":"Esta Lei constitui norma de regulamentação local da imunidade tributária prevista no art. 150, inciso VI, alínea “b”, da Constituição Federal, não configurando renúncia de receita tributária nos termos do art. 14 da Lei Complementar nº 101/2000.","paiId":null,"id":2925},{"tipo":"art","label":"Art. 12.","texto":"Esta Lei entra em vigor na data de sua publicação.","paiId":null,"id":2926}],"anexos":[],"preambulo":"DISPÕE SOBRE A ISENÇÃO DE IPTU, ISS E TAXAS MUNICIPAIS INCIDENTES SOBRE OS IMÓVEIS E SERVIÇOS DE TEMPLOS DE QUALQUER CULTO NO MUNICÍPIO DE MARICÁ E DECLARA INEXIGÍVEIS OS DÉBITOS ANTERIORES À VIGÊNCIA DESTA LEI.","formulaPromulgacao":"O POVO DO MUNICÍPIO DE MARICÁ, por seus representantes na Câmara Municipal de Maricá, aprovou e o Prefeito Municipal, em seu nome, sanciona a seguinte Lei.","dataExtenso":"17 DE OUTUBRO DE 2025","municipio":"Estado do Rio de Janeiro, RJ","assinatura":"WASHINGTON LUIZ CARDOSO SIQUEIRA\nPREFEITO DO MUNICÍPIO DE MARICÁ"},{"id":10,"tipo":"dec","num":"082","ano":"2025","ementa":"Aprova o Regimento Interno e consolida a estrutura organizacional da SEGET.","tributo":"geral","situacao":"vigente","link":"JOM 1.730, de 09/05/2025","artigos":[{"tipo":"art","label":"Art. 1º","texto":"Fica instituído o Regimento Interno no âmbito da SECRETARIA DE GESTÃO TRIBUTÁRIA E FISCAL – SEGET, do Município de Maricá, consolidado na forma dos Anexo I e II do presente Decreto.","paiId":null,"id":3789},{"tipo":"art","label":"Art. 2º","texto":"Este Decreto entra em vigor na data de sua publicação.","paiId":null,"id":3790}],"anexos":[{"id":4619,"nome":"ANEXO I","descricao":"REGIMENTO INTERNO DA SECRETARIA DE GESTÃO TRIBUTÁRIA E FISCAL DO MUNICÍPIO DE MARICÁ – SEGET.","tipo":"texto","textoLivre":"## TÍTULO I\n## DA CATEGORIA E DAS COMPETÊNCIAS LEGAIS\n\nArt. 1º A Secretaria de Gestão Tributária e Fiscal – SEGET é um órgão da Administração Direta, subordinado diretamente ao Prefeito do Município de Maricá/RJ, regendo-se pelo presente Regimento e pela legislação que lhe for aplicável.\n\nArt. 2º À SEGET, conforme disposto no art. 19 da Lei Complementar nº 398, de 12 de dezembro de 2024, compete:\n> I – gerir o sistema de gestão das receitas municipais;\n> II – estabelecer normas, diretrizes e políticas em matéria tributária;\n> III – coordenar a organização da legislação tributária municipal, orientando os contribuintes sobre sua correta aplicação;\n> IV – coordenar e compatibilizar as ações de controle, análise e apuração da arrecadação, cadastro de contribuintes e controle fiscal, garantindo o alinhamento e a integração das ações definidas pelo sistema de gestão das receitas municipais e a atuação articulada das unidades a ela subordinadas;\n> V – definir, coordenar e avaliar a execução da política tributária e fiscal, o controle da arrecadação e a gestão das informações econômico-fiscais, a consulta ao cumprimento das obrigações tributárias e legislação tributária;\n> VI – coordenar as atividades relativas a lançamento, arrecadação e fiscalização dos tributos mobiliários e imobiliários, mantendo atualizado o cadastro respectivo;\n> VII – planejar e formular o controle das atividades relativas à constituição do crédito tributário e à revisão de ofício do lançamento;\n> VIII – exercer o controle das receitas públicas, inclusive os ingressos, desonerações e renúncias fiscais;\n> IX – coordenar as atividades de inscrição em dívida ativa e a cobrança administrativa e extrajudicial dos créditos devidos ao Município;\n> X – coordenar e fiscalizar a cobrança dos créditos tributários e fiscais do Município e subsidiar a Procuradoria Geral do Município na cobrança administrativa e execução judicial da dívida ativa;\n> XI – promover estudos, pesquisas e análises econômicas e elaborar as estimativas de receitas municipais, visando subsidiar a elaboração dos instrumentos de planejamento e os orçamentos anuais;\n> XII – promover a articulação das ações fiscais entre as instâncias Federal, Estadual e Municipal;\n> XIII – desenvolver outras atividades inerentes à sua competência legal e finalidade ou que lhe forem atribuídas.\n\n## TÍTULO II\n## DA ESTRUTURA ORGANIZACIONAL E HIERÁRQUICA\n\nArt. 3º A SEGET, para o cumprimento de suas competências, disporá da seguinte estrutura básica:\n> I – Secretário(a) Municipal de Gestão Tributária e Fiscal;\n\n> II – Órgãos de assistência direta e imediata:\n> a) Gabinete;\n> b) Assessoria de Controle Interno e Compliance:\n> 1. Escola Fazendária;\n> 2. Auditoria Interna;\n> 3. Corregedoria Interna;\n> 4. Ouvidoria.\n> c) Assessoria de Governança:\n> 1. Programação Fiscal.\n\n> III – Órgãos Singulares:\n> a) Subsecretaria de Planejamento e Modernização da Gestão Tributária:\n> 1. Gerência de Planejamento e Modernização:\n> 1.1. Setor de Inteligência Fiscal;\n> 1.2. Setor de Sistemas de Arrecadação;\n> 1.3. Setor de Ciência de Dados Tributários e Geoprocessamento;\n> 1.4. Escritório de Projetos;\n> 1.5. Setor de Gestão e Segurança da Informação;\n> 1.6. Setor de Inovação em Serviços Tributários e Modernização de Processos.\n\n> b) Subsecretaria de Gestão:\n> 1. Gerência de Gestão:\n> 1.1. Setor de Documentação e Processos;\n> 1.2. Setor de Gestão de Pessoas;\n> 1.3. Setor de Protocolo e Arquivo;\n> 1.4. Setor de Planejamento de Compras;\n> 1.5. Setor de Infraestrutura e Logística;\n> 1.6. Setor de Gestão de Contratos e Convênios.\n\n> c) Subsecretaria Tributária:\n> 1. Assessoria de Tributação:\n> 1.1. Setor de Legislação e Consulta;\n> 1.2. Setor de Contencioso Fiscal.\n> 2. Gerência de Cadastro Fiscal:\n> 2.1. Setor de Cadastro de Pessoas e Atividades Econômicas;\n> 2.2. Setor de Cadastro Imobiliário.\n> 3. Gerência de Fiscalização:\n> 3.1. Setor de IPTU;\n> 3.2. Setor de ISS/Taxas/COSIP;\n> 3.3. Setor de ITBI.\n> 4. Gerência de Administração de Crédito Tributário:\n> 4.1. Setor de Arrecadação;\n> 4.2. Setor de Gestão do Crédito Tributário.\n> 5. Gerência de Relacionamento com o Cidadão:\n> 5.1. Setor do SIM;\n> 5.2. Setor de Call Center;\n> 5.3. Setor de Cobrança.\n\n> III – Órgãos de Administração Colegiada:\n> a) Conselho de Contribuintes;\n> b) 16ª Delegacia de Maricá – JUCERJA.\n\n## TÍTULO III\n## DA COMPETÊNCIA DAS UNIDADES ORGÂNICAS\n\n## Capítulo I\n## DOS ÓRGÃOS DE ASSISTÊNCIA DIRETA E IMEDIATA\n\n## SEÇÃO I\n## Gabinete\n\nArt. 4º Ao Gabinete, unidade de assessoramento, diretamente subordinada ao(à) Secretário(a), compete:\n> I – prestar assistência direta e imediata ao(à) Secretário(a) no desempenho de suas funções administrativas, estratégicas, técnicas e institucionais;\n> II – gerenciar a comunicação entre o(a) Secretário(a) e as demais unidades organizacionais, garantindo o alinhamento de informações e orientações estratégicas;\n> III – organizar a agenda do(a) Secretário(a), incluindo a elaboração de pautas, a preparação de reuniões, audiências e eventos oficiais;\n> IV – acompanhar e monitorar o cumprimento de despachos, decisões e determinações do(a) Secretário(a);\n> V – supervisionar a execução de serviços administrativos necessários ao funcionamento do Gabinete;\n> VI – zelar pela integridade das informações e documentos sob responsabilidade do Gabinete;\n> VII – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\n## SEÇÃO II\n## Assessoria de Controle Interno e Compliance\n\nArt. 5º A Assessoria de Controle Interno e Compliance, unidade de assessoramento técnico, diretamente subordinada ao(à) Secretário(a), compete:\n> I – assessorar o(a) Secretário(a) na elaboração dos instrumentos orçamentários e na supervisão da correta gestão orçamentária, financeira, patrimonial e operacional sob os aspectos da legalidade, legitimidade, economicidade, eficiência e eficácia;\n> II – avaliar o cumprimento das metas previstas no plano plurianual e no planejamento da SEGET, bem como a execução dos programas de trabalho e do orçamento anual;\n> III – manter intercâmbio de informações e conhecimentos técnicos com unidades de controle interno de outros órgãos da Administração Pública, com vistas ao permanente aperfeiçoamento da atividade de controle interno;\n> IV – acompanhar e garantir que as respostas formais às demandas dirigidas à SEGET, oriundas de órgãos de controle interno e externo, Ministério Público e outros entes fiscalizadores, sejam elaboradas e emitidas com conformidade técnica e jurídica, observando os prazos estabelecidos;\n> V – receber e responder as sugestões, críticas, reclamações e pedidos de acesso à informação da população, por intermédio do Sistema Eletrônico do Serviço de Informação ao Cidadão – e-SIC;\n> VI – consolidar relatórios periódicos sobre o cumprimento de exigências e recomendações emitidas por órgãos de controle interno e externo;\n> VII – identificar falhas, riscos e oportunidades de melhoria nos processos administrativos e operacionais da SEGET, recomendando a adoção de ações corretivas ou preventivas;\n> VIII – elaborar relatórios com análise das demandas da sociedade, identificando tendências e propondo melhorias nos processos internos e nos serviços prestados pela SEGET;\n> IX – garantir a conformidade das ações da SEGET com as normas, legislações e diretrizes aplicáveis à gestão tributária;\n> X – promover a capacitação e a conscientização dos servidores sobre as normas de compliance, ética pública e boas práticas administrativas;\n> XI – acompanhar as respostas às manifestações registradas na Ouvidoria, assegurando a adoção de providências adequadas;\n> XII – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\n## Subseção I\n## Escola Fazendária\n\nArt. 6º A Escola Fazendária, unidade de execução diretamente subordinada à Assessoria de Controle Interno e Compliance, compete:\n> I – identificar as necessidades de capacitação e desenvolvimento profissional dos servidores da SEGET, considerando os desafios e metas institucionais;\n> II – analisar, avaliar e promover as propostas de treinamento e capacitação apresentadas pelas unidades da SEGET, assegurando sua compatibilidade com os objetivos estratégicos e as demandas institucionais;\n> III – planejar, organizar e executar cursos, treinamentos, palestras, seminários e workshops relacionados à gestão tributária, finanças públicas, legislação fiscal, tecnologia aplicada e outras áreas pertinentes;\n> IV – promover programas de educação continuada, com foco no aperfeiçoamento das competências técnicas e comportamentais dos servidores;\n> V – organizar programas específicos de formação para novos servidores, facilitando sua integração e alinhamento com os objetivos institucionais;\n> VI – criar campanhas educativas para sensibilizar os servidores sobre a importância da formação contínua e do desenvolvimento profissional;\n> VII – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\n## Subseção II\n## Auditoria Interna\n\nArt. 7º A Auditoria Interna, unidade de execução diretamente subordinada à Assessoria de Controle Interno, compete:\n> I – verificar a conformidade das atividades da SEGET com as normas legais, regulatórias, e administrativas aplicáveis;\n> II – identificar e relatar, de forma fundamentada, quaisquer desvios ou inconformidades que possam comprometer a regularidade tributária, fiscal, administrativa ou operacional;\n> III – avaliar a eficácia dos procedimentos implementados para garantir a segurança e a integridade dos processos administrativos e tributários, propondo ajustes e melhorias quando necessário;\n> IV – planejar e executar auditorias internas regulares, abrangendo as áreas administrativa e tributária da Secretaria, de forma a avaliar riscos e propor soluções para o fortalecimento da gestão pública;\n> V – emitir relatórios técnicos detalhados com resultados, conclusões e recomendações, assegurando clareza, objetividade e alinhamento com os objetivos da SEGET;\n> VI – elaborar respostas técnicas específicas às demandas dirigidas à SEGET, oriundas de órgãos de controle interno e externo, Ministério Público e outros entes fiscalizadores;\n> VII – elaborar o Plano Anual de Auditoria da SEGET;\n> VIII – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\n## Subseção III\n## Corregedoria Interna\n\nArt. 8º A Corregedoria Interna, unidade de execução diretamente subordinada à Assessoria de Controle Interno e Compliance, compete:\n> I – receber, registrar e investigar denúncias relacionadas a possíveis desvios de conduta de servidores da Secretaria, assegurando o sigilo e a proteção das informações;\n> II – emitir Juízo de Admissibilidade de todas as denúncias recebidas;\n> III – conduzir procedimentos investigativos quando houver indícios de irregularidades ou denúncias formais contra servidores da SEGET;\n> IV – emitir pareceres e relatórios técnicos detalhados sobre as apurações realizadas, indicando eventuais responsabilidades e propondo as sanções cabíveis, nos termos da legislação vigente;\n> V – sugerir a instauração de sindicâncias e processos administrativos disciplinares para apurar possíveis infrações cometidas por servidores, observando os critérios estabelecidos nas normas internas, bem como os princípios do contraditório e da ampla defesa;\n> VI – monitorar o cumprimento das sanções disciplinares aplicadas, garantindo sua execução e registro nos sistemas administrativos;\n> VII – acompanhar os serviços das Comissões Disciplinares permanentes e temporárias;\n> VIII – colaborar com os órgãos externos, como órgãos de controle e fiscalização, quando necessário;\n> IX – manter cadastro dos servidores da SEGET que tenham respondido a processos administrativos disciplinares ou punidos por infração de conduta funcional nos últimos 5 (cinco) anos, bem como fornecer o mesmo quando solicitado por autoridade superior;\n> X – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\n## Subseção IV\n## Ouvidoria\n\nArt. 9º A Ouvidoria, unidade de execução diretamente subordinada à Assessoria de Controle Interno e Compliance, compete:\n> I – receber, registrar e tratar manifestações dos contribuintes, incluindo sugestões, reclamações, denúncias, solicitações de informações e elogios relacionados aos serviços prestados pela SEGET;\n> II – analisar e encaminhar as manifestações às unidades competentes, acompanhando a adoção das providências necessárias para a resolução das demandas;\n> III – garantir a resposta clara, objetiva e em prazo adequado às manifestações dos cidadãos, conforme os princípios de atendimento ao público;\n> IV – atender às solicitações de informações realizadas com base na Lei de Acesso à Informação (Lei Federal nº 12.527/2011), assegurando o fornecimento de dados públicos de forma clara e acessível;\n> V – acompanhar a tramitação das manifestações junto às unidades responsáveis, cobrando a adoção de medidas corretivas e a resolução das demandas recebidas;\n> VI – assegurar o sigilo das informações e a proteção da identidade dos manifestantes, quando solicitado ou em casos que envolvam denúncias;\n> VII – garantir que as manifestações sejam tratadas com imparcialidade, ética e respeito aos direitos do cidadão;\n> VIII – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\n## SEÇÃO III\n## Assessoria de Governança\n\nArt. 10. A Assessoria de Governança, unidade de assessoramento técnico diretamente subordinada ao(à) Secretário(a), compete:\n> I – planejar, coordenar e monitorar a implementação de estratégias e políticas institucionais, garantindo o alinhamento das ações da SEGET com os objetivos de eficiência, governança e sustentabilidade administrativa;\n> II – contribuir para a disseminação dos princípios da Governança Pública, que correspondem a capacidade de resposta, integridade, confiabilidade, melhoria regulatória, prestação de contas e responsabilidade e transparência;\n> III – implementar, supervisionar e avaliar práticas de governança pública, promovendo a conformidade com as normas, diretrizes legais e boas práticas de gestão;\n> IV – promover a cultura de governança pública da SEGET, disseminando princípios de ética, responsabilidade social e compromisso com a qualidade dos serviços prestados;\n> V – avaliar e monitorar a execução das metas e indicadores estratégicos da SEGET, propondo ações para assegurar seu cumprimento;\n> VI – elaborar relatórios de acompanhamento das metas e indicadores estratégicos e estudos sobre boas práticas de governança e gestão pública;\n> VII – propor ações de capacitação voltadas para o fortalecimento da governança e da gestão pública entre os servidores da SEGET;\n> VIII – propor diretrizes e critérios para a elaboração do planejamento e programação das atividades da fiscalização, bem como aprovar o Plano Anual de Fiscalização em conjunto com os responsáveis pelas respectivas unidades de assessoramento técnico;\n> IX – monitorar as atividades de fiscalização e arrecadação tributária, expedindo ordens de serviço e assegurando o cumprimento das metas fiscais;\n> X – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\n## Subseção I\n## Programação Fiscal\n\nArt. 11. A Programação Fiscal, unidade de execução diretamente subordinada à Assessoria de Governança, compete:\n> I – promover o cruzamento de informações financeiras e fiscais disponíveis para identificação de casos de sonegação, fraude ou qualquer tipo de falha que prejudique a arrecadação de tributos, instruindo a fiscalização com a elaboração de dossiês;\n> II – elaborar e promover a expedição de notificações de autorregularização para contribuintes com inconsistências tributárias;\n> III – elaborar o planejamento e a programação das atividades da fiscalização tributária, através de Plano Anual de Fiscalização, a ser submetido à Assessoria de Governança, e publicado em diário ou jornal oficial;\n> IV – auxiliar a Assessoria de Governança no monitoramento das atividades de fiscalização e arrecadação tributária, assegurando o cumprimento das metas fiscais;\n> V – apresentar estudos para otimização de metodologia e aperfeiçoamento dos critérios e parâmetros de identificação dos contribuintes fiscalizados e seus tipos de ações fiscais;\n> VI – monitorar o impacto dos programas fiscais na arrecadação municipal, propondo ajustes para maximizar os resultados;\n> VII – propor campanhas de conscientização e orientação dos contribuintes sobre os programas fiscais e suas vantagens;\n> VIII – articular a execução de programas fiscais com os demais setores da Secretaria e órgãos externos, quando necessário;\n> IX – efetuar o controle de qualidade e revisão dos processos de programações executados;\n> X – efetuar intercâmbio de técnicas e instrumentos de auditoria fiscal com entidades externas, inclusive mediante convênio ou termo de cooperação mútua;\n> XI – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\n## Capítulo II\n## DOS ÓRGÃOS SINGULARES\n\n## SEÇÃO I\n## Subsecretaria de Planejamento e Modernização de Gestão Tributária\n\nArt. 12. A Subsecretaria de Planejamento e Modernização de Gestão Tributária, unidade de planejamento, coordenação e execução, diretamente subordinada ao(à) Secretário(a), compete:\n> I – planejar, coordenar e implementar políticas e estratégias voltadas à modernização da gestão tributária e à eficiência arrecadatória do Município, alinhadas às diretrizes da SEGET;\n> II – propor inovações tecnológicas e metodológicas que otimizem os processos tributários, assegurando maior transparência, eficácia e acessibilidade aos contribuintes;\n> III – elaborar estudos e diagnósticos sobre o desempenho da arrecadação tributária, identificando oportunidades de melhoria e expansão da base de contribuintes;\n> IV – acompanhar e controlar sistematicamente a evolução da arrecadação tributária do Município, garantindo a atualização, integralidade e a confiabilidade dos dados gerenciais;\n> V – apoiar a segurança da informação no âmbito das atividades da SEGET, em conformidade com a legislação vigente, incluindo a Lei Geral de Proteção de Dados – LGPD;\n> VI – promover o uso de tecnologias inovadoras e metodologias ágeis para aprimorar a prestação de serviços ao cidadão e aos contribuintes, com foco na automação de processos;\n> VII – monitorar a execução de projetos estratégicos da SEGET, assegurando o cumprimento de prazos, metas e objetivos estabelecidos, e avaliar periodicamente seus resultados;\n> VIII – propor e coordenar projetos e programas que visem a melhoria da gestão tributária e o fortalecimento da arrecadação municipal;\n> IX – desenvolver e implementar projetos de inteligência fiscal, utilizando ferramentas de ciência de dados, geoprocessamento e análise preditiva para apoiar as ações de fiscalização e arrecadação;\n> X – fomentar parcerias e cooperações técnicas com instituições públicas e privadas para o desenvolvimento de soluções inovadoras na gestão tributária;\n> XI – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\n## Subseção I\n## Gerência de Planejamento e Modernização\n\nArt. 13. A Gerência de Planejamento e Modernização, unidade de execução diretamente subordinada à Subsecretaria de Planejamento e Modernização de Gestão Tributária, compete:\n> I – supervisionar e monitorar as iniciativas voltadas à inovação em serviços tributários e à modernização de processos no âmbito da SEGET;\n> II – promover a articulação entre os setores subordinados, garantindo alinhamento e sinergia entre as atividades desenvolvidas;\n> III – avaliar os resultados das ações realizadas pelos setores, propondo ajustes e melhorias sempre que necessário;\n> IV – atuar como ponto de contato para a articulação com outras áreas da SEGET e com órgãos externos em temas relacionados à inovação de serviços e modernização;\n> V – identificar demandas e oportunidades de inovação, coordenando o desenvolvimento de soluções que atendam às necessidades da gestão tributária e dos contribuintes;\n> VI – elaborar relatórios gerenciais e indicadores de desempenho para subsidiar decisões estratégicas da Subsecretaria de Planejamento e Modernização de Gestão Tributária;\n> VII – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\nArt. 14. Integra a estrutura da Gerência de Planejamento e Modernização, o Setor de Inteligência Fiscal, que compete:\n> I – planejar, coordenar, orientar, executar e controlar as atividades de inteligência fiscal, incluindo diligências, análise, pesquisa e investigação de fraudes;\n> II – propor a adoção de procedimentos administrativos, técnicos ou fiscais, que permitam a inibição de fraudes fiscais;\n> III – analisar e recomendar operações fiscais decorrentes de denúncias e proposições de outras unidades administrativas;\n> IV – comunicar à Assessoria de Controle Interno e Compliance a constatação de indícios de crimes contra a Ordem Tributária;\n> V – propor regras de segurança institucional na área de competência da SEGET;\n> VI – investigar, propor e acompanhar a obtenção de novas fontes de dados e relatórios para cruzamento de informações financeiras e fiscais, preferencialmente automatizados;\n> VII – assessorar o setor de Programação Fiscal no cruzamento de informações financeiras e fiscais e na elaboração do Plano Anual de Fiscalização;\n> VIII – estudar e propor alterações de procedimentos das atividades da fiscalização tributária para melhorar o custo-efetividade das ações fiscais;\n> IX – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\nArt. 15. Integra a estrutura da Gerência de Planejamento e Modernização, o Setor de Sistema de Arrecadação, que compete:\n> I – analisar e propor melhorias nos sistemas utilizados na arrecadação de tributos municipais, alinhando-os às demandas da gestão e às exigências da legislação tributária vigente;\n> II – avaliar e indicar as melhores soluções tecnológicas disponíveis para sistemas de arrecadação, priorizando eficiência, segurança e funcionalidade;\n> III – monitorar o desempenho e a utilização dos sistemas de arrecadação, identificando falhas ou oportunidades de otimização para garantir a continuidade e confiabilidade das operações financeiras do Município;\n> IV – propor e colaborar na capacitação de servidores e usuários para o uso eficiente das ferramentas e sistemas de arrecadação;\n> V – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\nArt. 16. Integra a estrutura da Gerência de Planejamento e Modernização, o Setor de Ciência de Dados Tributários e Geoprocessamento, que compete:\n> I – elaborar análises baseadas em dados para subsidiar a gestão tributária e a tomada de decisões estratégicas, utilizando tecnologias e ferramentas disponíveis;\n> II – avaliar e propor a utilização de ferramentas tecnológicas para extração, manipulação e visualização de dados relacionados às receitas públicas, cadastros tributários e outros indicadores de interesse fiscal;\n> II – gerar relatórios e indicadores de desempenho a partir de dados consolidados, com o objetivo de apoiar a formulação e o monitoramento de políticas públicas tributárias;\n> IV – apoiar as atividades de fiscalização tributária por meio do fornecimento de informações técnicas baseadas em análises de dados e geolocalização;\n> V – analisar e sugerir atualizações em bases de dados geoprocessadas, integrando informações espaciais e tributárias para melhorar o planejamento e a fiscalização;\n> VI – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\nArt. 17. Integra a estrutura da Gerência de Planejamento e Modernização, o Escritório de Projetos, que compete:\n> I – coordenar o gerenciamento do portfólio de projetos da SEGET, assegurando a integração e a priorização de iniciativas alinhadas às políticas públicas e tributárias;\n> II – implementar metodologias e ferramentas de gestão de projetos, assegurando o controle de prazos, custos e resultados;\n> III – prestar apoio técnico às unidades da SEGET na proposição, planejamento, execução, monitoramento e encerramento de projetos;\n> IV – propor a capacitação das equipes envolvidas na execução de projetos, fomentando a melhoria contínua das práticas de gestão;\n> V – elaborar relatórios periódicos sobre o andamento e os resultados dos projetos;\n> VI – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\nArt. 18. Integra a estrutura da Gerência de Planejamento e Modernização, o Setor de Gestão e Segurança da Informação, que compete:\n> I – planejar, implementar e gerenciar políticas de gestão e segurança da informação no âmbito da SEGET, apoiando na proteção de dados e na integridade das informações;\n> II – monitorar e apoiar no tratamento de incidentes relacionados à proteção de dados, reportando-os às autoridades competentes, quando necessário;\n> III – realizar diagnósticos periódicas para identificar vulnerabilidades e implementar medidas de mitigação de riscos relacionados à segurança da informação;\n> IV – promover a adoção de boas práticas na coleta, armazenamento, tratamento e compartilhamento de dados pessoais, de acordo com a legislação federal e municipal vigente;\n> V – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\nArt. 19. Integra a estrutura da Gerência de Planejamento e Modernização, o Setor de Inovação em Serviços Tributários e Modernização de Processos, que compete:\n> I – propor, desenvolver e implementar soluções inovadoras que melhorem a experiência do contribuinte e a eficiência dos serviços da SEGET;\n> II – realizar estudos de tendências tecnológicas para identificar oportunidades de inovação na administração tributária;\n> III – identificar pontos críticos e propor a reestruturação de fluxos e processos administrativos e tributários, com o objetivo de eliminar redundâncias, padronizar processos, aumentar a eficiência e a produtividade;\n> IV – promover a transformação digital na SEGET, automatizando processos e implantando serviços 100% digitais, com o objetivo de reduzir o tempo dos serviços prestados ao contribuinte;\n> V – garantir que os processos modernizados estejam alinhados às diretrizes legais, regulatórias e normativas aplicáveis, incluindo aquelas estabelecidas pela SEGET;\n> VI – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\n## SEÇÃO II\n## Subsecretaria de Gestão\n\nArt. 20. A Subsecretaria de Gestão, unidade de coordenação, supervisão e execução de ações administrativas, diretamente subordinada ao(à) Secretário(a), compete:\n> I – promover a inovação nos procedimentos administrativos, incluindo processos internos, gestão de pessoas e práticas licitatórias, com o objetivo de aprimorar a eficiência, a transparência e a qualidade dos serviços prestados;\n> II – supervisionar a execução das atividades administrativas, assegurando o alinhamento às diretrizes estratégicas, normas legais e às políticas institucionais aplicáveis;\n> III – coordenar e supervisionar a alocação de pessoal, materiais e financeiros necessários ao funcionamento das unidades da SEGET, assegurando a otimização e o uso eficiente desses recursos;\n> IV – planejar, coordenar e acompanhar ações relacionadas à documentação, aos processos administrativos e à gestão patrimonial, assegurando a conformidade e eficiência dessas atividades;\n> V – coordenar a elaboração e acompanhamento de contratos, convênios e aquisições, promovendo o cumprimento das normas aplicáveis;\n> VI – garantir a infraestrutura adequada para as atividades das unidades administrativas e fiscais da SEGET;\n> VII – monitorar e avaliar a eficácia dos serviços administrativos prestados, promovendo melhorias contínuas;\n> VIII – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\n## Subseção I\n## Gerência de Gestão\n\nArt. 21. A Gerência da Gestão, unidade de execução diretamente subordinada à Subsecretaria de Gestão, compete:\n> I – coordenar e implementar as atividades administrativas e operacionais dos setores subordinados, promovendo a integração entre suas ações;\n> II – monitorar o cumprimento de prazos, metas e objetivos relacionados às demandas administrativas, assegurando a entrega dos resultados previstos;\n> III – identificar e propor melhorias nos processos administrativos para maior eficiência e qualidade nos serviços prestados;\n> IV – supervisionar o uso adequado de recursos e a aplicação das normas administrativas vigentes;\n> V – elaborar relatórios gerenciais e indicadores de desempenho para subsidiar decisões estratégicas;\n> VI – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\nArt. 22. Integra a estrutura da Gerência de Gestão o Setor de Documentação e Processos, que compete:\n> I – analisar, tratar e acompanhar os documentos e processos administrativos encaminhados pelo Setor de Protocolo e Arquivo, verificando sua adequação e adotando as providências necessárias para sua instrução;\n> II – implementar e monitorar fluxos de trabalho para o gerenciamento e tramitação de documentos e processos administrativos;\n> III – elaborar respostas e encaminhamentos relacionados aos documentos e processos administrativos, quando aplicável, ou direcioná-los aos setores responsáveis para manifestação;\n> IV – propor e implementar melhorias na organização e gestão de documentos e processos administrativos, buscando maior eficiência e segurança na tramitação;\n> V – acompanhar e garantir o cumprimento de prazos para a tramitação de processos administrativos;\n> VI – controlar a tramitação interna dos documentos e processos, assegurando sua integridade e rastreabilidade;\n> VII – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\nArt. 23. Integra a estrutura da Gerência de Gestão, o Setor de Gestão de Pessoas, que compete:\n> I – cumprir e assegurar a aplicação das normas, instruções e diretrizes relativas à gestão de pessoas, em conformidade com a legislação vigente e as políticas institucionais;\n> II – gerenciar e manter atualizado o registro funcional de servidores, prestadores de serviço e estagiários, controlando dados como frequência, produtividade, benefícios e informações trabalhistas;\n> III – coordenar o levantamento das necessidades de recursos humanos, promovendo estudos e relatórios que subsidiem o planejamento e o regular andamento dos serviços da SEGET;\n> IV – acompanhar e gerenciar o ingresso de servidores nomeados por concurso público na SEGET, bem como supervisionar o período de estágio probatório;\n> V – coordenar a elaboração, execução e acompanhamento da escala de férias, com base nas informações fornecidas pelas unidades da SEGET, assegurando a continuidade das atividades;\n> VI – gerenciar a execução de atividades relacionadas à administração de pessoal, incluindo folha de pagamento, concessão de benefícios, produtividade e demais direitos dos servidores;\n> VII – consolidar e enviar à Secretaria Municipal de Administração os dados e informações necessários para alimentar os sistemas de cadastro de pessoal e de folha de pagamento, garantindo a consistência e a regularidade dos registros;\n> VIII – propor ações de integração, desenvolvimento e capacitação de servidores, visando à valorização e ao aprimoramento contínuo das competências profissionais;\n> IX – prestar atendimento aos servidores municipais lotados na SEGET, fornecendo informações sobre questões relacionadas à gestão de recursos humanos e outros assuntos pertinentes às suas necessidades funcionais;\n> X – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\nArt. 24. Integra a estrutura da Gerência de Gestão, o Setor de Protocolo e Arquivo, que compete:\n> I – receber, registrar e distribuir documentos, processos e correspondências internas e externas, assegurando sua correta destinação e registro;\n> II – executar as atividades relacionadas à recepção, expedição e protocolo de documentos e processos, observando normas, rotinas e diretrizes técnico-administrativas estabelecidas;\n> III – organizar e manter atualizado o registro geral de entrada e saída de documentos e processos enviados à SEGET, garantindo sua rastreabilidade;\n> IV – manter o controle e a organização do arquivo físico e digital, classificando os documentos de forma eficiente e conforme diretrizes arquivísticas;\n> V – propor e implementar diretrizes para o funcionamento do arquivo da SEGET, assegurando a gestão, preservação e acessibilidade dos documentos arquivados;\n> VI – realizar periodicamente a revisão da localização, da ordenação e do estado de conservação dos documentos arquivados, identificando necessidades de reparo ou realocação;\n> VII – acompanhar os procedimentos de descarte de documentos de acordo com técnicas arquivísticas e tabela de temporalidade publicada;\n> VIII – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\nArt. 25. Integra a estrutura da Gerência de Gestão, o Setor de Planejamento de Compras, que compete:\n> I – elaborar e submeter à apreciação do superior hierárquico os planos e projetos relacionados às aquisições e licitações necessárias ao funcionamento da SEGET;\n> II – planejar e coordenar os processos de aquisição e licitação, assegurando a conformidade com a legislação vigente;\n> III – desenvolver, implementar e revisar periodicamente o Plano Anual de Contratações da SEGET, contemplando as necessidades de materiais e serviços para o pleno funcionamento das atividades;\n> IV – realizar estudos técnicos preliminares e análises de riscos para subsidiar os processos licitatórios e de contratações diretas, assegurando embasamento técnico para aquisição;\n> V – elaborar, divulgar e monitorar os Documentos de Oficialização de Demandas (DOD), consolidando as necessidades internas da Secretaria;\n> VI – manter controle, registro e organização de todas as compras realizadas, com foco na rastreabilidade e conformidade dos processos de aquisição;\n> VII – fornecer informações e suporte técnico para subsidiar o acompanhamento dos contratos pela unidade responsável;\n> VIII – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\nArt. 26. Integra a estrutura da Gerência de Gestão, o Setor de Infraestrutura e Logística, que compete:\n> I – planejar, coordenar e executar atividades relacionadas à infraestrutura física necessária ao funcionamento das unidades da SEGET;\n> II – manter a infraestrutura interna da SEGET em condições operacionais, especialmente os serviços de recepção, transporte, vigilância, zeladoria e telefonia;\n> III – supervisionar a manutenção preventiva e corretiva das instalações físicas, equipamentos e mobiliários da SEGET;\n> IV – gerenciar e controlar o uso de veículos, equipamentos e outros recursos logísticos, assegurando sua utilização eficiente;\n> V – coordenar o recebimento, armazenamento, distribuição e controle de materiais, equipamentos e suprimentos necessários às atividades da SEGET;\n> VI – realizar o planejamento e a organização logística de eventos, reuniões e atividades institucionais promovidas pela SEGET;\n> VII – manter atualizado o inventário patrimonial da SEGET, assegurando o controle e a preservação dos bens públicos sob sua responsabilidade;\n> VIII – monitorar o consumo de recursos e propor medidas para otimização de custos;\n> IX – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\nArt. 27. Integra a estrutura da Gerência de Gestão, o Setor de Gestão de Contratos e Convênios, que compete:\n> I – coordenar e gerenciar os contratos e convênios firmados pela SEGET, assegurando o cumprimento das cláusulas contratuais e legais;\n> II – supervisionar os processos de aditamento, renovação e rescisão contratual, elaborando análises técnicas e pareceres para subsidiar decisões administrativas;\n> III – atualizar, controlar e manter organizadas as informações sobre contratos e convênios, incluindo prazos, valores e responsáveis;\n> IV – monitorar a execução contratual, verificando o cumprimento de prazos e obrigações;\n> V – acompanhar as alterações legislativas e regulamentares que impactem a gestão de contratos e convênios, propondo ajustes nos processos internos quando necessário;\n> VI – realizar os trâmites processuais necessários para a efetivação dos pagamentos relacionados aos contratos e convênios, garantindo a conformidade com as normas, prazos e obrigações contratuais;\n> VII – acompanhar e verificar a regularidade dos processos de pagamento dos contratos e convênios, assegurando o cumprimento das obrigações legais e contratuais;\n> VIII – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\n## SEÇÃO III\n## Subsecretaria Tributária\n\nArt. 28. A Subsecretaria Tributária, unidade de coordenação, supervisão e execução das políticas e ações tributárias, diretamente subordinada ao(à) Secretário(a), compete:\n> I – planejar, coordenar, supervisionar e avaliar as atividades de administração tributária, visando ao fortalecimento da gestão fiscal do Município, assegurando a eficiência e a conformidade com as diretrizes da SEGET;\n> II – exercer as atividades relativas à administração tributária do Município, incluindo cadastro, lançamento, fiscalização, tributação, arrecadação e cobrança dos tributos e demais receitas municipais;\n> III – assessorar o(a) Secretário(a) na formulação e proposição das políticas fiscal e tributária do Município;\n> IV – planejar, organizar, orientar e supervisionar as atividades relativas ao atendimento ao contribuinte, cadastro, lançamento, fiscalização, administração, cobrança e arrecadação de tributos e demais receitas do Município;\n> V – promover a orientação e instrução dos contribuintes sobre o cumprimento da legislação tributária vigente;\n> VI – avaliar a eficácia das ações de fiscalização, com base em indicadores de produtividade individual e coletiva do corpo de fiscais;\n> VII – articular-se com órgãos e autoridades federais, estaduais e municipais, mediante instruções do(a) Secretário(a), para integração, aperfeiçoamento e compartilhamento de informações relacionadas à administração tributária;\n> VIII – estimar e avaliar os impactos da renúncia de receitas tributárias, incluindo isenções, incentivos fiscais e alterações de alíquotas;\n> IX – propor e colaborar na implantação de medidas para assegurar o equilíbrio financeiro do Município;\n> X – promover estudos, propor regulamentações e supervisionar a aplicação da legislação tributária e as atividades de fiscalização;\n> XI – proceder à cobrança e arrecadação dos créditos tributários e não tributários, bem como à sua inscrição em Dívida Ativa;\n> XII – emitir certidões e atestados relacionados às finalidades e serviços da Subsecretaria, nos termos da legislação vigente;\n> XIII – expedir instruções normativas e outros atos administrativos necessários à regulamentação dos procedimentos internos;\n> XIV – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\n## ubseção I\n## Assessoria de Tributação\n\nArt. 29. A Assessoria de Tributação, unidade de assessoramento técnico subordinado à Subsecretaria Tributária, compete:\n> I – planejar, dirigir, coordenar e controlar a execução e o desenvolvimento das atividades do Setor de Legislação e Consulta Fiscal e do Setor de Contencioso Fiscal;\n> II – oferecer subsídios para a formulação das diretrizes gerais e prioridades da ação da SEGET na implementação da política tributária municipal;\n> III – elaborar normas complementares, instruções normativas, resoluções e regulamentos, para aprovação da autoridade superior, quanto à matéria de sua competência;\n> IV – subsidiar a execução da política tributária do Município;\n> V – analisar e expedir pareceres conforme dispõe a legislação tributária;\n> VI – promover o estudo da realidade econômica para coletar informações de caráter técnico que subsidiem as áreas de tributação, arrecadação e de gestão financeira da SEGET;\n> VII – subsidiar a atualização da legislação tributária municipal que trata de tributos mobiliários e imobiliários de forma que reflita a política tributária do Município;\n> VIII – realizar estudos e pesquisas jurídico-tributárias, quanto à correta interpretação e aplicação da legislação fiscal, propondo as medidas necessárias à uniformização de entendimento e a sua atualização, em face da evolução legislativa, doutrinária e jurisprudencial;\n> IX – decidir, em primeira instância, sobre litígios tributários;\n> X – decidir sobre os pedidos de reconhecimento de imunidade, isenção e não-incidência em sede recursal;\n> XI – disseminar informações relativas a julgamentos administrativos e decisões judiciais;\n> XII – pronunciar-se quanto às propostas de instituição, modificação e extinção ou redução de tributos, incentivos fiscais e regimes especiais de tributação;\n> XIII – elaborar o ato normativo que dá publicidade às datas de vencimento dos tributos municipais;\n> XIV – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\nArt. 30. Integra a estrutura da Assessoria de Tributação, o Setor de Legislação e Consulta Fiscal, que compete:\n> I – organizar e manter atualizada a coletânea de atos legais e administrativos de natureza fiscal;\n> II – dar máxima transparência e acessibilidade, aos órgãos e cidadãos, o acervo de Legislação Tributária;\n> III – estudar e propor as normas necessárias à formação da política tributária do Município;\n> IV – realizar estudos para subsidiar a elaboração e a avaliação de anteprojetos de legislação tributária, quanto aos efeitos sobre a arrecadação e a economia em geral;\n> V – avaliar os efeitos de mudanças na legislação tributária na arrecadação dos impostos, taxas e contribuições administradas pela Subsecretaria Tributária, bem como nos repasses e fundos de participação;\n> VI – propor alterações de atos legais e normativos com vistas ao aprimoramento da legislação tributária, em conjunto e articulação com as demais políticas públicas municipais;\n> VII – prestar esclarecimentos ao contribuinte e demais interessados acerca da legislação tributária vigente;\n> VIII – elaborar atos normativos e interpretativos da legislação tributária;\n> IX – emitir parecer técnico em processos de consulta tributária;\n> X – prestar assistência técnica e orientação ao pessoal alocado no Plantão Fiscal;\n> XI – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\nArt. 31. Integra a estrutura da Assessoria de Tributação, o Setor de Contencioso Fiscal, que compete:\n> I – acompanhar as decisões proferidas em primeira instância e pelo Conselho de Contribuintes;\n> II – acompanhar os julgamentos de processos relativos à matéria tributária na esfera judicial, especialmente nos tribunais superiores;\n> III – propor medidas com vistas ao aperfeiçoamento da ação fiscal e do contencioso administrativo-fiscal;\n> IV – propor normas e manuais destinados a regulamentar, uniformizar e harmonizar os procedimentos de julgamento de processos administrativos;\n> V – analisar e informar expedientes para defesa de lançamentos impugnados judicialmente e prestar informações referentes ao contencioso administrativo e judicial;\n> VI – realizar estudos e pesquisas jurídicas, de ordem legal, doutrinária e jurisprudencial, visando obter subsídios para fundamentar pareceres a serem exarados em processos submetidos à sua apreciação;\n> VII – emitir decisões administrativas em processos de impugnação de 1ª instância;\n> VIII – decidir, em sede recursal de primeira instância, sobre isenção, não-incidência e imunidade;\n> IX – manter organizado o arquivo dos pareceres, bem como de decisões de Primeira e de Segunda Instância Administrativas, relativas à matéria tributária e fiscal;\n> X – efetuar o controle dos processos sob sua jurisdição, acompanhando sua tramitação até solução final na esfera administrativa;\n> XI – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\n## Subseção II\n## Gerência de Cadastro Fiscal\n\nArt. 32. A Gerência de Cadastro Fiscal, unidade de execução diretamente subordinada à Subsecretaria Tributária, compete:\n> I – coordenar, estruturar e planejar o fluxo para os cadastros fiscais do Município, emitindo comunicados e orientações quanto aos procedimentos cabíveis para cadastro, orientando o contribuinte e demais setores da Subsecretaria Tributária;\n> II – gerenciar as operações de atualização das informações cadastrais e fiscais;\n> III – articular-se com os demais órgãos municipais responsáveis por licenciamentos, objetivando integrar, racionalizar e simplificar as ações de registro de empreendimentos do Município;\n> IV – propor regiões e as respectivas datas de início e fim dos projetos de recadastramento imobiliário, fixando equipes, cronogramas e metodologia;\n> V – articular-se com os órgãos afins para atualização de informações sobre cadastro de terreno e edificações sujeitos aos impostos e taxas, lançados com base na propriedade ou ocupação de imóveis;\n> VI – orientar na interpretação da legislação relativa a tributos no aspecto de aplicação de alíquotas e enquadramento de atividades, objetivando a correta classificação das atividades econômicas de acordo com a Classificação Nacional de Atividades Econômicas Fiscais – CNAE-Fiscal;\n> VII – manter intercâmbio com outras administrações tributárias, federais, estaduais ou municipais, para coleta, armazenagem e uso de informações cadastrais e de natureza fiscal;\n> VIII – elaborar normas que disciplinem as operações relativas ao Cadastro de Pessoas e Atividades Econômicas, ao Cadastro Imobiliário e Mobiliário e às declarações de inscrições cadastrais;\n> IX – registrar nos sistemas os cálculos de áreas, valores venais e outros elementos relativos aos imóveis a serem tributados;\n> X – decidir originariamente os requerimentos de baixa de Alvará de Licença;\n> XI – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\nArt. 33. Integra a estrutura da Gerência de Cadastro Fiscal, o Setor de Cadastro de Pessoas e Atividades Econômicas, que compete:\n> I – acompanhar, controlar e avaliar a qualidade do atendimento empresarial, observando o cumprimento da legislação municipal;\n> II – examinar e avaliar documentos de inscrição e alteração cadastral de contribuintes sujeitos à emissão de alvará de funcionamento;\n> III – deferir e expedir os Alvarás de Licença e respectivas guias de recolhimento das Taxas;\n> IV – notificar os contribuintes para regularização do Alvará de Licença;\n> V – auxiliar na efetivação e no desenvolvimento de programas e normas de procedimentos, visando à modernização e aperfeiçoamento do funcionamento do empresarial;\n> VI – manter alinhamento operacional junto ao Setor de Cadastro Imobiliário para controle de CEP e atualização de endereço para notificação de contribuintes;\n> VII – informar os processos físicos e/ou eletrônicos, de legalização das empresas situadas no Município;\n> VIII – emitir as guias de recolhimento relativas às taxas e preços públicos aplicáveis aos empreendimentos e do ISS fixo;\n> IX – coordenar e auxiliar a fiscalização relativa à atividade empresarial, exercida pelos Fiscais de Posturas designados, devendo se manifestar quanto assuntos da sua alçada ou delegados;\n> X – subsidiar programas de fiscalização com outros órgãos visando ao cumprimento da legislação tributária e de posturas municipais e outras leis, bem como o incremento da arrecadação dos tributos municipais;\n> XI – planejar, orientar, coordenar, analisar, decidir e executar as atividades de recepção, verificação, registro e preparo de cadastramento, abertura, baixa e alteração contratual, mantendo atualizado o cadastro de pessoas e atividades econômicas do Município;\n> XII – comunicar e indicar aos contribuintes para regularização do Alvará de Licença;\n> XIII – acompanhar as aberturas de MEI – Microempreendedor Individual e outras empresas por meio do Sistema de Registro Integrado - REGIN ou outro que o substitua;\n> XIV – atualizar as atividades baseando-se na Classificação Nacional de Atividades Econômicas – CNAE, Classificação Brasileira de Ocupações – CBO e Nomenclatura Brasileira de Serviços – NBS, de acordo com as Leis vigentes;\n> XV – controlar e executar as atividades de recepção, verificação, registro e preparo de cadastramento e atualização do Cadastro Geral do Município (CGM);\n> XVI – efetuar os vínculos do CGM com todos os demais cadastros, de modo a proporcionar a visão cadastral integrada do cidadão;\n> XVII – registrar o domicílio fiscal eleito pelo contribuinte, ou atribuir um de ofício nos casos previstos em lei;\n> XVIII – revisar periodicamente os procedimentos de fluxos, articulando-se com outros setores a fim de alimentar e manter atualizado o Cadastro Geral do Município;\n> XIX – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\nArt. 34. Integra a estrutura da Gerência de Cadastro Fiscal, o Setor de Cadastro Imobiliário, que compete:\n> I – coordenar e executar a matrícula dos contribuintes do Imposto Predial Territorial Urbano – IPTU, mantendo atualizado o cadastro em todos os aspectos que resultem na concretização do lançamento;\n> II – efetuar a anotação das transferências de propriedades imobiliárias;\n> III – proceder ao assentamento de alterações verificadas nos imóveis tributados, que influam em seu valor venal, para fins de lançamento;\n> IV – atualizar o fluxo de informações relacionadas à posse, propriedade ou domínio útil de imóvel em áreas urbanas e rurais do Município de acordo com informações de censos, por meio de levantamentos feitos por órgãos competentes municipal, estadual e/ou federal;\n> V – implantar as alterações no cadastro imobiliário decorrentes dos processos de legalização e parcelamento de solo;\n> VI – informar e emitir as certidões cadastrais imobiliárias;\n> VII – manter atualizada a base de dados do Cadastro Imobiliário Georreferenciado;\n> VIII – coordenar equipes de vistoria técnica e recadastradores;\n> X – manter atualizadas, junto ao Sistema Informatizado da Prefeitura, as informações necessárias para efeito de lançamento de impostos, operacionalizando as rotinas correlatas para fiscalização tributária;\n> X – realizar a coleta de dados para atualização do cadastro imobiliário do Município, condicionado a abertura de processo administrativo;\n> XI – efetuar levantamentos, em diligências no local, para efeito de revisão ou atualização cadastral, subsidiando lançamentos e avaliações de imóveis;\n> XII – manter e atualizar as plantas de referências cadastrais setoriais e de quadras;\n> XIII – coordenar e acompanhar a reambulação, restituição, vetorização e a revisão das áreas recadastradas;\n> XIV – subsidiar a identificação de imóveis jacentes no Município, comunicando a Procuradoria Geral Municipal para eventual incorporação patrimonial, observado os trâmites legais;\n> XV – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\n## Subseção III\n## Gerência de Fiscalização\n\nArt. 35. A Gerência de Fiscalização, unidade de execução diretamente subordinado à Subsecretaria Tributária, compete:\n> I – planejar e executar ações que visem o incremento da receita própria, da transparência e da eficiência da Subsecretaria Tributária e dos programas de educação fiscal;\n> II – gerenciar e orientar as operações dos Fiscais subordinados;\n> III – pronunciar-se sobre solicitação de retificação de lançamento;\n> IV – instruir os processos administrativos de contencioso fiscal, quando a impugnação tratar de matéria de sua competência;\n> V – elaborar o programa de acompanhamento diferenciado para os grandes contribuintes;\n> VI – exigir, a qualquer tempo, a exibição de livros e comprovantes dos atos e operações que possam constituir fato gerador da obrigação tributária;\n> VII – fazer inspeções nos locais e estabelecimentos onde se exercerem atividades sujeitos a obrigações tributárias ou nos bens e serviços que constituam matéria tributável;\n> VIII – exigir informações e comunicações, escritas ou verbais, relativas à fiscalização;\n> IX – notificar o contribuinte ou responsável para comparecer às repartições da Subsecretaria Tributária;\n> X – apreender documentos que possam constituir-se em prova a favor do Fisco;\n> XI – requisitar auxílio da força policial ou requerer ordem judicial, quando indispensável à realização de diligências, inspeções ou registro de locais, estabelecimentos, livros e objetos de contribuintes responsáveis bem como ao fechamento de estabelecimentos, quando houver descumprimento de exigências legais ou regulamentares;\n> XII – sugerir alterações na legislação tributária para o aperfeiçoamento da atividade de fiscalização, visando à atualização constante;\n> XIII – atender e prestar informações aos contribuintes e a quaisquer órgãos ou entidades sobre interpretação da legislação tributária no que tange aos tributos de competência do município;\n> XIV – prestar assessoramento aos fiscais plantonistas;\n> XV – emitir autorização de emissão de notas fiscais de serviço;\n> XVI – emitir pareceres em processos de solicitação de revisão de lançamento de tributos;\n> XVII – emitir pareceres em processos de pedido de cancelamento de débitos tributários, restituição de indébito, compensação tributária, imunidade tributária, isenção, prescrição, incentivo fiscal e não incidência tributária;\n> XVIII – controlar os prazos para pagamento das Notificações de Lançamento e Autos de Infração Tributários;\n> XIX – controlar os prazos para cumprimento das Notificações emitidas;\n> XX – articular-se com os cartórios de registro de imóveis no sentido de assegurar que não sejam lavrados instrumentos, escrituras, contratos ou termos judiciais referentes à transmissão intervivos de imóveis sem que tenha sido pago o Imposto sobre a Transmissão de Bens Imóveis (ITBI) de competência do Município;\n> XXI – adotar os procedimentos necessários à identificação de divergências entre os valores constantes em declaração prestada pelo sujeito passivo e os valores pagos, parcelados, compensados ou com exigibilidade suspensa;\n> XXII – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\nParágrafo Único. Nos casos dos incisos VI, X e XI, os funcionários lavrarão termo próprio, do qual constarão, especificamente, os elementos examinados ou as providências tomadas ou assumidas.\n\nArt. 36. Integra a estrutura da Gerência de Fiscalização, o Setor de IPTU, que compete:\n> I – avaliar os imóveis localizados no Município para efeito de tributação do IPTU e Taxa de Coleta de Lixo, bem como efetuar o lançamento dos tributos;\n> II – controlar e coordenar a execução das ações fiscais de sua área de competência;\n> III – decidir sobre isenção, não-incidência e imunidade do IPTU e da Taxa de Coleta de Lixo;\n> IV – prorrogar prazo do procedimento para exame da situação fiscal do sujeito passivo;\n> V – emitir parecer, por meio de servidor designado, em casos de impugnação do sujeito passivo;\n> VI – designar servidor para funções ou projetos específicos correlatos às competências da respectiva Gerência;\n> VII – comunicar ao Gerente de Fiscalização a constatação de indícios de crimes contra a Ordem Tributária;\n> VIII – propor e subsidiar alterações que visem à melhoria da legislação, das normas e procedimentos, dentro de sua área de atuação;\n> IX – colaborar com o controle e atualização do cadastro imobiliário e demais cadastros fiscais;\n> X – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\nArt. 37. Integra a estrutura da Gerência de Fiscalização, o Setor de ISS/Taxas/COSIP, que compete:\n> I – controlar e coordenar a execução das ações fiscais de sua área de competência;\n> II – gerenciar e orientar as operações dos Auditores Fiscais subordinados;\n> III – decidir sobre isenção, não-incidência e imunidade do ISS, das Taxas e da COSIP;\n> IV – prorrogar prazo do procedimento para exame da situação fiscal do sujeito passivo;\n> V – emitir parecer, por meio de servidor designado, em casos de impugnação do sujeito passivo;\n> VI – designar servidor para funções ou projetos específicos correlatos às competências da respectiva Gerência;\n> VII – comunicar ao Gerente de Fiscalização a constatação de indícios de crimes contra a Ordem Tributária;\n> VIII – propor e subsidiar alterações que visem à melhoria da legislação, das normas e procedimentos, dentro de sua área de atuação;\n> IX – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\nArt. 38. Integra a estrutura da Gerência de Fiscalização, o Setor de ITBI, que compete:\n> I – avaliar os imóveis localizados no Município para efeito de tributação do ITBI e efetuar o lançamento do tributo;\n> II – controlar e coordenar a execução das ações fiscais de sua área de competência;\n> III – auxiliar a busca de elementos, no desenvolvimento de estudos técnicos, para atualização da planta genérica de valores;\n> IV – colaborar com o controle e atualização do cadastro imobiliário;\n> V – decidir sobre isenção, não-incidência e imunidade do ITBI;\n> VI – gerenciar e orientar as operações dos Fiscais de Tributos envolvidos com suas atividades;\n> VII – emitir parecer devidamente fundamentado sobre a questão versada na impugnação do sujeito passivo do ITBI;\n> VIII – comunicar ao Gerente de Fiscalização a constatação de indícios de crimes contra a ordem tributária;\n> IX – propor e subsidiar alterações que visem à melhoria da legislação, das normas e procedimentos, dentro de sua área de atuação;\n> X – atender e prestar informações aos contribuintes e a quaisquer órgãos ou entidades sobre interpretação da legislação tributária no que tange ao ITBI;\n> XI – exercer outras atividades que lhe forem atribuídas na sua área.\n\n## Subseção IV\n## Gerência de Administração de Crédito Tributário\n\nArt. 39. A Gerência de Administração de Crédito Tributário, unidade de execução diretamente subordinada à Subsecretaria Tributária, compete:\n> I – planejar, coordenar, orientar, supervisionar e controlar as atividades de arrecadação de tributos diversos, mantendo o intercâmbio de informações com outros órgãos e entidades, na sua área de competência;\n> II – apresentar estudo e análise da previsão de arrecadação das receitas tributárias para subsidiar as decisões da SEGET quanto ao estabelecimento das metas fiscais para fins gerenciais e de elaboração de orçamento do Município;\n> III – instruir os processos administrativos de contencioso fiscal, quando a impugnação tratar de matéria de sua competência;\n> IV – controlar os valores relativos à constituição, suspensão, extinção e exclusão de créditos tributários;\n> V – desenvolver estudos comparativos entre a previsão e a realização da receita tributária, visando dinamizar a arrecadação;\n> VI – controlar e gerenciar os créditos tributários com exigibilidade suspensa;\n> VII – elaborar relatório mensal consolidado dos débitos recebidos, dos processos de cobrança administrativa em andamento e do quantitativo de Certidões remetidas à Procuradoria Geral do Município para execução;\n> VIII – gerenciar as atividades relativas à cobrança de créditos tributários e não tributários não resolvidos no âmbito do Setor de Cobrança, incluindo a análise técnica e formalização de procedimentos para inscrição em dívida ativa;\n> IX – prestar informações aos órgãos jurídicos do Município, sempre que solicitado, a fim de auxiliar nos processos de execuções fiscais ou quaisquer outros em que o Município esteja envolvido;\n> X – prestar, quando solicitado, informações aos órgãos do Poder Judiciário, órgão de controle interno e externo, bem como ao Ministério Público;\n> XI – prestar informação em processos administrativos quanto à existência de débitos fiscais de contribuintes;\n> XII – acompanhar e propor medidas para melhoria no controle da arrecadação de receitas não tributárias;\n> XIII – manter controle de contribuintes inidôneos na área de sua competência;\n> XIV – adotar os procedimentos necessários à identificação de divergências entre os valores constantes em declaração prestada pelo sujeito passivo e os valores pagos, parcelados, compensados ou com exigibilidade suspensa;\n> XV – propor critérios para seleção de grandes contribuintes devedores, realizando estudos visando à identificação de sujeitos passivos de interesse da administração tributária, em função do potencial econômico-tributário e das variáveis macroeconômicas de influência, para inclusão no programa de acompanhamento diferenciado;\n> XVI – apoiar a Assessoria de Tributação na elaboração do instrumento normativo que dá publicidade às datas de vencimento dos tributos municipais;\n> XVII – expedir parecer técnico para instruir a decisão em processos de restituição, compensação e amortização;\n> XVIII – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\nArt. 40. Integra a estrutura da Gerência de Administração do Crédito Tributário, o Setor de Arrecadação, que compete:\n> I – elaborar a previsão anual, mensal e diária da arrecadação tributária, por tipo de receita, porte do contribuinte, categorias e setores econômicos;\n> II – monitorar diariamente a evolução da arrecadação tributária prevista e realizada;\n> III – analisar as variações da arrecadação tributária por setores de atividades econômicas, por códigos de receita e por categoria de contribuintes;\n> IV – realizar estudos e projeção de cenários visando aumentar a arrecadação municipal;\n> V – estudar o comportamento das receitas tributárias e não tributárias, propondo ao Gerente de Administração do Crédito Tributário as medidas que julgar necessárias ao aperfeiçoamento e à melhoria do sistema de arrecadação;\n> VI – acompanhar e propor medidas para melhoria no controle da arrecadação de receitas tributárias e não tributárias;\n> VII – executar e fiscalizar o programa de acompanhamento das transferências constitucionais para apuração dos índices de participação e dos repasses de receitas oriundas dos tributos estaduais e federais à Municipalidade;\n> VIII – manter atualizada a base de dados das transferências constitucionais registradas;\n> IX – apresentar estudo e análise da previsão de arrecadação das receitas transferidas para subsidiar as decisões da SEGET quanto ao estabelecimento das metas fiscais para fins gerenciais e de elaboração de orçamento do Município;\n> X – elaborar quadros diários provisórios e definitivos da arrecadação de receitas estaduais;\n> XI – elaborar relatório mensal consolidado das receitas oriundas de transferências constitucionais;\n> XII – efetuar o intercâmbio com as demais unidades da SEGET, bem como com órgãos e entidades municipais, estaduais e federais, com objetivo de realizar a supervisão e acompanhamento das transferências intergovernamentais;\n> XIII – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\nArt. 41. Integra a estrutura da Gerência de Administração do Crédito Tributário, o Setor de Gestão do Crédito Tributário, que compete:\n> I – controlar os valores relativos à constituição, suspensão, extinção e exclusão de créditos tributários;\n> I – prestar suporte técnico às atividades relativas à cobrança administrativa e ao recolhimento de créditos;\n> III – prestar informações aos órgãos jurídicos do Município, sempre que solicitado, a fim de auxiliar nos processos de execuções fiscais;\n> IV – inscrever em Dívida Ativa os créditos vencidos, observando o disposto na legislação;\n> V – emitir Certidão de Dívida Ativa, acompanhando a inscrição de crédito, observando o disposto no inciso anterior;\n> VI – gerenciar os créditos tributários com exigibilidade suspensa;\n> VII – manter controle de contribuintes inadimplentes na área de sua competência;\n> VIII – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\n## Subseção V\n## Gerência de Relacionamento com o Cidadão\n\nArt. 42. A Gerência de Relacionamento com o Cidadão, unidade de execução diretamente subordinada à Subsecretaria Tributária, compete:\n> I – monitorar e avaliar a qualidade dos atendimentos realizados, propondo melhorias nos processos e nas práticas de atendimento;\n> II – adotar medidas para a racionalização e simplificação dos procedimentos de rotina, instando à melhoria do atendimento ao contribuinte;\n> III – promover a elaboração de diretrizes para a padronização da rede de atendimento das unidades descentralizadas;\n> IV – receber sugestões, questionamentos, críticas, elogios e providenciar as medidas e respostas cabíveis encaminhando as demandas e questionamentos para o setor responsável;\n> V – garantir a acessibilidade plena no atendimento ao contribuinte, conforme o Estatuto da Pessoa com Deficiência (Lei nº 13.146/2015), com adaptações físicas e tecnológicas nas unidades de atendimento e nos canais digitais;\n> VI – desenvolver e monitorar indicadores de desempenho do atendimento, visando subsidiar a tomada de decisões;\n> VII – assegurar ao contribuinte atendimento de alto padrão de qualidade, eficiência e agilidade;\n> VIII – promover a simplificação de procedimentos e a disseminação de informações visando à facilitação do cumprimento das obrigações tributárias;\n> IX – prestar informações gerenciais relativas às atividades desempenhadas no mês;\n> X – manter informada a Subsecretaria Tributária acerca das estatísticas de atendimento por meio de relatórios gerenciais periódicos;\n> XI – identificar necessidades de capacitação dos atendentes e propor treinamentos específicos para melhoria do atendimento ao público;\n> XII – atualizar e gerenciar os serviços de atendimento empresarial via Internet com o acompanhamento e controle da qualidade destes serviços de autoatendimento;\n> XIII – coordenar os serviços de Atendimentos Empresarial da Casa do Empreendedor quanto à legalização da empresa;\n> XIV – controlar e coordenar os plantões fiscais visando atender e prestar informações aos contribuintes e a quaisquer órgãos, referentes à sua área de atuação;\n> XV – planejar, coordenar, orientar, supervisionar e controlar as atividades de cobrança de débitos de tributos diversos, mantendo o intercâmbio de informações com outros órgãos e entidades, na sua área de competência;\n> XVI – prestar informação em processos administrativos quanto à existência de débitos fiscais de contribuintes;\n> XVII – estabelecer parcerias com outros órgãos municipais, estaduais e federais para expandir os serviços disponíveis nas unidades do SIM, promovendo a integração administrativa e a descentralização do atendimento;\n> XVIII – exercer outras atividades que lhe forem atribuídas na sua área de atuação.\n\nArt. 43. Integra a estrutura da Gerência de Relacionamento com o Cidadão, o Setor do SIM, que compete:\n> I – coordenar e organizar os procedimentos de atendimento ao público nas unidades de Serviços Integrados Municipal – SIM, observando e controlando o fl
